<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ongoing Works – Redmyre House</title>
<!-- 기존 head 내용 그대로 (링크, 스타일 등) -->
<style>
/* 기존 스타일 전체 유지 */
</style>
</head>
<body>

<!-- 기존 HTML 구조 그대로 (사이드바, 메인, worksList 등) -->

<!-- WORK MODAL - 여기만 수정 -->
<div class="modal-backdrop" id="workModal">
  <div class="modal-box">
    <div class="modal-title" id="workModalTitle">Add Work</div>
    <input type="hidden" id="workEditId">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="modal-field">
        <label class="modal-label">Title</label>
        <input class="modal-input" id="workTitle" placeholder="Work description…">
      </div>
      <div class="modal-field">
        <label class="modal-label">Contractor</label>
        <select class="modal-select" id="workContractor">
          <option value="">Select contractor…</option>
        </select>
      </div>
      <div class="modal-field">
        <label class="modal-label">Status</label>
        <select class="modal-select" id="workStatus">
          <option value="scheduled">Scheduled</option>
          <option value="inprog">In Progress</option>
          <option value="urgent">Urgent</option>
          <option value="done">Completed</option>
        </select>
      </div>
      <div class="modal-field">
        <label class="modal-label">Progress (%)</label>
        <input class="modal-input" id="workProgress" type="number" min="0" max="100" value="0">
      </div>
    </div>

    <!-- 완료 날짜 추가 -->
    <div class="modal-field">
      <label class="modal-label">Completion Date <span style="font-size:10px;color:var(--muted);">(only for Completed status)</span></label>
      <input class="modal-input" type="date" id="workCompletedDate">
    </div>

    <div class="modal-field">
      <label class="modal-label">Description (Admin / Committee / Observer only)</label>
      <textarea class="modal-textarea" id="workDesc" placeholder="Work description visible to everyone…"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label" style="color:#92400e">⚠️ Private Notes</label>
      <textarea class="modal-textarea" id="workPrivate" placeholder="Financial details, sensitive info — only visible to Admin / Committee / Observer…"></textarea>
      <div class="private-hint">This section is NOT visible to Owners or Tenants.</div>
    </div>
    <div class="modal-footer">
      <button class="btn-danger" id="deleteWorkBtn" onclick="deleteWork()" style="display:none;margin-right:auto">Delete</button>
      <button class="btn-secondary" onclick="closeModal('workModal')">Cancel</button>
      <button class="btn-primary" onclick="saveWork()">Save →</button>
    </div>
  </div>
</div>

<!-- 나머지 기존 모달과 toast 그대로 -->

<div class="toast" id="toast"></div>

<script type="module">
/* 기존 스크립트 대부분 그대로 유지 */

/* openEditWork 함수 수정 */
window.openEditWork = () => {
  if (!selectedWork) return;
  const w = selectedWork;
  document.getElementById('workModalTitle').textContent = 'Edit Work';
  document.getElementById('workEditId').value = w.id;
  document.getElementById('workTitle').value = w.title||'';
  document.getElementById('workContractor').value = w.contractor_id||'';
  document.getElementById('workStatus').value = w.status||'inprog';
  document.getElementById('workProgress').value = w.progress||0;
  document.getElementById('workDesc').value = w.description||'';
  document.getElementById('workPrivate').value = w.private_notes||'';

  // 완료 날짜 추가
  if (w.completed_at) {
    document.getElementById('workCompletedDate').value = new Date(w.completed_at).toISOString().split('T')[0];
  } else {
    document.getElementById('workCompletedDate').value = '';
  }

  document.getElementById('deleteWorkBtn').style.display = 'inline-flex';
  document.getElementById('workModal').classList.add('open');
};

/* saveWork 함수 수정 - 완료 날짜 저장 추가 */
window.saveWork = async () => {
  const id = document.getElementById('workEditId').value;
  const contractorId = document.getElementById('workContractor').value;
  const contractorObj = allContractors.find(c => c.id === contractorId);
  const completedDate = document.getElementById('workCompletedDate').value;

  const data = {
    title: document.getElementById('workTitle').value.trim(),
    contractor_id: contractorId || null,
    contractor: contractorObj ? `${contractorObj.service} — ${contractorObj.company}` : '',
    contractor_name: contractorObj ? contractorObj.company : '',
    status: document.getElementById('workStatus').value,
    progress: parseInt(document.getElementById('workProgress').value)||0,
    description: document.getElementById('workDesc').value.trim(),
    private_notes: document.getElementById('workPrivate').value.trim(),
    updated_at: new Date().toISOString(),
  };

  // 완료 날짜 처리
  if (completedDate && data.status === 'done') {
    data.completed_at = new Date(completedDate).toISOString();
  } else if (data.status !== 'done') {
    data.completed_at = null;
  }

  if (!data.title) { showToast('Please enter a title', true); return; }

  try {
    if (id) {
      await supabase.from('works').update(data).eq('id', id);
    } else {
      await supabase.from('works').insert(data);
    }
    closeModal('workModal');
    if (openAccordionId) closeAccordion(openAccordionId);
    await loadWorks();
    showToast('Work saved ✓');
  } catch(e) { showToast(e.message||'Failed to save', true); }
};

/* 나머지 기존 코드 (loadWorks, renderWorks, toggleAccordion 등) 그대로 */

// Init
await loadContractors();
await loadWorks();
</script>
</body>
</html>
