<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Parking Warning Sticker</title>
<link rel="stylesheet" href="/css/pages/parking-sticker-print.css">
</head>
<body>
<div class="page">

<div class="sticker" id="s1">
<svg viewBox="0 0 454 370" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif" width="100%" height="100%">
  <defs>
    <pattern id="hz1" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#111"/>
      <rect x="10" width="10" height="20" fill="#ffe600"/>
    </pattern>
  </defs>
  <rect width="454" height="370" fill="url(#hz1)"/>
  <rect x="12" y="12" width="430" height="346" fill="#ffe600"/>
  <text x="227" y="128" text-anchor="middle" font-size="130" font-weight="900" fill="#e8000d" textLength="410" lengthAdjust="spacingAndGlyphs">WARNING</text>
  <text x="227" y="185" text-anchor="middle" font-size="36" font-weight="900" fill="#111">Unauthorised Parking</text>
  <line x1="20" y1="202" x2="434" y2="202" stroke="#111" stroke-width="2"/>
  <text x="227" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#111">Your vehicle has been recorded by CCTV.</text>
  <line x1="20" y1="265" x2="434" y2="265" stroke="#111" stroke-width="2"/>
  <text x="227" y="330" text-anchor="middle" font-size="38" font-weight="900" fill="#e8000d" textLength="410" lengthAdjust="spacingAndGlyphs">DO NOT PARK HERE AGAIN.</text>
</svg>
</div>

<div class="sticker" id="s2">
<svg viewBox="0 0 454 370" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif" width="100%" height="100%">
  <defs>
    <pattern id="hz2" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#111"/>
      <rect x="10" width="10" height="20" fill="#ffe600"/>
    </pattern>
  </defs>
  <rect width="454" height="370" fill="url(#hz2)"/>
  <rect x="12" y="12" width="430" height="346" fill="#ffe600"/>
  <text x="227" y="128" text-anchor="middle" font-size="130" font-weight="900" fill="#e8000d" textLength="410" lengthAdjust="spacingAndGlyphs">WARNING</text>
  <text x="227" y="185" text-anchor="middle" font-size="36" font-weight="900" fill="#111">Unauthorised Parking</text>
  <line x1="20" y1="202" x2="434" y2="202" stroke="#111" stroke-width="2"/>
  <text x="227" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#111">Your vehicle has been recorded by CCTV.</text>
  <line x1="20" y1="265" x2="434" y2="265" stroke="#111" stroke-width="2"/>
  <text x="227" y="330" text-anchor="middle" font-size="38" font-weight="900" fill="#e8000d" textLength="410" lengthAdjust="spacingAndGlyphs">DO NOT PARK HERE AGAIN.</text>
</svg>
</div>

</div>
</body>
</html>
