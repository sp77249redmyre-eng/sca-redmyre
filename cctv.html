<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v4.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
/* CCTV page only. Keep the existing BMS sidebar, topbar, layout.js and style.css intact. */
/* Use the available viewport height so the 4 x 3 camera wall does not create page scrolling. */
html:has(.cctv-console),
body:has(.cctv-console) {
  height: 100%;
  overflow: hidden;
}
body:has(.cctv-console) { margin: 0; }

.main:has(.cctv-console) {
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-left: 2px solid #00F5FF;
  box-sizing: border-box;
}
.main:has(.cctv-console) > #topbarPlaceholder { flex: 0 0 auto; }

.content:has(> .cctv-console) {
  flex: 1 1 0;
  min-height: 0;
  height: auto;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  background:
    radial-gradient(ellipse 70% 40% at 50% -5%, rgba(0,245,255,.07), transparent 70%),
    repeating-linear-gradient(0deg, rgba(0,245,255,.035) 0, rgba(0,245,255,.035) 1px, transparent 1px, transparent 3px),
    #030507;
}
.cctv-console {
  --c-text: #D7F7F5;
  --c-muted: #9FC0BF;
  --c-line: #154252;
  --c-cyan: #00F5FF;
  flex: 1 1 0;
  min-height: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--c-text);
  container-type: inline-size;
  container-name: cctv-console;
  box-sizing: border-box;
}

.cctv-console .cv-top {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 0 0 8px;
}
.cctv-console .cv-title {
  font-family: 'Orbitron', 'Segoe UI', sans-serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .04em;
  color: #D7F7F5;
  margin-right: 8px;
}
.cctv-console .cv-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.cctv-console .cv-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 700;
  color: #d7f7f5;
  background: #04141b;
  border: 1px solid var(--c-line);
  border-radius: 9px;
  cursor: pointer;
}
.cctv-console .cv-tab:hover { border-color: #00b9d8; }
.cctv-console .cv-tab[data-tab="parking"].is-active { background: #0a56c8; border-color: #3b8cff; }
.cctv-console .cv-tab[data-tab="lobby"].is-active { background: #0b6b3a; border-color: #2fd47a; }
.cctv-console .cv-tab[data-tab="upper"].is-active { background: #8a3a16; border-color: #ff8a4c; }

.cctv-console .cv-panel {
  display: none;
  flex: 1 1 0;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  box-sizing: border-box;
  border: 1px solid var(--c-line);
  border-radius: 12px;
  padding: 8px;
  background: rgba(2,11,16,.7);
}
.cctv-console .cv-panel.is-active { display: flex; }
.cctv-console .cv-panel[data-tab="parking"] { border-color: #2f6fd8; }
.cctv-console .cv-panel[data-tab="lobby"] { border-color: #26a862; }
.cctv-console .cv-panel[data-tab="upper"] { border-color: #d9743a; }
.cctv-console .cv-panel-head {
  display: flex;
  flex: 0 0 auto;
  align-items: baseline;
  gap: 10px;
  margin: 0 0 7px;
  font-size: 17px;
  line-height: 1.25;
  font-weight: 700;
}
.cctv-console .cv-panel-head small { font-size: 12px; font-weight: 500; color: var(--c-muted); }

.cctv-console .cv-grid {
  display: grid;
  flex: 1 1 0;
  min-height: 0;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 6px;
  align-content: stretch;
}
.cctv-console .cv-panel[data-tab="lobby"] .cv-grid {
  grid-template-rows: repeat(2, minmax(0, 1fr));
}
.cctv-console .cv-tile {
  position: relative;
  min-width: 0;
  min-height: 0;
  height: 100%;
  overflow: hidden;
  border: 1px solid #00b9d8;
  border-radius: 7px;
  background: #020b10;
  aspect-ratio: auto;
}
.cctv-console .cv-tile video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #010609;
  display: none;
  cursor: zoom-in;
}
.cctv-console .cv-tile[data-state="live"] video { display: block; }
.cctv-console .cv-tile[data-src="ch27"] video { object-position: right center; }
.cctv-console .cv-tile[data-src="ch24"] video { object-position: left center; }

/* Full-screen CCTV must show the complete source frame, not the cropped tile view. */
.cctv-console .cv-tile video:fullscreen,
.cctv-console .cv-tile video:-webkit-full-screen {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  object-fit: contain !important;
  object-position: center center !important;
  background: #000 !important;
}
.cctv-console .cv-msg {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  text-align: center;
  color: #7faeb6;
  font-family: 'JetBrains Mono', Consolas, monospace;
  font-size: 12px;
}
.cctv-console .cv-tile[data-state="live"] .cv-msg { display: none; }
.cctv-console .cv-label {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 7px;
  background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,0));
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  text-shadow: 0 1px 2px #000;
}
.cctv-console .cv-label span.cv-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ffb000;
  flex: 0 0 auto;
}
.cctv-console .cv-tile[data-state="live"] .cv-dot { background: #19e08a; box-shadow: 0 0 6px #19e08a; }
.cctv-console .cv-tile[data-state="offline"] .cv-dot { background: #ff4d4d; }
.cctv-console .cv-tile[data-state="offline"] { border-color: #6b2a2a; }
.cctv-console .cv-tile.is-empty { border-style: dashed; border-color: #2a4a52; }
.cctv-console .cv-tile.is-empty .cv-msg { color: #6f8f95; font-size: 13px; }
.cctv-console .cv-tile.is-pending .cv-label { color: #ffd27a; }

/* Compact layouts remain within the viewport on narrower browser windows. */
@container cctv-console (max-width: 1100px) {
  .cctv-console .cv-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(4, minmax(0, 1fr));
  }
  .cctv-console .cv-panel[data-tab="lobby"] .cv-grid {
    grid-template-rows: repeat(3, minmax(0, 1fr));
  }
}
@container cctv-console (max-width: 760px) {
  .cctv-console .cv-title { font-size: 18px; }
  .cctv-console .cv-tab { padding: 6px 9px; font-size: 12px; }
  .cctv-console .cv-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(6, minmax(0, 1fr));
    gap: 4px;
  }
  .cctv-console .cv-panel[data-tab="lobby"] .cv-grid {
    grid-template-rows: repeat(4, minmax(0, 1fr));
  }
  .cctv-console .cv-label { font-size: 10px; padding: 3px 5px; }
}
@container cctv-console (max-width: 420px) {
  .cctv-console .cv-grid {
    grid-template-columns: 1fr;
    grid-template-rows: repeat(12, minmax(0, 1fr));
  }
  .cctv-console .cv-panel[data-tab="lobby"] .cv-grid {
    grid-template-rows: repeat(8, minmax(0, 1fr));
  }
}

/* Mobile: one large camera per row, natural page scrolling, and no fixed-height wall. */
@media (max-width: 760px) {
  html:has(.cctv-console),
  body:has(.cctv-console) {
    height: auto;
    min-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .main:has(.cctv-console) {
    height: auto;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: visible;
  }

  .content:has(> .cctv-console) {
    flex: 1 0 auto;
    height: auto;
    min-height: 0;
    overflow: visible;
    display: block;
    padding-bottom: 16px;
  }

  .cctv-console {
    display: block;
    flex: none;
    width: 100%;
    min-height: 0;
  }

  .cctv-console .cv-top {
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }

  .cctv-console .cv-title {
    width: 100%;
    margin: 0 0 2px;
    font-size: 18px;
  }

  .cctv-console .cv-tabs {
    width: 100%;
    gap: 6px;
  }

  .cctv-console .cv-tab {
    flex: 1 1 auto;
    justify-content: center;
    padding: 8px 6px;
    font-size: 12px;
    white-space: nowrap;
  }

  .cctv-console .cv-panel {
    flex: none;
    min-height: 0;
    overflow: visible;
    padding: 7px;
  }

  .cctv-console .cv-panel.is-active {
    display: block;
  }

  .cctv-console .cv-panel-head {
    flex-wrap: wrap;
    margin-bottom: 8px;
    font-size: 15px;
  }

  .cctv-console .cv-grid,
  .cctv-console .cv-panel[data-tab="lobby"] .cv-grid {
    display: grid;
    flex: none;
    min-height: 0;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: none;
    grid-auto-rows: auto;
    gap: 9px;
    align-content: start;
  }

  .cctv-console .cv-tile {
    width: 100%;
    height: auto;
    min-height: 0;
    aspect-ratio: 16 / 9;
  }

  .cctv-console .cv-label {
    padding: 5px 7px;
    font-size: 12px;
  }

  .cctv-console .cv-msg {
    font-size: 12px;
  }
}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
  <div class="cctv-console">

    <div class="cv-top">
      <div class="cv-title">Redmyre CCTV</div>
      <div class="cv-tabs" role="tablist">
        <button class="cv-tab is-active" data-tab="parking" type="button" role="tab">&#128663; Parking</button>
        <button class="cv-tab" data-tab="lobby" type="button" role="tab">&#128716; Lobby &amp; Lifts</button>
        <button class="cv-tab" data-tab="upper" type="button" role="tab">&#127970; Upper Levels</button>
      </div>
    </div>

    <div class="cv-panel is-active" data-tab="parking">
      <div class="cv-panel-head">Parking <small>4 x 3 (12 cameras)</small></div>
      <div class="cv-grid"></div>
    </div>
    <div class="cv-panel" data-tab="lobby">
      <div class="cv-panel-head">Lobby &amp; Lifts <small>4 x 2 (8 cameras)</small></div>
      <div class="cv-grid"></div>
    </div>
    <div class="cv-panel" data-tab="upper">
      <div class="cv-panel-head">Upper Levels <small>4 x 3 (12 cameras)</small></div>
      <div class="cv-grid"></div>
    </div>

  </div>
  </div>
</div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role } = ctx;
// CCTV: lets the live-view script fetch a fresh login token (auto-refreshed by supabase-js).
window.__bmsGetToken = async () => { try { const { data } = await supabase.auth.getSession(); return (data && data.session) ? data.session.access_token : null; } catch (e) { return null; } };
if (role !== 'admin') { window.location.href = '/pages/announcement.html'; }
</script>

<script>
/* CCTV viewer: MSE over WSS through the BMS CCTV gatekeeper (admin login token required). View-only.
   Only the visible tab is connected; desktop cameras connect one at a time, while mobile connects up to three visible tiles. */
(function initCctvViewer(){
  var HOST = 'redmyre-pc.tail8f8836.ts.net';
  var CODEC_LIST = ['avc1.640029','avc1.64002A','avc1.640033','hvc1.1.6.L153.B0','mp4a.40.2','mp4a.40.5','flac','opus'];
  var SLOW = { ch19: 1, ch24: 1, ch25: 1, ch26: 1, ch27: 1, ch28: 1 };       // high resolution cameras: slow to start
  var STAGGER_MS = 700;                                      // gap between camera connections

  /* Camera map (go2rtc stream name -> camera name), confirmed from the read-only mapping.
     src:null = no stream found yet (shown as an empty tile). pending:true = channel known, exact name not confirmed. */
  var TABS = {
    parking: [
      { src:'ch4',  name:'Garage Entry' },
      { src:'ch2',  name:'Garage Exit' },
      { src:'ch3',  name:'Bins' },
      { src:'ch22', name:'Car Park Up Ramp' },
      { src:'ch27', name:'Basement Entry' },
      { src:'ch26', name:'Car Park to Foyer' },
      { src:'ch6',  name:'Car Park Disabled Spots' },
      { src:'ch25', name:'Back Car Park' },
      { src:'ch7',  name:'B1 Car Park' },
      { src:'ch8',  name:'B2 Car Park' },
      { src:'ch23', name:'Lift 1' },
      { src:'ch21', name:'Lift 2' }
    ],
    lobby: [
      { src:'ch5',  name:'Main Entrance' },
      { src:'ch1',  name:'Foyer' },
      { src:'ch24', name:'Foyer Lifts' },
      { src:'ch28', name:'Loading Dock to Lobby' },
      { src:'ch2',  name:'Garage Exit' },
      { src:'ch26', name:'Car Park to Foyer' },
      { src:'ch23', name:'Lift 1' },
      { src:'ch21', name:'Lift 2' }
    ],
    upper: [
      { src:'ch9',  name:'Level 6 R' },
      { src:'ch10', name:'Level 6 L' },
      { src:'ch11', name:'Level 5 R' },
      { src:'ch12', name:'Level 5 L' },
      { src:'ch13', name:'Level 4 R' },
      { src:'ch14', name:'Level 4 L' },
      { src:'ch15', name:'Level 3 R' },
      { src:'ch16', name:'Level 3 L' },
      { src:'ch18', name:'Level 2 R' },
      { src:'ch17', name:'Level 2 L' },
      { src:'ch20', name:'Level 1 R' },
      { src:'ch19', name:'Level 1 L' }
    ]
  };

  function codecs(){
    if (!window.MediaSource) return '';
    return CODEC_LIST.filter(function(c){ return MediaSource.isTypeSupported('video/mp4; codecs="' + c + '"'); }).join();
  }
  function getToken(){
    return new Promise(function(resolve){
      var tries = 0;
      (function poll(){
        if (typeof window.__bmsGetToken === 'function') { window.__bmsGetToken().then(resolve, function(){ resolve(null); }); return; }
        if (++tries > 50) { resolve(null); return; }
        setTimeout(poll, 200);
      })();
    });
  }

  function Player(tile, src){
    this.tile = tile; this.src = src;
    this.video = tile.querySelector('video');
    this.msgEl = tile.querySelector('.cv-msg');
    this.ws = null; this.ms = null; this.sb = null; this.queue = [];
    this.retry = 0; this.timer = null; this.watchdog = null; this.lastData = 0; this.stopped = true;
  }
  Player.prototype.setState = function(st, text){
    this.tile.setAttribute('data-state', st);
    if (this.msgEl && text) this.msgEl.textContent = text;
  };
  Player.prototype.start = function(){ if (!this.stopped) return; this.stopped = false; this.open(); };
  Player.prototype.stop = function(){
    this.stopped = true; this.cleanup(); clearTimeout(this.timer);
    this.setState('connecting', 'Waiting…');
  };
  Player.prototype.cleanup = function(){
    clearInterval(this.watchdog); this.watchdog = null;
    if (this.ws) { try { this.ws.onclose = null; this.ws.onerror = null; this.ws.onmessage = null; this.ws.close(); } catch(e){} this.ws = null; }
    this.queue = []; this.sb = null;
    if (this.video) { try { this.video.pause(); this.video.removeAttribute('src'); this.video.load(); } catch(e){} }
    this.ms = null;
  };
  Player.prototype.fail = function(text, code){
    var self = this;
    this.cleanup();
    if (this.stopped) return;
    this.setState('offline', text || 'Camera offline');
    var delay;
    if (code === 4401) { delay = 800; }
    else {
      this.retry = Math.min(this.retry + 1, 6);
      delay = Math.min(30000, 2000 * Math.pow(1.7, this.retry));
      if (code === 4403) delay = 30000;
    }
    clearTimeout(this.timer);
    this.timer = setTimeout(function(){ if (!self.stopped) self.open(); }, delay);
  };
  Player.prototype.open = function(){
    var self = this;
    if (!window.MediaSource || !window.WebSocket) { this.setState('offline', 'Browser not supported'); return; }
    var supported = codecs();
    if (!supported) { this.setState('offline', 'Codec not supported'); return; }
    this.cleanup();
    this.setState('connecting', 'Connecting…');
    var ws = new WebSocket('wss://' + HOST + '/ws');
    ws.binaryType = 'arraybuffer';
    this.ws = ws;
    var ms = new MediaSource();
    this.ms = ms;
    this.video.src = URL.createObjectURL(ms);
    var ready = false, sourceOpen = false;
    function sendInit(){
      if (ready && sourceOpen && ws.readyState === 1) ws.send(JSON.stringify({type:'mse', value: supported}));
    }
    ms.addEventListener('sourceopen', function(){ sourceOpen = true; try { URL.revokeObjectURL(self.video.src); } catch(e){} sendInit(); }, {once:true});
    ws.onopen = function(){
      getToken().then(function(tok){
        if (self.ws !== ws) return;
        if (!tok) { self.fail('Please sign in again'); return; }
        if (ws.readyState === 1) ws.send(JSON.stringify({type:'auth', token: tok, src: self.src}));
      });
    };
    ws.onerror = function(){ if (self.ws === ws) self.fail('Cannot reach camera server'); };
    ws.onclose = function(ev){
      if (self.ws !== ws) return;
      if (ev && ev.code === 4403) self.fail('Admin access required', 4403);
      else if (ev && ev.code === 4401) self.fail('Reconnecting…', 4401);
      else self.fail('Connection lost');
    };
    ws.onmessage = function(ev){
      self.lastData = Date.now();
      if (typeof ev.data === 'string') {
        var msg; try { msg = JSON.parse(ev.data); } catch(e){ return; }
        if (msg.type === 'ready') { ready = true; sendInit(); }
        else if (msg.type === 'mse') {
          try {
            self.sb = ms.addSourceBuffer(msg.value);
            self.sb.mode = 'segments';
            self.sb.addEventListener('updateend', function(){ self.pump(); });
            self.pump();
          } catch(e){ self.fail('Stream format error'); }
        } else if (msg.type === 'error') {
          self.fail('Camera offline');
        }
        return;
      }
      self.queue.push(ev.data);
      self.pump();
    };
    clearInterval(this.watchdog);
    this.lastData = Date.now();
    this.watchdog = setInterval(function(){
      if (Date.now() - self.lastData > (SLOW[self.src] ? 45000 : 12000)) self.fail('No signal');
    }, 4000);
  };
  Player.prototype.pump = function(){
    var sb = this.sb, v = this.video;
    if (!sb || sb.updating || !this.ms || this.ms.readyState !== 'open') return;
    try {
      if (this.queue.length) { sb.appendBuffer(this.queue.shift()); return; }
      if (v.buffered.length) {
        var start = v.buffered.start(0), end = v.buffered.end(v.buffered.length - 1);
        if (end - v.currentTime > 2.5 || v.currentTime < start) v.currentTime = Math.max(start, end - 0.4);
        if (v.currentTime - start > 8) sb.remove(start, v.currentTime - 4);
      }
    } catch(e){ this.fail('Stream error'); return; }
    if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function(){}); }
    if (v.readyState >= 2 && !v.paused) { this.retry = 0; this.setState('live'); }
  };

  var players = {};          // tab name -> [Player]
  var current = 'parking';
  var startTimers = [];
  var mobileMedia = window.matchMedia('(max-width: 760px)');
  var mobileObserver = null;
  var MOBILE_MAX_ACTIVE = 3; // Keep mobile decoding/network load limited to three visible cameras.

  function isMobile(){ return mobileMedia.matches; }

  function updateMobileStreams(){
    if (!isMobile() || document.hidden) return;
    var list = players[current] || [];

    // Fallback for older browsers without IntersectionObserver.
    if (!mobileObserver) {
      var viewportHeight = window.innerHeight || document.documentElement.clientHeight;
      list.forEach(function(p){
        var rect = p.tile.getBoundingClientRect();
        var visibleHeight = Math.max(0, Math.min(rect.bottom, viewportHeight) - Math.max(rect.top, 0));
        p.visibilityRatio = rect.height > 0 ? visibleHeight / rect.height : 0;
      });
    }

    var selected = new Set(list.filter(function(p){ return p.visibilityRatio > 0; })
      .sort(function(a, b){ return b.visibilityRatio - a.visibilityRatio; })
      .slice(0, MOBILE_MAX_ACTIVE));

    list.forEach(function(p){
      if (selected.has(p)) p.start();
      else if (!p.stopped) p.stop();
    });
  }

  function buildTab(tabName){
    var grid = document.querySelector('.cv-panel[data-tab="' + tabName + '"] .cv-grid');
    players[tabName] = [];
    TABS[tabName].forEach(function(cam){
      var tile = document.createElement('div');
      tile.className = 'cv-tile';
      if (cam.pending) tile.className += ' is-pending';
      if (!cam.src) tile.className += ' is-empty';
      tile.setAttribute('data-state', cam.src ? 'connecting' : 'offline');
      if (cam.src) tile.setAttribute('data-src', cam.src);
      var label = cam.name + (cam.src ? ' · ' + cam.src.toUpperCase() : '');
      tile.innerHTML = '<video muted autoplay playsinline disablepictureinpicture></video>' +
        '<div class="cv-msg"></div>' +
        '<div class="cv-label"><span class="cv-dot"></span><span class="cv-name"></span></div>';
      tile.querySelector('.cv-name').textContent = label;
      tile.querySelector('.cv-msg').textContent = cam.src ? 'Waiting…' : (cam.spare ? '(spare)' : 'Not connected yet');
      grid.appendChild(tile);
      if (cam.src) {
        var p = new Player(tile, cam.src);
        p.visibilityRatio = 0;
        tile.__cctvPlayer = p;
        players[tabName].push(p);
        if (mobileObserver) mobileObserver.observe(tile);
        var v = tile.querySelector('video');
        v.addEventListener('playing', function(){ p.retry = 0; p.setState('live'); });
        v.addEventListener('click', function(){
          if (document.fullscreenElement) { document.exitFullscreen(); }
          else if (v.requestFullscreen) { v.requestFullscreen().catch(function(){}); }
        });
      }
    });
  }

  function stopAll(){
    startTimers.forEach(clearTimeout); startTimers = [];
    Object.keys(players).forEach(function(t){ players[t].forEach(function(p){ p.stop(); }); });
  }
  function startTab(tabName){
    startTimers.forEach(clearTimeout); startTimers = [];
    if (isMobile()) {
      // Only start the cameras currently visible on mobile; scrolling activates the next ones.
      setTimeout(updateMobileStreams, 120);
      return;
    }
    players[tabName].forEach(function(p, i){
      startTimers.push(setTimeout(function(){ if (!document.hidden && current === tabName) p.start(); }, i * STAGGER_MS));
    });
  }
  function showTab(tabName){
    current = tabName;
    document.querySelectorAll('.cv-tab').forEach(function(b){ b.classList.toggle('is-active', b.getAttribute('data-tab') === tabName); });
    document.querySelectorAll('.cv-panel').forEach(function(p){ p.classList.toggle('is-active', p.getAttribute('data-tab') === tabName); });
    stopAll();
    startTab(tabName);
  }

  function init(){
    if ('IntersectionObserver' in window) {
      mobileObserver = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          var p = entry.target.__cctvPlayer;
          if (p) p.visibilityRatio = entry.isIntersecting ? entry.intersectionRatio : 0;
        });
        updateMobileStreams();
      }, { root: null, threshold: [0, 0.1, 0.25, 0.5, 0.75, 1] });
    }

    Object.keys(TABS).forEach(buildTab);
    document.querySelectorAll('.cv-tab').forEach(function(b){
      b.addEventListener('click', function(){ var t = b.getAttribute('data-tab'); if (t !== current) showTab(t); });
    });
    if (!document.hidden) startTab(current);

    var onViewportModeChange = function(){
      stopAll();
      if (!document.hidden) startTab(current);
    };
    if (mobileMedia.addEventListener) mobileMedia.addEventListener('change', onViewportModeChange);
    else if (mobileMedia.addListener) mobileMedia.addListener(onViewportModeChange);

    if (!mobileObserver) {
      var scrollScheduled = false;
      window.addEventListener('scroll', function(){
        if (!isMobile() || scrollScheduled) return;
        scrollScheduled = true;
        requestAnimationFrame(function(){ scrollScheduled = false; updateMobileStreams(); });
      }, { passive: true });
      window.addEventListener('resize', function(){ if (isMobile()) updateMobileStreams(); }, { passive: true });
    }
  }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) stopAll(); else startTab(current);
  });
  window.addEventListener('pagehide', stopAll);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(init, 800); });
  else setTimeout(init, 800);
})();
</script>
</body>
</html>
