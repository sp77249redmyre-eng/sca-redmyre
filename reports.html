<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* 원본 스타일 그대로 유지 */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue-900:#0f2456;--blue-800:#1e3a8a;--blue-700:#1e4fa3;--blue-600:#2563eb;
  --blue-400:#60a5fa;--blue-100:#dbeafe;--blue-50:#eff6ff;
  --bg:#f0f4f8;--surface:#fff;--border:#e2e8f0;--border-light:#f1f5f9;
  --text:#0f172a;--text-2:#475569;--muted:#94a3b8;
  --green:#10b981;--green-bg:#ecfdf5;--green-text:#065f46;
  --yellow:#f59e0b;--yellow-bg:#fffbeb;--yellow-text:#92400e;
  --red:#ef4444;--red-bg:#fef2f2;--red-text:#991b1b;
  --orange:#f97316;--orange-bg:#fff7ed;--orange-text:#9a3412;
  --sidebar-w:232px;
}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
/* 모든 스타일 원본 그대로 유지 (너무 길어서 생략했지만 실제 파일에는 다 들어있음) */
</style>
</head>
<body>

<!-- 사이드바, 메인 등 원본 그대로 -->

<div class="main">
  <div class="main-topbar">
    <div>
      <div class="page-title">Reports</div>
      <div class="breadcrumb">Redmyre House · Building Management System</div>
    </div>
    <div class="tb-right">
      <div class="role-chip"><div class="role-dot"></div><span class="role-label" id="topbarRole">—</span></div>
      <div class="user-chip">
        <div class="u-avatar" id="topAvatar">?</div>
        <div><div class="u-name" id="topName">—</div><div class="u-role" id="topRole">—</div></div>
      </div>
    </div>
  </div>

  <div class="content">
    <!-- FILTERS, STATS, CATEGORY, APPROVED QUOTES 등 원본 그대로 -->

    <!-- ONGOING WORKS BY WORKFLOW -->
    <div class="section-title" style="margin-top:8px">Ongoing Works Status</div>
    <div id="worksSection" style="margin-bottom:24px">
      <div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">Loading…</div>
    </div>

    <!-- ONE-OFF EXPENSES 원본 그대로 -->
  </div>
</div>

<!-- ADD EXPENSE MODAL 원본 그대로 -->

<div class="toast" id="toast"></div>

<script type="module">
/* 기존 코드 대부분 그대로 + 아코디언 + 날짜 수정 기능 추가 */

const SUPABASE_URL = "https://wunsexdnqathluplkkvo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_6UyUhrHT3X1I02bVqwNuHQ_YQWh_NAo";
const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const { data:{ session } } = await supabase.auth.getSession();
if (!session) { window.location.href = 'index.html'; }
const user = session.user;
const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
const role = profile?.role || 'observer';
if (!['admin','committee','observer'].includes(role)) { window.location.href = 'building.html'; }

const name = profile?.full_name || user.email.split('@')[0];
const initials = name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
['sbAvatar','topAvatar'].forEach(id => document.getElementById(id).textContent = initials);
document.getElementById('sbName').textContent = name;
document.getElementById('topName').textContent = name;
const roleLabel = role.charAt(0).toUpperCase()+role.slice(1);
document.getElementById('sbRole').textContent = roleLabel;
document.getElementById('topRole').textContent = roleLabel;
document.getElementById('topbarRole').textContent = roleLabel;

const privileged = ['admin','committee','observer'];
if (privileged.includes(role)) {
  document.getElementById('quotesNav').style.display = 'flex';
  const _rn = document.getElementById('reportsNav'); if(_rn) _rn.style.display = 'flex';
  document.getElementById('historyNav').style.display = 'flex';
}
if (role === 'admin') {
  document.getElementById('usersNav').style.display = 'flex';
  document.getElementById('adminSection').style.display = 'block';
}
if (role === 'admin') document.getElementById('addExpenseBtn').style.display = 'inline-flex';

window.handleLogout = async () => { await supabase.auth.signOut(); window.location.href = 'index.html'; };
window.closeModal = id => document.getElementById(id).classList.remove('open');
window.showToast = (msg, isError=false) => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = isError?'#991b1b':'#0f172a';
  t.style.display = 'block'; setTimeout(()=>t.style.display='none',3500);
};

/* CAT_LABELS, parseQuoteCategory, fmt, CAT_COLORS, catBadge 등 기존 그대로 */

// loadReport, renderExpenses 등 기존 함수 유지 (여기서는 생략)

// ==================== 아코디언 + 날짜 수정이 모두 되는 renderWorks ====================
async function renderWorks(catFilter) {
  const wrap = document.getElementById('worksSection');
  if (!wrap) return;

  let query = supabase.from('works').select('*').eq('status','done').not('completed_at','is',null).order('completed_at', {ascending: false});
  if (dateFrom) query = query.gte('completed_at', dateFrom.toISOString());
  if (dateTo)   query = query.lte('completed_at', new Date(dateTo.getTime()+86400000).toISOString());

  const { data: works } = await query;
  const allWorks = works || [];

  const filtered = catFilter === 'all' ? allWorks : allWorks.filter(w => (w.category||'Other') === catFilter);

  if (!filtered.length) {
    wrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">No completed works for this period</div>';
    return;
  }

  let html = `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;border-left:4px solid var(--green)">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--green-bg);border-bottom:1px solid var(--border-light)">
        <span style="font-size:13px;font-weight:700;color:var(--green-text)">✅ Completed Works
          <span style="font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--border);padding:2px 8px;border-radius:100px;color:var(--text-2);margin-left:6px">${filtered.length}</span>
        </span>
      </div>
      <div>`;

  for (const w of filtered) {
    const completedISO = w.completed_at ? new Date(w.completed_at).toISOString().split('T')[0] : '';

    let amount = '';
    if (w.quote_id) {
      const { data: q } = await supabase.from('quotes').select('amount').eq('id', w.quote_id).single();
      if (q?.amount) amount = fmt(q.amount) + ' <span style="font-size:10px;font-weight:600;background:#fef9f0;border:1px solid #fed7aa;color:#92400e;padding:1px 5px;border-radius:4px">ex GST</span>';
    } else if (w.private_notes) {
      const match = w.private_notes.match(/Price:\s*(\$[\d,]+\.?\d*)/);
      if (match) amount = match[1] + ' <span style="font-size:10px;font-weight:600;background:#fef9f0;border:1px solid #fed7aa;color:#92400e;padding:1px 5px;border-radius:4px">ex GST</span>';
    }

    html += `
      <div onclick="toggleCompletedAccordion('${w.id}')" style="display:grid;grid-template-columns:150px 1fr auto auto;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border-light);align-items:center;cursor:pointer" class="table-row">
        <div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:2px">Completed</div>
          <input type="date" value="${completedISO}"
            onchange="event.stopImmediatePropagation(); updateCompletedDate('${w.id}',this.value)"
            style="font-size:12px;border:1px solid var(--border);border-radius:6px;padding:3px 6px;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;cursor:pointer">
        </div>
        <div>
          <div style="font-size:13px;font-weight:500">${w.title||'—'}${w.quote_id?'<span style="font-size:10px;color:var(--blue-600);background:var(--blue-50);border:1px solid var(--blue-100);border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:600">QUOTE</span>':''}</div>
          <div style="font-size:11px;color:var(--muted)">${w.contractor_name||w.contractor||'—'}</div>
        </div>
        <div style="text-align:right">
          ${amount ? `<div style="font-size:14px;font-weight:600;color:var(--green-text)">${amount}</div>` : ''}
        </div>
        <div>${catBadge(w.category||'Other')}</div>
      </div>

      <!-- 아코디언 창 -->
      <div class="work-accordion" id="acc-${w.id}" style="display:none; background:var(--bg); padding:18px 20px; border-top:1px solid var(--border-light);">
        <div style="font-size:13px; color:var(--text-2); margin-bottom:12px">
          Completed on <strong>${w.completed_at ? new Date(w.completed_at).toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'}) : '—'}</strong>
        </div>
        ${w.private_notes ? `<div style="background:#fef9f0; border:1px solid #fed7aa; border-radius:8px; padding:12px; font-size:13px;">${w.private_notes}</div>` : ''}
      </div>`;
  }

  html += '</div></div>';
  wrap.innerHTML = html;
}

/* 아코디언 열고 닫기 함수 */
window.toggleCompletedAccordion = function(id) {
  const acc = document.getElementById('acc-' + id);
  if (acc) {
    acc.style.display = (acc.style.display === 'block') ? 'none' : 'block';
  }
};

/* 날짜 수정 함수 */
window.updateCompletedDate = async (id, dateStr) => {
  if (!dateStr) return;
  try {
    await supabase.from('works').update({
      completed_at: new Date(dateStr).toISOString(),
      updated_at: new Date(dateStr).toISOString(),
    }).eq('id', id);
    showToast('Date updated ✓');
  } catch(e) { 
    showToast('Failed to update date', true); 
  }
};

/* 나머지 기존 함수들 (loadReport, renderExpenses, sortQuotes 등) 그대로 */

// Init
updateDateRange();

// Mobile hamburger menu
(function(){
  var btn=document.getElementById("hamburgerBtn");
  var overlay=document.getElementById("sidebarOverlay");
  var sidebar=document.querySelector(".sidebar");
  if(!btn||!sidebar) return;
  function openMenu(){sidebar.classList.add("mobile-open");overlay.classList.add("open");btn.classList.add("open")}
  function closeMenu(){sidebar.classList.remove("mobile-open");overlay.classList.remove("open");btn.classList.remove("open")}
  btn.addEventListener("click",function(){sidebar.classList.contains("mobile-open")?closeMenu():openMenu()});
  overlay.addEventListener("click",closeMenu);
  sidebar.querySelectorAll(".nav-item").forEach(function(a){a.addEventListener("click",function(){if(window.innerWidth<=768)closeMenu()})});
})();
</script>
</body>
</html>
