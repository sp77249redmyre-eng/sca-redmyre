<style>
/* ── Sidebar icon animation base ── */
.nav-icon svg {
  display: block;
  width: 20px;
  height: 20px;
  overflow: visible;
  transition: transform 0.2s ease;
}


/* ── 2. CLIPBOARD: 체크선 draw ── */
.svg-clip-check {
  stroke-dasharray: 12;
  stroke-dashoffset: 12;
  transition: stroke-dashoffset 0.4s ease 0.1s;
}
.nav-item[data-page="service-reports"]:hover .svg-clip-check {
  stroke-dashoffset: 0;
}

/* ── 3. FILES: 위 페이지 살짝 들림 ── */
@keyframes fileLift {
  0%   { transform: translateY(0) rotate(0deg); }
  40%  { transform: translateY(-3px) rotate(-6deg); }
  100% { transform: translateY(0) rotate(0deg); }
}
.nav-item[data-page="documents"]:hover .svg-file-top {
  animation: fileLift 0.45s ease forwards;
  transform-origin: bottom left;
}

/* ── 4. SPEAKERPHONE: 좌우 흔들 ── */
@keyframes speakerShake {
  0%   { transform: rotate(0deg); }
  20%  { transform: rotate(-12deg); }
  40%  { transform: rotate(10deg); }
  60%  { transform: rotate(-8deg); }
  80%  { transform: rotate(6deg); }
  100% { transform: rotate(0deg); }
}
.nav-item[data-page="announcements"]:hover .svg-speaker-body {
  animation: speakerShake 0.5s ease forwards;
  transform-origin: bottom center;
}

/* ── 5. CAR: 오른쪽으로 달려나가며 페이드아웃 → 왼쪽에서 재등장 루프 ── */
@keyframes carDrive {
  0%   { transform: translateX(0);    opacity: 1; }
  70%  { transform: translateX(14px); opacity: 1; }
  71%  { transform: translateX(14px); opacity: 0; }
  72%  { transform: translateX(-14px); opacity: 0; }
  100% { transform: translateX(0);    opacity: 1; }
}
@keyframes wheelSpin {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.nav-item[data-page="parking"]:hover .svg-car-body {
  animation: carDrive 0.7s ease-in-out infinite;
}

/* ── 6. BUILDING: 아래서 위로 rise ── */
@keyframes buildingRise {
  0%   { transform: translateY(0); }
  40%  { transform: translateY(-3px); }
  100% { transform: translateY(0); }
}
.nav-item[data-page="occupants"]:hover .svg-building-body {
  animation: buildingRise 0.4s ease forwards;
}

/* ── 7. MAIL: 봉투 뚜껑 열림 ── */
@keyframes mailOpen {
  0%   { transform: rotateX(0deg); }
  100% { transform: rotateX(-160deg); }
}
.svg-mail-flap {
  transform-origin: top center;
  transform-box: fill-box;
  transition: transform 0.35s ease;
}
.nav-item[data-page="complaints"]:hover .svg-mail-flap {
  transform: rotateX(-160deg);
}

/* ── 8. AIR-CONDITIONING: 바람선 파동 ── */
@keyframes windWave1 {
  0%,100% { transform: translateX(0) scaleX(1); opacity:1; }
  50%      { transform: translateX(3px) scaleX(1.15); opacity:0.6; }
}
@keyframes windWave2 {
  0%,100% { transform: translateX(0) scaleX(1); opacity:1; }
  50%      { transform: translateX(3px) scaleX(1.15); opacity:0.6; }
}
@keyframes windWave3 {
  0%,100% { transform: translateX(0) scaleX(1); opacity:1; }
  50%      { transform: translateX(3px) scaleX(1.15); opacity:0.6; }
}
.nav-item[data-page="hvac"]:hover .svg-wind-1 {
  animation: windWave1 0.6s ease 0s infinite;
  transform-origin: left center;
}
.nav-item[data-page="hvac"]:hover .svg-wind-2 {
  animation: windWave2 0.6s ease 0.1s infinite;
  transform-origin: left center;
}
.nav-item[data-page="hvac"]:hover .svg-wind-3 {
  animation: windWave3 0.6s ease 0.2s infinite;
  transform-origin: left center;
}

/* ── 9. HISTORY (clock): 시계바늘 회전 ── */
@keyframes clockSpin {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.nav-item[data-page="history"]:hover .svg-clock-hand-m {
  animation: clockSpin 0.6s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.nav-item[data-page="history"]:hover .svg-clock-hand-h {
  animation: clockSpin 1.8s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}

/* ── 10. QUOTES (file-invoice): 스캔선 내려옴 ── */
@keyframes scanLine {
  0%   { transform: translateY(-6px); opacity: 0; }
  20%  { opacity: 1; }
  100% { transform: translateY(6px); opacity: 0; }
}
.nav-item[data-page="quotes"]:hover .svg-scan-line {
  animation: scanLine 0.6s ease forwards;
}

/* ── 11. WORKS (tool/wrench): 회전 ── */
@keyframes wrenchTurn {
  0%   { transform: rotate(0deg); }
  30%  { transform: rotate(-30deg); }
  60%  { transform: rotate(20deg); }
  100% { transform: rotate(0deg); }
}
.nav-item[data-page="works"]:hover .svg-tool-body {
  animation: wrenchTurn 0.5s ease forwards;
  transform-box: fill-box;
  transform-origin: center;
}

/* ── 12. COMPLETED WORKS (circle-check): 체크 bounce ── */
@keyframes checkBounce {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.25); }
  70%  { transform: scale(0.92); }
  100% { transform: scale(1); }
}
.nav-item[data-page="reports"]:hover .svg-check-mark {
  animation: checkBounce 0.4s ease forwards;
  transform-box: fill-box;
  transform-origin: center;
}

/* ── 13. COST REPORT (chart-bar): 막대 rise ── */
@keyframes barRise1 {
  0%,100% { transform: scaleY(1); }
  50%      { transform: scaleY(1.3); }
}
@keyframes barRise2 {
  0%,100% { transform: scaleY(1); }
  50%      { transform: scaleY(1.5); }
}
@keyframes barRise3 {
  0%,100% { transform: scaleY(1); }
  50%      { transform: scaleY(1.2); }
}
.nav-item[data-page="cost-dashboard"]:hover .svg-bar-1 {
  animation: barRise1 0.5s ease 0s forwards;
  transform-origin: bottom center;
  transform-box: fill-box;
}
.nav-item[data-page="cost-dashboard"]:hover .svg-bar-2 {
  animation: barRise2 0.5s ease 0.07s forwards;
  transform-origin: bottom center;
  transform-box: fill-box;
}
.nav-item[data-page="cost-dashboard"]:hover .svg-bar-3 {
  animation: barRise3 0.5s ease 0.14s forwards;
  transform-origin: bottom center;
  transform-box: fill-box;
}

/* ── 14. EMERGENCY (phone-call): 진동 ── */
@keyframes phoneVibrate {
  0%,100% { transform: rotate(0deg); }
  15%  { transform: rotate(-15deg); }
  30%  { transform: rotate(15deg); }
  45%  { transform: rotate(-12deg); }
  60%  { transform: rotate(12deg); }
  75%  { transform: rotate(-6deg); }
  90%  { transform: rotate(6deg); }
}
.nav-item[data-page="emergency"]:hover .svg-phone-body {
  animation: phoneVibrate 0.55s ease forwards;
  transform-box: fill-box;
  transform-origin: center;
}

/* ── 15/16. BOOK (guide): 페이지 넘김 ── */
@keyframes bookFlip {
  0%   { transform: skewY(0deg) scaleX(1); }
  40%  { transform: skewY(-4deg) scaleX(0.85); }
  100% { transform: skewY(0deg) scaleX(1); }
}
.nav-item[data-page="guide-resident"]:hover .svg-book-page,
.nav-item[data-page="guide-committee"]:hover .svg-book-page {
  animation: bookFlip 0.45s ease forwards;
  transform-origin: left center;
  transform-box: fill-box;
}

/* ── 17. USERS: 사람 슬라이드 ── */
@keyframes userSlide {
  0%   { transform: translateX(0); }
  40%  { transform: translateX(3px); }
  100% { transform: translateX(0); }
}
.nav-item[data-page="users"]:hover .svg-user-second {
  animation: userSlide 0.4s ease forwards;
}

/* ── 18. SETTINGS (gear): 회전 ── */
@keyframes gearSpin {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(90deg); }
}
.nav-item[data-page="system"]:hover .svg-gear-body {
  animation: gearSpin 0.5s ease forwards;
  transform-box: fill-box;
  transform-origin: center;
}

/* ── 19. SIGNBOARD (tv): 화면 깜빡 ── */
@keyframes tvGlow {
  0%,100% { opacity: 1; }
  30%      { opacity: 0.3; }
  60%      { opacity: 0.9; }
  80%      { opacity: 0.5; }
}
.nav-item[data-page="signboard"]:hover .svg-tv-screen {
  animation: tvGlow 0.5s ease forwards;
}
