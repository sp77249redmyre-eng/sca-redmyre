<div class="main-topbar">
  <div>
    <div id="topbarGreeting"></div>
    <div class="page-title" id="topbarPageTitle">—</div>
    <div class="breadcrumb">Redmyre House · Building Management System</div>
  </div>
  <div class="tb-right">
    <div class="role-chip">
      <div class="role-dot"></div>
      <span class="role-label" id="topbarRole">—</span>
    </div>
    <div class="user-chip">
      <div class="u-avatar" id="topAvatar">?</div>
      <div>
        <div class="u-name" id="topName">—</div>
        <div class="u-role" id="topRole">—</div>
      </div>
    </div>
  </div>
</div>
