     /components/topbar.html
     ============================================================ -->

<div class="main-topbar">
  <div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <div id="topbarGreeting" style="font-size:15px;font-weight:600"></div>
      <button id="notifToggleBtn" onclick="toggleNotification()" style="
        display:inline-flex;align-items:center;gap:5px;
        padding:3px 10px;
        background:transparent;
        border:1.5px solid var(--border);
        border-radius:20px;
        color:var(--muted);
        font-size:12px;font-weight:500;
        cursor:pointer;
        transition:all 0.2s;
      ">
        <span id="notifIcon">🔕</span>
        <span id="notifLabel">OFF</span>
      </button>
    </div>
    <div id="topbarDate" style="font-size:12px;color:var(--muted);"></div>
  </div>

  <script>
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
    }
    let notifEnabled = false;
    function updateNotifUI() {
      const btn = document.getElementById('notifToggleBtn');
      document.getElementById('notifIcon').textContent  = notifEnabled ? '🔔' : '🔕';
      document.getElementById('notifLabel').textContent = notifEnabled ? 'ON'  : 'OFF';
      btn.style.background  = notifEnabled ? 'var(--accent-soft, rgba(99,102,241,0.1))' : 'transparent';
      btn.style.borderColor = notifEnabled ? 'var(--accent, #6366f1)' : 'var(--border)';
      btn.style.color       = notifEnabled ? 'var(--accent, #6366f1)' : 'var(--muted)';
    }
    window.toggleNotification = function () {
      if (!notifEnabled) {
        Notification.requestPermission().then(async permission => {
          if (permission !== 'granted') { notifEnabled = false; updateNotifUI(); return; }
          try {
            const reg = await navigator.serviceWorker.register('/sw.js');
            const sub = await reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array('BNyzSuyh9RRzRLNiPq1mngiuEH35QX3smFJoYQGWdOSdu_4koNy4s65I8WUpI1gxanRgJLNU0gDJfhW1PUdxQrI')
            });
            const { data: { user } } = await supabase.auth.getUser();
            await supabase.from('push_subscriptions').insert({ user_id: user.id, subscription: sub });
            notifEnabled = true;
          } catch(e) { notifEnabled = false; }
          updateNotifUI();
        });
      } else {
        notifEnabled = false;
        updateNotifUI();
      }
    }
  </script>
  <div class="tb-right">
    <div class="role-chip">
      <div class="role-dot"></div>
      <span class="role-label" id="topbarRole">—</span>
    </div>
    <div class="user-chip">
      <div class="u-avatar" id="topAvatar">?</div>
      <div>
        <div class="u-name" id="topName">—</div>
        <div class="u-role" id="topRole">—</div>
      </div>
    </div>
    <button onclick="handleLogout()" style="
      display:flex;align-items:center;gap:6px;
      padding:7px 14px;
      background:transparent;
      border:1.5px solid var(--border);
      border-radius:8px;
      color:var(--muted);
      font-size:13px;
      font-weight:500;
      cursor:pointer;
      transition:all 0.2s;
    "
    onmouseover="this.style.borderColor='var(--danger,#ef4444)';this.style.color='var(--danger,#ef4444)'"
    onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
      <span style="font-size:15px">🚪</span> Log out
    </button>
  </div>
</div>
