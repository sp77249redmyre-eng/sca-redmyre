<!-- ============================================================
     Redmyre BMS — Shared Topbar Component
     /components/topbar.html
     ============================================================ -->

<div class="main-topbar">
  <div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <div id="topbarGreeting" style="font-size:15px;font-weight:600"></div>
      <button id="notifToggleBtn" onclick="toggleNotification()" style="
        display:inline-flex;align-items:center;gap:5px;
        padding:3px 10px;
        background:transparent;
        border:1.5px solid var(--border);
        border-radius:20px;
        color:var(--muted);
        font-size:12px;font-weight:500;
        cursor:pointer;
        transition:all 0.2s;
      ">
        <span id="notifIcon">🔕</span>
        <span id="notifLabel">OFF</span>
      </button>
    </div>
    <div id="topbarDate" style="font-size:12px;color:var(--muted);"></div>
  </div>


  <div class="tb-right">
    <div class="role-chip">
      <div class="role-dot"></div>
      <span class="role-label" id="topbarRole">—</span>
    </div>
    <div class="user-chip" onclick="openMyProfile()" style="cursor:pointer" title="My Profile">
      <div class="u-avatar" id="topAvatar">?</div>
      <div>
        <div class="u-name" id="topName">—</div>
        <div class="u-role" id="topRole">—</div>
      </div>
    </div>
    <button onclick="handleLogout()" style="
      display:flex;align-items:center;gap:6px;
      padding:7px 14px;
      background:transparent;
      border:1.5px solid var(--border);
      border-radius:8px;
      color:var(--muted);
      font-size:13px;
      font-weight:500;
      cursor:pointer;
      transition:all 0.2s;
    "
    onmouseover="this.style.borderColor='var(--danger,#ef4444)';this.style.color='var(--danger,#ef4444)'"
    onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
      <span style="font-size:15px">🚪</span> Log out
    </button>
  </div>
</div>

<!-- ============================================================
     My Profile Modal (Phase 1 - skeleton)
     ============================================================ -->
<style>
  .myprof-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    z-index: 9998;
    align-items: flex-start;
    justify-content: center;
    padding: 60px 20px 40px;
    overflow-y: auto;
  }
  .myprof-backdrop.open { display: flex; }
  .myprof-box {
    background: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 640px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
    animation: myprofIn 0.2s ease-out;
  }
  @keyframes myprofIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .myprof-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid #e2e8f0;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
  }
  .myprof-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .myprof-close {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .myprof-close:hover { background: rgba(255,255,255,0.3); }
  .myprof-body {
    padding: 24px;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
  }
  .myprof-placeholder {
    text-align: center;
    color: #64748b;
    padding: 40px 20px;
  }
  .myprof-placeholder h3 {
    font-size: 18px;
    color: #1e293b;
    margin: 0 0 8px;
  }
  .myprof-placeholder p {
    font-size: 13px;
    margin: 0;
    color: #94a3b8;
  }

  /* ── User Info Card ── */
  .myprof-user-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
    border: 1px solid #bae6fd;
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 24px;
  }
  .myprof-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
  }
  .myprof-user-info { flex: 1; min-width: 0; }
  .myprof-user-name {
    font-size: 17px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 4px;
    word-break: break-word;
  }
  .myprof-user-email {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 8px;
    word-break: break-all;
  }
  .myprof-user-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .myprof-role-badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .myprof-role-admin { background: #fee2e2; color: #991b1b; }
  .myprof-role-committee { background: #fef3c7; color: #92400e; }
  .myprof-role-observer { background: #ede9fe; color: #5b21b6; }
  .myprof-role-owner { background: #dcfce7; color: #166534; }
  .myprof-role-tenant { background: #dbeafe; color: #1e40af; }
  .myprof-role-default { background: #f1f5f9; color: #475569; }
  .myprof-unit-badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 100px;
    background: #f1f5f9;
    color: #475569;
    font-size: 11px;
    font-weight: 600;
  }

  /* ── Section ── */
  .myprof-section {
    margin-bottom: 20px;
  }
  .myprof-section-title {
    font-size: 13px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 12px;
    letter-spacing: 0.02em;
  }

  /* ── Form ── */
  .myprof-form {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px;
  }
  .myprof-field {
    margin-bottom: 12px;
  }
  .myprof-field:last-of-type { margin-bottom: 16px; }
  .myprof-field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 5px;
  }
  .myprof-field input {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    background: #fff;
    color: #1e293b;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    box-sizing: border-box;
  }
  .myprof-field input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
  }
  .myprof-form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* ── Buttons ── */
  .myprof-btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .myprof-btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  }
  .myprof-btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* ── Messages ── */
  .myprof-msg {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
  }
  .myprof-msg-error {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fecaca;
  }
  .myprof-msg-success {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #bbf7d0;
  }
  .myprof-msg-loading {
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #cbd5e1;
  }
</style>

<div class="myprof-backdrop" id="myProfileModal" onclick="if(event.target===this) closeMyProfile()">
  <div class="myprof-box">
    <div class="myprof-header">
      <div class="myprof-title">👤 My Profile</div>
      <button class="myprof-close" onclick="closeMyProfile()">✕</button>
    </div>
    <div class="myprof-body" id="myProfileBody">
      <div class="myprof-placeholder">
        <h3>Loading…</h3>
        <p>Phase 1 skeleton</p>
      </div>
    </div>
  </div>
</div>
