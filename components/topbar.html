<style>
  /* Topbar right area — 양끝 정렬 */
  .tb-right {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex: 1;
    min-width: 0;
  }
  .tb-right-group {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    min-width: 0;
  }

  /* User block (avatar + name + role) */
  .user-block {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .user-block .u-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    flex-shrink: 0;
  }
  .user-block .u-text {
    line-height: 1.3;
    min-width: 0;
  }
  .user-block .u-name {
    font-size: 14px;
    font-weight: 600;
    color: #0f172a;
    white-space: nowrap;
  }
  .user-block .u-role-line {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #2563eb;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .user-block .u-role-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #2563eb;
  }

  /* Divider */
  .tb-divider {
    width: 1px;
    height: 28px;
    background: #e2e8f0;
    flex-shrink: 0;
  }

  /* Edit Profile button — 시스템 메인 파랑 */
  .edit-profile-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 16px;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
  }
  .edit-profile-btn:hover {
    background: linear-gradient(135deg, #1e40af, #1d4ed8);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  }

  /* Log out button — 빨강 (우측 끝, 위험 액션 분리) */
  .logout-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 14px;
    background: transparent;
    border: 1.5px solid #fecaca;
    border-radius: 10px;
    color: #ef4444;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .logout-btn:hover {
    background: #fee2e2;
    border-color: #ef4444;
    color: #b91c1c;
  }

  /* Mobile */
  @media (max-width: 768px) {
    .tb-right { gap: 8px; }
    .tb-right-group { gap: 10px; }
    .tb-divider { height: 24px; }
    .user-block .u-avatar { width: 34px; height: 34px; font-size: 12px; }
    .edit-profile-btn { padding: 8px 11px; }
    .edit-profile-text { display: none; }
    .logout-btn { padding: 8px 11px; }
    .logout-text { display: none; }
  }
</style>

<div class="main-topbar">
  <div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <div id="topbarGreeting" style="font-size:15px;font-weight:600"></div>
      <button id="notifToggleBtn" onclick="toggleNotification()" style="
        display:inline-flex;align-items:center;gap:5px;
        padding:3px 10px;
        background:transparent;
        border:1.5px solid var(--border);
        border-radius:20px;
        color:var(--muted);
        font-size:12px;font-weight:500;
        cursor:pointer;
        transition:all 0.2s;
      ">
        <span id="notifIcon">🔕</span>
        <span id="notifLabel">OFF</span>
      </button>
    </div>
    <div id="topbarDate" style="font-size:12px;color:var(--muted);"></div>
  </div>


  <div class="tb-right">
    <div class="tb-right-group">
      <div class="user-block" id="topUserBlock">
        <div class="u-avatar" id="topAvatar">?</div>
        <div class="u-text">
          <div class="u-name" id="topName">—</div>
          <div class="u-role-line">
            <span class="u-role-dot"></span>
            <span class="u-role-label" id="topRole">—</span>
          </div>
        </div>
      </div>
      <div class="tb-divider"></div>
      <button class="edit-profile-btn" onclick="openMyProfile()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <span class="edit-profile-text">Edit Profile</span>
      </button>
    </div>
    <button class="logout-btn" onclick="handleLogout()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span class="logout-text">Log out</span>
    </button>
  </div>
</div>

<style>
  .myprof-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    z-index: 9998;

    justify-content: center;
    padding: 60px 20px 40px;
    overflow-y: auto;
  }

    overflow: hidden;
    animation: myprofIn 0.2s ease-out;

    to   { opacity: 1; transform: translateY(0); }
  }
  .myprof-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid #e2e8f0;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
  }
  .myprof-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .myprof-close {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .myprof-close:hover { background: rgba(255,255,255,0.3); }

    color: #1e293b;
    margin: 0 0 8px;
  }
  .myprof-placeholder p {
    font-size: 13px;
    margin: 0;
    color: #94a3b8;
  }

  /* ── User Info Card ── */

  /* ── Section ── */
  .myprof-section {
    margin-bottom: 20px;
  }
  .myprof-section-title {
