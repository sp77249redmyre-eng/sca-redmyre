<!-- ============================================================
     Redmyre BMS — Shared Topbar Component
     /components/topbar.html
     ============================================================ -->

<style>
  /* Topbar right area — 양끝 정렬 */
  .tb-right {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex: 1;
    min-width: 0;
  }
  .tb-right-group {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    min-width: 0;
  }

  /* User block (avatar + name + role) */
  .user-block {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .user-block .u-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    flex-shrink: 0;
  }
  .user-block .u-text {
    line-height: 1.3;
    min-width: 0;
  }
  .user-block .u-name {
    font-size: 14px;
    font-weight: 600;
    color: #0f172a;
    white-space: nowrap;
  }
  .user-block .u-role-line {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #2563eb;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .user-block .u-role-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #2563eb;
  }

  /* Divider */
  .tb-divider {
    width: 1px;
    height: 28px;
    background: #e2e8f0;
    flex-shrink: 0;
  }

  /* Edit Profile button — 시스템 메인 파랑 */
  .edit-profile-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 16px;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
  }
  .edit-profile-btn:hover {
    background: linear-gradient(135deg, #1e40af, #1d4ed8);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  }

  /* Log out button — 빨강 (우측 끝, 위험 액션 분리) */
  .logout-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 14px;
    background: transparent;
    border: 1.5px solid #fecaca;
    border-radius: 10px;
    color: #ef4444;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .logout-btn:hover {
    background: #fee2e2;
    border-color: #ef4444;
    color: #b91c1c;
  }

  /* Mobile */
  @media (max-width: 768px) {
    /* main-topbar 자체를 세로 정렬 (인사말 위 / 액션 아래) */
    .main-topbar {
      flex-direction: column !important;
      align-items: stretch !important;
      gap: 12px !important;
    }
    /* 우측 액션 바: 100% 너비로 양 끝 정렬 */
    .tb-right {
      width: 100%;
      gap: 8px;
    }
    .tb-right-group {
      gap: 10px;
      flex-wrap: nowrap;
    }
    .tb-divider { height: 24px; }
    .user-block .u-avatar { width: 34px; height: 34px; font-size: 12px; }
    .user-block .u-name { font-size: 13px; }
    .user-block .u-role-line { font-size: 10px; }
    /* Edit Profile / Log out: 텍스트 숨기고 아이콘만 (공간 절약) */
    .edit-profile-btn { padding: 8px 11px; }
    .edit-profile-text { display: none; }
    .logout-btn { padding: 8px 11px; }
    .logout-text { display: none; }
  }
</style>

<div class="main-topbar">
  <div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <div id="topbarGreeting" style="font-size:15px;font-weight:600"></div>
      <button id="notifToggleBtn" onclick="toggleNotification()" style="
        display:inline-flex;align-items:center;gap:5px;
        padding:3px 10px;
        background:transparent;
        border:1.5px solid var(--border);
        border-radius:20px;
        color:var(--muted);
        font-size:12px;font-weight:500;
        cursor:pointer;
        transition:all 0.2s;
      ">
        <span id="notifIcon">🔕</span>
        <span id="notifLabel">OFF</span>
      </button>
    </div>
    <div id="topbarDate" style="font-size:12px;color:var(--muted);"></div>
  </div>


  <div class="tb-right">
    <div class="tb-right-group">
      <div class="user-block" id="topUserBlock">
        <div class="u-avatar" id="topAvatar">?</div>
        <div class="u-text">
          <div class="u-name" id="topName">—</div>
          <div class="u-role-line">
            <span class="u-role-dot"></span>
            <span class="u-role-label" id="topRole">—</span>
          </div>
        </div>
      </div>
      <div class="tb-divider"></div>
      <button class="edit-profile-btn" onclick="openMyProfile()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <span class="edit-profile-text">Edit Profile</span>
      </button>
    </div>
    <button class="logout-btn" onclick="handleLogout()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span class="logout-text">Log out</span>
    </button>
  </div>
</div>
<!-- ============================================================
     My Profile Modal (Re-architected — Unified Form)
     ============================================================ -->
<style>
  .myprof-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    z-index: 9998;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
  }
  .myprof-backdrop.open { display: flex; }
  .myprof-box {
    background: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
  }

  /* Header */
  .myprof-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid #f1f5f9;
  }
  .myprof-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .myprof-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .myprof-title-block { min-width: 0; }
  .myprof-title {
    font-size: 16px;
    font-weight: 700;
    color: #0f172a;
    line-height: 1.2;
  }
  .myprof-subtitle {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
  }
  .myprof-close {
    width: 32px; height: 32px;
    border: none;
    background: transparent;
    color: #64748b;
    font-size: 18px;
    cursor: pointer;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .myprof-close:hover { background: #f1f5f9; color: #0f172a; }

  /* Body */
  .myprof-body {
    padding: 18px 20px 14px;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
  }

  /* Section */
  .myprof-section { margin-bottom: 18px; }
  .myprof-section-title {
    font-size: 12px;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .myprof-section-help {
    font-size: 11px;
    color: #64748b;
    margin-bottom: 8px;
    line-height: 1.5;
  }

  /* Admin info box */
  .myprof-admin-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 12px 14px;
  }
  .myprof-admin-row {
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 8px;
    font-size: 12px;
    padding: 3px 0;
    align-items: baseline;
  }
  .myprof-admin-label {
    color: #64748b;
    font-weight: 500;
  }
  .myprof-admin-value {
    color: #0f172a;
    font-weight: 600;
    word-break: break-all;
  }

  /* Inputs */
  .myprof-field { margin-bottom: 10px; }
  .myprof-label {
    font-size: 11px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 4px;
    display: block;
  }
  .myprof-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 9px;
    font-size: 13px;
    color: #0f172a;
    background: #fff;
    font-family: 'DM Sans', sans-serif;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.15s;
  }
  .myprof-input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }

  /* Password change toggle */
  .myprof-pw-btn {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 9px;
    background: #fff;
    font-size: 13px;
    color: #334155;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'DM Sans', sans-serif;
  }
  .myprof-pw-btn:hover { background: #f8fafc; }
  .myprof-pw-arrow {
    font-size: 14px;
    color: #94a3b8;
    transition: transform 0.2s;
  }
  .myprof-pw-btn.open .myprof-pw-arrow { transform: rotate(90deg); }
  .myprof-pw-panel {
    display: none;
    margin-top: 8px;
    padding: 12px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 9px;
  }
  .myprof-pw-panel.open { display: block; }
  .myprof-pw-msg {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 7px;
    font-size: 12px;
    display: none;
  }
  .myprof-pw-msg.show { display: block; }
  .myprof-pw-msg.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .myprof-pw-msg.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .myprof-pw-msg.loading { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

  .myprof-pw-submit {
    margin-top: 8px;
    width: 100%;
    padding: 9px;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .myprof-pw-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Unit checkbox row */
  .myprof-unit-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.15s;
    border: 0.5px solid;
  }
  .myprof-unit-row.owner {
    background: #ecfdf5;
    border-color: #d1fae5;
  }
  .myprof-unit-row.tenant {
    background: #f3f4f6;
    border-color: #e5e7eb;
  }
  .myprof-unit-row:hover { transform: translateY(-1px); }

  .myprof-checkbox {
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 1.5px solid #cbd5e1;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .myprof-unit-row.owner .myprof-checkbox {
    background: #065f46;
    border-color: #065f46;
  }
  .myprof-checkbox-tick {
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: none;
  }
  .myprof-unit-row.owner .myprof-checkbox-tick { display: block; }

  .myprof-unit-name {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
  }
  .myprof-unit-row.owner .myprof-unit-name { color: #065f46; }
  .myprof-unit-row.tenant .myprof-unit-name { color: #475569; }

  .myprof-unit-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 99px;
    color: #fff;
    letter-spacing: 0.04em;
  }
  .myprof-unit-row.owner .myprof-unit-badge { background: #065f46; }
  .myprof-unit-row.tenant .myprof-unit-badge { background: #1e40af; }

  /* Vehicles */
  .myprof-vehicles-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
    min-height: 4px;
  }
  .myprof-veh-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px 6px 9px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    font-size: 12px;
    font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
    font-weight: 600;
    color: #1e3a8a;
  }
  .myprof-veh-icon { font-size: 13px; }
  .myprof-veh-remove {
    border: none;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
    font-size: 13px;
    padding: 0 2px;
    line-height: 1;
  }
  .myprof-veh-remove:hover { color: #dc2626; }
  .myprof-veh-flash { animation: myprofVehFlash 0.6s ease; }
  @keyframes myprofVehFlash {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); background: #fef3c7; border-color: #fcd34d; }
  }

  .myprof-veh-add-row {
    display: flex;
    gap: 6px;
  }
  .myprof-veh-input {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 12px;
    font-family: 'SF Mono', 'Monaco', monospace;
    text-transform: uppercase;
    color: #0f172a;
    box-sizing: border-box;
    outline: none;
  }
  .myprof-veh-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
  .myprof-veh-add-btn {
    padding: 9px 14px;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    flex-shrink: 0;
  }

  /* Footer buttons */
  .myprof-footer {
    display: flex;
    gap: 8px;
    padding: 14px 20px 18px;
    border-top: 1px solid #f1f5f9;
    background: #fff;
  }
  .myprof-btn-cancel {
    flex: 1;
    padding: 11px;
    border: 1px solid #e2e8f0;
    background: #fff;
    color: #334155;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .myprof-btn-cancel:hover { background: #f8fafc; }
  .myprof-btn-save {
    flex: 1;
    padding: 11px;
    border: none;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    box-shadow: 0 3px 10px rgba(37,99,235,0.25);
  }
  .myprof-btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Global save msg */
  .myprof-save-msg {
    padding: 10px 14px;
    border-radius: 9px;
    font-size: 12px;
    margin: 10px 20px 0;
    display: none;
  }
  .myprof-save-msg.show { display: block; }
  .myprof-save-msg.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .myprof-save-msg.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .myprof-save-msg.loading { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

  @media (max-width: 480px) {
    .myprof-box { max-width: 100%; }
    .myprof-body { padding: 14px 16px 10px; }
    .myprof-footer { padding: 12px 16px 14px; }
    .myprof-header { padding: 14px 16px 12px; }
  }
</style>

<div class="myprof-backdrop" id="myProfileModal" onclick="if(event.target===this) closeMyProfile()">
  <div class="myprof-box">
    <!-- Header -->
    <div class="myprof-header">
      <div class="myprof-header-left">
        <div class="myprof-avatar" id="myprofAvatar">?</div>
        <div class="myprof-title-block">
          <div class="myprof-title">My Profile</div>
          <div class="myprof-subtitle" id="myprofSubtitle">—</div>
        </div>
      </div>
      <button class="myprof-close" onclick="closeMyProfile()">✕</button>
    </div>

    <!-- Body -->
    <div class="myprof-body" id="myProfileBody">
      <div style="padding: 40px; text-align: center; color: #94a3b8; font-size: 13px;">Loading…</div>
    </div>

    <!-- Save status -->
    <div class="myprof-save-msg" id="myprofSaveMsg"></div>

    <!-- Footer -->
    <div class="myprof-footer" id="myprofFooter" style="display:none">
      <button class="myprof-btn-cancel" onclick="closeMyProfile()">취소 / Cancel</button>
      <button class="myprof-btn-save" id="myprofSaveBtn" onclick="myProfileSaveAll()">저장 / Save</button>
    </div>
  </div>
</div>
