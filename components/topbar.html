<style>
  /* Navy bar — matches the sidebar */

  #notifToggleBtn {

  /* Edit Profile — white button, soft glow */
  .edit-profile-btn {

    background: #fff; color: #1e3a8a; font-size: 18px; font-weight: 800;
    cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap;
    animation: tbGlow 2.8s ease-in-out infinite; transition: transform 0.15s;
  }
  .edit-profile-btn:hover { transform: translateY(-1px); background: #f1f6ff; }
  .edit-profile-btn:active { transform: scale(0.97); }
  @keyframes tbGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.5); }
    50% { box-shadow: 0 0 0 9px rgba(255, 255, 255, 0); }
  }

  /* Incomplete-profile nudge (replaces the Edit button until profile is complete) */
  .tb-nudge {
    display: none; align-items: center; gap: 12px; height: 52px; padding: 0 7px 0 20px;
    border-radius: 13px; background: #fff; color: #1e3a8a;
    font-size: 17.5px; font-weight: 700; cursor: pointer; border: none;
    font-family: 'DM Sans', sans-serif; white-space: nowrap;
  }

    animation: tbDot 1.8s infinite;
  }

    0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
    100% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }

  .tb-hidden { display: none !important; }

    .tb-right { width: 100%; gap: 8px; justify-content: space-between; flex-wrap: nowrap; }

<div class="main-topbar">

      <span class="tb-long">Add your phone &amp; vehicle email</span>
      <b>Complete profile →</b>
    </button>

      <span class="edit-profile-text">Edit Profile</span>
    </button>

      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span class="logout-text">Log out</span>
    </button>

  </div>
</div>

<script>
  /* Profile-completeness nudge: owner/tenant with a unit they operate and
     (no phone) or (a plate without a notice email) → show "Complete profile". */
  (function () {
    var tries = 0;
    function splitE(v) { return String(v || '').split(/[,;\s]+/).map(function (x) { return x.trim().toLowerCase(); }).filter(Boolean); }

    async function checkProfile() {
      var ctx = window.__bmsCtx;
      var nudge = document.getElementById('tbNudge');
      if (!nudge) return;
      if (!ctx || !ctx.supabase || !ctx.user || !ctx.user.email) {
        if (tries++ < 40) setTimeout(checkProfile, 500);
        return;
      }
      var role = ctx.role;
      if (role !== 'owner' && role !== 'tenant') { setIncomplete(false); return; }
      try {
        var res = await ctx.supabase.from('occupants').select('*');
        var me = ctx.user.email.toLowerCase();
        var incomplete = false, mine = 0;
        (res.data || []).forEach(function (o) {
          var isPrimary = splitE(o.primary_email).indexOf(me) !== -1;
          var isBiz = splitE(o.business_email).indexOf(me) !== -1;
          var operated = (isPrimary && o.owner_type !== 'Tenant') || (!isPrimary && isBiz && o.owner_type === 'Tenant');
          if (!operated) return;
          mine++;
          if (!String(o.phone || '').trim()) incomplete = true;
          var plates = String(o.license_plates || '').split(',').map(function (p) { return p.trim().toUpperCase(); }).filter(Boolean);
          var pe = {};
          if (o.plate_emails && typeof o.plate_emails === 'object') {
            Object.keys(o.plate_emails).forEach(function (k) { if (o.plate_emails[k]) pe[String(k).trim().toUpperCase()] = 1; });
          }
          if (plates.some(function (p) { return !pe[p]; })) incomplete = true;
        });
        setIncomplete(mine > 0 && incomplete);
      } catch (e) { setIncomplete(false); }
    }
    function setIncomplete(on) {
      var nudge = document.getElementById('tbNudge');
      if (nudge) nudge.classList.toggle('show', !!on);
      document.body.classList.toggle('tb-incomplete', !!on);
    }
    window.tbRecheckProfile = checkProfile;
    window.addEventListener('myprofile-saved', checkProfile);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', checkProfile);
    else checkProfile();
  })();
</script>

<script>
  /* 드롭다운 토글 — 모바일에서만 작동 */
  window.toggleUserDropdown = function(e) {
    if (window.innerWidth > 768) return;
    if (e) { e.stopPropagation(); }
    const dd = document.getElementById('userDropdown');
    if (!dd) return;
    dd.classList.toggle('open');
  };
  window.closeUserDropdown = function() {
    const dd = document.getElementById('userDropdown');
    if (dd) dd.classList.remove('open');
  };

  /* DOM 준비 후 직접 핸들러 바인딩 (onclick보다 안전) */
  document.addEventListener('DOMContentLoaded', () => {
    /* user-block 클릭 → 드롭다운 토글 (모바일) */
    const ub = document.getElementById('topUserBlock');
    if (ub) {
      ub.addEventListener('click', (e) => {
        if (window.innerWidth > 768) return;
        e.stopPropagation();
        const dd = document.getElementById('userDropdown');
        if (dd) dd.classList.toggle('open');
      });
    }
    /* 드롭다운 항목 직접 바인딩 */
    const editBtn = document.querySelector('#userDropdown .user-dropdown-item.edit');
    if (editBtn) {
      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        window.closeUserDropdown();
        if (typeof window.openMyProfile === 'function') {
          window.openMyProfile();
        }
      });
    }
    const logoutBtn = document.querySelector('#userDropdown .user-dropdown-item.logout');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        window.closeUserDropdown();
        if (typeof window.handleLogout === 'function') {
          window.handleLogout();
        }
      });
    }
    /* 외부 클릭 시 닫기 */
    document.addEventListener('click', (e) => {
      const dd = document.getElementById('userDropdown');
      const ub2 = document.getElementById('topUserBlock');
      if (!dd || !ub2 || !dd.classList.contains('open')) return;
      if (ub2.contains(e.target) || dd.contains(e.target)) return;
      window.closeUserDropdown();
    });
    /* ESC로 닫기 */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.closeUserDropdown();
    });
  });
</script>
