<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cost Dashboard – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ── Filter Bar ── */
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-select{padding:7px 11px;border:0.5px solid #e2e8f0;border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;background:#fff;color:#475569;transition:border-color 0.15s}
.filter-select:focus{outline:none;border-color:#2563eb}
.filter-input{padding:7px 12px;border:0.5px solid #e2e8f0;border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;background:#fff;color:#1e293b;outline:none;width:140px;transition:border-color 0.15s}
.filter-input:focus{border-color:#2563eb}
.btn-refresh{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:linear-gradient(135deg,#1e3a8a,#2563eb);border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif;box-shadow:0 2px 8px rgba(37,99,235,0.2)}
.btn-refresh:hover{box-shadow:0 4px 14px rgba(37,99,235,0.3);transform:translateY(-1px)}

/* ── Stats Row ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:#fff;border:0.5px solid #e2e8f0;border-radius:14px;padding:20px;transition:box-shadow 0.2s;position:relative;overflow:hidden}
.stat-card:hover{box-shadow:0 6px 20px rgba(0,0,0,0.07);transform:translateY(-1px)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0;background:var(--stat-color,#e2e8f0)}
.stat-label{font-size:11px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px}
.stat-num{font-size:26px;font-weight:600;letter-spacing:-1px;margin-bottom:4px}
.stat-sub{font-size:11px;color:#94a3b8;margin-top:2px}

/* ── Section Heading ── */
.section-heading{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-heading-bar{width:4px;height:18px;border-radius:2px;background:#2563eb;flex-shrink:0}
.section-heading-text{font-size:15px;font-weight:600;color:#1e293b}

/* ── Category Grid ── */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
.cat-card{background:#fff;border:0.5px solid #e2e8f0;border-radius:12px;padding:16px;border-top:3px solid;transition:all 0.15s}
.cat-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.08);transform:translateY(-2px)}
.cat-name{font-size:12px;font-weight:600;color:#475569;margin-bottom:4px}
.cat-amount{font-size:18px;font-weight:600;margin-bottom:3px}
.cat-count{font-size:11px;color:#94a3b8;margin-top:3px}
.cat-bar-wrap{height:4px;background:#f1f5f9;border-radius:100px;margin-top:10px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:100px;transition:width 0.6s ease}

/* ── Two-column layout ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
.panel{background:#fff;border:0.5px solid #e2e8f0;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.panel-header{padding:14px 20px;background:#f8fafc;border-bottom:0.5px solid #f1f5f9;font-size:15px;font-weight:600;color:#1e293b;display:flex;justify-content:space-between;align-items:center}
.panel-body{padding:4px 0}


.rank-meta{font-size:13px;color:#94a3b8}
.rank-bar-wrap{height:3px;background:#f1f5f9;border-radius:100px;margin-top:5px;width:100%;overflow:hidden}
.rank-bar-fill{height:100%;border-radius:100px;transition:width 0.5s ease}
.rank-amount{font-size:13px;font-weight:600;color:#1e293b;white-space:nowrap}

/* ── Monthly Table ── */
.month-row{display:grid;grid-template-columns:90px 1fr 80px 80px;gap:8px;align-items:center;padding:11px 20px;border-bottom:0.5px solid #f8fafc;transition:background 0.12s}
.month-row:last-child{border-bottom:none}
.month-row:hover{background:#f8fafc}
.month-label{font-size:13px;font-weight:500;color:#1e293b}
.month-bar-wrap{height:6px;background:#f1f5f9;border-radius:100px;overflow:hidden}
.month-bar-fill{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:100px;transition:width 0.5s ease}
.month-amount{font-size:12px;font-weight:600;color:#1e293b;text-align:right}
.month-count{font-size:11px;color:#94a3b8;text-align:right}
.emg-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#dc2626;margin-left:4px;vertical-align:middle;flex-shrink:0}

/* ── Top Projects ── */
.projects-panel{background:#fff;border:0.5px solid #e2e8f0;border-radius:16px;overflow:hidden;margin-bottom:28px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.proj-row{display:grid;grid-template-columns:28px 1fr 100px 110px 80px;gap:12px;align-items:center;padding:13px 20px;border-bottom:0.5px solid #f8fafc;transition:background 0.12s}
.proj-row:last-child{border-bottom:none}
.proj-row:hover{background:#f8fafc}
.proj-rank{font-size:13px;font-weight:700;color:#94a3b8}
.proj-rank.top{color:#f59e0b}
.proj-title{font-size:13px;font-weight:500;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-vendor{font-size:12px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-amount{font-size:13px;font-weight:600;color:#1e293b;text-align:right}
.proj-date{font-size:12px;color:#94a3b8;text-align:right}
.cat-badge{display:inline-flex;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:600}

/* ── Emergency ratio badge ── */
.emg-ratio{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;background:#fee2e2;color:#991b1b;margin-left:6px}

/* ── Toast */
.toast{position:fixed;bottom:28px;right:28px;padding:14px 22px;border-radius:12px;color:#fff;font-size:14px;display:none;z-index:9999;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,0.15)}

/* ── Quarterly ── */
.quarterly-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.q-card{background:#fff;border:0.5px solid #e2e8f0;border-radius:12px;padding:16px;text-align:center;position:relative;overflow:hidden}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--q-color,#2563eb)}
.q-label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px}
.q-amount{font-size:20px;font-weight:700;letter-spacing:-0.5px;color:#1e293b;margin-bottom:4px}
.q-sub{font-size:11px;color:#94a3b8}
.q-bar-wrap{height:4px;background:#f1f5f9;border-radius:100px;margin-top:10px;overflow:hidden}
.q-bar-fill{height:100%;border-radius:100px;transition:width 0.6s ease}

/* ── Category filter chips ── */
.cat-filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.cat-chip{padding:5px 12px;border-radius:100px;font-size:12px;font-weight:600;border:1.5px solid #e2e8f0;background:#fff;color:#475569;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
.cat-chip:hover{border-color:#2563eb;color:#2563eb}
.cat-chip.active{background:#2563eb;color:#fff;border-color:#2563eb}
.cat-chip-label{font-size:11px;color:#94a3b8;font-weight:600;margin-right:4px}

/* ── 모바일 ── */
@media(max-width:768px){
  .stats-row{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px}
  .stat-num{font-size:20px}
  .cat-grid{grid-template-columns:1fr 1fr;gap:8px}
  .cat-card{padding:12px}
  .cat-amount{font-size:15px}
  .two-col{grid-template-columns:1fr}
  #section2Grid{grid-template-columns:1fr !important}
  #pieGrid{grid-template-columns:1fr !important}
  .filter-bar{gap:6px}
  .filter-select,.filter-input{width:100%;padding:10px;font-size:14px}
  .btn-refresh{width:100%;justify-content:center;padding:10px}
  .proj-row{grid-template-columns:24px 1fr auto;gap:8px}
  .proj-vendor,.proj-date{display:none}
  .month-row{grid-template-columns:80px 1fr 70px}
  .month-count{display:none}
}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">

    <!-- Filter Bar -->
    <div class="filter-bar">
      <select class="filter-select" id="filterPeriod">
        <option value="thismonth">This Month</option>
        <option value="lastmonth">Last Month</option>
        <option value="thisquarter">This Quarter</option>
        <option value="thisyear" selected>This Year</option>
        <option value="alltime">All Time</option>
        <option value="custom">Custom Range</option>
      </select>
      <input type="date" class="filter-input" id="dateFrom" style="display:none">
      <input type="date" class="filter-input" id="dateTo" style="display:none">
      <button class="btn-refresh" id="refreshBtn">↻ Refresh</button>
      <button class="btn-refresh" id="exportBtn" style="background:linear-gradient(135deg,#16a34a,#22c55e);margin-left:4px">📥 Export Excel</button>
      <a href="/pages/reports.html" class="btn-refresh" style="background:linear-gradient(135deg,#7c3aed,#6d28d9);margin-left:auto;text-decoration:none">📋 Completed Works</a>
    </div>

    <!-- Category Filter -->


    <!-- 1. Pie Chart -->
    <div class="section-heading">
      <div class="section-heading-bar" style="background:#0891b2"></div>
      <div class="section-heading-text">Spend by Category</div>
    </div>
    <div class="panel" style="padding:40px;margin-bottom:28px">
      <div style="display:grid;grid-template-columns:360px 1fr;gap:60px;align-items:center" id="pieGrid">
        <div style="position:relative;width:360px;height:360px;margin:0 auto">
          <canvas id="categoryPieChart" width="360" height="360"></canvas>
        </div>
        <div id="pieLegend" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>
    </div>

    <!-- 2. Monthly Bar Chart -->
    <div class="section-heading">
      <div class="section-heading-bar" style="background:#7c3aed"></div>
      <div class="section-heading-text">Monthly Spend</div>
    </div>
    <div class="panel" style="padding:32px;margin-bottom:0;border-radius:16px 16px 0 0">
      <canvas id="monthlyBarChart" style="width:100%;height:380px;display:block"></canvas>
    </div>
    <div id="monthDetail" style="display:none;border:1px solid #e2e8f0;border-top:none;border-radius:0 0 16px 16px;overflow:hidden;margin-bottom:28px"></div>
    <div style="margin-bottom:28px"></div>




  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role } = ctx;

if (!['admin','committee','observer'].includes(role)) window.location.href='/pages/building.html';

const CAT_LABELS = { 'HVAC':'HVAC','Fire':'Fire','Electrical':'Electrical','Security':'Security','Plumbing':'Plumbing','Lift':'Lift','General':'General','Legal':'Legal' };
const CAT_COLORS = { 'HVAC':'#d97706','Fire':'#dc2626','Electrical':'#ca8a04','Security':'#7c3aed','Plumbing':'#0891b2','Lift':'#059669','General':'#2563eb','Legal':'#db2777' };
const CAT_BG    = { 'HVAC':'#fef3c7','Fire':'#fee2e2','Electrical':'#fefce8','Security':'#ede9fe','Plumbing':'#ecfeff','Lift':'#dcfce7','General':'#dbeafe','Legal':'#fce7f3' };
const Q_COLORS = ['#2563eb','#16a34a','#f59e0b','#7c3aed'];

const MONTH_COLORS = ['#2563eb','#7c3aed','#0891b2','#059669','#d97706','#dc2626','#db2777','#16a34a','#ea580c','#6366f1','#0e7490','#9333ea'];
const fmt = n => '$'+Number(n||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtShort = n => { const v=Number(n||0); return v>=1000?'$'+(v/1000).toFixed(1)+'k':fmt(v); };

function parseQuoteCategory(q) {
  try { if (q.comment) { const c=typeof q.comment==='string'?JSON.parse(q.comment):q.comment; if (c?.category) return c.category; } } catch {}
  }

function catBadge(cat) {
    const color=CAT_COLORS[cat]||'#94a3b8';
  const bg=CAT_BG[cat]||'#f1f5f9';
  return `<span class="cat-badge" style="background:${bg};color:${color};border:0.5px solid ${color}33">${label}</span>`;
}

let dateFrom=null, dateTo=null;
let allData = [];

function updateDateRange() {
  const period=document.getElementById('filterPeriod').value;
  const fromEl=document.getElementById('dateFrom');
  const toEl=document.getElementById('dateTo');
  if (period==='custom') { fromEl.style.display='block'; toEl.style.display='block'; return; }
  fromEl.style.display='none'; toEl.style.display='none';
  const now=new Date(); const y=now.getFullYear(); const m=now.getMonth();
  if (period==='thismonth')   { dateFrom=new Date(y,m,1); dateTo=new Date(y,m+1,0); }
  else if (period==='lastmonth')   { dateFrom=new Date(y,m-1,1); dateTo=new Date(y,m,0); }
  else if (period==='thisquarter') { const q=Math.floor(m/3); dateFrom=new Date(y,q*3,1); dateTo=new Date(y,q*3+3,0); }
  else if (period==='thisyear')    { dateFrom=new Date(y,0,1); dateTo=new Date(y,11,31); }
  else { dateFrom=null; dateTo=null; }
  loadDashboard();
}

document.getElementById('filterPeriod').addEventListener('change', updateDateRange);
document.getElementById('refreshBtn').addEventListener('click', loadDashboard);
document.getElementById('dateFrom').addEventListener('change', () => {
  dateFrom=new Date(document.getElementById('dateFrom').value); loadDashboard();
});
document.getElementById('dateTo').addEventListener('change', () => {
  dateTo=new Date(document.getElementById('dateTo').value); loadDashboard();
});

// ── Category Filter ──────────────────────────────────────────
// ── Export Excel ─────────────────────────────────────────────
document.getElementById('exportBtn').addEventListener('click', () => {
  const data = allData;
  if (!data.length) { showToast('No data to export', true); return; }

  const rows = data.map(q => ({
    'Date': q.completion_date ? new Date(q.completion_date).toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }) : '—',
    'Project': q.project || q.title || '—',
    'Contractor': q.vendor || '—',
    'Category': CAT_LABELS[q._cat] || q._cat || '—',
    'Amount (ex GST)': Number(q.amount || 0),
    'Type': q.is_emergency ? 'Emergency' : 'Regular' }));

  // Total row
  const total = data.reduce((s, q) => s + Number(q.amount || 0), 0);
  rows.push({ 'Date': '', 'Project': '', 'Contractor': '', 'Category': 'TOTAL', 'Amount (ex GST)': total, 'Type': '' });

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:14},{wch:36},{wch:22},{wch:14},{wch:16},{wch:10}];
  const wb = XLSX.utils.book_new();
  const period = document.getElementById('filterPeriod').value;
  XLSX.utils.book_append_sheet(wb, ws, 'Financial');
  const dateStr = new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb, `Redmyre_Financial_${period}_${dateStr}.xlsx`);
});

async function loadDashboard() {

  let qQuery=supabase.from('quotes').select('*')
    .not('completion_date','is',null)
    .eq('work_status','completed')
    .not('status','eq','removed')
    .order('completion_date',{ascending:false});

  if (dateFrom) qQuery=qQuery.gte('completion_date',dateFrom.toISOString().split('T')[0]);
  if (dateTo)   qQuery=qQuery.lte('completion_date',new Date(dateTo.getTime()+86400000).toISOString().split('T')[0]);

  const { data:raw } = await qQuery;
  allData = (raw||[]).map(q=>({...q,_cat:parseQuoteCategory(q)}));

  renderDashboard(allData);
}

function renderDashboard(data) {
  if (!data.length) {
    return;
  }

  // Monthly totals
  const monthlyTotals={};
  data.forEach(q=>{
    if (!q.completion_date) return;
    const d=new Date(q.completion_date);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (!monthlyTotals[key]) monthlyTotals[key]={total:0,count:0,label:d.toLocaleString('en-AU',{month:'short',year:'numeric'})};
    monthlyTotals[key].total+=(Number(q.amount)||0);
    monthlyTotals[key].count++;
  });
  const sortedMonths=Object.entries(monthlyTotals).sort((a,b)=>a[0].localeCompare(b[0]));

  renderMonthlyBarChart(sortedMonths);
  renderPieChart(data);
  _currentPieData = data;
  renderCategoryAccordion(data, document.getElementById('categoryAccordion').dataset.openCat||null);
}

// 월별 바 차트 슬라이스 정보 저장
window._monthSlices = [];

function renderMonthlyBarChart(sortedMonths) {
  const canvas=document.getElementById('monthlyBarChart');
  if (!canvas||!sortedMonths.length) return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth||800;
  const H=380;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const maxVal=Math.max(...sortedMonths.map(([,d])=>d.total),1);
  const n=sortedMonths.length;
  const padL=72,padR=24,padT=60,padB=70;
  const chartW=W-padL-padR;
  const chartH=H-padT-padB;
  const barW=Math.min(Math.floor(chartW/n)-12,80);
  const gap=(chartW-barW*n)/(n+1);

  window._monthSlices = [];
  let selectedMonth = window._selectedMonth||null;

  function draw() {
    ctx.clearRect(0,0,W,H);

    // 그리드
    for (let i=0;i<=4;i++) {
      const y=padT+chartH-(chartH/4)*i;
      ctx.strokeStyle='#f1f5f9'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+chartW,y); ctx.stroke();
      ctx.fillStyle='#94a3b8'; ctx.font='12px DM Sans,sans-serif'; ctx.textAlign='right';
      ctx.fillText(fmtShort(maxVal/4*i),padL-8,y+4);
    }

    sortedMonths.forEach(([key,d],i)=>{
      const x=padL+gap+i*(barW+gap);
      const bH=Math.max((d.total/maxVal)*chartH,4);
      const y=padT+chartH-bH;
      const isSelected = selectedMonth===key;
      const monthColor = MONTH_COLORS[i % MONTH_COLORS.length];

      window._monthSlices[i]={x,y:padT,w:barW,h:chartH+padB,key,d,color:monthColor};

      // 바
      const grad=ctx.createLinearGradient(x,y,x,y+bH);
      grad.addColorStop(0, isSelected ? '#f59e0b' : monthColor);
      grad.addColorStop(1, isSelected ? '#d97706' : monthColor+'99');
      ctx.fillStyle=grad;
      ctx.beginPath(); ctx.roundRect(x,y,barW,bH,[8,8,0,0]); ctx.fill();

      // 선택된 바 테두리
      if (isSelected) {
        ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.roundRect(x-1,y-1,barW+2,bH+1,[8,8,0,0]); ctx.stroke();
      }

      // inc GST (크게)
      ctx.fillStyle=isSelected?'#d97706':'#1e293b';
      ctx.font='bold 14px DM Sans,sans-serif'; ctx.textAlign='center';
      ctx.fillText(fmtShort(d.total*1.1),x+barW/2,y-26);
      // ex GST
      ctx.fillStyle='#64748b'; ctx.font='12px DM Sans,sans-serif';
      ctx.fillText(fmtShort(d.total),x+barW/2,y-11);
      // 월 라벨 (크게)
      ctx.fillStyle=isSelected?'#d97706':monthColor;
      ctx.font=`bold 13px DM Sans,sans-serif`;
      ctx.fillText(d.label,x+barW/2,padT+chartH+22);
      // job 수
      ctx.fillStyle='#94a3b8'; ctx.font='12px DM Sans,sans-serif';
      ctx.fillText(d.count+' job'+(d.count!==1?'s':''),x+barW/2,padT+chartH+40);
    });

    // X축
    ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(padL,padT+chartH); ctx.lineTo(padL+chartW,padT+chartH); ctx.stroke();
  }

  draw();
  window._redrawMonthlyBar = draw;

  // 클릭
  canvas.onclick=(e)=>{
    const rect=canvas.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width);
    const my=(e.clientY-rect.top)*(H/rect.height);
    let clicked=null;
    window._monthSlices.forEach(s=>{
      if (mx>=s.x&&mx<=s.x+s.w&&my>=s.y&&my<=s.y+s.h) clicked=s;
    });
    if (!clicked) return;
    if (window._selectedMonth===clicked.key) {
      window._selectedMonth=null;
      document.getElementById('monthDetail').style.display='none';
    } else {
      window._selectedMonth=clicked.key;
      renderMonthDetail(clicked.key, clicked.d, clicked.color);
    }
    draw();
  };

  // 호버 커서
  canvas.onmousemove=(e)=>{
    const rect=canvas.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width);
    const my=(e.clientY-rect.top)*(H/rect.height);
    let hit=false;
    window._monthSlices.forEach(s=>{
      if (mx>=s.x&&mx<=s.x+s.w&&my>=s.y&&my<=s.y+s.h) hit=true;
    });
    canvas.style.cursor=hit?'pointer':'default';
  };
}

function renderPieChart(data) {
  let selectedSlice = -1;
  window._pieData = data;
  const canvas=document.getElementById('categoryPieChart');
  if (!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=360,H=360,cx=W/2,cy=H/2,r=158,inner=90;
  const totals={};
  data.forEach(q=>{ const cat=q._cat||'General'; totals[cat]=(totals[cat]||0)+Number(q.amount||0); });
  const total=Object.values(totals).reduce((s,v)=>s+v,0);
  if (!total) return;
  const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const slices=[]; let startAngle=-Math.PI/2;
  sorted.forEach(([cat,val])=>{
    const angle=(val/total)*Math.PI*2;
    slices.push({cat,val,startAngle,endAngle:startAngle+angle,color:CAT_COLORS[cat]||'#94a3b8'});
    startAngle+=angle;
  });

  function drawCenter(l1,l2,l3) {
    ctx.beginPath(); ctx.arc(cx,cy,inner,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.textAlign='center';
    ctx.fillStyle='#94a3b8'; ctx.font='600 13px DM Sans,sans-serif'; ctx.fillText(l1,cx,cy-26);
    ctx.fillStyle='#0f172a'; ctx.font='800 20px DM Sans,sans-serif'; ctx.fillText(l2,cx,cy+2);
    ctx.fillStyle='#2563eb'; ctx.font='700 15px DM Sans,sans-serif'; ctx.fillText(l3,cx,cy+24);
  }

  function draw(hovered=-1) {
    ctx.clearRect(0,0,W,H);
    slices.forEach((s,i)=>{
      const off=i===hovered?8:0;
      const mid=(s.startAngle+s.endAngle)/2;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(mid)*off,cy+Math.sin(mid)*off);
      ctx.arc(cx+Math.cos(mid)*off,cy+Math.sin(mid)*off,r,s.startAngle,s.endAngle);
      ctx.lineTo(cx+Math.cos(mid)*off,cy+Math.sin(mid)*off);
      ctx.fillStyle=s.color; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.stroke();
    });
    if (hovered>=0) {
      const s=slices[hovered];
      drawCenter(CAT_LABELS[s.cat]||s.cat,fmt(s.val),'inc: '+fmt(s.val*1.1));
    } else {
      drawCenter('Total (ex GST)',fmt(total),'inc GST: '+fmt(total*1.1));
    }
  }
  draw();
  window._drawPie = draw;

  canvas.onmousemove=(e)=>{
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left-cx, my=e.clientY-rect.top-cy;
    const dist=Math.sqrt(mx*mx+my*my);
    if (dist<inner||dist>r){draw(selectedSlice);return;}
    let angle=Math.atan2(my,mx);
    if (angle<-Math.PI/2) angle+=Math.PI*2;
    const idx=slices.findIndex(s=>angle>=s.startAngle&&angle<s.endAngle);
    idx>=0?draw(idx):draw(selectedSlice);
  };
  canvas.onmouseleave=()=>draw(selectedSlice);
  canvas.onclick=(e)=>{
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left-cx, my=e.clientY-rect.top-cy;
    const dist=Math.sqrt(mx*mx+my*my);
    if (dist<inner||dist>r) return;
    let angle=Math.atan2(my,mx);
    if (angle<-Math.PI/2) angle+=Math.PI*2;
    const idx=slices.findIndex(s=>angle>=s.startAngle&&angle<s.endAngle);
    if (idx>=0) {
      const cat=slices[idx].cat;
      selectedSlice = selectedSlice===idx?-1:idx;
      draw(selectedSlice);
      toggleCategoryAccordion(selectedSlice>=0?cat:null);
    }
  };

  document.getElementById('pieLegend').innerHTML=sorted.map(([cat,val],i)=>{
    const pct=Math.round(val/total*100);
    const color=CAT_COLORS[cat]||'#94a3b8';
    const items=data.filter(q=>(q._cat||'General')===cat).sort((a,b)=>new Date(b.completion_date)-new Date(a.completion_date));
    const detailRows=items.map((q,j)=>{
      const dateStr=q.completion_date?new Date(q.completion_date).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}):'—';
      const emg=q.is_emergency?`<span style="font-size:9px;font-weight:700;color:#dc2626;background:#fee2e2;padding:1px 5px;border-radius:8px;margin-left:4px">EMG</span>`:'';
      return `<div style="display:grid;grid-template-columns:120px 2fr 1fr 130px;gap:0;padding:14px 20px;background:${j%2===0?'#fff':'#f8fafc'};border-bottom:1px solid #f1f5f9;align-items:center">
        <div style="font-size:14px;font-weight:500;color:#64748b">${dateStr}</div>
        <div style="font-size:15px;font-weight:600;color:#1e293b">${q.project||q.title||'—'}${emg}</div>
        <div style="font-size:14px;color:#475569">${q.vendor||'—'}</div>
        <div style="text-align:right">
          <div style="font-size:14px;font-weight:700;color:#1e293b">${fmt(Number(q.amount||0))}</div>
          <div style="font-size:13px;font-weight:600;color:#2563eb;margin-top:2px">${fmt(Number(q.amount||0)*1.1)} inc GST</div>
        </div>
      </div>`;
    }).join('');
    const totalRow=`<div style="display:grid;grid-template-columns:120px 2fr 1fr 130px;gap:0;padding:14px 20px;background:${color}15;border-top:2px solid ${color}">
      <div></div><div></div>
      <div style="font-size:14px;font-weight:700;color:#1e293b">Total</div>
      <div style="text-align:right">
        <div style="font-size:14px;font-weight:700;color:#1e293b">${fmt(val)}</div>
        <div style="font-size:13px;font-weight:700;color:#2563eb;margin-top:2px">${fmt(val*1.1)} inc GST</div>
      </div>
    </div>`;
    const header=`<div style="display:grid;grid-template-columns:120px 2fr 1fr 130px;gap:0;padding:10px 20px;background:#f8fafc;border-bottom:1px solid #e2e8f0;border-top:1px solid #e2e8f0">
      <div style="font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.06em">Date</div>
      <div style="font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.06em">Project</div>
      <div style="font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.06em">Contractor</div>
      <div style="font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;text-align:right">Amount</div>
    </div>`;
    return `<div style="border-radius:12px;overflow:hidden;border:1.5px solid #e2e8f0;transition:all 0.2s" id="leg-item-${i}">
      <div data-cat="${cat}" data-idx="${i}" style="display:flex;align-items:center;gap:14px;padding:12px 16px;background:#f8fafc;cursor:pointer;transition:all 0.15s"
        onmouseover="this.style.background='${color}18';this.parentElement.style.borderColor='${color}';if(window._drawPie)window._drawPie(${i});"
        onmouseout="if(!this.parentElement.classList.contains('open')){this.style.background='#f8fafc';this.parentElement.style.borderColor='#e2e8f0';}if(window._drawPie)window._drawPie(window._selectedSlice!=null?window._selectedSlice:-1);"
        onclick="handleLegendClick('${cat}',${i})">
        <div style="width:14px;height:14px;border-radius:50%;background:${color};flex-shrink:0"></div>
        <div style="flex:1">
          <div style="font-size:16px;font-weight:700;color:#1e293b">${CAT_LABELS[cat]||cat}</div>
          <div style="font-size:14px;color:#94a3b8;margin-top:4px">ex GST: ${fmt(val)} &nbsp;|&nbsp; inc GST: <span style="color:#2563eb;font-weight:600">${fmt(val*1.1)}</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
          <div style="text-align:right">
            <div style="font-size:20px;font-weight:800;color:#1e293b">${pct}%</div>
            <div style="font-size:14px;color:#94a3b8">of total</div>
          </div>
          <div class="leg-arrow" style="font-size:18px;color:#94a3b8;transition:transform 0.2s">›</div>
        </div>
      </div>
      <div class="leg-detail" style="display:none">
        ${header}${detailRows}${totalRow}
      </div>
    </div>`;
  }).join('')+`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,#0f2456,#1e3a8a);margin-top:8px">
      <div style="font-size:14px;font-weight:700;color:rgba(255,255,255,0.8)">Total</div>
      <div style="text-align:right">
        <div style="font-size:12px;color:rgba(255,255,255,0.6)">ex GST: ${fmt(total)}</div>
        <div style="font-size:16px;font-weight:800;color:#fff">inc GST: ${fmt(total*1.1)}</div>
      </div>
    </div>`;
}

updateDateRange();

let _currentPieData = [];

window.handleLegendClick = function(cat, idx) {
  const item = document.getElementById('leg-item-'+idx);
  if (!item) return;
  const detail = item.querySelector('.leg-detail');
  const arrow = item.querySelector('.leg-arrow');
  const header = item.querySelector('[data-cat]');
  const color = CAT_COLORS[cat]||'#94a3b8';
  const isOpen = item.classList.contains('open');

  // 모든 항목 닫기
  document.querySelectorAll('#pieLegend [id^="leg-item-"]').forEach(el => {
    el.classList.remove('open');
    el.style.borderColor='#e2e8f0';
    const d=el.querySelector('.leg-detail'); if(d) d.style.display='none';
    const a=el.querySelector('.leg-arrow'); if(a) a.style.transform='rotate(0deg)';
    const h=el.querySelector('[data-cat]'); if(h) h.style.background='#f8fafc';
  });

  if (!isOpen) {
    item.classList.add('open');
    item.style.borderColor=color;
    detail.style.display='block';
    arrow.style.transform='rotate(90deg)';
    header.style.background=color+'18';
    window._selectedSlice = idx;
  } else {
    window._selectedSlice = -1;
  }
  if (window._drawPie) window._drawPie(window._selectedSlice!=null?window._selectedSlice:-1);
};

function toggleCategoryAccordion(cat) {
  const accordion = document.getElementById('categoryAccordion');
  // 같은 카테고리 클릭시 닫기
  if (accordion.dataset.openCat === cat) {
    accordion.dataset.openCat = '';
    renderCategoryAccordion(_currentPieData, null);
    // 범례 선택 해제
    document.querySelectorAll('#pieLegend [data-cat]').forEach(el => {
      el.classList.remove('selected');
      el.style.background='#f8fafc'; el.style.borderColor='#f1f5f9';
    });
    return;
  }
  accordion.dataset.openCat = cat;
  renderCategoryAccordion(_currentPieData, cat);
  // 범례 하이라이트
  document.querySelectorAll('#pieLegend [data-cat]').forEach(el => {
    if (el.dataset.cat === cat) {
      el.classList.add('selected');
      el.style.background=(CAT_COLORS[cat]||'#94a3b8')+'18';
      el.style.borderColor=CAT_COLORS[cat]||'#94a3b8';
    } else {
      el.classList.remove('selected');
      el.style.background='#f8fafc'; el.style.borderColor='#f1f5f9';
    }
  });
  // 스크롤
  setTimeout(()=>accordion.scrollIntoView({behavior:'smooth',block:'start'}), 100);
}

function renderCategoryAccordion(data, selectedCat) {

  accordion.innerHTML = sorted.map(([cat, total]) => {
    const items = data.filter(q=>(q._cat||'General')===cat).sort((a,b)=>new Date(b.completion_date)-new Date(a.completion_date));
    const isOpen = cat === selectedCat;
    const color = CAT_COLORS[cat]||'#94a3b8';

    return `<div style="border-radius:12px;overflow:hidden;border:1.5px solid ${isOpen?color:'#e2e8f0'};transition:all 0.2s">
      <div onclick="toggleCategoryAccordion('${cat}')" style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:${isOpen?color+'12':'#f8fafc'};cursor:pointer;transition:all 0.2s">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:12px;height:12px;border-radius:50%;background:${color};flex-shrink:0"></div>
          <div style="font-size:15px;font-weight:700;color:#1e293b">${CAT_LABELS[cat]||cat}</div>
          <div style="font-size:12px;color:#94a3b8">${items.length} work${items.length!==1?'s':''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:16px">
          <div style="text-align:right">
            <div style="font-size:14px;font-weight:700;color:#1e293b">${fmt(total)}</div>
            <div style="font-size:11px;color:#94a3b8">ex GST &nbsp;|&nbsp; <span style="color:${color};font-weight:600">${fmt(total*1.1)} inc GST</span></div>
          </div>
          <div style="font-size:18px;color:#94a3b8;transition:transform 0.2s;transform:rotate(${isOpen?90:0}deg)">›</div>
        </div>
      </div>
      ${isOpen?`
      <div style="background:#fff;border-top:1px solid #e2e8f0">
        <div style="display:grid;grid-template-columns:120px 1fr 1fr 1fr 1fr;gap:0;padding:10px 20px;background:#f8fafc;border-bottom:1px solid #e2e8f0">
          <div style="font-size:13px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.06em">Date</div>
          <div style="font-size:13px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.06em">Project</div>
          <div style="font-size:13px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.06em">Contractor</div>
          <div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;text-align:right">ex GST</div>
          <div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;text-align:right">inc GST</div>
        </div>
        ${items.map((q,i)=>{
          const dateStr=q.completion_date?new Date(q.completion_date).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}):'—';
          const emg=q.is_emergency?'<span style="font-size:9px;font-weight:700;color:#dc2626;background:#fee2e2;padding:1px 5px;border-radius:8px;margin-left:4px">EMG</span>':'';
          return `<div style="display:grid;grid-template-columns:120px 1fr 1fr 1fr 1fr;gap:0;padding:12px 20px;background:${i%2===0?'#fff':'#f8fafc'};border-bottom:1px solid #f1f5f9;align-items:center">
            <div style="font-size:13px;color:#64748b">${dateStr}</div>
            <div style="font-size:13px;font-weight:600;color:#1e293b">${q.project||q.title||'—'}${emg}</div>
            <div style="font-size:12px;color:#475569">${q.vendor||'—'}</div>
            <div style="font-size:13px;font-weight:600;color:#1e293b;text-align:right">${fmt(Number(q.amount||0))}</div>
            <div style="font-size:13px;font-weight:700;color:#2563eb;text-align:right">${fmt(Number(q.amount||0)*1.1)}</div>
          </div>`;
        }).join('')}
        <div style="display:grid;grid-template-columns:120px 1fr 1fr 1fr 1fr;gap:0;padding:12px 20px;background:linear-gradient(135deg,#0f2456,#1e3a8a)">
          <div></div><div></div><div style="font-size:12px;font-weight:700;color:rgba(255,255,255,0.7)">Total</div>

        </div>
      </div>`:''}
    </div>`;
  }).join('');
}
