<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-num{font-size:26px;font-weight:600;letter-spacing:-1px}
.stat-label{font-size:12px;color:var(--muted);margin-top:3px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-light)}
.card-title{font-size:14px;font-weight:600}
.table-head{display:grid;grid-template-columns:48px 1fr 140px 110px 130px;gap:12px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--border-light)}
.th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em}
.user-row{display:grid;grid-template-columns:48px 1fr 140px 110px 130px;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--border-light);transition:background 0.12s}
.user-row:last-child{border-bottom:none}
.user-row:hover{background:var(--bg)}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.av-admin{background:var(--purple-bg);color:var(--purple-text)}
.av-committee{background:var(--blue-50);color:var(--blue-700)}
.av-observer{background:var(--green-bg);color:var(--green-text)}
.av-owner{background:var(--border-light);color:var(--text-2)}
.av-tenant{background:var(--border-light);color:var(--text-2)}
.user-name{font-size:13px;font-weight:600}
.user-email{font-size:11px;color:var(--muted);margin-top:2px}
.role-select{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-weight:500;background:var(--surface);color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif}
.role-hint{font-size:12px;color:var(--blue-700);background:var(--blue-50);border-left:3px solid var(--blue-600);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:8px;line-height:1.6;display:none}
.perm-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--border-light)}
.perm-title{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.perm-item{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;background:var(--bg)}
.perm-item input[type="checkbox"]{margin:0}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div class="section-title">User Management</div>
      <button class="btn-primary" id="inviteBtn">+ Invite User</button>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="statTotal" style="color:var(--blue-600)">—</div><div class="stat-label">Total Users</div></div>
      <div class="stat-card"><div class="stat-num" id="statAdmin" style="color:var(--purple)">—</div><div class="stat-label">Admin</div></div>
      <div class="stat-card"><div class="stat-num" id="statCommittee" style="color:var(--blue-600)">—</div><div class="stat-label">Committee</div></div>
      <div class="stat-card"><div class="stat-num" id="statObserver" style="color:var(--green)">—</div><div class="stat-label">Observer</div></div>
      <div class="stat-card"><div class="stat-num" id="statOther" style="color:var(--muted)">—</div><div class="stat-label">Owner / Tenant</div></div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">All Users</div>
        <span style="font-size:12px;color:var(--muted)" id="userCountLabel">Loading…</span>
      </div>
      <div class="table-head">
        <div></div>
        <div class="th">Name / Email</div>
        <div class="th">Role</div>
        <div class="th">Status</div>
        <div class="th" style="text-align:right">Actions</div>
      </div>
      <div id="userList"><div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">Loading users…</div></div>
    </div>
  </div>
</div>

<!-- INVITE MODAL -->
<div class="modal-backdrop" id="inviteModal">
  <div class="modal-box">
    <div class="modal-title">Invite New User</div>
    <div class="modal-field"><label class="modal-label">Email Address</label><input class="modal-input" type="email" id="inviteEmail" placeholder="email@example.com"></div>
    <div class="modal-field"><label class="modal-label">Full Name</label><input class="modal-input" type="text" id="inviteName" placeholder="e.g. John Smith"></div>
    <div class="modal-field">
      <label class="modal-label">Role</label>
      <select class="modal-select" id="inviteRole">
        <option value="">Select role…</option>
        <option value="committee">Committee</option>
        <option value="observer">Observer</option>
        <option value="owner">Owner</option>
        <option value="tenant">Tenant</option>
      </select>
      <div class="role-hint" id="roleHint"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('inviteModal')">Cancel</button>
      <button class="btn-primary" id="sendInviteBtn">Send Invite →</button>
    </div>
  </div>
</div>

<!-- PERMISSIONS MODAL -->
<div class="modal-backdrop" id="permModal">
  <div class="modal-box">
    <div class="modal-title">Edit Permissions</div>
    <input type="hidden" id="permUserId">
    <input type="hidden" id="permUserName">
    <div style="font-size:13px;color:var(--muted);margin-bottom:16px">Customize access for <strong id="permUserLabel"></strong></div>
    <div class="perm-section">
      <div class="perm-title">📄 Pages Access</div>
      <div class="perm-grid" id="permPages"></div>
    </div>
    <div class="perm-section">
      <div class="perm-title">⚡ Actions</div>
      <div class="perm-grid" id="permActions"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('permModal')">Cancel</button>
      <button class="btn-primary" id="savePermBtn">Save Permissions →</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role } = ctx;

// 🔥 챗이사 지시: setTimeout 버그 수정
if (role !== 'admin') { 
  setTimeout(() => {
    window.location.href = '/pages/building.html';
  }, 0);
}

// 🔥 챗이사 지시: 기본 권한 정의
const DEFAULT_PERMISSIONS = {
  admin: { pages: ['all'], actions: ['all'] },
  committee: { 
    pages: ['quotes','works','reports','history','building','announcements','parking','complaints','hvac','emergency','dashboard'], 
    actions: ['approve','create_work','edit_work','view_quotes'] 
  },
  observer: { 
    pages: ['quotes','works','reports','history','building','announcements','parking','complaints','hvac','emergency','dashboard'], 
    actions: ['view_quotes'] 
  },
  owner: { 
    pages: ['building','announcements','works','reports','parking','complaints','hvac','emergency','dashboard'], 
    actions: [] 
  },
  tenant: { 
    pages: ['building','announcements','hvac','emergency','dashboard'], 
    actions: [] 
  }
};

const ALL_PAGES = ['building','announcements','parking','complaints','hvac','emergency','works','dashboard','history','quotes','reports','users'];
const ALL_ACTIONS = ['approve','create_work','edit_work','view_quotes','force_approve','delete_quote'];

const ROLE_HINTS = {
  committee:'Can view all quotes with amounts and vote to approve or decline.',
  observer: 'Read-only access to quotes. Can see everything but cannot vote.',
  owner:    'Can view announcements, works and building status. No quote access.',
  tenant:   'Basic access — announcements, HVAC temperature requests only.'
};
const ROLE_COLORS = { admin:'av-admin',committee:'av-committee',observer:'av-observer',owner:'av-owner',tenant:'av-tenant' };
const ROLE_BADGES = { admin:'badge-purple',committee:'badge-blue',observer:'badge-green',owner:'badge-gray',tenant:'badge-gray' };

document.getElementById('inviteRole').addEventListener('change', () => {
  const val  = document.getElementById('inviteRole').value;
  const hint = document.getElementById('roleHint');
  if (val&&ROLE_HINTS[val]) { hint.textContent=ROLE_HINTS[val]; hint.style.display='block'; }
  else hint.style.display='none';
});

async function loadUsers() {
  const { data:profiles } = await supabase.from('profiles').select('*').order('role').order('full_name');
  if (!profiles) return;
  const counts = { admin:0,committee:0,observer:0,owner:0,tenant:0 };
  profiles.forEach(p=>{ if (counts[p.role]!==undefined) counts[p.role]++; });
  document.getElementById('statTotal').textContent     = profiles.length;
  document.getElementById('statAdmin').textContent     = counts.admin;
  document.getElementById('statCommittee').textContent = counts.committee;
  document.getElementById('statObserver').textContent  = counts.observer;
  document.getElementById('statOther').textContent     = counts.owner + counts.tenant;
  document.getElementById('userCountLabel').textContent= `${profiles.length} users`;
  const list = document.getElementById('userList');
  if (!profiles.length) { list.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">No users found.</div>'; return; }
  list.innerHTML = profiles.map(p => {
    const displayName = p.full_name||p.email?.split('@')[0]||'—';
    const ini = displayName.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
    const isSelf = p.id===user.id;
    const avClass = ROLE_COLORS[p.role]||'av-owner';
    const badgeClass = ROLE_BADGES[p.role]||'badge-gray';
    return `
      <div class="user-row">
        <div class="avatar ${avClass}">${ini}</div>
        <div>
          <div class="user-name">${displayName}${isSelf?' <span style="font-size:10px;color:var(--muted);font-weight:400">(You)</span>':''}</div>
          <div class="user-email">${p.email||'—'}</div>
        </div>
        <select class="role-select" onchange="changeRole('${p.id}',this.value)" ${isSelf?'disabled':''}>
          <option value="admin"     ${p.role==='admin'     ?'selected':''}>Admin</option>
          <option value="committee" ${p.role==='committee' ?'selected':''}>Committee</option>
          <option value="observer"  ${p.role==='observer'  ?'selected':''}>Observer</option>
          <option value="owner"     ${p.role==='owner'     ?'selected':''}>Owner</option>
          <option value="tenant"    ${p.role==='tenant'    ?'selected':''}>Tenant</option>
        </select>
        <span class="badge ${badgeClass}">${p.role?.charAt(0).toUpperCase()+p.role?.slice(1)||'—'}</span>
        <div style="display:flex;gap:6px;justify-content:flex-end">
          ${!isSelf?`
            <button class="btn-secondary" style="padding:5px 10px;font-size:11px" onclick="openPermissions('${p.id}','${displayName.replace(/'/g,"\\'")}')">⚙️ Permissions</button>
            <button class="btn-danger" style="padding:5px 10px;font-size:11px" onclick="removeUser('${p.id}','${displayName.replace(/'/g,"\\'")}')">Remove</button>
          `:'<span style="font-size:11px;color:var(--muted)">—</span>'}
        </div>
      </div>`;
  }).join('');
}

// 🔥 챗이사 지시: role 변경 시 permissions 자동 업데이트 + 즉시 반영
window.changeRole = async (uid, newRole) => {
  try { 
    const newPerms = DEFAULT_PERMISSIONS[newRole] || DEFAULT_PERMISSIONS.observer;
    await supabase.from('profiles').update({role:newRole, permissions:newPerms}).eq('id',uid); 
    showToast(`Role updated to ${newRole} ✓`); 
    await loadUsers(); 
    // 🔥 챗이사 지시: 자신의 role 변경 시 즉시 반영
    if (uid === user.id) {
      setTimeout(() => { location.reload(); }, 500);
    }
  }
  catch(e) { showToast('Failed to update role', true); }
};

// 🔥 Permissions 모달 열기
window.openPermissions = async (uid, uname) => {
  document.getElementById('permUserId').value = uid;
  document.getElementById('permUserName').value = uname;
  document.getElementById('permUserLabel').textContent = uname;
  
  const { data:profile } = await supabase.from('profiles').select('permissions').eq('id',uid).single();
  const perms = profile?.permissions || { pages: [], actions: [] };
  
  // Pages 체크박스
  const pagesEl = document.getElementById('permPages');
  pagesEl.innerHTML = ALL_PAGES.map(page => `
    <label class="perm-item">
      <input type="checkbox" value="${page}" ${perms.pages.includes(page)||perms.pages.includes('all')?'checked':''}>
      <span>${page}</span>
    </label>
  `).join('');
  
  // Actions 체크박스
  const actionsEl = document.getElementById('permActions');
  actionsEl.innerHTML = ALL_ACTIONS.map(action => `
    <label class="perm-item">
      <input type="checkbox" value="${action}" ${perms.actions.includes(action)||perms.actions.includes('all')?'checked':''}>
      <span>${action}</span>
    </label>
  `).join('');
  
  document.getElementById('permModal').classList.add('open');
};

// 🔥 Permissions 저장
document.getElementById('savePermBtn').addEventListener('click', async () => {
  const uid = document.getElementById('permUserId').value;
  const checkedPages = Array.from(document.querySelectorAll('#permPages input:checked')).map(cb => cb.value);
  const checkedActions = Array.from(document.querySelectorAll('#permActions input:checked')).map(cb => cb.value);
  
  try {
    await supabase.from('profiles').update({
      permissions: { pages: checkedPages, actions: checkedActions }
    }).eq('id', uid);
    
    closeModal('permModal');
    showToast('Permissions updated ✓');
    await loadUsers();
    
    // 🔥 챗이사 지시: 자신의 permissions 변경 시 즉시 반영
    if (uid === user.id) {
      setTimeout(() => { location.reload(); }, 500);
    }
  } catch(e) {
    showToast('Failed to update permissions', true);
  }
});

window.removeUser = async (uid, uname) => {
  if (!confirm(`Remove ${uname}?\nThey will lose access to this system immediately.`)) return;
  try {
    const { data:{session:s1} } = await supabase.auth.refreshSession();
    if (!s1) { showToast('Session expired. Please log in again.', true); return; }
    const res = await fetch('/api/delete-user', { method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${s1.access_token}`}, body:JSON.stringify({user_id:uid}) });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error||'Failed to remove user');
    showToast(`${uname} removed ✓`);
    await loadUsers();
  } catch(e) { showToast(e.message||'Failed to remove user', true); }
};

document.getElementById('inviteBtn').addEventListener('click', () => {
  document.getElementById('inviteEmail').value='';
  document.getElementById('inviteName').value='';
  document.getElementById('inviteRole').value='';
  document.getElementById('roleHint').style.display='none';
  document.getElementById('inviteModal').classList.add('open');
});

document.getElementById('sendInviteBtn').addEventListener('click', async () => {
  const email      = document.getElementById('inviteEmail').value.trim().toLowerCase();
  const fullName   = document.getElementById('inviteName').value.trim();
  const inviteRole = document.getElementById('inviteRole').value;
  const btn = document.getElementById('sendInviteBtn');
  if (!email)      { showToast('Please enter an email address', true); return; }
  if (!fullName)   { showToast('Please enter a full name', true); return; }
  if (!inviteRole) { showToast('Please select a role', true); return; }
  btn.disabled=true; btn.textContent='Sending…';
  try {
    const { data:{session:s2} } = await supabase.auth.refreshSession();
    if (!s2) { showToast('Session expired. Please log in again.', true); return; }
    const res = await fetch('/api/send-invite', { method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${s2.access_token}`}, body:JSON.stringify({email,full_name:fullName,role:inviteRole}) });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error||'Failed to send invite');
    closeModal('inviteModal');
    showToast(`Invite sent to ${email} ✓`);
    await loadUsers();
  } catch(e) { showToast(e.message||'Failed to send invite', true); }
  finally { btn.disabled=false; btn.textContent='Send Invite →'; }
});

await loadUsers();
</script>
</body>
</html>
