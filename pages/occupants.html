<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Occupants – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
.content { padding: 24px; max-width: 100%; }
.search-table-wrap { overflow-x: auto; }
/* Column toggle */
.col-toggle-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
.col-toggle-label { font-size:11px; font-weight:700; color:var(--muted); margin-right:2px; }
.col-toggle-btn { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:100px; font-size:11px; font-weight:600; border:1.5px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.15s; }
.col-toggle-btn.on { background:var(--blue-600); color:#fff; border-color:var(--blue-600); }
.col-toggle-btn.on::before { content:'✓ '; }

/* Suite Tabs */
.suite-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  border-bottom: 2px solid var(--border);
  padding-bottom: 8px;
}
.suite-tab {
  padding: 8px 18px;
  border-radius: 8px 8px 0 0;
  background: var(--bg);
  border: 1px solid var(--border);
  border-bottom: none;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
  position: relative;
  bottom: -2px;
}
.suite-tab:hover { background: var(--surface); }
.suite-tab.active {
  background: var(--surface);
  color: var(--blue-600);
  border-color: var(--blue-600);
  border-bottom: 2px solid var(--surface);
  z-index: 1;
}

/* Occupant List */
.occ-list { display: flex; flex-direction: column; gap: 10px; }
.occ-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: all 0.15s;
}
.occ-item:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.06); }
.occ-unit {
  font-size: 15px;
  font-weight: 700;
  color: var(--blue-600);
  min-width: 50px;
}
.occ-info { flex: 1; }
.occ-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
}
.occ-contact {
  font-size: 12px;
  color: var(--muted);
}
.occ-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--text-2);
}
.occ-meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
}
.occ-actions {
  display: flex;
  gap: 6px;
}

/* Ground Floor Special */
.ground-floor {
  background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
  border-color: #fbbf24;
}

/* Committee Badge */
.committee-star {
  font-size: 16px;
  margin-left: 6px;
}

/* Modal Specific */
.modal-info-grid {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 12px 16px;
  margin: 20px 0;
}
.modal-info-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-align: right;
}
.modal-info-value {
  font-size: 13px;
  color: var(--text);
}
.vehicle-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.vehicle-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg);
  border-radius: 8px;
  font-size: 13px;
  font-family: 'Courier New', monospace;
  font-weight: 600;
}

/* Modal Label Override */
.modal-label {
  color: #111827 !important;
  font-weight: 700 !important;
}

/* Plate Tag Input UI */
#plateList {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.plate-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.plate-input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 13px;
  font-family: 'Courier New', monospace;
  font-weight: 600;
  background: #fff;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 1px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.plate-input:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
}
.plate-input.invalid {
  border-color: #ef4444;
  background: #fef2f2;
}
.plate-remove-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid #ef4444;
  background: #fee2e2;
  color: #b91c1c;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}
.plate-remove-btn:hover {
  background: #ef4444;
  color: #fff;
}
.plate-remove-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* Admin Search Section */
.admin-search-section {
  margin-top: 32px;
  display: none;
}
.admin-search-section.visible { display: block; }
/* Filter chips */
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.filter-chip { padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
.filter-chip:hover { border-color: var(--blue-600); color: var(--blue-600); }
.filter-chip.active { background: var(--blue-600); color: #fff; border-color: var(--blue-600); }
.filter-chip-label { font-size: 11px; font-weight: 700; color: var(--muted); margin-right: 2px; }
.admin-search-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.admin-search-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.admin-search-bar {
  position: relative;
  flex: 1;
  max-width: 380px;
}
.admin-search-input {
  width: 100%;
  padding: 9px 36px 9px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  box-sizing: border-box;
}
.admin-search-input:focus {
  border-color: var(--blue-600);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
}
.admin-search-clear {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 14px;
  display: none;
  padding: 0;
  line-height: 1;
}
.admin-search-count {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

/* Search Table */
.search-table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.search-table {
  width: 100%;
  border-collapse: collapse;
}
.search-table thead {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--bg);
}
.search-table th {
  padding: 11px 14px;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  text-align: left;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
.search-table td {
  padding: 10px 14px;
  font-size: 13px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: middle;
}
.search-table tbody tr:last-child td { border-bottom: none; }
.search-table tbody tr:hover { background: var(--bg); }

/* Inline edit cell */
.edit-cell {
  cursor: text;
  border-radius: 6px;
  padding: 4px 6px;
  min-width: 80px;
  transition: background 0.12s;
}
.edit-cell:hover { background: var(--border-light); }
.edit-cell.editing {
  background: var(--surface);
  outline: 2px solid var(--blue-600);
  outline-offset: -1px;
}
.edit-cell input {
  border: none;
  background: transparent;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  width: 100%;
  outline: none;
  padding: 0;
}
.edit-cell.empty { color: var(--muted); font-style: italic; }

/* Vehicle badges */
.plate-badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.plate-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px 6px 12px;
  background: var(--blue-50);
  color: var(--blue-700);
  border: 1.5px solid #bfdbfe;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.5px;
}
.plate-badge::before { content: '🚗'; font-size: 13px; }
.plate-badge-remove {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #ef4444;
  border: none;
  cursor: pointer;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 0;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.12s, transform 0.1s;
}
.plate-badge-remove:hover { background: #b91c1c; transform: scale(1.15); }
.plate-add-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  border: 2px dashed var(--blue-600);
  border-radius: 8px;
  background: none;
  color: var(--blue-600);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.12s;
}
.plate-add-btn:hover { background: var(--blue-50); }
.plate-add-input {
  width: 90px;
  padding: 5px 8px;
  border: 1.5px solid var(--blue-600);
  border-radius: 8px;
  font-size: 13px;
  font-family: 'Courier New', monospace;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  outline: none;
  background: var(--surface);
  color: var(--text);
}
.unit-badge {
  font-size: 13px;
  font-weight: 700;
  color: var(--blue-600);
  background: var(--blue-50);
  padding: 3px 10px;
  border-radius: 7px;
  white-space: nowrap;
}
.search-empty {
  padding: 48px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

/* Mobile */
@media (max-width: 768px) {
  .suite-tabs { gap: 4px; }
  .suite-tab { padding: 6px 12px; font-size: 12px; }
  .occ-item { flex-direction: column; align-items: flex-start; padding: 14px 16px; }
  .occ-unit { min-width: auto; }
  .occ-meta { flex-wrap: wrap; }
  .occ-actions { width: 100%; justify-content: flex-end; }
  .modal-info-grid { grid-template-columns: 1fr; gap: 8px; }
  .modal-info-label { text-align: left; }
}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    
    <div class="section-hdr">
      <div class="section-title">Occupants</div>
    </div>

    <!-- Suite Tabs -->
    <div class="suite-tabs">
      <button class="suite-tab active" data-suite="Ground">Ground</button>
      <button class="suite-tab" data-suite="Suite A">Suite A</button>
      <button class="suite-tab" data-suite="Suite B">Suite B</button>
      <button class="suite-tab" data-suite="Suite C">Suite C</button>
      <button class="suite-tab" data-suite="Suite D">Suite D</button>
      <button class="suite-tab" data-suite="Suite E">Suite E</button>
      <button class="suite-tab" data-suite="Suite F">Suite F</button>
      <button class="suite-tab" data-suite="Suite G">Suite G</button>
      <button class="suite-tab" data-suite="Suite H">Suite H</button>
    </div>

    <!-- Occupant List -->
    <div class="occ-list" id="occList">
      <div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">Loading…</div>
    </div>

    <!-- Admin Search Section -->
    <div class="admin-search-section" id="adminSearchSection">
      <div style="height:1px;background:var(--border);margin-bottom:28px"></div>
      <div class="admin-search-header">
        <div class="admin-search-title">🔍 Quick Search</div>
        <button onclick="exportOccupants()" style="margin-left:auto;padding:7px 16px;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px;">📥 Export Excel</button>
        <button onclick="openBulkInvite()" style="padding:7px 16px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px;">📧 Bulk Invite</button>
        <div class="admin-search-bar">
          <input type="text" id="adminSearchInput" class="admin-search-input" placeholder="Search unit, name, email, plate…" autocomplete="off">
          <button id="adminSearchClear" class="admin-search-clear">✕</button>
        </div>
        <div class="admin-search-count" id="adminSearchCount"></div>
      </div>

      <!-- Filter Chips -->
      <div class="filter-chips" id="filterChips">
        <span class="filter-chip-label">Quick:</span>
        <button class="filter-chip" data-filter="all" onclick="applyFilter('all')">All</button>
        <button class="filter-chip" data-filter="Ground" onclick="applyFilter('Ground')">Ground</button>
        <button class="filter-chip" data-filter="1" onclick="applyFilter('1')">L1</button>
        <button class="filter-chip" data-filter="2" onclick="applyFilter('2')">L2</button>
        <button class="filter-chip" data-filter="3" onclick="applyFilter('3')">L3</button>
        <button class="filter-chip" data-filter="4" onclick="applyFilter('4')">L4</button>
        <button class="filter-chip" data-filter="5" onclick="applyFilter('5')">L5</button>
        <button class="filter-chip" data-filter="6" onclick="applyFilter('6')">L6</button>
        <span class="filter-chip-label" style="margin-left:6px">Suite:</span>
        <button class="filter-chip" data-filter="A" onclick="applyFilter('A')">A</button>
        <button class="filter-chip" data-filter="B" onclick="applyFilter('B')">B</button>
        <button class="filter-chip" data-filter="C" onclick="applyFilter('C')">C</button>
        <button class="filter-chip" data-filter="D" onclick="applyFilter('D')">D</button>
        <button class="filter-chip" data-filter="E" onclick="applyFilter('E')">E</button>
        <button class="filter-chip" data-filter="F" onclick="applyFilter('F')">F</button>
        <button class="filter-chip" data-filter="G" onclick="applyFilter('G')">G</button>
        <button class="filter-chip" data-filter="H" onclick="applyFilter('H')">H</button>
      </div>
      <!-- Column Toggle -->
      <div class="col-toggle-bar" id="colToggleBar">
        <span class="col-toggle-label">Columns:</span>
        <button class="col-toggle-btn on" data-col="business_name" onclick="toggleCol(this)">Business Name</button>
        <button class="col-toggle-btn on" data-col="contact" onclick="toggleCol(this)">Contact</button>
        <button class="col-toggle-btn on" data-col="primary_email" onclick="toggleCol(this)">Primary Email</button>
        <button class="col-toggle-btn on" data-col="business_email" onclick="toggleCol(this)">Business Email</button>
        <button class="col-toggle-btn on" data-col="phone" onclick="toggleCol(this)">Phone</button>
        <button class="col-toggle-btn on" data-col="role" onclick="toggleCol(this)">Role</button>
        <button class="col-toggle-btn on" data-col="vehicles" onclick="toggleCol(this)">Vehicles</button>
      </div>
      <div id="adminSearchResults"></div>
    </div>

  </div>
</div>

<!-- VIEW MODAL -->
<div class="modal-backdrop" id="viewModal">
  <div class="modal-box">
    <div class="modal-title" id="viewModalTitle">Unit Details</div>
    
    <div class="modal-info-grid" id="viewModalContent">
      <!-- Dynamically populated -->
    </div>

    <div class="modal-footer">
      <button class="btn-primary" id="viewEditBtn" style="display:none">✏️ Edit</button>
      <button class="btn-secondary" onclick="closeModal('viewModal')">Close</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="editModal">
  <div class="modal-box">
    <div class="modal-title" id="editModalTitle">Edit Unit</div>
    <input type="hidden" id="editId">
    
    <div class="modal-field">
      <label class="modal-label">Unit</label>
      <input class="modal-input" id="editUnit" disabled>
    </div>
    
    <div class="modal-field">
      <label class="modal-label">Business Name</label>
      <input class="modal-input" id="editBusinessName" placeholder="Business or tenant name">
    </div>
    
    <div class="modal-field">
      <label class="modal-label">Contact Person</label>
      <input class="modal-input" id="editContactPerson" placeholder="Primary contact name">
    </div>
    
    <div class="modal-field">
      <label class="modal-label">Primary Email</label>
      <input class="modal-input" type="email" id="editPrimaryEmail" placeholder="Primary contact email">
    </div>
    
    <div class="modal-field">
      <label class="modal-label">Business Email(s)</label>
      <input class="modal-input" id="editBusinessEmail" placeholder="Additional emails (comma-separated)">
    </div>
    
    <div class="modal-field">
      <label class="modal-label">Phone</label>
      <input class="modal-input" id="editPhone" placeholder="Contact phone number">
    </div>
    
    <div class="modal-field">
      <label class="modal-label">Committee Member</label>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="editIsCommittee">
        <span style="font-size:13px">This occupant is a committee member</span>
      </label>
    </div>
    
    <div class="modal-field" id="committeeRoleField" style="display:none">
      <label class="modal-label">Committee Role</label>
      <select class="modal-select" id="editCommitteeRole">
        <option value="Member">Member</option>
        <option value="Chairman">Chairman</option>
        <option value="Treasurer">Treasurer</option>
        <option value="Secretary">Secretary</option>
      </select>
    </div>
    
    <div class="modal-field">
      <label class="modal-label">License Plates</label>
      <div class="plate-badges" id="plateList" style="min-height:44px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center"></div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('editModal')">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save →</button>
    </div>
  </div>
</div>

<!-- BULK INVITE MODAL -->
<div class="modal-backdrop" id="bulkInviteModal">
  <div class="modal-box" style="max-width:680px">
    <div class="modal-title">📧 Bulk Invite Preview</div>
    <p style="font-size:13px;color:var(--muted);margin:-8px 0 16px">Review the list below before sending. Committee members and existing accounts are excluded.</p>
    <div id="bulkInviteList" style="max-height:420px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:16px"></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:16px" id="bulkInviteSummary"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('bulkInviteModal')">Cancel</button>
      <button class="btn-primary" id="sendBulkInviteBtn">Send All Invites →</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '/js/layout.js';

const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');

const { supabase, user, role, name, profile } = ctx;
const myUnit = profile?.unit || null;
const myEmail = user?.email || null;

if (!['admin','committee','observer','owner','tenant'].includes(role)) {
  window.location.href = '/pages/building.html';
}

let allOccupants = [];
let currentSuite = 'Ground';
let myOwnedUnits = new Set(); // primary_email 기준 본인 소유 유닛들

// owner/tenant: 본인 suite 탭만 표시
if (['owner','tenant'].includes(role) && myUnit) {
  const mySuite = (() => {
    const match = myUnit.match(/^([0-9]+)([A-H])$/i);
    if (!match) return null;
    const letter = match[2].toUpperCase();
    return 'Suite ' + letter;
  })();
  document.querySelectorAll('.suite-tab').forEach(tab => {
    if (mySuite && tab.dataset.suite !== mySuite) {
      tab.style.display = 'none';
    }
  });
  if (mySuite) {
    currentSuite = mySuite;
    document.querySelectorAll('.suite-tab').forEach(t => t.classList.remove('active'));
    const myTab = document.querySelector(`.suite-tab[data-suite="${mySuite}"]`);
    if (myTab) myTab.classList.add('active');
  }
}

// Load occupants
async function loadOccupants() {
  const { data, error } = await supabase
    .from('occupants')
    .select('*')
    .order('unit', { ascending: true });
  
  if (error) {
    showToast('Failed to load occupants', true);
    return;
  }
  
  allOccupants = data || [];

  // profiles email → role 맵 생성
  const { data: profilesData } = await supabase.from('profiles').select('email, role');
  window._profileRoleMap = {};
  (profilesData || []).forEach(p => {
    if (p.email) window._profileRoleMap[p.email.toLowerCase()] = p.role;
  });

  // primary_email 기준 본인 소유 유닛 세팅 (committee/owner)
  if (myEmail && ['admin','committee','owner'].includes(role)) {
    myOwnedUnits = new Set(
      allOccupants.filter(o => o.primary_email?.toLowerCase() === myEmail.toLowerCase()).map(o => o.unit)
    );
  }

  renderOccupants();
}

// Render occupants
function renderOccupants() {
  const list = document.getElementById('occList');

  // owner/tenant: 본인 unit만
  let visibleOccupants = allOccupants;
  if (['owner','tenant'].includes(role) && myUnit) {
    visibleOccupants = allOccupants.filter(o => o.unit === myUnit);
  }

  // Filter by current suite
  let filtered;
  if (currentSuite === 'Ground') {
    filtered = visibleOccupants.filter(o => o.level === 'Ground' || o.unit === 'Unit 1');
  } else {
    filtered = visibleOccupants.filter(o => o.suite === currentSuite);
  }
  
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🏢</div><div class="empty-title">No occupants in this suite</div></div>`;
    return;
  }
  
  list.innerHTML = filtered.map(o => {
    const vehicles = (o.license_plates || '').split(',').filter(p => p.trim()).length;
    const emails = [o.primary_email, o.business_email].filter(e => e).length;
    const isGround = o.level === 'Ground';
    
    return `
      <div class="occ-item ${isGround ? 'ground-floor' : ''}">
        <div class="occ-unit">${o.unit}</div>
        <div class="occ-info">
          <div class="occ-name">
            ${o.business_name || 'Vacant'}
            ${o.is_committee ? '<span class="committee-star" title="Committee Member">⭐</span>' : ''}
          </div>
          ${o.contact_person ? `<div class="occ-contact">${o.contact_person}</div>` : ''}
        </div>
        <div class="occ-meta">
          <div class="occ-meta-item">📧 ${emails}</div>
          <div class="occ-meta-item">🚗 ${vehicles}</div>
        </div>
        <div class="occ-actions">
          <button class="btn-secondary" onclick="openViewModal('${o.id}')">👁️ View</button>
          ${(role === 'admin' || (['committee','owner'].includes(role) && myOwnedUnits.has(o.unit)) || (role === 'tenant' && o.unit === myUnit)) ? `<button class="btn-secondary" onclick="openEditModal('${o.id}')">✏️ Edit</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

// Save
document.getElementById('saveBtn').addEventListener('click', async () => {
  const id = document.getElementById('editId').value;

  // Collect plates from plate tag UI
  const plates = collectPlates();
  const platesStr = plates.join(', ');

  const occ = allOccupants.find(o => o.id === id);
  const unit = occ?.unit || '';
  const contactPerson = document.getElementById('editContactPerson').value.trim();
  const businessName = document.getElementById('editBusinessName').value.trim();
  const ownerName =
    contactPerson ||
    businessName ||
    occ?.contact_person ||
    occ?.business_name ||
    '';

  const data = {
    business_name: businessName,
    contact_person: contactPerson,
    primary_email: document.getElementById('editPrimaryEmail').value.trim(),
    business_email: document.getElementById('editBusinessEmail').value.trim(),
    phone: document.getElementById('editPhone').value.trim(),
    is_committee: document.getElementById('editIsCommittee').checked,
    committee_role: document.getElementById('editIsCommittee').checked ? document.getElementById('editCommitteeRole').value : null,
    license_plates: platesStr || null,
  };

  const { error } = await supabase
    .from('occupants')
    .update(data)
    .eq('id', id);

  if (error) {
    showToast('Failed to save: ' + error.message, true);
    return;
  }

  // Sync vehicles via RPC
  const { error: rpcError } = await supabase.rpc('sync_vehicles', {
    p_unit: unit,
    p_owner_name: ownerName,
    p_plates: plates
  });

  if (rpcError) {
    showToast('Saved but vehicle sync failed: ' + rpcError.message, true);
  }

  closeModal('editModal');
  await loadOccupants();
  showToast('Occupant updated ✓');
});

// ── Plate Badge UI (Modal) ────────────────────────────────────
function renderPlateList(plates) {
  const container = document.getElementById('plateList');
  container.innerHTML = '';
  plates.forEach(p => { if (p) container.appendChild(createModalPlateBadge(p)); });
  container.appendChild(createModalAddBtn());
}

function createModalPlateBadge(plate) {
  const span = document.createElement('span');
  span.className = 'plate-badge';
  span.dataset.plate = plate;
  span.innerHTML = `${plate} <button type="button" class="plate-badge-remove" title="Remove">✕</button>`;
  span.querySelector('.plate-badge-remove').addEventListener('click', () => {
    span.remove();
    refreshModalAddBtn();
  });
  return span;
}

function createModalAddBtn() {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'plate-add-btn';
  btn.id = 'modalPlateAddBtn';
  btn.textContent = '+ Add';
  btn.addEventListener('click', () => {
    const container = document.getElementById('plateList');
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'plate-add-input';
    inp.placeholder = 'ABC123';
    inp.maxLength = 8;
    container.insertBefore(inp, btn);
    inp.focus();

    const confirm = () => {
      const val = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      inp.remove();
      if (val.length >= 2) {
        const existing = collectPlates();
        if (!existing.includes(val)) {
          container.insertBefore(createModalPlateBadge(val), btn);
        }
      }
    };
    inp.addEventListener('blur', confirm);
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
      if (e.key === 'Escape') inp.remove();
      inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });
    inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  });
  return btn;
}

function refreshModalAddBtn() {
  const container = document.getElementById('plateList');
  if (!container.querySelector('#modalPlateAddBtn')) {
    container.appendChild(createModalAddBtn());
  }
}

function collectPlates() {
  const container = document.getElementById('plateList');
  return Array.from(container.querySelectorAll('.plate-badge'))
    .map(b => b.dataset.plate)
    .filter(p => p && p.length >= 2);
}

// ── Column Toggle ─────────────────────────────────────────────
const ALL_COLS = ['business_name','contact','primary_email','business_email','phone','role','vehicles'];
let activeCols = new Set(ALL_COLS);

window.toggleCol = (btn) => {
  const col = btn.dataset.col;
  if (activeCols.has(col)) {
    if (activeCols.size <= 1) return; // 최소 1개는 유지
    activeCols.delete(col);
    btn.classList.remove('on');
  } else {
    activeCols.add(col);
    btn.classList.add('on');
  }
  // 현재 결과 다시 렌더
  if (window._lastSearchResults) renderSearchResults(window._lastSearchResults);
};

// ── Filter Chips ──────────────────────────────────────────────
window.applyFilter = (filter) => {
  // 검색창 초기화
  const searchInput = document.getElementById('adminSearchInput');
  searchInput.value = '';
  document.getElementById('adminSearchClear').style.display = 'none';

  // 칩 활성화
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.filter === filter);
  });

  if (filter === 'all') {
    renderSearchResults(allOccupants);
    return;
  }

  const results = allOccupants.filter(o => {
    const unit = (o.unit || '').toUpperCase();
    if (filter === 'Ground') return o.level === 'Ground' || o.unit === 'Unit 1';
    // Level (숫자) — unit이 "1A", "2B" 등
    if (/^\d$/.test(filter)) return unit.startsWith(filter);
    // Suite (알파벳) — unit이 "1A", "2A" 등 끝자리
    if (/^[A-H]$/.test(filter)) return unit.endsWith(filter);
    return false;
  });

  renderSearchResults(results);
};

function renderSearchResults(results) {
  window._lastSearchResults = results;

  const countEl = document.getElementById('adminSearchCount');
  const resultsEl = document.getElementById('adminSearchResults');

  if (!results.length) {
    countEl.textContent = '';
    resultsEl.innerHTML = `<div class="search-table-wrap"><div class="search-empty">No results found</div></div>`;
    return;
  }

  countEl.textContent = `${results.length} result${results.length > 1 ? 's' : ''}`;

  const rows = results.map(o => {
    const plates = (o.license_plates || '').split(',').map(p => p.trim()).filter(p => p);
    const plateBadges = plates.map(p => `
      <span class="plate-badge" data-occ-id="${o.id}" data-plate="${p}">
        ${p}
        <button class="plate-badge-remove" onclick="removePlateInline('${o.id}','${p}')" title="Remove">✕</button>
      </span>`).join('');

    return `
      <tr data-id="${o.id}">
        <td><span class="unit-badge">${o.unit}</span></td>
        ${activeCols.has('business_name') ? `<td><div class="edit-cell ${!o.business_name?'empty':''}" data-field="business_name" data-id="${o.id}" onclick="startInlineEdit(this)">${o.business_name || 'Add name…'}</div></td>` : ''}
        ${activeCols.has('contact') ? `<td><div class="edit-cell ${!o.contact_person?'empty':''}" data-field="contact_person" data-id="${o.id}" onclick="startInlineEdit(this)">${o.contact_person || 'Add name…'}</div></td>` : ''}
        ${activeCols.has('primary_email') ? `<td><div class="edit-cell ${!o.primary_email?'empty':''}" data-field="primary_email" data-id="${o.id}" onclick="startInlineEdit(this)">${o.primary_email || 'Add email…'}</div></td>` : ''}
        ${activeCols.has('business_email') ? `<td><div class="edit-cell ${!o.business_email?'empty':''}" data-field="business_email" data-id="${o.id}" onclick="startInlineEdit(this)">${o.business_email || 'Add email…'}</div></td>` : ''}
        ${activeCols.has('phone') ? `<td><div class="edit-cell ${!o.phone?'empty':''}" data-field="phone" data-id="${o.id}" onclick="startInlineEdit(this)">${o.phone || 'Add phone…'}</div></td>` : ''}
        ${activeCols.has('role') ? `<td>${(() => {
            if (o.is_committee) return '<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#ede9fe;color:#6d28d9">committee</span>';
            const parts = [];
            if (o.primary_email) parts.push('<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#dbeafe;color:#1d4ed8">owner</span>');
            if ((o.business_email||'').trim()) parts.push('<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#dcfce7;color:#15803d">tenant</span>');
            return parts.length ? parts.join(' ') : '<span style="font-size:11px;color:var(--muted)">—</span>';
          })()}</td>` : ''}
        ${activeCols.has('vehicles') ? `<td><div class="plate-badges" id="plates-${o.id}">${plateBadges}<button class="plate-add-btn" onclick="addPlateInline('${o.id}')">+ Add</button></div></td>` : ''}
        <td><button class="btn-secondary" style="padding:5px 10px;font-size:11px;white-space:nowrap" onclick="openEditModal('${o.id}')">✏️ Edit</button></td>
      </tr>`;
  }).join('');

  resultsEl.innerHTML = `
    <div class="search-table-wrap">
      <table class="search-table">
        <thead>
          <tr>
            <th>Unit</th>
            ${activeCols.has('business_name') ? '<th>Business Name</th>' : ''}
            ${activeCols.has('contact') ? '<th>Contact</th>' : ''}
            ${activeCols.has('primary_email') ? '<th>Primary Email</th>' : ''}
            ${activeCols.has('business_email') ? '<th>Business Email</th>' : ''}
            ${activeCols.has('phone') ? '<th>Phone</th>' : ''}
            ${activeCols.has('role') ? '<th>Role</th>' : ''}
            ${activeCols.has('vehicles') ? '<th>Vehicles</th>' : ''}
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// Inline Edit
window.startInlineEdit = (cell) => {
  if (cell.classList.contains('editing')) return;
  const field = cell.dataset.field;
  const id = cell.dataset.id;
  const occ = allOccupants.find(o => o.id === id);
  const currentVal = occ?.[field] || '';

  cell.classList.add('editing');
  cell.classList.remove('empty');

  const input = document.createElement('input');
  input.type = field.includes('email') ? 'email' : 'text';
  input.value = currentVal;
  input.style.minWidth = '120px';
  cell.innerHTML = '';
  cell.appendChild(input);
  input.focus();
  input.select();

  const save = async () => {
    const newVal = input.value.trim();
    cell.classList.remove('editing');
    if (newVal === currentVal) {
      cell.innerHTML = currentVal || '<span style="color:var(--muted);font-style:italic">Add…</span>';
      if (!currentVal) cell.classList.add('empty');
      return;
    }
    try {
      const { error } = await supabase.from('occupants').update({ [field]: newVal || null }).eq('id', id);
      if (error) throw error;
      // Update local cache
      const idx = allOccupants.findIndex(o => o.id === id);
      if (idx !== -1) allOccupants[idx][field] = newVal || null;
      cell.innerHTML = newVal || '';
      if (!newVal) cell.classList.add('empty');
      showToast('Saved ✓');
    } catch(e) {
      showToast('Failed to save', true);
      cell.innerHTML = currentVal || '';
      if (!currentVal) cell.classList.add('empty');
    }
  };

  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { cell.classList.remove('editing'); cell.innerHTML = currentVal || ''; if (!currentVal) cell.classList.add('empty'); }
  });
};

// Add plate inline
window.addPlateInline = (id) => {
  const container = document.getElementById(`plates-${id}`);
  if (!container) return;
  const addBtn = container.querySelector('.plate-add-btn');

  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'plate-add-input';
  inp.placeholder = 'ABC123';
  inp.maxLength = 8;
  container.insertBefore(inp, addBtn);
  inp.focus();

  const confirm = async () => {
    const val = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    inp.remove();
    if (!val || val.length < 2) return;
    const occ = allOccupants.find(o => o.id === id);
    if (!occ) return;
    const existing = (occ.license_plates || '').split(',').map(p => p.trim()).filter(p => p);
    if (existing.includes(val)) { showToast('Plate already exists', true); return; }
    const newPlates = [...existing, val];
    await savePlates(id, occ, newPlates);
  };

  inp.addEventListener('blur', confirm);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
    if (e.key === 'Escape') inp.remove();
    inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });
  inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
};

// Remove plate inline
window.removePlateInline = async (id, plate) => {
  const occ = allOccupants.find(o => o.id === id);
  if (!occ) return;
  const existing = (occ.license_plates || '').split(',').map(p => p.trim()).filter(p => p);
  const newPlates = existing.filter(p => p !== plate);
  await savePlates(id, occ, newPlates);
};

// Save plates via RPC
async function savePlates(id, occ, plates) {
  const platesStr = plates.join(', ');
  const ownerName = occ.contact_person || occ.business_name || '';
  try {
    const { error } = await supabase.from('occupants').update({ license_plates: platesStr || null }).eq('id', id);
    if (error) throw error;
    await supabase.rpc('sync_vehicles', { p_unit: occ.unit, p_owner_name: ownerName, p_plates: plates });
    const idx = allOccupants.findIndex(o => o.id === id);
    if (idx !== -1) allOccupants[idx].license_plates = platesStr || null;
    // Re-render plates cell
    const container = document.getElementById(`plates-${id}`);
    if (container) {
      const badges = plates.map(p => `
        <span class="plate-badge">
          ${p}
          <button class="plate-badge-remove" onclick="removePlateInline('${id}','${p}')" title="Remove">✕</button>
        </span>`).join('');
      container.innerHTML = badges + `<button class="plate-add-btn" onclick="addPlateInline('${id}')">+ Add</button>`;
    }
    showToast('Vehicles updated ✓');
  } catch(e) {
    showToast('Failed to update vehicles', true);
  }
}
// ─────────────────────────────────────────────────────────────

// Export to Excel
// ── Bulk Invite ───────────────────────────────────────────────
let bulkInviteList = [];

window.openBulkInvite = async () => {
  const listEl = document.getElementById('bulkInviteList');
  const summaryEl = document.getElementById('bulkInviteSummary');
  const sendBtn = document.getElementById('sendBulkInviteBtn');
  listEl.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">Loading...</div>';
  summaryEl.textContent = '';
  sendBtn.disabled = true;
  openModal('bulkInviteModal');

  // 현재 profiles 이메일 (이미 계정 있는 사람)
  const { data: profiles } = await supabase.from('profiles').select('email');
  const existingEmails = new Set((profiles || []).map(p => p.email?.toLowerCase()).filter(Boolean));

  bulkInviteList = [];

  for (const occ of allOccupants) {
    // committee 스킵
    if (occ.is_committee) continue;

    // primary_email → owner
    if (occ.primary_email) {
      const email = occ.primary_email.trim().toLowerCase();
      if (email && !existingEmails.has(email)) {
        bulkInviteList.push({
          email: occ.primary_email.trim(),
          name: occ.contact_person || occ.business_name || '',
          role: 'owner',
          unit: occ.unit,
          status: 'pending'
        });
      }
    }

    // business_email → tenant (콤마 구분 여러 명)
    if (occ.business_email) {
      const emails = occ.business_email.split(',').map(e => e.trim()).filter(Boolean);
      for (const email of emails) {
        if (!existingEmails.has(email.toLowerCase())) {
          bulkInviteList.push({
            email,
            name: '',
            role: 'tenant',
            unit: occ.unit,
            status: 'pending'
          });
        }
      }
    }
  }

  // 중복 이메일 제거
  const seen = new Set();
  bulkInviteList = bulkInviteList.filter(item => {
    if (seen.has(item.email.toLowerCase())) return false;
    seen.add(item.email.toLowerCase());
    return true;
  });

  if (!bulkInviteList.length) {
    listEl.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">No new users to invite</div>';
    summaryEl.textContent = '';
    return;
  }

  const ownerCount = bulkInviteList.filter(i => i.role === 'owner').length;
  const tenantCount = bulkInviteList.filter(i => i.role === 'tenant').length;
  summaryEl.textContent = `${bulkInviteList.length} invites ready — ${ownerCount} owners · ${tenantCount} tenants`;

  listEl.innerHTML = `
    <table style="width:100%;border-collapse:collapse">
      <thead>
        <tr style="background:var(--bg)">
          <th style="padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;text-align:left;border-bottom:1px solid var(--border)">Unit</th>
          <th style="padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;text-align:left;border-bottom:1px solid var(--border)">Email</th>
          <th style="padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;text-align:left;border-bottom:1px solid var(--border)">Name</th>
          <th style="padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;text-align:left;border-bottom:1px solid var(--border)">Role</th>
        </tr>
      </thead>
      <tbody>
        ${bulkInviteList.map((item, i) => `
          <tr style="border-bottom:1px solid var(--border-light)" id="bulk-row-${i}">
            <td style="padding:9px 14px;font-size:13px;font-weight:700;color:var(--blue-600)">${item.unit}</td>
            <td style="padding:9px 14px;font-size:13px;color:var(--text)">${item.email}</td>
            <td style="padding:9px 14px;font-size:13px;color:var(--muted)">${item.name || '—'}</td>
            <td style="padding:9px 14px">
              <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;${item.role==='owner'?'background:#dbeafe;color:#1d4ed8':'background:#dcfce7;color:#15803d'}">${item.role}</span>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;

  sendBtn.disabled = false;
};

document.getElementById('sendBulkInviteBtn').addEventListener('click', async () => {
  const sendBtn = document.getElementById('sendBulkInviteBtn');
  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending...';

  let sent = 0, failed = 0;

  for (let i = 0; i < bulkInviteList.length; i++) {
    const item = bulkInviteList[i];
    const rowEl = document.getElementById(`bulk-row-${i}`);
    try {
      const { data: { session } } = await supabase.auth.getSession();
      const res = await fetch('/api/send-invite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ email: item.email, full_name: item.name || '', role: item.role, unit: item.unit })
      });
      if (!res.ok) throw new Error();
      if (rowEl) rowEl.style.background = '#f0fdf4';
      sent++;
    } catch {
      if (rowEl) rowEl.style.background = '#fef2f2';
      failed++;
    }
  }

  sendBtn.textContent = 'Done!';
  document.getElementById('bulkInviteSummary').textContent = `✅ ${sent} sent${failed > 0 ? ` · ❌ ${failed} failed` : ''}`;
  showToast(`${sent} invites sent!`);
});

// ─────────────────────────────────────────────────────────────

window.exportOccupants = () => {
  const data = (window._lastSearchResults && window._lastSearchResults.length) ? window._lastSearchResults : allOccupants;

  const rows = data.map(o => {
    const row = { 'Unit': o.unit || '' };
    if (activeCols.has('business_name')) row['Business Name'] = o.business_name || '';
    if (activeCols.has('contact')) row['Contact Person'] = o.contact_person || '';
    if (activeCols.has('primary_email')) row['Primary Email'] = o.primary_email || '';
    if (activeCols.has('business_email')) row['Business Email'] = o.business_email || '';
    if (activeCols.has('phone')) row['Phone'] = o.phone || '';
    if (activeCols.has('role')) {
      row['Role'] = o.is_committee ? 'committee' : o.primary_email ? 'owner' : (o.business_email||'').trim() ? 'tenant' : '';
    }
    if (activeCols.has('vehicles')) row['License Plates'] = (o.license_plates || '').split(',').map(p => p.trim()).filter(p => p).join(', ');
    return row;
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Occupants');
  const date = new Date().toISOString().split('T')[0];
  const activeChip = document.querySelector('.filter-chip.active');
  const filterLabel = activeChip ? activeChip.dataset.filter : '';
  const suffix = filterLabel && filterLabel !== 'all' ? `_${filterLabel}` : '';
  XLSX.writeFile(wb, `Redmyre_Occupants${suffix}_${date}.xlsx`);
};

// Initial load
await loadOccupants();
</script>
