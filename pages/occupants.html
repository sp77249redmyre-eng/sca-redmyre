<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Occupants – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v4.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
.content { padding: 24px; max-width: 100%; }
.search-table-wrap { overflow-x: auto; }
/* Column toggle */
.col-toggle-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
.col-toggle-label { font-size:11px; font-weight:700; color:var(--muted); margin-right:2px; }
.col-toggle-btn { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:100px; font-size:11px; font-weight:600; border:1.5px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.15s; }
.col-toggle-btn.on { background:var(--blue-600); color:#fff; border-color:var(--blue-600); }
.col-toggle-btn.on::before { content:'✓ '; }

/* Suite Tabs */
.suite-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  border-bottom: 2px solid var(--border);
  padding-bottom: 8px;
}
.suite-tab {
  padding: 8px 18px;
  border-radius: 8px 8px 0 0;
  background: var(--bg);
  border: 1px solid var(--border);
  border-bottom: none;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
  position: relative;
  bottom: -2px;
}
.suite-tab:hover { background: var(--surface); }
.suite-tab.active {
  background: var(--surface);
  color: var(--blue-600);
  border-color: var(--blue-600);
  border-bottom: 2px solid var(--surface);
  z-index: 1;
}

/* Occupant List */
.occ-list { display: flex; flex-direction: column; gap: 10px; }
.occ-item.highlight-flash {
  animation: highlightPulse 2s ease;
  border-color: #16a34a !important;
  box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
}
@keyframes highlightPulse {
  0% { background: #dcfce7; box-shadow: 0 0 0 6px rgba(22, 163, 74, 0.3); }
  100% { background: var(--surface); box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15); }
}
.occ-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  transition: all 0.2s;
  max-width: 800px;
  overflow: hidden;
}
.occ-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: background 0.15s;
}
.occ-header:hover { background: #f8fafc; }
.occ-item.expanded { border-color: #16a34a; box-shadow: 0 4px 14px rgba(22,163,74,0.08); }
.occ-item.expanded .occ-header { background: #f0fdf4; }
.occ-item:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.06); }
.occ-item.occ-restricted { opacity: 0.55; cursor: default; }
.occ-item.occ-restricted:hover { box-shadow: none; }
.occ-item.occ-restricted .occ-header { cursor: default; }
.occ-item.occ-restricted .occ-header:hover { background: var(--surface); }
.occ-chevron {
  font-size: 12px;
  color: var(--muted);
  transition: transform 0.2s;
  flex-shrink: 0;
}
.occ-item.expanded .occ-chevron { transform: rotate(180deg); color: #16a34a; }

/* Accordion Body */
.occ-body {
  display: none;
  padding: 0 20px 20px 20px;
  border-top: 1px solid #f1f5f9;
  background: #fafbfc;
}
.occ-item.expanded .occ-body { display: block; animation: slideDown 0.25s ease-out; }
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
.occ-body-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px 24px;
  padding-top: 18px;
}
.occ-field {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.occ-field-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.occ-field-value {
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
  word-break: break-word;
  line-height: 1.5;
}
.occ-field-value.empty { color: #cbd5e1; font-style: italic; font-weight: 400; }
.occ-field-value a { color: var(--blue-600); text-decoration: none; }
.occ-field-value a:hover { text-decoration: underline; }
.occ-field-value.full { grid-column: 1 / -1; }
.occ-badge-committee {
  display: inline-flex; align-items: center; gap: 5px;
  background: linear-gradient(135deg, #fef3c7, #fde68a);
  color: #92400e;
  padding: 4px 10px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 700;
}
/* Type Badge (OWNER / TENANT) - 헤더 우측 */
.occ-type-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  flex-shrink: 0;
}
.occ-type-badge.owner { background: #dcfce7; color: #166534; }
.occ-type-badge.tenant { background: #dbeafe; color: #1e40af; }
.occ-type-badge.empty { background: #f1f5f9; color: #94a3b8; }

/* Info Bar (펼침 카드 상단 안내바) */
.occ-info-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  margin: 16px 0 14px 0;
}
.occ-info-bar.privileged { background: #fef9c3; color: #854d0e; border-left: 3px solid #eab308; }
.occ-info-bar.self-owner { background: #dcfce7; color: #166534; border-left: 3px solid #16a34a; }
.occ-info-bar.privacy { background: #fee2e2; color: #991b1b; border-left: 3px solid #ef4444; }
.occ-info-bar.owner-unit { background: #dcfce7; color: #166534; border-left: 3px solid #16a34a; }

/* List-style fields (1-column) */
.occ-body-list {
  display: flex;
  flex-direction: column;
  padding-top: 4px;
}
.occ-list-row {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 12px;
  padding: 8px 0;
  align-items: baseline;
}
.occ-list-row + .occ-list-row { border-top: 1px solid #f1f5f9; }
.occ-list-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.occ-list-label .lbl-star { color: #eab308; font-size: 12px; }
.occ-list-label .lbl-icon { font-size: 13px; opacity: 0.85; }
.occ-list-value {
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
  word-break: break-word;
  line-height: 1.5;
}
.occ-list-value.empty { color: #cbd5e1; font-style: italic; font-weight: 400; }
.occ-list-value a { color: var(--blue-600); text-decoration: none; }
.occ-list-value a:hover { text-decoration: underline; }
.occ-list-divider {
  border-top: 1px dashed #cbd5e1;
  margin: 4px 0;
}

/* Vehicles Section */
.occ-vehicles-section {
  padding: 14px 0 4px 0;
  margin-top: 6px;
  border-top: 1px solid #e2e8f0;
}
.occ-vehicles-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.occ-body-actions {
  display: flex;
  justify-content: flex-end;
  padding-top: 16px;
  margin-top: 14px;
  border-top: 1px solid #e2e8f0;
}
.occ-edit-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: #16a34a;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.occ-edit-btn:hover { background: #15803d; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(22,163,74,0.25); }
.occ-unit {
  font-size: 15px;
  font-weight: 700;
  color: var(--blue-600);
  min-width: 50px;
}
.occ-info { flex: 1; }
.occ-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
}
.occ-contact {
  font-size: 12px;
  color: var(--muted);
}
.occ-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--text-2);
}
.occ-meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
}
.occ-actions {
  display: flex;
  gap: 6px;
}

/* Committee Badge */
.committee-star {
  font-size: 16px;
  margin-left: 6px;
}

/* Modal Specific */
.modal-info-grid {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 12px 16px;
  margin: 20px 0;
}
.modal-info-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-align: right;
}
.modal-info-value {
  font-size: 13px;
  color: var(--text);
}
.vehicle-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.vehicle-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg);
  border-radius: 8px;
  font-size: 13px;
  font-family: 'Courier New', monospace;
  font-weight: 600;
}

/* Modal Label Override */
.modal-label {
  color: #111827 !important;
  font-weight: 700 !important;
}

/* Plate Tag Input UI */
#plateList {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.plate-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.plate-input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 13px;
  font-family: 'Courier New', monospace;
  font-weight: 600;
  background: #fff;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 1px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.plate-input:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
}
.plate-input.invalid {
  border-color: #ef4444;
  background: #fef2f2;
}
.plate-remove-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid #ef4444;
  background: #fee2e2;
  color: #b91c1c;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}
.plate-remove-btn:hover {
  background: #ef4444;
  color: #fff;
}
.plate-remove-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* Admin Search Section */
.admin-search-section {
  margin-top: 32px;
  display: none;
}
.admin-search-section.visible { display: block; }
/* Filter chips */
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.filter-chip { padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
.filter-chip:hover { border-color: var(--blue-600); color: var(--blue-600); }
.filter-chip.active { background: var(--blue-600); color: #fff; border-color: var(--blue-600); }
.filter-chip-label { font-size: 11px; font-weight: 700; color: var(--muted); margin-right: 2px; }
.admin-search-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.admin-search-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.admin-search-bar {
  position: relative;
  flex: 1;
  max-width: 380px;
}
.admin-search-input {
  width: 100%;
  padding: 9px 36px 9px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  box-sizing: border-box;
}
.admin-search-input:focus {
  border-color: var(--blue-600);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
}
.admin-search-clear {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 14px;
  display: none;
  padding: 0;
  line-height: 1;
}
.admin-search-count {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

/* Search Table */
.search-table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.search-table {
  width: 100%;
  border-collapse: collapse;
}
.search-table thead {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--bg);
}
.search-table th {
  padding: 11px 14px;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  text-align: left;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
.search-table td {
  padding: 10px 14px;
  font-size: 13px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: middle;
}
.search-table tbody tr:last-child td { border-bottom: none; }
.search-table tbody tr:hover { background: var(--bg); }

/* Inline edit cell */
.edit-cell {
  cursor: text;
  border-radius: 6px;
  padding: 4px 6px;
  min-width: 80px;
  transition: background 0.12s;
}
.edit-cell:hover { background: var(--border-light); }
.edit-cell.editing {
  background: var(--surface);
  outline: 2px solid var(--blue-600);
  outline-offset: -1px;
}
.edit-cell input {
  border: none;
  background: transparent;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  width: 100%;
  outline: none;
  padding: 0;
}
.edit-cell.empty { color: var(--muted); font-style: italic; }

/* Vehicle badges */
.plate-badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.plate-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px 6px 12px;
  background: var(--blue-50);
  color: var(--blue-700);
  border: 1.5px solid #bfdbfe;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.5px;
}
.plate-badge::before { content: '🚗'; font-size: 13px; }
.plate-badge-remove {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #ef4444;
  border: none;
  cursor: pointer;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 0;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.12s, transform 0.1s;
}
.plate-badge-remove:hover { background: #b91c1c; transform: scale(1.15); }
.plate-add-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  border: 2px dashed var(--blue-600);
  border-radius: 8px;
  background: none;
  color: var(--blue-600);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.12s;
}
.plate-add-btn:hover { background: var(--blue-50); }
.plate-add-input {
  width: 90px;
  padding: 5px 8px;
  border: 1.5px solid var(--blue-600);
  border-radius: 8px;
  font-size: 13px;
  font-family: 'Courier New', monospace;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  outline: none;
  background: var(--surface);
  color: var(--text);
}
.unit-badge {
  font-size: 13px;
  font-weight: 700;
  color: var(--blue-600);
  background: var(--blue-50);
  padding: 3px 10px;
  border-radius: 7px;
  white-space: nowrap;
}
.search-empty {
  padding: 48px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

/* Mobile */
@media (max-width: 768px) {
  .content { padding: 16px !important; overflow-x: hidden; }
  .occ-list { max-width: 100%; width: 100%; }
  .occ-item { max-width: 100%; width: 100%; box-sizing: border-box; }
  .occ-header { box-sizing: border-box; max-width: 100%; }
  .occ-name { word-break: break-word; overflow-wrap: break-word; }
  
  /* Quick Search (Admin only) - 모바일 대응 */
  .admin-search-section { max-width: 100%; overflow-x: hidden; }
  .admin-search-header { flex-direction: column; align-items: stretch; gap: 8px; }
  .admin-search-bar { max-width: 100% !important; width: 100%; }
  .admin-search-count { text-align: right; }
  .filter-chips { max-width: 100%; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .filter-chips::-webkit-scrollbar { display: none; }
  .filter-chip { flex-shrink: 0; }
  .search-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .search-table { min-width: 600px; }
  .suite-tabs { 
    gap: 6px; 
    flex-wrap: nowrap; 
    overflow-x: auto; 
    -webkit-overflow-scrolling: touch; 
    scrollbar-width: none;
    padding-bottom: 4px;
    margin-left: -16px;
    margin-right: -16px;
    padding-left: 16px;
    padding-right: 16px;
    scroll-snap-type: x mandatory;
  }
  .suite-tabs::-webkit-scrollbar { display: none; }
  .suite-tab { 
    padding: 8px 0; 
    font-size: 13px; 
    flex: 0 0 calc((100% - 12px) / 3);
    white-space: nowrap;
    text-align: center;
    scroll-snap-align: start;
  }
  .occ-item { padding: 0; }
  .occ-header { flex-wrap: wrap; padding: 14px 16px; gap: 10px; }
  .occ-header .occ-info { flex: 1 1 calc(100% - 120px); min-width: 0; }
  .occ-header .occ-info .occ-name { word-break: break-word; }
  .occ-header .occ-meta { order: 3; flex: 0 0 auto; }
  .occ-chevron { order: 4; flex: 0 0 auto; }
  .occ-body { padding: 0 16px 16px 16px; }
  .occ-list-row { grid-template-columns: 130px 1fr; gap: 8px; padding: 7px 0; }
  .occ-list-label { font-size: 11px; }
  .occ-list-value { font-size: 12.5px; }
  .occ-info-bar { font-size: 11.5px; padding: 9px 12px; }
  .occ-body-grid { grid-template-columns: 1fr; gap: 12px; }
  .occ-unit { min-width: auto; }
  .occ-meta { flex-wrap: wrap; max-width: 100%; }
  .occ-meta-item { word-break: break-all; max-width: 100%; }
  .occ-actions { width: 100%; justify-content: flex-end; }
  .modal-info-grid { grid-template-columns: 1fr; gap: 8px; }
  .modal-info-label { text-align: left; }
}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    
    <div class="section-hdr">
      <div class="section-title">Occupants</div>
    </div>

    <!-- Suite Tabs -->
    <div class="suite-tabs">
      <button class="suite-tab active" data-suite="Ground">Ground</button>
      <button class="suite-tab" data-suite="Level 1">Level 1</button>
      <button class="suite-tab" data-suite="Level 2">Level 2</button>
      <button class="suite-tab" data-suite="Level 3">Level 3</button>
      <button class="suite-tab" data-suite="Level 4">Level 4</button>
      <button class="suite-tab" data-suite="Level 5">Level 5</button>
      <button class="suite-tab" data-suite="Level 6">Level 6</button>
      <button class="suite-tab" data-suite="External">External</button>
    </div>

    <!-- Occupant List -->
    <div class="occ-list" id="occList">
      <div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">Loading…</div>
    </div>

    <!-- Admin Search Section -->
    <div class="admin-search-section" id="adminSearchSection" style="display:none">

<script type="module">
import { initLayout } from '/js/layout.js';

const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');

const { supabase, user, role, name, profile } = ctx;
const myUnit = profile?.unit || null;
const myEmail = user?.email || null;

if (!['admin','committee','observer','owner','tenant'].includes(role)) {
  window.location.href = '/pages/building.html';
}

let allOccupants = [];
let currentSuite = 'Ground';
let myOwnedUnits = new Set(); // primary_email 기준 본인 소유 유닛들

// owner/tenant: 본인 유닛의 level로 초기 탭 설정 (다른 탭도 모두 볼 수 있음)
if (['owner','tenant'].includes(role) && myUnit) {
  const unitList = (role === 'owner' && myOwnedUnits.size > 0) ? [...myOwnedUnits] : [myUnit];
  const mySuites = new Set();
  unitList.forEach(u => {
    if (u === 'Unit 1') { mySuites.add('Ground'); return; }
    const match = u.match(/^([0-9]+)([A-H])$/i);
    if (!match) return;
    mySuites.add('Level ' + match[1]);
  });

  if (mySuites.size === 0) {
    currentSuite = 'External';
    document.querySelectorAll('.suite-tab').forEach(t => t.classList.remove('active'));
    const extTab = document.querySelector('.suite-tab[data-suite="External"]');
    if (extTab) extTab.classList.add('active');
  } else {
    const firstSuite = [...mySuites][0];
    currentSuite = firstSuite;
    document.querySelectorAll('.suite-tab').forEach(t => t.classList.remove('active'));
    const myTab = document.querySelector(`.suite-tab[data-suite="${firstSuite}"]`);
    if (myTab) myTab.classList.add('active');
  }
}

// Load occupants
async function loadOccupants() {
  const { data, error } = await supabase
    .from('occupants')
    .select('*')
    .order('unit', { ascending: true });
  
  if (error) {
    showToast('Failed to load occupants', true);
    return;
  }
  
  let combined = data || [];

  // owner/tenant: 다른 유닛도 보이게 하려면 public 함수로 보충
  if (['owner','tenant'].includes(role)) {
    const { data: publicData } = await supabase.rpc('get_all_occupants_public');
    if (publicData) {
      const myIds = new Set(combined.map(o => o.id));
      const extras = publicData.filter(p => !myIds.has(p.id));
      combined = [...combined, ...extras];
    }
  }

  allOccupants = combined;

  // profiles email → role 맵 생성
  const { data: profilesData } = await supabase.from('profiles').select('email, role');
  window._profileRoleMap = {};
  (profilesData || []).forEach(p => {
    if (p.email) window._profileRoleMap[p.email.toLowerCase()] = p.role;
  });

  // committee/owner/tenant: primary_email + business_email 모두 매칭 (콤마 분리 처리)
  if (myEmail && ['committee','owner','tenant'].includes(role)) {
    const myEmailLower = myEmail.toLowerCase();
    myOwnedUnits = new Set(
      allOccupants.filter(o => {
        // primary_email 매칭 (콤마 분리 — 공동 Owner 지원)
        if (o.primary_email) {
          const primaryEmails = o.primary_email.split(',').map(e => e.trim().toLowerCase());
          if (primaryEmails.includes(myEmailLower)) return true;
        }
        // business_email 매칭 (콤마 분리)
        if (o.business_email) {
          const emails = o.business_email.split(',').map(e => e.trim().toLowerCase());
          if (emails.includes(myEmailLower)) return true;
        }
        return false;
      }).map(o => o.unit)
    );
    // profiles.unit도 포함 (안전장치)
    if (myUnit) myOwnedUnits.add(myUnit);
  }

  // admin은 전체 유닛 접근이라 myOwnedUnits 안 쓰지만 호환성 위해 세팅
  if (role === 'admin') {
    myOwnedUnits = new Set(allOccupants.map(o => o.unit));
  }

  // owner/tenant: 전체 탭 다 표시 (이웃 보게), 본인 유닛 있는 첫 번째 층으로 탭 active 이동
  if (['owner','tenant'].includes(role) && myOwnedUnits.size > 0) {
    const myLevels = new Set();
    myOwnedUnits.forEach(u => {
      if (u === 'Unit 1') { myLevels.add('Ground'); return; }
      const match = u.match(/^([0-9]+)([A-H])$/i);
      if (match) myLevels.add('Level ' + match[1]);
    });
    // 전체 탭 표시 (숨김 제거)
    document.querySelectorAll('.suite-tab').forEach(tab => {
      tab.style.display = '';
    });
    // 본인 유닛 있는 첫 번째 층으로 active 이동
    const firstLevel = [...myLevels][0];
    if (firstLevel && firstLevel !== currentSuite) {
      currentSuite = firstLevel;
      document.querySelectorAll('.suite-tab').forEach(t => t.classList.remove('active'));
      const myTab = document.querySelector(`.suite-tab[data-suite="${firstLevel}"]`);
      if (myTab) myTab.classList.add('active');
    }
  }

  renderOccupants();
}

// Render occupants
function renderOccupants() {
  const list = document.getElementById('occList');

  // owner/tenant도 모든 유닛 표시 (본인 것 외엔 비활성)
  let visibleOccupants = allOccupants;

  // Filter by current level
  let filtered;
  if (currentSuite === 'Ground') {
    filtered = visibleOccupants.filter(o => o.level === 'Ground' || o.unit === 'Unit 1');
  } else if (currentSuite === 'External') {
    filtered = visibleOccupants.filter(o => o.level === 'External');
  } else {
    // "Level 1" ~ "Level 6" - DB 값과 직접 매칭
    filtered = visibleOccupants.filter(o => o.level === currentSuite);
  }
  
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🏢</div><div class="empty-title">No occupants on this level</div></div>`;
    return;
  }
  
  // owner/tenant 본인 유닛 판별용
  const isMyUnit = (unit) => {
    if (!['owner','tenant'].includes(role)) return true; // admin/committee/observer는 전부
    return myOwnedUnits.has(unit) || unit === myUnit;
  };
  
  list.innerHTML = filtered.map(o => {
    const vehicles = (o.license_plates || '').split(',').filter(p => p.trim()).length;
    // business_email 콤마 분리 → tenantEmail (첫번째) / staffEmails (나머지)
    const allBusinessEmails = (o.business_email || '').split(',').map(e => e.trim()).filter(e => e);
    const tenantEmail = allBusinessEmails[0] || '';
    const staffEmails = allBusinessEmails.slice(1);
    const emailCount = (o.primary_email ? 1 : 0) + allBusinessEmails.length;
    const isGround = o.level === 'Ground';
    const canEdit = (role === 'admin' || (['committee','owner','tenant'].includes(role) && (myOwnedUnits.has(o.unit) || o.unit === myUnit)));
    const plates = (o.license_plates || '').split(',').map(p => p.trim()).filter(p => p);
    const restricted = ['owner','tenant'].includes(role) && !isMyUnit(o.unit);
    const clickHandler = restricted ? '' : `onclick="toggleOccAccordion('${o.id}', event)"`;

    // ──── 4-케이스 권한 분기 ────
    const isOwnerUnit = o.owner_type === 'Owner';
    const isTenantUnit = o.owner_type === 'Tenant';
    const isPrivilegedRole = ['admin','committee','observer'].includes(role);
    const isMyOwnedUnit = role === 'owner' && myOwnedUnits.has(o.unit);
    // ⭐ 항목(Owner Contact / Primary Email) 표시 여부
    const showStarFields = isOwnerUnit || isPrivilegedRole || isMyOwnedUnit;
    // 안내바 종류
    let infoBarHtml = '';
    if (isOwnerUnit) {
      infoBarHtml = `<div class="occ-info-bar owner-unit"><span>OWNER unit — visible to everyone</span></div>`;
    } else if (isMyOwnedUnit) {
      infoBarHtml = `<div class="occ-info-bar self-owner"><span>You are the Owner — all <span style="color:#eab308">⭐</span> fields visible</span></div>`;
    } else if (isPrivilegedRole) {
      infoBarHtml = `<div class="occ-info-bar privileged"><span><span style="color:#eab308">⭐</span> = visible to Admin / Committee / Observer / Owner only</span></div>`;
    } else {
      // 일반 owner/tenant가 다른 TENANT 유닛 보는 경우
      infoBarHtml = `<div class="occ-info-bar privacy"><span><span style="color:#eab308">⭐</span> Owner Contact / Primary Email hidden — Privacy protected</span></div>`;
    }

    // 헤더 배지
    const typeBadge = isOwnerUnit
      ? `<span class="occ-type-badge owner">OWNER</span>`
      : isTenantUnit
        ? `<span class="occ-type-badge tenant">TENANT</span>`
        : '';

    // 차량 섹션
    const vehiclesHtml = plates.length
      ? `<div class="occ-vehicles-section">
           <div class="occ-vehicles-title">🚗 Vehicles (${plates.length})</div>
           <div class="plate-badges">${plates.map(p => `<span class="plate-badge">${p}</span>`).join('')}</div>
         </div>`
      : `<div class="occ-vehicles-section">
           <div class="occ-vehicles-title">🚗 Vehicles (0)</div>
           <div style="font-size:12px;color:#cbd5e1;font-style:italic">No vehicles registered</div>
         </div>`;

    // ⭐ 항목 (Owner Contact + Primary Email)
    // Primary Email 콤마 분리 (공동 Owner 지원)
    const primaryEmailList = (o.primary_email || '').split(',').map(e => e.trim()).filter(e => e);
    const primaryEmailHtml = primaryEmailList.length
      ? primaryEmailList.map(e => `<a href="mailto:${e}">${e}</a>`).join('<br>')
      : '<span class="empty-inline">Not set</span>';
    const starRowsHtml = showStarFields ? `
      <div class="occ-list-row">
        <div class="occ-list-label"><span class="lbl-star">⭐</span> Owner Contact</div>
        <div class="occ-list-value ${o.contact_person ? '' : 'empty'}">${o.contact_person || 'Not set'}</div>
      </div>
      <div class="occ-list-row">
        <div class="occ-list-label"><span class="lbl-star">⭐</span> Primary Email</div>
        <div class="occ-list-value ${primaryEmailList.length ? '' : 'empty'}">${primaryEmailList.length ? primaryEmailHtml : 'Not set'}</div>
      </div>
    ` : '';

    // Contact 라벨: OWNER 유닛은 ⭐ 안 붙이고 Primary Email만 보여주면 됨 (OWNER는 Contact = Owner)
    // 그래서 OWNER 유닛은 ⭐Owner Contact 대신 Contact만 보여주고 끝
    const contactRowHtml = isOwnerUnit ? `
      <div class="occ-list-row">
        <div class="occ-list-label"><span class="lbl-icon">👤</span> Contact</div>
        <div class="occ-list-value ${o.contact_person ? '' : 'empty'}">${o.contact_person || 'Not set'}</div>
      </div>
      <div class="occ-list-row">
        <div class="occ-list-label"><span class="lbl-icon">📧</span> Primary Email</div>
        <div class="occ-list-value ${primaryEmailList.length ? '' : 'empty'}">${primaryEmailList.length ? primaryEmailHtml : 'Not set'}</div>
      </div>
    ` : `
      ${starRowsHtml}
      ${showStarFields ? '<div class="occ-list-divider"></div>' : ''}
      <div class="occ-list-row">
        <div class="occ-list-label"><span class="lbl-icon">👤</span> Contact</div>
        <div class="occ-list-value ${o.business_name || o.contact_person ? '' : 'empty'}">${o.business_name ? o.business_name : (o.contact_person || 'Not set')}</div>
      </div>
      <div class="occ-list-row">
        <div class="occ-list-label"><span class="lbl-icon">📧</span> Tenant Email</div>
        <div class="occ-list-value ${tenantEmail ? '' : 'empty'}">${tenantEmail ? `<a href="mailto:${tenantEmail}">${tenantEmail}</a>` : 'Not set'}</div>
      </div>
    `;

    // OWNER 유닛은 Tenant Email 없음, Staff Email만 있을 수 있음
    const staffEmailRowHtml = staffEmails.length || isOwnerUnit ? `
      <div class="occ-list-row">
        <div class="occ-list-label"><span class="lbl-icon">📧</span> Staff Email</div>
        <div class="occ-list-value ${staffEmails.length ? '' : 'empty'}">${staffEmails.length ? staffEmails.map(e => `<a href="mailto:${e}">${e}</a>`).join('<br>') : '(none)'}</div>
      </div>
    ` : '';

    return `
      <div class="occ-item ${isGround ? 'ground-floor' : ''} ${restricted ? 'occ-restricted' : ''}" data-unit="${o.unit}" data-id="${o.id}">
        <div class="occ-header" ${clickHandler}>
          <div class="occ-unit">${o.unit}</div>
          <div class="occ-info">
            <div class="occ-name">
              ${o.business_name || '<span style="color:#cbd5e1;font-style:italic">Vacant</span>'}
              ${o.is_committee ? '<span class="committee-star" title="Committee Member">⭐</span>' : ''}
            </div>
            ${o.contact_person ? `<div class="occ-contact">${o.contact_person}</div>` : ''}
          </div>
          <div class="occ-meta">
            ${typeBadge}
            <div class="occ-meta-item">📧 ${emailCount}</div>
            <div class="occ-meta-item">🚗 ${vehicles}</div>
          </div>
          ${restricted ? '' : '<div class="occ-chevron">▼</div>'}
        </div>
        <div class="occ-body">
          ${infoBarHtml}
          <div class="occ-body-list">
            <div class="occ-list-row">
              <div class="occ-list-label"><span class="lbl-icon">🏠</span> Suite</div>
              <div class="occ-list-value ${o.suite ? '' : 'empty'}">${o.suite || o.unit}</div>
            </div>
            <div class="occ-list-row">
              <div class="occ-list-label"><span class="lbl-icon">🏷️</span> Type</div>
              <div class="occ-list-value">${o.owner_type || '<span style="color:#cbd5e1;font-style:italic">Not set</span>'}</div>
            </div>
            ${contactRowHtml}
            ${staffEmailRowHtml}
            <div class="occ-list-row">
              <div class="occ-list-label"><span class="lbl-icon">📞</span> Phone</div>
              <div class="occ-list-value ${o.phone ? '' : 'empty'}">${o.phone ? o.phone.split(/[,\/]/).map(p => `<a href="tel:${p.trim().replace(/\s/g,'')}">${p.trim()}</a>`).join(' · ') : 'Not set'}</div>
            </div>
            ${o.is_committee ? `
            <div class="occ-list-row">
              <div class="occ-list-label"><span class="lbl-icon">⭐</span> Committee</div>
              <div class="occ-list-value"><span class="occ-badge-committee">⭐ ${o.committee_role || 'Committee Member'}</span></div>
            </div>` : ''}
          </div>
          ${vehiclesHtml}
          ${canEdit ? `
          <div class="occ-body-actions">
            <button class="occ-edit-btn" onclick="openEditModal('${o.id}'); event.stopPropagation();">✏️ Edit Details</button>
          </div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

// 아코디언 토글 (하나만 열림 - 다른 카드 열면 자동 닫힘)
window.toggleOccAccordion = function(id, event) {
  // Edit 버튼 등 내부 버튼 클릭 시 토글 안 함
  if (event.target.closest('.occ-edit-btn, a')) return;
  const item = document.querySelector(`.occ-item[data-id="${id}"]`);
  if (!item) return;
  const wasExpanded = item.classList.contains('expanded');
  // 모든 카드 닫기
  document.querySelectorAll('.occ-item.expanded').forEach(el => el.classList.remove('expanded'));

// Save
document.getElementById('saveBtn').addEventListener('click', async () => {
  const id = document.getElementById('editId').value;

  // Collect plates from plate tag UI
  const plates = collectPlates();
  const platesStr = plates.join(', ');

  const occ = allOccupants.find(o => o.id === id);
  const unit = occ?.unit || '';
  const contactPerson = document.getElementById('editContactPerson').value.trim();
  const businessName = document.getElementById('editBusinessName').value.trim();
  const ownerName =
    contactPerson ||
    businessName ||
    occ?.contact_person ||
    occ?.business_name ||
    '';

  // Tenant Email + Staff Email(s) 합쳐서 business_email 생성
  const tenantEmail = document.getElementById('editTenantEmail').value.trim();
  const staffEmailsRaw = document.getElementById('editStaffEmails').value.trim();
  const staffList = staffEmailsRaw ? staffEmailsRaw.split(',').map(e => e.trim()).filter(e => e) : [];
  const combinedBusinessEmail = [tenantEmail, ...staffList].filter(e => e).join(', ');

  const data = {
    business_name: businessName,
    contact_person: contactPerson,
    primary_email: document.getElementById('editPrimaryEmail').value.trim(),
    business_email: combinedBusinessEmail,
    owner_type: document.getElementById('editOwnerType').value || null,
    phone: document.getElementById('editPhone').value.trim(),
    is_committee: document.getElementById('editIsCommittee').checked,
    committee_role: document.getElementById('editIsCommittee').checked ? document.getElementById('editCommitteeRole').value : null,
    license_plates: platesStr || null,
  };

  const { error } = await supabase
    .from('occupants')
    .update(data)
    .eq('id', id);

  if (error) {
    showToast('Failed to save: ' + error.message, true);
    return;
  }

  // Sync vehicles via RPC
  const { error: rpcError } = await supabase.rpc('sync_vehicles', {
    p_unit: unit,
    p_owner_name: ownerName,
    p_plates: plates
  });

  if (rpcError) {
    showToast('Saved but vehicle sync failed: ' + rpcError.message, true);
  }

  closeModal('editModal');
  await loadOccupants();
  showToast('Occupant updated ✓');
});

// ── Plate Badge UI (Modal) ────────────────────────────────────
function renderPlateList(plates) {
  const container = document.getElementById('plateList');
  container.innerHTML = '';
  plates.forEach(p => { if (p) container.appendChild(createModalPlateBadge(p)); });
  container.appendChild(createModalAddBtn());
}

function createModalPlateBadge(plate) {
  const span = document.createElement('span');
  span.className = 'plate-badge';
  span.dataset.plate = plate;
  span.innerHTML = `${plate} <button type="button" class="plate-badge-remove" title="Remove">✕</button>`;
  span.querySelector('.plate-badge-remove').addEventListener('click', () => {
    span.remove();
    refreshModalAddBtn();
  });
  return span;
}

function createModalAddBtn() {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'plate-add-btn';
  btn.id = 'modalPlateAddBtn';
  btn.textContent = '+ Add';
  btn.addEventListener('click', () => {
    const container = document.getElementById('plateList');
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'plate-add-input';
    inp.placeholder = 'ABC123';
    inp.maxLength = 8;
    container.insertBefore(inp, btn);
    inp.focus();

    const confirm = () => {
      const val = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      inp.remove();
      if (val.length >= 2) {
        const existing = collectPlates();
        if (!existing.includes(val)) {
          container.insertBefore(createModalPlateBadge(val), btn);
        }
      }
    };
    inp.addEventListener('blur', confirm);
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
      if (e.key === 'Escape') inp.remove();
      inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });
    inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  });
  return btn;
}

function refreshModalAddBtn() {
  const container = document.getElementById('plateList');
  if (!container.querySelector('#modalPlateAddBtn')) {
    container.appendChild(createModalAddBtn());
  }
}

function collectPlates() {
  const container = document.getElementById('plateList');
  return Array.from(container.querySelectorAll('.plate-badge'))
    .map(b => b.dataset.plate)
    .filter(p => p && p.length >= 2);
}

const ALL_COLS = ['business_name','contact','primary_email','business_email','phone','role','vehicles'];
let activeCols = new Set(ALL_COLS);

window.toggleCol = (btn) => {
  const col = btn.dataset.col;
  if (activeCols.has(col)) {
    if (activeCols.size <= 1) return; // 최소 1개는 유지
    activeCols.delete(col);
    btn.classList.remove('on');
  } else {
    activeCols.add(col);
    btn.classList.add('on');
  }
  // 현재 결과 다시 렌더
  if (window._lastSearchResults) renderSearchResults(window._lastSearchResults);
};

// ── Filter Chips ──────────────────────────────────────────────
window.applyFilter = (filter) => {
  // 검색창 초기화
  const searchInput = document.getElementById('adminSearchInput');
  searchInput.value = '';
  document.getElementById('adminSearchClear').style.display = 'none';

  // 칩 활성화
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.filter === filter);
  });

  if (filter === 'all') {
    renderSearchResults(allOccupants);
    return;
  }

  const results = allOccupants.filter(o => {
    const unit = (o.unit || '').toUpperCase();
    if (filter === 'Ground') return o.level === 'Ground' || o.unit === 'Unit 1';
    if (filter === 'External') return o.level === 'External';
    // Level (숫자) — unit이 "1A", "2B" 등
    if (/^\d$/.test(filter)) return unit.startsWith(filter);
    // Suite (알파벳) — unit이 "1A", "2A" 등 끝자리
    if (/^[A-H]$/.test(filter)) return unit.endsWith(filter);
    return false;
  });

  renderSearchResults(results);
};

        ${activeCols.has('business_email') ? `<td><div class="edit-cell ${!o.business_email?'empty':''}" data-field="business_email" data-id="${o.id}" onclick="startInlineEdit(this)">${o.business_email || 'Add email…'}</div></td>` : ''}
        ${activeCols.has('phone') ? `<td><div class="edit-cell ${!o.phone?'empty':''}" data-field="phone" data-id="${o.id}" onclick="startInlineEdit(this)">${o.phone || 'Add phone…'}</div></td>` : ''}

// Inline Edit
window.startInlineEdit = (cell) => {
  if (cell.classList.contains('editing')) return;
  const field = cell.dataset.field;
  const id = cell.dataset.id;
  const occ = allOccupants.find(o => o.id === id);
  const currentVal = occ?.[field] || '';

  cell.classList.add('editing');
  cell.classList.remove('empty');

  const input = document.createElement('input');
  input.type = field.includes('email') ? 'email' : 'text';
  input.value = currentVal;
  input.style.minWidth = '120px';
  cell.innerHTML = '';
  cell.appendChild(input);
  input.focus();
  input.select();

  const save = async () => {
    const newVal = input.value.trim();
    cell.classList.remove('editing');
    if (newVal === currentVal) {
      cell.innerHTML = currentVal || '<span style="color:var(--muted);font-style:italic">Add…</span>';
      if (!currentVal) cell.classList.add('empty');
      return;
    }
    try {
      const { error } = await supabase.from('occupants').update({ [field]: newVal || null }).eq('id', id);
      if (error) throw error;
      // Update local cache
      const idx = allOccupants.findIndex(o => o.id === id);
      if (idx !== -1) allOccupants[idx][field] = newVal || null;
      cell.innerHTML = newVal || '';
      if (!newVal) cell.classList.add('empty');
      showToast('Saved ✓');
    } catch(e) {
      showToast('Failed to save', true);
      cell.innerHTML = currentVal || '';
      if (!currentVal) cell.classList.add('empty');
    }
  };

  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { cell.classList.remove('editing'); cell.innerHTML = currentVal || ''; if (!currentVal) cell.classList.add('empty'); }
  });
};

// Add plate inline
window.addPlateInline = (id) => {
  const container = document.getElementById(`plates-${id}`);
  if (!container) return;
  const addBtn = container.querySelector('.plate-add-btn');

  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'plate-add-input';
  inp.placeholder = 'ABC123';
  inp.maxLength = 8;
  container.insertBefore(inp, addBtn);
  inp.focus();

  const confirm = async () => {
    const val = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    inp.remove();
    if (!val || val.length < 2) return;
    const occ = allOccupants.find(o => o.id === id);
    if (!occ) return;
    const existing = (occ.license_plates || '').split(',').map(p => p.trim()).filter(p => p);
    if (existing.includes(val)) { showToast('Plate already exists', true); return; }
    const newPlates = [...existing, val];
    await savePlates(id, occ, newPlates);
  };

  inp.addEventListener('blur', confirm);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
    if (e.key === 'Escape') inp.remove();
    inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });
  inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
};

// Remove plate inline
window.removePlateInline = async (id, plate) => {
  const occ = allOccupants.find(o => o.id === id);
  if (!occ) return;
  const existing = (occ.license_plates || '').split(',').map(p => p.trim()).filter(p => p);
  const newPlates = existing.filter(p => p !== plate);
  await savePlates(id, occ, newPlates);
};

// Save plates via RPC
async function savePlates(id, occ, plates) {
  const platesStr = plates.join(', ');
  const ownerName = occ.contact_person || occ.business_name || '';
  try {
    const { error } = await supabase.from('occupants').update({ license_plates: platesStr || null }).eq('id', id);
    if (error) throw error;
    await supabase.rpc('sync_vehicles', { p_unit: occ.unit, p_owner_name: ownerName, p_plates: plates });
    const idx = allOccupants.findIndex(o => o.id === id);
    if (idx !== -1) allOccupants[idx].license_plates = platesStr || null;
    // Re-render plates cell
    const container = document.getElementById(`plates-${id}`);
    if (container) {
      const badges = plates.map(p => `
        <span class="plate-badge">
          ${p}
          <button class="plate-badge-remove" onclick="removePlateInline('${id}','${p}')" title="Remove">✕</button>
        </span>`).join('');
      container.innerHTML = badges + `<button class="plate-add-btn" onclick="addPlateInline('${id}')">+ Add</button>`;
    }
    showToast('Vehicles updated ✓');
  } catch(e) {
    showToast('Failed to update vehicles', true);
  }
}
// ─────────────────────────────────────────────────────────────

// Export to Excel
// ── Bulk Invite ───────────────────────────────────────────────
let bulkInviteList = [];

window.openBulkInvite = async () => {
  const listEl = document.getElementById('bulkInviteList');
  const summaryEl = document.getElementById('bulkInviteSummary');
  const sendBtn = document.getElementById('sendBulkInviteBtn');
  listEl.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">Loading...</div>';
  summaryEl.textContent = '';
  sendBtn.disabled = true;
  openModal('bulkInviteModal');

  // 현재 profiles 이메일 (이미 계정 있는 사람)
  const { data: profiles } = await supabase.from('profiles').select('email');
  const existingEmails = new Set((profiles || []).map(p => p.email?.toLowerCase()).filter(Boolean));

  bulkInviteList = [];

  for (const occ of allOccupants) {
    // committee 스킵
    if (occ.is_committee) continue;

    // primary_email → owner
    if (occ.primary_email) {
      const email = occ.primary_email.trim().toLowerCase();
      if (email && !existingEmails.has(email)) {
        bulkInviteList.push({
          email: occ.primary_email.trim(),
          name: occ.contact_person || occ.business_name || '',
          role: 'owner',
          unit: occ.unit,
          status: 'pending'
        });
      }
    }

    // business_email → tenant (콤마 구분 여러 명)
    if (occ.business_email) {
      const emails = occ.business_email.split(',').map(e => e.trim()).filter(Boolean);
      for (const email of emails) {
        if (!existingEmails.has(email.toLowerCase())) {
          bulkInviteList.push({
            email,
            name: '',
            role: 'tenant',
            unit: occ.unit,
            status: 'pending'
          });
        }
      }
    }
  }

  // 중복 이메일 제거
  const seen = new Set();
  bulkInviteList = bulkInviteList.filter(item => {
    if (seen.has(item.email.toLowerCase())) return false;
    seen.add(item.email.toLowerCase());
    return true;
  });

  if (!bulkInviteList.length) {
    listEl.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">No new users to invite</div>';
    summaryEl.textContent = '';
    return;
  }

  const ownerCount = bulkInviteList.filter(i => i.role === 'owner').length;
  const tenantCount = bulkInviteList.filter(i => i.role === 'tenant').length;
  summaryEl.textContent = `${bulkInviteList.length} invites ready — ${ownerCount} owners · ${tenantCount} tenants (staff)`;

  listEl.innerHTML = `
    <table style="width:100%;border-collapse:collapse">
      <thead>
        <tr style="background:var(--bg)">
          <th style="padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;text-align:left;border-bottom:1px solid var(--border)">Unit</th>
          <th style="padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;text-align:left;border-bottom:1px solid var(--border)">Email</th>
          <th style="padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;text-align:left;border-bottom:1px solid var(--border)">Name</th>
          <th style="padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;text-align:left;border-bottom:1px solid var(--border)">Role</th>
        </tr>
      </thead>
      <tbody>
        ${bulkInviteList.map((item, i) => `
          <tr style="border-bottom:1px solid var(--border-light)" id="bulk-row-${i}">
            <td style="padding:9px 14px;font-size:13px;font-weight:700;color:var(--blue-600)">${item.unit}</td>
            <td style="padding:9px 14px;font-size:13px;color:var(--text)">${item.email}</td>
            <td style="padding:9px 14px;font-size:13px;color:var(--muted)">${item.name || '—'}</td>
            <td style="padding:9px 14px">
              <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;${item.role==='owner'?'background:#dbeafe;color:#1d4ed8':'background:#dcfce7;color:#15803d'}">${item.role}</span>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;

  sendBtn.disabled = false;
};

document.getElementById('sendBulkInviteBtn').addEventListener('click', async () => {
  const sendBtn = document.getElementById('sendBulkInviteBtn');
  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending...';

  let sent = 0, failed = 0;

  for (let i = 0; i < bulkInviteList.length; i++) {
    const item = bulkInviteList[i];
    const rowEl = document.getElementById(`bulk-row-${i}`);
    try {
      const { data: { session } } = await supabase.auth.getSession();
      const res = await fetch('/api/send-invite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ email: item.email, full_name: item.name || '', role: item.role, unit: item.unit })
      });
      if (!res.ok) throw new Error();
      if (rowEl) rowEl.style.background = '#f0fdf4';
      sent++;
    } catch {
      if (rowEl) rowEl.style.background = '#fef2f2';
      failed++;
    }
  }

  sendBtn.textContent = 'Done!';
  document.getElementById('bulkInviteSummary').textContent = `✅ ${sent} sent${failed > 0 ? ` · ❌ ${failed} failed` : ''}`;
  showToast(`${sent} invites sent!`);
});

// ─────────────────────────────────────────────────────────────

window.exportOccupants = () => {
  const data = (window._lastSearchResults && window._lastSearchResults.length) ? window._lastSearchResults : allOccupants;

  const rows = data.map(o => {
    const row = { 'Unit': o.unit || '' };
    if (activeCols.has('business_name')) row['Business Name'] = o.business_name || '';
    if (activeCols.has('contact')) row['Contact Person'] = o.contact_person || '';
    if (activeCols.has('primary_email')) row['Primary Email'] = o.primary_email || '';
    if (activeCols.has('business_email')) row['Business Email'] = o.business_email || '';
    if (activeCols.has('phone')) row['Phone'] = o.phone || '';
    if (activeCols.has('role')) {
      row['Role'] = o.is_committee ? ('committee' + ((o.business_email||'').trim() ? ' + tenant (staff)' : '')) : o.primary_email ? 'owner' : (o.business_email||'').trim() ? 'tenant (staff)' : '';
    }
    if (activeCols.has('vehicles')) row['License Plates'] = (o.license_plates || '').split(',').map(p => p.trim()).filter(p => p).join(', ');
    return row;
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Occupants');
  const date = new Date().toISOString().split('T')[0];
  const activeChip = document.querySelector('.filter-chip.active');
  const filterLabel = activeChip ? activeChip.dataset.filter : '';
  const suffix = filterLabel && filterLabel !== 'all' ? `_${filterLabel}` : '';
  XLSX.writeFile(wb, `Redmyre_Occupants${suffix}_${date}.xlsx`);
};

// Initial load
await loadOccupants();

// ── URL 파라미터 처리: ?unit=XXX 로 들어온 경우 자동 이동/하이라이트 ──
(function handleUnitParam() {
  const params = new URLSearchParams(window.location.search);
  const targetUnit = params.get('unit');
  if (!targetUnit) return;
  
  // 권한 체크: admin/observer/committee만
  if (!['admin','observer','committee'].includes(role)) return;

  // 유닛이 속한 level 찾기 (예: 6H → "Level 6")
  function getSuiteForUnit(unit) {
    if (unit === 'Unit 1') return 'Ground';
    const match = unit.match(/^([0-9]+)([A-H])$/i);
    if (!match) return 'External';
    const level = match[1];
    return 'Level ' + level;
  }

  const targetSuite = getSuiteForUnit(targetUnit);
  
  // Suite 탭 자동 전환
  if (targetSuite !== currentSuite) {
    const targetTab = document.querySelector(`.suite-tab[data-suite="${targetSuite}"]`);
    if (targetTab) {
      targetTab.click();
    }
  }
  
  // 렌더링 대기 후 스크롤 + 하이라이트 + 아코디언 자동 펼치기
  setTimeout(() => {
    const targetItem = document.querySelector(`.occ-item[data-unit="${targetUnit}"]`);
    if (targetItem) {
      targetItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
      targetItem.classList.add('highlight-flash');
      // 1초 후 아코디언 자동 펼치기
      setTimeout(() => {
        targetItem.classList.add('expanded');
      }, 1000);
      // 3초 후 하이라이트 제거
      setTimeout(() => targetItem.classList.remove('highlight-flash'), 3000);
    }
  }, 400);
})();
</script>
