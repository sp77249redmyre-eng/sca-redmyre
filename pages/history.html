<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature History – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-num{font-size:26px;font-weight:600;letter-spacing:-1px}
.stat-label{font-size:12px;color:var(--muted);margin-top:3px}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-select{padding:6px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text-2)}
.table-head{display:grid;grid-template-columns:160px 130px 90px 100px 100px 100px 1fr;gap:10px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--border-light)}
.th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em}
.hist-row{display:grid;grid-template-columns:160px 130px 90px 100px 100px 100px 1fr;gap:10px;padding:13px 20px;border-bottom:1px solid var(--border-light);align-items:center;transition:background 0.12s}
.hist-row:last-child{border-bottom:none}
.hist-row:hover{background:var(--bg)}
</style>
</head>
<body class="role-admin">
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div class="section-title">Temperature History</div>
      <button class="btn-danger" id="clearAllBtn">🗑 Clear All</button>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="statTotal" style="color:var(--blue-600)">—</div><div class="stat-label">Total Requests</div></div>
      <div class="stat-card"><div class="stat-num" id="statCompleted" style="color:var(--green)">—</div><div class="stat-label">Completed</div></div>
      <div class="stat-card"><div class="stat-num" id="statFailed" style="color:var(--red)">—</div><div class="stat-label">Failed / Rejected</div></div>
      <div class="stat-card"><div class="stat-num" id="statPending" style="color:var(--yellow)">—</div><div class="stat-label">Pending</div></div>
    </div>
    <div class="filter-bar">
      <select class="filter-select" id="filterStatus"><option value="all">All Status</option><option value="completed">Completed</option><option value="failed">Failed</option><option value="rejected">Rejected</option><option value="pending">Pending</option><option value="approved">Approved</option></select>
      <select class="filter-select" id="filterLevel"><option value="all">All Floors</option><option>Level 1</option><option>Level 2</option><option>Level 3</option><option>Level 4</option><option>Level 5</option><option>Level 6</option></select>
      <select class="filter-select" id="filterType"><option value="all">All Types</option><option value="hot">Too Hot</option><option value="cold">Too Cold</option></select>
      <button class="btn-secondary" id="refreshBtn">↻ Refresh</button>
    </div>
    <div class="card">
      <div class="table-head">
        <div class="th">Date / Time</div>
        <div class="th">Reported By</div>
        <div class="th">Floor</div>
        <div class="th">Tenancy</div>
        <div class="th">Type</div>
        <div class="th">Status</div>
        <div class="th">Comment</div>
      </div>
      <div id="historyList"><div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">Loading…</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '../js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase } = ctx;

const ST_CLS = { completed:'badge-green',failed:'badge-red',rejected:'badge-red',approved:'badge-yellow',pending:'badge-yellow',processing:'badge-blue' };

async function loadHistory() {
  const statusFilter = document.getElementById('filterStatus').value;
  const levelFilter  = document.getElementById('filterLevel').value;
  const typeFilter   = document.getElementById('filterType').value;
  let query = supabase.from('hvac_requests').select('*').order('created_at',{ascending:false}).limit(200);
  if (statusFilter!=='all') query = query.eq('status',statusFilter);
  if (levelFilter!=='all')  query = query.eq('level',levelFilter);
  if (typeFilter!=='all')   query = query.eq('type',typeFilter);
  const { data } = await query;
  const list = document.getElementById('historyList');
  const { data:allData } = await supabase.from('hvac_requests').select('status,type');
  if (allData) {
    document.getElementById('statTotal').textContent     = allData.length;
    document.getElementById('statCompleted').textContent = allData.filter(r=>r.status==='completed').length;
    document.getElementById('statFailed').textContent    = allData.filter(r=>r.status==='failed'||r.status==='rejected').length;
    document.getElementById('statPending').textContent   = allData.filter(r=>r.status==='pending'||r.status==='approved').length;
  }
  if (!data?.length) { list.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">No history found</div>'; return; }
  list.innerHTML = data.map(r=>`
    <div class="hist-row">
      <div style="font-size:12px;color:var(--text-2)">${new Date(r.created_at).toLocaleString('en-AU',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      <div style="font-size:13px;font-weight:500">${r.user_name||'Unknown'}</div>
      <div style="font-size:12px;color:var(--text-2)">${r.level||'—'}</div>
      <div style="font-size:12px;color:var(--text-2)">${r.tenancy||'—'}</div>
      <div style="font-size:13px">${r.type==='hot'?'🥵 Too Hot':'🥶 Too Cold'}</div>
      <span class="badge ${ST_CLS[r.status]||'badge-gray'}">${r.status||'—'}</span>
      <div style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.comment||''}">${r.comment||'—'}</div>
    </div>`).join('');
}

document.getElementById('filterStatus').addEventListener('change', loadHistory);
document.getElementById('filterLevel').addEventListener('change', loadHistory);
document.getElementById('filterType').addEventListener('change', loadHistory);
document.getElementById('refreshBtn').addEventListener('click', loadHistory);

document.getElementById('clearAllBtn').addEventListener('click', async () => {
  if (!confirm('Clear ALL temperature history?\nThis cannot be undone.')) return;
  await supabase.from('hvac_requests').delete().neq('id','00000000-0000-0000-0000-000000000000');
  showToast('History cleared');
  await loadHistory();
});

await loadHistory();
</script>
</body>
</html>
