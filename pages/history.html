<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature History – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v4.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
.analysis-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.analysis-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center}
.analysis-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px}
.analysis-value{font-size:24px;font-weight:600;margin-bottom:4px}
.analysis-count{font-size:13px;color:var(--text-2)}
.heatmap-container{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.heatmap-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.heatmap-title{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:14px}
.heatmap-bar{display:grid;grid-template-columns:80px 1fr 60px;gap:10px;align-items:center;margin-bottom:10px}
.bar-label{font-size:12px;font-weight:500;color:var(--text-2)}
.bar-fill{height:24px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11px;color:#fff;font-weight:600;transition:all 0.3s}
.bar-count{font-size:12px;font-weight:600;color:var(--text);text-align:right}
.chart-container{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px}
.chart-title{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:14px}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-select{padding:6px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text-2)}
.table-head{display:grid;grid-template-columns:160px 130px 90px 100px 100px 100px 1fr;gap:10px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--border-light)}
.th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em}
.hist-row{display:grid;grid-template-columns:160px 130px 90px 100px 100px 100px 1fr;gap:10px;padding:13px 20px;border-bottom:1px solid var(--border-light);align-items:center;transition:background 0.12s}
.hist-row:last-child{border-bottom:none}
.hist-row:hover{background:var(--bg)}

/* 모바일 최적화 */
@media(max-width:768px){
  .analysis-row{grid-template-columns:1fr;gap:10px}
  .analysis-card{padding:14px}
  .analysis-value{font-size:20px}
  .heatmap-container{grid-template-columns:1fr;gap:12px}
  .heatmap-card{padding:14px}
  .heatmap-bar{grid-template-columns:70px 1fr 50px;gap:8px;margin-bottom:8px}
  .bar-label{font-size:11px}
  .bar-fill{height:20px;font-size:10px;padding:0 6px}
  .bar-count{font-size:11px}
  .chart-container{padding:14px}
  .filter-bar{gap:6px}
  .filter-select{padding:8px 10px;font-size:13px;width:100%}
  .btn-secondary{width:100%;padding:10px;justify-content:center}
  
  /* 테이블을 카드형으로 변경 */
  .table-head{display:none}
  .hist-row{
    display:block;
    padding:14px;
    border:1px solid var(--border-light);
    border-radius:10px;
    margin-bottom:10px;
    background:var(--surface)
  }
  .hist-row:hover{background:var(--bg)}
  .hist-row > div{
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center
  }
  .hist-row > div:last-child{margin-bottom:0}
  .hist-row > div::before{
    content:attr(data-label);
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-right:10px
  }
  
  /* 헤더 버튼 */
  .content > div:first-child{
    flex-direction:column;
    align-items:stretch;
    gap:12px
  }
  #clearAllBtn{width:100%;justify-content:center}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div class="section-title">Temperature History</div>
      <button class="btn-danger" id="clearAllBtn">🗑 Clear All</button>
    </div>

    <!-- 패턴 분석 카드 -->
    <div class="analysis-row">
      <div class="analysis-card">
        <div class="analysis-label">Most Problematic</div>
        <div class="analysis-value" id="mostProblematic">—</div>
        <div class="analysis-count" id="mostProblematicCount">—</div>
      </div>
      <div class="analysis-card">
        <div class="analysis-label">Hot vs Cold</div>
        <div class="analysis-value" id="hotVsCold">—</div>
        <div class="analysis-count" id="hotVsColdRatio">—</div>
      </div>
      <div class="analysis-card">
        <div class="analysis-label">Peak Request Time</div>
        <div class="analysis-value" id="peakTime">—</div>
        <div class="analysis-count" id="peakTimeCount">—</div>
      </div>
    </div>

    <!-- 히트맵 -->
    <div class="heatmap-container">
      <div class="heatmap-card">
        <div class="heatmap-title">Most Complaints by Floor</div>
        <div id="floorHeatmap">Loading...</div>
      </div>
      <div class="heatmap-card">
        <div class="heatmap-title">Top Tenancies</div>
        <div id="tenancyHeatmap">Loading...</div>
      </div>
    </div>

    <!-- 월별 트렌드 차트 -->
    <div class="chart-container">
      <div class="chart-title">Monthly Trend (Last 12 Months)</div>
      <canvas id="monthlyChart" height="80"></canvas>
    </div>

    <div class="filter-bar">
      <select class="filter-select" id="filterStatus"><option value="all">All Status</option><option value="completed">Completed</option><option value="failed">Failed</option><option value="rejected">Rejected</option><option value="pending">Pending</option><option value="approved">Approved</option></select>
      <select class="filter-select" id="filterLevel"><option value="all">All Floors</option><option>Level 1</option><option>Level 2</option><option>Level 3</option><option>Level 4</option><option>Level 5</option><option>Level 6</option></select>
      <select class="filter-select" id="filterType"><option value="all">All Types</option><option value="hot">Too Hot</option><option value="cold">Too Cold</option></select>
      <button class="btn-secondary" id="refreshBtn">↻ Refresh</button>
    </div>
    <div class="card">
      <div class="table-head">
        <div class="th">Date / Time</div>
        <div class="th">Reported By</div>
        <div class="th">Floor</div>
        <div class="th">Tenancy</div>
        <div class="th">Type</div>
        <div class="th">Status</div>
        <div class="th">Comment</div>
      </div>
      <div id="historyList"><div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">Loading…</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '../js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase } = ctx;

const ST_CLS = { completed:'badge-green',failed:'badge-red',rejected:'badge-red',approved:'badge-yellow',pending:'badge-yellow',processing:'badge-blue' };
let monthlyChart = null;

async function loadHistory() {
  const statusFilter = document.getElementById('filterStatus').value;
  const levelFilter  = document.getElementById('filterLevel').value;
  const typeFilter   = document.getElementById('filterType').value;
  let query = supabase.from('hvac_requests').select('*').order('created_at',{ascending:false}).limit(200);
  if (statusFilter!=='all') query = query.eq('status',statusFilter);
  if (levelFilter!=='all')  query = query.eq('level',levelFilter);
  if (typeFilter!=='all')   query = query.eq('type',typeFilter);
  const { data } = await query;
  const list = document.getElementById('historyList');
  
  // 전체 데이터 가져오기 (분석용)
  const { data:allData } = await supabase.from('hvac_requests').select('*');
  
  if (allData) {
    // 1. Most Problematic Floor
    const floorCounts = {};
    allData.forEach(r => {
      if (r.level) floorCounts[r.level] = (floorCounts[r.level] || 0) + 1;
    });
    const sortedFloors = Object.entries(floorCounts).sort((a,b) => b[1] - a[1]);
    if (sortedFloors.length) {
      document.getElementById('mostProblematic').textContent = sortedFloors[0][0];
      document.getElementById('mostProblematicCount').textContent = `${sortedFloors[0][1]}건`;
    }

    // 2. Hot vs Cold
    const hotCount = allData.filter(r => r.type === 'hot').length;
    const coldCount = allData.filter(r => r.type === 'cold').length;
    const total = hotCount + coldCount;
    if (total > 0) {
      const hotPct = Math.round(hotCount / total * 100);
      const coldPct = 100 - hotPct;
      document.getElementById('hotVsCold').innerHTML = `🥵 ${hotPct}% <span style="color:var(--muted)">vs</span> 🥶 ${coldPct}%`;
      document.getElementById('hotVsColdRatio').textContent = `${hotCount} hot / ${coldCount} cold`;
    }

    // 3. Peak Request Time
    const hourCounts = {};
    allData.forEach(r => {
      const hour = new Date(r.created_at).getHours();
      hourCounts[hour] = (hourCounts[hour] || 0) + 1;
    });
    const sortedHours = Object.entries(hourCounts).sort((a,b) => b[1] - a[1]);
    if (sortedHours.length) {
      const peakHour = parseInt(sortedHours[0][0]);
      const peakCount = sortedHours[0][1];
      const timeRange = `${peakHour}:00-${peakHour+1}:00`;
      document.getElementById('peakTime').textContent = timeRange;
      document.getElementById('peakTimeCount').textContent = `${peakCount}건 (${Math.round(peakCount/allData.length*100)}%)`;
    }

    // 4. Floor Heatmap
    const floorHtml = sortedFloors.slice(0, 6).map(([floor, count]) => {
      const maxCount = sortedFloors[0][1];
      const width = Math.round(count / maxCount * 100);
      const color = count > maxCount * 0.7 ? '#ef4444' : count > maxCount * 0.4 ? '#f59e0b' : '#3b82f6';
      return `<div class="heatmap-bar">
        <div class="bar-label">${floor}:</div>
        <div class="bar-fill" style="width:${width}%;background:${color}"></div>
        <div class="bar-count">${count}건</div>
      </div>`;
    }).join('');
    document.getElementById('floorHeatmap').innerHTML = floorHtml || '<div style="color:var(--muted);font-size:12px">No data</div>';

    // 5. Tenancy Heatmap
    const tenancyCounts = {};
    allData.forEach(r => {
      if (r.tenancy) tenancyCounts[r.tenancy] = (tenancyCounts[r.tenancy] || 0) + 1;
    });
    const sortedTenancies = Object.entries(tenancyCounts).sort((a,b) => b[1] - a[1]);
    const maxTenancyCount = sortedTenancies.length ? sortedTenancies[0][1] : 1;
    const tenancyHtml = sortedTenancies.slice(0, 6).map(([tenancy, count]) => {
      const width = Math.round(count / maxTenancyCount * 100);
      const color = count > maxTenancyCount * 0.7 ? '#ef4444' : count > maxTenancyCount * 0.4 ? '#f59e0b' : '#3b82f6';
      return `<div class="heatmap-bar">
        <div class="bar-label">${tenancy}:</div>
        <div class="bar-fill" style="width:${width}%;background:${color}"></div>
        <div class="bar-count">${count}건</div>
      </div>`;
    }).join('');
    document.getElementById('tenancyHeatmap').innerHTML = tenancyHtml || '<div style="color:var(--muted);font-size:12px">No data</div>';

    // 6. Monthly Trend Chart
    const monthCounts = {};
    const now = new Date();
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      monthCounts[key] = 0;
    }
    allData.forEach(r => {
      const key = r.created_at.slice(0, 7);
      if (monthCounts.hasOwnProperty(key)) monthCounts[key]++;
    });
    const labels = Object.keys(monthCounts).map(k => {
      const [y, m] = k.split('-');
      return new Date(y, m-1).toLocaleDateString('en-AU', {month:'short'});
    });
    const values = Object.values(monthCounts);

    if (monthlyChart) monthlyChart.destroy();
    monthlyChart = new Chart(document.getElementById('monthlyChart'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Requests',
          data: values,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          tension: 0.4,
          fill: true,
          pointBackgroundColor: '#3b82f6',
          pointRadius: 4,
          pointHoverRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (context) => `${context.parsed.y}건`
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: { precision: 0 }
          }
        }
      }
    });
  }

  // 테이블 렌더링
  if (!data?.length) { list.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">No history found</div>'; return; }
  list.innerHTML = data.map(r=>`
    <div class="hist-row">
      <div data-label="Date / Time" style="font-size:12px;color:var(--text-2)">${new Date(r.created_at).toLocaleString('en-AU',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      <div data-label="Reported By" style="font-size:13px;font-weight:500">${r.user_name||'Unknown'}</div>
      <div data-label="Floor" style="font-size:12px;color:var(--text-2)">${r.level||'—'}</div>
      <div data-label="Tenancy" style="font-size:12px;color:var(--text-2)">${r.tenancy||'—'}</div>
      <div data-label="Type" style="font-size:13px">${r.type==='hot'?'🥵 Too Hot':'🥶 Too Cold'}</div>
      <div data-label="Status"><span class="badge ${ST_CLS[r.status]||'badge-gray'}">${r.status||'—'}</span></div>
      <div data-label="Comment" style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.comment||''}">${r.comment||'—'}</div>
    </div>`).join('');
}

document.getElementById('filterStatus').addEventListener('change', loadHistory);
document.getElementById('filterLevel').addEventListener('change', loadHistory);
document.getElementById('filterType').addEventListener('change', loadHistory);
document.getElementById('refreshBtn').addEventListener('click', loadHistory);

document.getElementById('clearAllBtn').addEventListener('click', async () => {
  if (!confirm('Clear ALL temperature history?\nThis cannot be undone.')) return;
  await supabase.from('hvac_requests').delete().neq('id','00000000-0000-0000-0000-000000000000');
  showToast('History cleared');
  await loadHistory();
});

await loadHistory();
</script>
</body>
</html>
