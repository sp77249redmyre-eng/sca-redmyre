<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v4.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<link rel="stylesheet" href="/css/pages/announcements.css?v=announcements-css-20261107">



















</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
<div class="content">

<!-- Page Header -->
<div class="page-header">
<div class="page-header-icon">
<svg viewBox="0 0 24 24"><path d="M18 8a4 4 0 0 1 0 8"/><path d="M20 5a8 8 0 0 1 0 14"/><rect x="2" y="9" width="6" height="6" rx="1"/><path d="M8 9l8-6v18L8 15"/></svg>
</div>
<div class="page-header-body">
<div class="page-header-title-row">
<div style="display:flex;align-items:center;gap:10px;min-width:0">
<span class="page-header-title">Announcements</span>

</div>
</div>
<div class="page-header-sub">Important notices and updates from building management.</div>
</div>
</div>
<div class="filter-bar" style="margin-top:14px;margin-bottom:10px">
<button id="addAnnBtn" style="display:none;background:#2563eb;color:#fff;padding:8px 14px;border:none;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif">+ New Announcement</button>
<button class="filter-btn active" data-filter="all" id="activeFilterBtn">Active</button>
<button class="filter-btn" data-filter="archived" id="archivedFilterBtn">📦 Archived</button>
</div>
<div class="ann-list" id="annList">
<div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">Loading…</div>
</div>
</div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="annModal">
<div class="modal-box">
<div class="modal-title" id="annModalTitle">New Announcement</div>
<input type="hidden" id="annEditId">
<div class="modal-field">
<label class="modal-label">Title</label>
<input class="modal-input" id="annTitle" placeholder="Announcement title…">
</div>
<div class="modal-field">
<label class="modal-label">Content</label>
<div id="annContentEditor"></div>
<textarea class="modal-textarea" id="annContent" style="display:none" aria-hidden="true"></textarea>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="modal-field">
<label class="modal-label">Category</label>
<select class="modal-select" id="annCategory">
<option value="urgent">🚨 Urgent</option>
<option value="maintenance">🔧 Maintenance</option>
<option value="reminder">🔔 Reminder</option>
</select>
</div>
<div class="modal-field">
<label class="modal-label">Pin to top</label>
<label class="pin-toggle" id="pinToggle">
<input type="checkbox" id="annPinned">
<span id="pinLabel" style="font-size:13px;font-weight:500">Pin this announcement</span>
</label>
<label class="archive-toggle" id="archiveToggle">
<input type="checkbox" id="annArchived">
<span id="archiveLabel" style="font-size:13px;font-weight:500">📦 Archive this announcement</span>
</label>
</div>
</div>
<div class="modal-field">
<label class="modal-label">Schedule (optional)</label>
<label class="schedule-toggle" id="scheduleToggle">
<input type="checkbox" id="annScheduled">
<span id="scheduleLabel" style="font-size:13px;font-weight:500">🕐 Schedule for later</span>
</label>
<div class="schedule-fields" id="scheduleFields">
<div style="font-size:11px;color:#7c3aed;font-weight:600;margin-bottom:8px">Sydney time (AEST/AEDT)</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div>
<label style="font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px">Date</label>
<input type="date" id="scheduleDate" class="modal-input" style="font-size:14px">
</div>
<div>
<label style="font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px">Time</label>
<input type="time" id="scheduleTime" class="modal-input" style="font-size:14px">
</div>
</div>
<div id="schedulePreview" style="margin-top:8px;font-size:12px;color:#7c3aed;font-weight:500"></div>
</div>
</div>
<div class="modal-field">
<label class="modal-label">Attachments (optional)</label>
<div style="display:flex;gap:10px;margin-top:4px">
<button type="button" id="annCameraBtn" style="flex:1;padding:10px;border:2px dashed var(--border);border-radius:10px;background:var(--bg);cursor:pointer;font-size:12px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:5px;transition:all 0.15s" onmouseover="this.style.borderColor='var(--blue-600)'" onmouseout="this.style.borderColor='var(--border)'">
<span style="font-size:20px">📷</span><span>Camera</span>
</button>
<button type="button" id="annFileBtn" style="flex:1;padding:10px;border:2px dashed var(--border);border-radius:10px;background:var(--bg);cursor:pointer;font-size:12px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:5px;transition:all 0.15s" onmouseover="this.style.borderColor='var(--blue-600)'" onmouseout="this.style.borderColor='var(--border)'">
<span style="font-size:20px">📁</span><span>Browse File</span>
</button>
</div>
<input type="file" id="annInputCamera" accept="image/*" capture="environment" style="display:none">
<input type="file" id="annInputFile" accept="image/*,application/pdf" multiple style="display:none">
<div id="annExistingAttach" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
<div id="annAttachPreview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px"></div>
<div id="annAttachCount" style="font-size:11px;color:var(--muted);margin-top:4px;display:none"></div>
</div>
<div style="margin:0 0 4px;padding:12px;background:#f8fafc;border:0.5px solid var(--border-light);border-radius:8px">
<div style="font-size:11px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:5px">🧪 Test send — preview before publishing (no save, no push)</div>
<div style="display:flex;gap:8px">
<input type="text" id="annTestEmail" placeholder="sp77249.redmyre@gmail.com (default)" style="flex:1;border:0.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;background:#fff;color:var(--text)">
<button type="button" class="btn-secondary" style="white-space:nowrap" id="annTestBtn">Send test</button>
</div>
<div style="font-size:11px;color:var(--muted);margin-top:6px">Leave blank to send to yourself.</div>
</div>

<div class="modal-footer">
<button class="btn-danger" id="deleteAnnBtn" style="display:none;margin-right:auto">Delete</button>
<button class="btn-secondary" onclick="closeModal('annModal')">Cancel</button>
<button class="btn-primary" id="saveAnnBtn">Save →</button>
</div>
</div>
</div>
<div class="toast" id="toast"></div>

<!-- 첨부파일 모달 -->
<div id="attachModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;flex-direction:column" onclick="if(event.target===this)closeAttachModal()">
<div style="position:absolute;top:16px;right:20px;display:flex;gap:12px;align-items:center">
<a id="attachDownload" href="" download style="color:#fff;font-size:13px;padding:6px 14px;border:1px solid rgba(255,255,255,0.4);border-radius:8px;text-decoration:none">⬇ Download</a>
<button onclick="closeAttachModal()" style="background:none;border:none;color:#fff;font-size:28px;cursor:pointer;line-height:1">&times;</button>
</div>
<div id="attachContent" style="max-width:90vw;max-height:88vh;overflow:auto;display:flex;align-items:center;justify-content:center"></div>
</div>

<div class="modal-backdrop" id="annDetailModal" onclick="if(event.target===this)closeModal('annDetailModal')">
<div class="modal-box" style="max-width:1500px;width:97%;max-height:94vh;overflow-y:auto;padding:18px">
<div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:4px">
<button onclick="closeModal('annDetailModal')" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1">&times;</button>
</div>
<div id="annDetailBody" style="overflow:hidden;word-break:break-word;overflow-wrap:anywhere;contain:layout style"></div>
</div>
</div>

<div class="modal-backdrop" id="viewedModal" onclick="if(event.target===this)closeModal('viewedModal')">
<div class="modal-box" style="max-width:480px">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
<div class="modal-title" style="margin-bottom:0">👀 Read Status</div>
<button onclick="closeModal('viewedModal')" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1">&times;</button>
</div>
<div id="viewedAnnTitle" style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:16px;padding:10px 14px;background:var(--bg);border-radius:8px"></div>
<div style="display:flex;gap:8px;margin-bottom:14px">
<button class="btn-pill btn-pill-active" id="viewedTabNotRead" onclick="switchViewedTab('notread')">🔴 Not Read</button>
<button class="btn-pill" id="viewedTabRead" onclick="switchViewedTab('read')">✅ Read</button>
</div>
<div id="viewedList" style="max-height:340px;overflow-y:auto"></div>
<div id="viewedReminderWrap" style="margin-top:14px;display:none">
<button class="btn-primary" id="sendReminderBtn" onclick="sendReminder()" style="width:100%">🔔 Send Reminder to Unread Users</button>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script type="module" src="/js/announcements.js"></script>
</body>
</html>
