<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v4.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.content{
  padding:10px 14px 20px;
  box-sizing:border-box;
  min-height:calc(100vh - 56px);
  height:auto;
  overflow:visible;
}
.ann-list{display:block;}
.filter-bar{display:flex;align-items:center;gap:8px;}
.ann-active-shell{
  display:grid;
  grid-template-columns:minmax(0,1fr) 410px;
  gap:14px;
  background:var(--surface);
  border:1.5px solid #bfdbfe;
  border-radius:14px;
  padding:9px;
  box-sizing:border-box;
}
.ann-main-card{
  min-width:0;
  background:#fff;
  border:1px solid #dbeafe;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(15,23,42,.04);
}
.ann-hero{
  background:linear-gradient(135deg,#1e3a8a,#1d4ed8);
  color:#fff;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.ann-hero-left{display:flex;align-items:center;gap:11px;min-width:0;}
.ann-hero-icon{font-size:25px;line-height:1;flex-shrink:0;}
.ann-hero-title{font-size:19px;font-weight:800;line-height:1.18;word-break:break-word;}
.ann-hero-meta{font-size:11px;font-weight:600;margin-top:3px;opacity:.95;}
.ann-hero-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:6px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.18);
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  flex-shrink:0;
}
.ann-body-wrap{padding:15px 17px 18px;min-width:0;overflow:visible;}
.ann-body{
  font-size:14px;
  color:#374151;
  line-height:1.48;
  overflow:visible;
  word-break:break-word;
  overflow-wrap:anywhere;
}
.ann-body p{margin:5px 0 !important;}
.ann-body h1,.ann-body h2,.ann-body h3,.ann-body h4,.ann-body h5,.ann-body h6{
  margin:6px 0 5px !important;
}
.ann-body table{
  border-collapse:collapse !important;
  width:100% !important;
  max-width:100% !important;
}
.ann-body th,.ann-body td{
  padding:5px 7px !important;
  line-height:1.18 !important;
}
.ann-body img{max-width:100%;height:auto;}
.ann-body ul,.ann-body ol{margin:5px 0 !important;padding-left:20px !important;}
.ann-body li{margin:2px 0 !important;}

.ann-side{display:flex;flex-direction:column;gap:10px;min-width:0;}
.ann-side-card{
  background:#f8fafc;
  border:1px solid #dbe5f0;
  border-radius:14px;
  padding:16px;
  min-width:0;
}
.ann-attachment-card{
  background:linear-gradient(180deg,#f8fbff 0%,#eef6ff 100%);
  border:1.5px solid #93c5fd;
  box-shadow:0 3px 12px rgba(37,99,235,.07);
}
.ann-attachment-heading{
  margin-bottom:12px;
  font-size:17px;
  line-height:1.2;
  color:#0f172a;
}
.ann-attachment-heading .ann-paperclip{
  font-size:22px;
  line-height:1;
}
.ann-attachment-chip{
  margin-left:auto;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 11px;
  border-radius:999px;
  background:#2563eb;
  color:#fff;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  box-shadow:0 2px 6px rgba(37,99,235,.18);
}
.ann-side-title{
  font-size:17px;
  font-weight:800;
  color:#0f172a;
  margin-bottom:11px;
  display:flex;
  align-items:center;
  gap:8px;
}
.ann-details-icon{
  width:22px;
  height:22px;
  border-radius:5px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#0ea5e9;
  color:#fff;
  font-size:13px;
  font-weight:900;
  flex-shrink:0;
}
.ann-attachment-list{display:flex;flex-direction:column;gap:9px;}
.ann-attachment{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  background:linear-gradient(90deg,#fff8f8 0%,#fff 100%);
  border:1.5px solid #fecaca;
  border-radius:11px;
  text-decoration:none;
  color:#0f172a;
  cursor:pointer;
  min-width:0;
  box-shadow:0 1px 5px rgba(15,23,42,.04);
}
.ann-attachment:hover{border-color:#2563eb;background:#eff6ff;}
.ann-pdf-icon{
  width:48px;
  height:54px;
  border-radius:8px;
  background:#fee2e2;
  color:#dc2626;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  flex-shrink:0;
  border:1px solid #fecaca;
}
.ann-attachment-name{
  display:-webkit-box;
  min-width:0;
  width:100%;
  font-size:14px;
  font-weight:800;
  line-height:1.3;
  color:#0f172a;
  overflow:hidden;
  text-overflow:ellipsis;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
}
.ann-attachment-size{display:block;font-size:12px;color:#64748b;margin-top:4px;font-weight:600;}
.ann-download{
  margin-left:auto;
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eff6ff;
  color:#2563eb;
  font-size:23px;
  font-weight:800;
  flex-shrink:0;
}
.ann-info-row{
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:10px 0;
  border-bottom:1px solid #dbe3ef;
  font-size:14px;
}
.ann-info-row:last-child{border-bottom:0;padding-bottom:0;}
.ann-info-label{color:#64748b;min-width:88px;font-weight:700;}
.ann-info-value{color:#0f172a;font-weight:800;word-break:break-word;}
.ann-admin-title{
  font-size:18px;
  font-weight:800;
  color:#0f172a;
  margin-bottom:13px;
  display:flex;
  align-items:center;
  gap:8px;
}
.ann-admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.ann-admin-actions button{min-height:48px;font-size:15px !important;font-weight:700 !important;padding:10px 12px !important;}
.ann-admin-actions .wide{grid-column:1/-1;}
.ann-admin-actions .ann-resend-btn{
  background:#fff7ed !important;
  border:1.5px solid #fdba74 !important;
  color:#c2410c !important;
}
.ann-admin-actions .ann-resend-btn:hover{
  background:#ffedd5 !important;
  border-color:#f97316 !important;
}
.ann-resend-warning{
  grid-column:1/-1;
  margin-top:-2px;
  margin-bottom:1px;
  padding:9px 11px;
  background:#fff7ed;
  border:1px solid #fed7aa;
  border-radius:8px;
  color:#9a3412;
  font-size:12px;
  line-height:1.35;
  font-weight:700;
}
.ann-test-box{
  margin-top:12px;
  padding:12px;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:10px;
}
.ann-test-box input{width:100%;box-sizing:border-box;margin-bottom:8px;font-size:14px !important;min-height:42px;padding:9px 11px !important;}
.ann-test-box button{width:100%;min-height:42px;font-size:14px !important;font-weight:700 !important;}

.ann-archived-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  background:#fff;
  border:1px solid #dbe3ef;
  border-radius:12px;
  padding:8px;
}
.ann-archived-row{
  display:grid;
  grid-template-columns:34px minmax(0,1fr) 150px 24px;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:9px;
  cursor:pointer;
  transition:.15s;
}
.ann-archived-row:hover{background:#eff6ff;border-color:#bfdbfe;}
.ann-archived-icon{font-size:16px;text-align:center;}
.ann-archived-title{
  font-size:13px;
  font-weight:700;
  color:#334155;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ann-archived-date{font-size:11px;color:#64748b;text-align:right;white-space:nowrap;}
.ann-archived-arrow{font-size:18px;color:#94a3b8;text-align:center;}
.ann-archived-empty{
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
}

.ann-modal-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 390px;
  gap:16px;
}
.ann-modal-side{display:flex;flex-direction:column;gap:12px;}
#annDetailModal .modal-box{
  max-width:1500px !important;
  width:97% !important;
  max-height:94vh !important;
  overflow-y:auto;
  padding:18px !important;
}
#annDetailModal .ann-side-card{padding:14px;}
#annDetailModal .ann-side-title{font-size:13px;}
#annDetailModal .ann-attachment-name{font-size:13px;}
#annDetailModal .ann-info-row{font-size:12px;}

/* Compact notification control — replaces the old full-width banner */
.ann-notification-btn{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 10px;
  border:1px solid #93c5fd;
  border-radius:999px;
  background:#eff6ff;
  color:#1d4ed8;
  font-family:'DM Sans',sans-serif;
  font-size:11px;
  font-weight:700;
  line-height:1;
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s ease;
}
.ann-notification-btn:hover{background:#dbeafe;border-color:#60a5fa;}
.ann-notification-btn:active{transform:translateY(1px);}

@media(max-width:1200px){
  .ann-active-shell{grid-template-columns:minmax(0,1fr) 380px;}
  .ann-modal-layout{grid-template-columns:minmax(0,1fr) 360px;}
}
@media(max-width:900px){
  .content{height:auto;min-height:0;overflow:visible;}
  .ann-active-shell{grid-template-columns:1fr;padding:7px;}
  .ann-side{display:block;}
  .ann-side-card{margin-top:10px;}
  .ann-hero{align-items:flex-start;padding:12px;}
  .ann-hero-title{font-size:17px;}
  .ann-body-wrap{padding:12px;}
  .ann-archived-row{grid-template-columns:28px minmax(0,1fr) 22px;}
  .ann-archived-date{display:none;}
  .ann-admin-actions{grid-template-columns:1fr;}
  .ann-admin-actions .wide{grid-column:auto;}
  .ann-modal-layout{grid-template-columns:1fr;}
  #annDetailModal .modal-box{width:96% !important;max-height:94vh !important;}
}
</style>

<style id="announcements-viewport-fit">
/* Natural page scrolling is intentional: long announcements must remain fully readable. */
html,body{overflow:auto;}
.main{min-height:100vh;overflow:visible;}
</style>

</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-header-icon">
        <svg viewBox="0 0 24 24"><path d="M18 8a4 4 0 0 1 0 8"/><path d="M20 5a8 8 0 0 1 0 14"/><rect x="2" y="9" width="6" height="6" rx="1"/><path d="M8 9l8-6v18L8 15"/></svg>
      </div>
      <div class="page-header-body">
        <div class="page-header-title-row">
          <div style="display:flex;align-items:center;gap:10px;min-width:0">
            <span class="page-header-title">Announcements</span>
            <button type="button" class="ann-notification-btn" id="enablePushBtn" style="display:none">🔔 Enable notifications</button>
          </div>
        </div>
        <div class="page-header-sub">Important notices and updates from building management.</div>
      </div>
    </div>
    <div class="filter-bar" style="margin-top:14px;margin-bottom:10px">
      <button class="filter-btn active" data-filter="all" id="activeFilterBtn">Active</button>
      <button id="addAnnBtn" style="display:none;background:#2563eb;color:#fff;padding:8px 14px;border:none;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif">+ New Announcement</button>
      <button class="filter-btn" data-filter="archived" id="archivedFilterBtn">📦 Archived</button>
    </div>
    <div class="ann-list" id="annList">
      <div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">Loading…</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="annModal">
  <div class="modal-box">
    <div class="modal-title" id="annModalTitle">New Announcement</div>
    <input type="hidden" id="annEditId">
    <div class="modal-field">
      <label class="modal-label">Title</label>
      <input class="modal-input" id="annTitle" placeholder="Announcement title…">
    </div>
    <div class="modal-field">
      <label class="modal-label">Content</label>
      <textarea class="modal-textarea" id="annContent" style="min-height:160px" placeholder="Write your announcement here…"></textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="modal-field">
        <label class="modal-label">Category</label>
        <select class="modal-select" id="annCategory">
          <option value="urgent">🚨 Urgent</option>
          <option value="maintenance">🔧 Maintenance</option>
          <option value="reminder">🔔 Reminder</option>
        </select>
      </div>
      <div class="modal-field">
        <label class="modal-label">Pin to top</label>
        <label class="pin-toggle" id="pinToggle">
          <input type="checkbox" id="annPinned">
          <span id="pinLabel" style="font-size:13px;font-weight:500">Pin this announcement</span>
        </label>
        <label class="archive-toggle" id="archiveToggle">
          <input type="checkbox" id="annArchived">
          <span id="archiveLabel" style="font-size:13px;font-weight:500">📦 Archive this announcement</span>
        </label>
      </div>
    </div>
    <div class="modal-field">
      <label class="modal-label">Schedule (optional)</label>
      <label class="schedule-toggle" id="scheduleToggle">
        <input type="checkbox" id="annScheduled">
        <span id="scheduleLabel" style="font-size:13px;font-weight:500">🕐 Schedule for later</span>
      </label>
      <div class="schedule-fields" id="scheduleFields">
        <div style="font-size:11px;color:#7c3aed;font-weight:600;margin-bottom:8px">Sydney time (AEST/AEDT)</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>
            <label style="font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px">Date</label>
            <input type="date" id="scheduleDate" class="modal-input" style="font-size:14px">
          </div>
          <div>
            <label style="font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px">Time</label>
            <input type="time" id="scheduleTime" class="modal-input" style="font-size:14px">
          </div>
        </div>
        <div id="schedulePreview" style="margin-top:8px;font-size:12px;color:#7c3aed;font-weight:500"></div>
      </div>
    </div>
    <div class="modal-field">
      <label class="modal-label">Attachments (optional)</label>
      <div style="display:flex;gap:10px;margin-top:4px">
        <button type="button" id="annCameraBtn" style="flex:1;padding:10px;border:2px dashed var(--border);border-radius:10px;background:var(--bg);cursor:pointer;font-size:12px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:5px;transition:all 0.15s" onmouseover="this.style.borderColor='var(--blue-600)'" onmouseout="this.style.borderColor='var(--border)'">
          <span style="font-size:20px">📷</span><span>Camera</span>
        </button>
        <button type="button" id="annFileBtn" style="flex:1;padding:10px;border:2px dashed var(--border);border-radius:10px;background:var(--bg);cursor:pointer;font-size:12px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:5px;transition:all 0.15s" onmouseover="this.style.borderColor='var(--blue-600)'" onmouseout="this.style.borderColor='var(--border)'">
          <span style="font-size:20px">📁</span><span>Browse File</span>
        </button>
      </div>
      <input type="file" id="annInputCamera" accept="image/*" capture="environment" style="display:none">
      <input type="file" id="annInputFile" accept="image/*,application/pdf" multiple style="display:none">
      <div id="annExistingAttach" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
      <div id="annAttachPreview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px"></div>
      <div id="annAttachCount" style="font-size:11px;color:var(--muted);margin-top:4px;display:none"></div>
    </div>

    <div style="margin:0 0 4px;padding:12px;background:#f8fafc;border:0.5px solid var(--border-light);border-radius:8px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:5px">🧪 Test send — preview before publishing (no save, no push)</div>
      <div style="display:flex;gap:8px">
        <input type="text" id="annTestEmail" placeholder="sp77249.redmyre@gmail.com (default)" style="flex:1;border:0.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;background:#fff;color:var(--text)">
        <button type="button" class="btn-secondary" style="white-space:nowrap" id="annTestBtn">Send test</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px">Leave blank to send to yourself.</div>
    </div>

    <div class="modal-footer">
      <button class="btn-danger" id="deleteAnnBtn" style="display:none;margin-right:auto">Delete</button>
      <button class="btn-secondary" onclick="closeModal('annModal')">Cancel</button>
      <button class="btn-primary" id="saveAnnBtn">Save →</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- 첨부파일 모달 -->
<div id="attachModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;flex-direction:column" onclick="if(event.target===this)closeAttachModal()">
  <div style="position:absolute;top:16px;right:20px;display:flex;gap:12px;align-items:center">
    <a id="attachDownload" href="" download style="color:#fff;font-size:13px;padding:6px 14px;border:1px solid rgba(255,255,255,0.4);border-radius:8px;text-decoration:none">⬇ Download</a>
    <button onclick="closeAttachModal()" style="background:none;border:none;color:#fff;font-size:28px;cursor:pointer;line-height:1">&times;</button>
  </div>
  <div id="attachContent" style="max-width:90vw;max-height:88vh;overflow:auto;display:flex;align-items:center;justify-content:center"></div>
</div>

<div class="modal-backdrop" id="annDetailModal" onclick="if(event.target===this)closeModal('annDetailModal')">
  <div class="modal-box" style="max-width:1500px;width:97%;max-height:94vh;overflow-y:auto;padding:18px">
    <div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:4px">
      <button onclick="closeModal('annDetailModal')" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1">&times;</button>
    </div>
    <div id="annDetailBody" style="overflow:hidden;word-break:break-word;overflow-wrap:anywhere;contain:layout style"></div>
  </div>
</div>

<div class="modal-backdrop" id="viewedModal" onclick="if(event.target===this)closeModal('viewedModal')">
  <div class="modal-box" style="max-width:480px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div class="modal-title" style="margin-bottom:0">👀 Read Status</div>
      <button onclick="closeModal('viewedModal')" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1">&times;</button>
    </div>
    <div id="viewedAnnTitle" style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:16px;padding:10px 14px;background:var(--bg);border-radius:8px"></div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn-pill btn-pill-active" id="viewedTabNotRead" onclick="switchViewedTab('notread')">🔴 Not Read</button>
      <button class="btn-pill" id="viewedTabRead" onclick="switchViewedTab('read')">✅ Read</button>
    </div>
    <div id="viewedList" style="max-height:340px;overflow-y:auto"></div>
    <div id="viewedReminderWrap" style="margin-top:14px;display:none">
      <button class="btn-primary" id="sendReminderBtn" onclick="sendReminder()" style="width:100%">🔔 Send Reminder to Unread Users</button>
    </div>
  </div>
</div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role, name } = ctx;
async function logActivity(action, record_id = null) {
  try {
    if (role === 'admin') return;
    await supabase.from('audit_logs').insert({
      user_email: user.email,
      user_role: role,
      action,
      record_id,
      created_at: new Date().toISOString()
    });
  } catch (e) {}
}
window.logActivity = logActivity;

if (role === 'admin') document.getElementById('addAnnBtn').style.display = 'inline-flex';

async function loadAnnouncements() {
  const { data } = await supabase.from('announcements').select('*').order('pinned',{ascending:false}).order('created_at',{ascending:false});
  allAnns = data || [];

  if (role === 'admin') {
    const { data: profiles } = await supabase.from('profiles').select('email, full_name, role').neq('role', 'admin');
    allProfilesList = profiles || [];

    const { data: logs } = await supabase.from('audit_logs').select('user_email, record_id').eq('action', 'ANNOUNCEMENT_VIEWED').not('record_id', 'is', null);
    viewedMap = {};
    (logs || []).forEach(l => {
      if (!l.record_id) return;
      if (!viewedMap[l.record_id]) viewedMap[l.record_id] = new Set();
      viewedMap[l.record_id].add(l.user_email);
    });
  }

  renderAnns();
}

function normalizeText(value) {
  return String(value || '')
    .replace(/\u00a0/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}

function renderAnnouncementContent(a) {
  const raw = a.content || '';
  const hasHTML = /<[a-z][\s\S]*>/i.test(raw);
  const titleText = normalizeText(a.title);

  if (!hasHTML) {
    const text = raw.trim();
    if (titleText) {
      const lines = text.split(/\r?\n/);
      if (lines.length && normalizeText(lines[0]) === titleText) {
        return lines.slice(1).join('\n')
          .replace(/&/g,'&amp;')
          .replace(/</g,'&lt;')
          .replace(/>/g,'&gt;')
          .replace(/\n/g,'<br>');
      }
    }
    return text
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/\n/g,'<br>');
  }

  try {
    const holder = document.createElement('div');
    holder.innerHTML = raw;

    if (titleText) {
      // The announcement content can itself be a complete email-style
      // table with a blue title/header row. The page already supplies the
      // title once, so remove only that first header row while preserving
      // the rest of the table and all body content.
      const topTables = Array.from(holder.children).filter(el => el.tagName === 'TABLE');

      for (const table of topTables.slice(0, 3)) {
        const rows = Array.from(table.querySelectorAll(':scope > tbody > tr, :scope > tr'));
        if (!rows.length) continue;

        const firstRow = rows[0];
        const firstRowText = normalizeText(firstRow.textContent);

        if (firstRowText.startsWith(titleText)) {
          firstRow.remove();
          break;
        }

        // Some editors add a wrapper table before the actual notice table.
        const nestedTables = Array.from(table.querySelectorAll('table'));
        for (const nested of nestedTables.slice(0, 4)) {
          const nestedRows = Array.from(nested.querySelectorAll(':scope > tbody > tr, :scope > tr'));
          if (!nestedRows.length) continue;

          const nestedFirstRow = nestedRows[0];
          if (normalizeText(nestedFirstRow.textContent).startsWith(titleText)) {
            nestedFirstRow.remove();
            break;
          }
        }

        if (!holder.querySelector(`table`)) break;
      }
    }

    return holder.innerHTML;
  } catch (e) {
    return raw;
  }
}

function formatAttachmentSize(bytes) {
  const n = Number(bytes || 0);
  if (!n) return '';
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${Math.round(n / 1024)} KB`;
  return `${(n / (1024 * 1024)).toFixed(1)} MB`;
}

function updateSchedulePreview() {

  if (d && t) {

    document.getElementById('schedulePreview').textContent = '📅 Will send: ' + formatSydneyTime(utc);
  }
}

// Sydney timezone helpers
function sydneyInputToUTC(dateStr, timeStr) {
  // dateStr: 'YYYY-MM-DD', timeStr: 'HH:MM'
  // Sydney local time → UTC using Intl API (browser-timezone independent)
  const [year, month, day] = dateStr.split('-').map(Number);
  const [hour, minute] = timeStr.split(':').map(Number);
  // Binary search for the UTC ms that corresponds to this Sydney local time
  // Start with UTC-10 estimate
  let utcMs = Date.UTC(year, month - 1, day, hour - 10, minute, 0);
  for (let i = 0; i < 3; i++) {
    const parts = new Intl.DateTimeFormat('en-AU', {
      timeZone: 'Australia/Sydney',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false
    }).formatToParts(new Date(utcMs));
    const get = (t) => parseInt(parts.find(p => p.type === t)?.value || '0');
    const diffH = hour - get('hour');
    const diffM = minute - get('minute');
    utcMs -= (diffH * 60 + diffM) * 60000;
  }
  return new Date(utcMs).toISOString();
}

function getSydneyOffset(isoString) {
  const d = new Date(isoString || Date.now());
  const fmt = new Intl.DateTimeFormat('en-AU', { timeZone: 'Australia/Sydney', timeZoneName: 'shortOffset' });
  const parts = fmt.formatToParts(d);
  const tzPart = parts.find(p => p.type === 'timeZoneName')?.value || '+10:00';
  const match = tzPart.match(/([+-])(\d+)(?::(\d+))?/);
  if (!match) return 10 * 60;
  const sign = match[1] === '+' ? 1 : -1;
  return sign * (parseInt(match[2]) * 60 + parseInt(match[3] || 0));
}

function toSydneyInputValues(isoString) {
  const d = new Date(isoString);
  const offsetMins = getSydneyOffset(isoString);
  const sydMs = d.getTime() + offsetMins * 60000;
  const syd = new Date(sydMs);
  const pad = n => String(n).padStart(2,'0');
  return {
    date: `${syd.getUTCFullYear()}-${pad(syd.getUTCMonth()+1)}-${pad(syd.getUTCDate())}`,
    time: `${pad(syd.getUTCHours())}:${pad(syd.getUTCMinutes())}`
  };
}

function formatSydneyTime(isoString) {
  return new Date(isoString).toLocaleString('en-AU', {
    timeZone: 'Australia/Sydney',
    weekday: 'short', day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit', hour12: true
  });
}

function annRenderExisting() {
  const grid = document.getElementById('annExistingAttach');
  if (!grid) return;
  grid.innerHTML = '';
  existingAttachments.forEach((att, idx) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:12px;max-width:180px';
    const isPdf = att.type === 'application/pdf';
    if (isPdf) {
      wrap.innerHTML = `<span style="font-size:16px">📄</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${att.name}</span><button type="button" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:14px;font-weight:700;padding:0;flex-shrink:0">✕</button>`;
    } else {
      wrap.innerHTML = `<img src="${att.url}" style="width:48px;height:48px;object-fit:cover;border-radius:6px"><button type="button" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;font-size:10px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>`;
    }
    wrap.querySelector('button').addEventListener('click', () => {
      existingAttachments.splice(idx, 1);
      annRenderExisting();
      annUpdateCount();
    });
    grid.appendChild(wrap);
  });
  annUpdateCount();
}

function annUpdateCount() {
  const countEl = document.getElementById('annAttachCount');
  const total = existingAttachments.length + annFiles.length;
  if (total > 0) {

function annUpdatePreview() {
  const grid = document.getElementById('annAttachPreview');

    wrap.style.cssText = 'position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:12px;max-width:180px';

function annHandleFiles(files) {
  for (const file of files) {
    if (existingAttachments.length + annFiles.length >= ANN_MAX_FILES) { showToast(`Max ${ANN_MAX_FILES} files allowed`, true); break; }
    if (file.size > ANN_MAX_SIZE) { showToast(`${file.name} exceeds 10MB`, true); continue; }
    annFiles.push(file);
  }
  annUpdatePreview();
  annUpdateButtons();
}

    list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">${currentViewedTab==='read'?'No one has read this yet':'Everyone has read this! 🎉'}</div>`;

  }

    const initials = (p.full_name||'?').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);

    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:0.5px solid var(--border-light)">

      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.full_name||p.email}</div>
        <div style="font-size:11px;color:var(--muted)">${roleLabel}</div>
      </div>

    </div>`;
  }).join('');

}

window.sendReminder = async function() {
  const a = allAnns.find(x => x.id === currentViewedAnnId);
  if (!a) return;
  const viewed = viewedMap[currentViewedAnnId] || new Set();
  const notReadUsers = allProfilesList.filter(p => !viewed.has(p.email));
  if (!notReadUsers.length) { showToast('Everyone has read this!'); return; }
  if (!confirm(`Send reminder push to ${notReadUsers.length} user(s) who haven't read this?`)) return;
  const btn = document.getElementById('sendReminderBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const { data: notReadProfiles } = await supabase.from('profiles').select('id').in('email', notReadUsers.map(u=>u.email));
    const ids = (notReadProfiles||[]).map(p=>p.id);
    if (ids.length) {
      const { data:{ session: pushSession } } = await supabase.auth.getSession();
      for (const uid of ids) {
        await fetch('/api/send-push', {
          method:'POST',
          headers:{ 'Content-Type':'application/json','Authorization':`Bearer ${pushSession.access_token}` },
          body: JSON.stringify({ user_id: uid, title:'📢 Reminder: ' + a.title, message:'Please check the latest announcement', url:'/pages/announcements.html' })
        });
      }
    }
    showToast(`Reminder sent to ${notReadUsers.length} user(s) ✓`);
  } catch(e) { showToast('Failed to send reminder', true); }
  finally { btn.disabled = false; btn.textContent = '🔔 Send Reminder to Unread Users'; }
};

// Push Notifications
const VAPID_PUBLIC_KEY = 'BNyzSuyh9RRzRLNiPq1mngiuEH35QX3smFJoYQGWdOSdu_4koNy4s65I8WUpI1gxanRgJLNU0gDJfhW1PUdxQrI';
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4-base64String.length%4)%4);
  const base64 = (base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i=0;i<rawData.length;++i) outputArray[i]=rawData.charCodeAt(i);
  return outputArray;
}
let swRegistration = null;
async function initServiceWorker() {
  const btn = document.getElementById('enablePushBtn');
  if (!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)) {
    if (btn) btn.style.display = 'none';
    return;
  }
  try {
    swRegistration = await navigator.serviceWorker.register('/sw.js');
    const permission = Notification.permission;

    if (permission === 'default') {
      if (btn) btn.style.display = 'inline-flex';
    } else {
      if (btn) btn.style.display = 'none';
    }

    if (permission === 'granted') await subscribeUser();
  } catch(e) {
    if (btn) btn.style.display = 'none';
  }
}
async function subscribeUser() {
  if (!swRegistration) return;
  try {
    let sub = await swRegistration.pushManager.getSubscription();
    if (!sub) sub = await swRegistration.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    await supabase.from('push_subscriptions').upsert({ user_id:user.id, subscription:sub.toJSON() },{ onConflict:'user_id' });
  } catch(e){}
}
document.getElementById('enablePushBtn').addEventListener('click', async () => {
  try {
    const permission = await Notification.requestPermission();
    const btn = document.getElementById('enablePushBtn');
    if (permission === 'granted') {
      await subscribeUser();
      btn.style.display = 'none';
      showToast('Notifications enabled ✓');
    } else {
      btn.style.display = 'none';
      showToast('Notifications blocked', true);
    }
  } catch(e) {
    document.getElementById('enablePushBtn').style.display = 'none';
  }
});
initServiceWorker();
