<!DOCTYPE html>
<html lang="en">
<head>

<style>
.content { padding: 24px; max-width: 900px; }
.ann-list { display:flex;flex-direction:column;gap:12px }
.ann-item { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;transition:box-shadow 0.15s }
.ann-item:hover { box-shadow:0 4px 16px rgba(0,0,0,0.07) }
.ann-item.pinned { border-color:#bfdbfe;background:linear-gradient(135deg,#f0f9ff,#eff6ff) }
.ann-item.archived { background:#f1f5f9; border-color:#cbd5e1 }
.ann-item.archived .ann-title { color:#94a3b8 }
.ann-item.archived .ann-body { color:#94a3b8 }
.ann-item.archived .ann-meta { color:#94a3b8 }
.ann-top { display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px }
.ann-title { font-size:15px;font-weight:600 }
.ann-meta { font-size:12px;color:var(--muted);margin-top:3px }
.ann-body { font-size:14px;color:#374151;line-height:1.7 }
.ann-footer { display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-light) }
.ann-actions { display:flex;gap:6px }
.pin-toggle { display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.15s }
.pin-toggle.on { border-color:var(--blue-400);background:var(--blue-50) }
.archive-toggle { display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.15s;margin-top:8px }
.archive-toggle.on { border-color:#94a3b8;background:#f1f5f9 }
.push-banner { background:var(--blue-50);border:1px solid var(--blue-100);border-radius:12px;padding:14px 18px;display:none;align-items:center;gap:12px;margin-bottom:16px }
.push-banner.show { display:flex }
.push-banner-btn { padding:7px 14px;border-radius:8px;background:var(--blue-600);border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap }
.push-banner-dismiss { font-size:18px;color:var(--muted);cursor:pointer;padding:0 4px;background:none;border:none;line-height:1 }
@media(max-width:768px){
  .content{padding:14px}
  .ann-item{padding:14px}
  .ann-title{font-size:14px}
  .ann-body{font-size:13px}
  .ann-footer{flex-direction:column;gap:10px;align-items:flex-start}
  .ann-actions{width:100%;flex-wrap:wrap}
  .ann-actions button{flex:1;min-width:0;font-size:11px;padding:6px 8px}
  .push-banner{flex-direction:column;gap:10px;text-align:center}

  /* ───── 모바일 모달 풀스크린 친화 ───── */
  .modal-content { padding: 18px; max-height: 92vh; overflow-y: auto; }
  .modal-header h2 { font-size: 17px; }
  .modal-footer { flex-direction: column-reverse; gap: 8px; }
  .modal-footer button { width: 100%; height: 46px; font-size: 14px; }

  /* 첨부 카메라/파일 버튼 한 줄 유지 + 더 큰 탭 영역 */
  #annCameraBtn, #annFileBtn { padding: 14px 8px !important; font-size: 11px !important; }

  /* 필터 버튼 살짝 크게 — 손가락 친화 */
  .filter-btn { padding: 8px 14px; font-size: 12px; }
}
</style>
</head>
<body>

<!-- ============================================================
     LANGUAGE SELECTOR (Google Translate)
     UI is placed inline next to filter-bar (see below)
     This block contains only styles + script + hidden container
     ============================================================ -->

<!-- Google Translate hidden container -->
<div id="google_translate_element" style="position:fixed;top:-1000px;left:-1000px;opacity:0;pointer-events:none"></div>

<style>
.goog-te-banner-frame.skiptranslate{display:none !important}
.goog-te-gadget-simple{display:none}
body{top:0 !important}
.goog-tooltip,.goog-tooltip:hover{display:none !important}
.goog-text-highlight{background:none !important;box-shadow:none !important}
font font{background:transparent !important;box-shadow:none !important}
.lang-option{padding:10px 14px;cursor:pointer;font-size:13px;color:#0f172a;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px;transition:background 0.1s}
.lang-option:hover{background:#f8fafc}
.lang-option:last-child{border-bottom:none}
.lang-option.active{background:#eff6ff;color:#1e3a8a;font-weight:600}
.lang-flag{font-size:16px;width:22px}
</style>

<script>
var LANGS = [
  {code:'en', label:'EN', flag:'🇺🇸', name:'English'},
  {code:'ko', label:'KO', flag:'🇰🇷', name:'한국어'},
  {code:'zh-CN', label:'中', flag:'🇨🇳', name:'中文 (简体)'},
  {code:'zh-TW', label:'中', flag:'🇹🇼', name:'中文 (繁體)'},
  {code:'ja', label:'JA', flag:'🇯🇵', name:'日本語'},
  {code:'vi', label:'VI', flag:'🇻🇳', name:'Tiếng Việt'},
  {code:'hi', label:'HI', flag:'🇮🇳', name:'हिन्दी'},
  {code:'ar', label:'AR', flag:'🇸🇦', name:'العربية'},
  {code:'es', label:'ES', flag:'🇪🇸', name:'Español'},
  {code:'fr', label:'FR', flag:'🇫🇷', name:'Français'},
  {code:'de', label:'DE', flag:'🇩🇪', name:'Deutsch'},
  {code:'it', label:'IT', flag:'🇮🇹', name:'Italiano'},
  {code:'pt', label:'PT', flag:'🇵🇹', name:'Português'},
  {code:'ru', label:'RU', flag:'🇷🇺', name:'Русский'},
  {code:'th', label:'TH', flag:'🇹🇭', name:'ไทย'},
  {code:'id', label:'ID', flag:'🇮🇩', name:'Bahasa Indonesia'}
];

function googleTranslateElementInit(){
  new google.translate.TranslateElement({
    pageLanguage:'en',
    includedLanguages:LANGS.map(function(l){return l.code}).join(','),
    autoDisplay:false
  },'google_translate_element');
}

function setCookie(name, value){
  var hostname = window.location.hostname;
  document.cookie = name + '=' + value + ';path=/';
  document.cookie = name + '=' + value + ';path=/;domain=' + hostname;
  var parts = hostname.split('.');
  if(parts.length > 1){
    document.cookie = name + '=' + value + ';path=/;domain=.' + parts.slice(-2).join('.');
  }
}

function renderLangMenu(currentCode){
  var menu = document.getElementById('langMenu');
  menu.innerHTML = LANGS.map(function(l){
    var active = l.code === currentCode ? ' active' : '';
    return '<div class="lang-option'+active+'" data-code="'+l.code+'" onclick="selectLang(\''+l.code+'\',\''+l.label+'\')"><span class="lang-flag">'+l.flag+'</span><span>'+l.name+'</span></div>';
  }).join('');
}

function toggleLangMenu(){
  var menu = document.getElementById('langMenu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}

function selectLang(code, label){
  if(code === 'en'){
    setCookie('googtrans', '');
  } else {
    setCookie('googtrans', '/en/' + code);
  }
  document.getElementById('langBtnLabel').textContent = label;
  document.getElementById('langMenu').style.display = 'none';
  localStorage.setItem('selectedLang', code);
  localStorage.setItem('selectedLangLabel', label);
  window.location.reload();
}

(function initLang(){
  var saved = localStorage.getItem('selectedLang') || 'en';
  var label = localStorage.getItem('selectedLangLabel') || 'EN';
  document.getElementById('langBtnLabel').textContent = label;
  renderLangMenu(saved);
})();

document.addEventListener('click', function(e){
  if(!document.getElementById('langSelector').contains(e.target)){
    document.getElementById('langMenu').style.display = 'none';
  }
});
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<div class="main">

  <div class="content">

<!-- MODAL -->

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role, name } = ctx;
async function logActivity(action, record_id = null) {
  try {
    if (role === 'admin') return;
    await supabase.from('audit_logs').insert({
      user_email: user.email,
      user_role: role,
      action,
      record_id,
      created_at: new Date().toISOString()
    });
  } catch (e) {}
}
window.logActivity = logActivity;

if (role === 'admin') document.getElementById('addAnnBtn').style.display = 'inline-flex';

const CAT_BADGE = { urgent:'badge-red',maintenance:'badge-yellow',meeting:'badge-blue',reminder:'badge-purple',general:'badge-gray' };
const CAT_EMOJI = { urgent:'🚨',maintenance:'🔧',meeting:'📅',reminder:'🔔',general:'📌' };
let allAnns = [];
let currentFilter = 'all';
let allProfilesList = [];
let viewedMap = {}; // { annId: Set of emails }
let currentViewedAnnId = null;
let currentViewedTab = 'notread';

async function loadAnnouncements() {
  const { data } = await supabase.from('announcements').select('*').order('pinned',{ascending:false}).order('created_at',{ascending:false});
  allAnns = data || [];

  if (role === 'admin') {
    const { data: profiles } = await supabase.from('profiles').select('email, full_name, role').neq('role', 'admin');
    allProfilesList = profiles || [];

    const { data: logs } = await supabase.from('audit_logs').select('user_email, record_id').eq('action', 'ANNOUNCEMENT_VIEWED').not('record_id', 'is', null);
    viewedMap = {};
    (logs || []).forEach(l => {
      if (!l.record_id) return;
      if (!viewedMap[l.record_id]) viewedMap[l.record_id] = new Set();
      viewedMap[l.record_id].add(l.user_email);
    });
  }

  renderAnns();
}

function renderAnns() {
  const list = document.getElementById('annList');
  let filtered;
  if (currentFilter === 'all') {
    filtered = allAnns.filter(a => !a.archived);
  } else if (currentFilter === 'archived') {
    filtered = allAnns.filter(a => a.archived);
  } else {
    filtered = allAnns.filter(a => !a.archived && a.category === currentFilter);
  }
  if (!filtered.length) {
    const emptyMsg = currentFilter === 'archived'
      ? '<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-title">No archived announcements</div><div style="font-size:13px;color:var(--muted)">Archive old announcements to keep this list tidy.</div></div>'
      : `<div class="empty-state"><div class="empty-icon">📢</div><div class="empty-title">No announcements yet</div><div style="font-size:13px;color:var(--muted)">${role==='admin'?'Click "+ New Announcement" to create one.':'Check back later for updates.'}</div></div>`;
    list.innerHTML = emptyMsg;
    return;
  }
  list.innerHTML = filtered.map(a => `
    <div class="ann-item ${a.pinned?'pinned':''}${a.archived?' archived':''}" onclick="openAnnDetail('${a.id}')">
      <div class="ann-top">
        <div>
          <div class="ann-title">${a.pinned?'📌 ':''}${a.title}</div>
          <div class="ann-meta">${new Date(a.created_at).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
        </div>
        <span class="badge ${CAT_BADGE[a.category]||'badge-gray'}">${CAT_EMOJI[a.category]||'📌'} ${a.category||'general'}</span>
      </div>
    </div>`).join('');
}

window.openAnnDetail = (id) => {
  const a = allAnns.find(x => x.id === id);
  if (!a) return;
  logActivity('ANNOUNCEMENT_VIEWED', a.id);

  const attachmentsHtml = a.attachments && a.attachments.length ? `
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">
      ${a.attachments.map(att => att.type === 'application/pdf'
        ? `<a href="${att.url}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text);text-decoration:none;transition:all 0.15s" onmouseover="this.style.borderColor='var(--blue-600)'" onmouseout="this.style.borderColor='var(--border)'">📄 ${att.name}</a>`
        : `<a href="${att.url}" target="_blank"><img src="${att.url}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--border);transition:opacity 0.15s" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'"></a>`
      ).join('')}
    </div>` : '';

  const adminFooterHtml = role==='admin' ? `
    <div class="ann-footer" style="margin-top:20px;padding-top:14px;border-top:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:11px;color:var(--muted)">${a.pinned?'📌 Pinned':''}</span>
        <button onclick="openViewedModal('${a.id}');event.stopPropagation();" style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;border:0.5px solid #e2e8f0;background:#f8fafc;color:#475569;cursor:pointer;transition:all 0.15s" onmouseover="this.style.borderColor='#2563eb';this.style.color='#2563eb'" onmouseout="this.style.borderColor='#e2e8f0';this.style.color='#475569'">👀 ${viewedMap[a.id]?viewedMap[a.id].size:0}/${allProfilesList.length} read</button>
      </div>
      <div class="ann-actions" style="display:flex;gap:6px">
        <button class="btn-secondary" onclick="resendAnnouncement('${a.id}');event.stopPropagation();">📨 Resend</button>
        <button class="btn-secondary" onclick="closeModal('annDetailModal');openEditAnn(${JSON.stringify(a).replace(/"/g,'&quot;')})">✏️ Edit</button>
        <button class="btn-danger" onclick="confirmDeleteAnn('${a.id}')">Delete</button>
      </div>
    </div>` : '';

  // HTML 태그 포함 여부 자동 감지: 있으면 그대로 렌더, 없으면 \n을 <br>로 변환
  const hasHTML = /<[a-z][\s\S]*>/i.test(a.content || '');
  const renderedContent = hasHTML
    ? a.content
    : (a.content || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');

  document.getElementById('annDetailBody').innerHTML = `
    <div class="ann-top" style="margin-bottom:14px">
      <div>

// Attachments
const ANN_MAX_FILES = 5;
const ANN_MAX_SIZE = 10 * 1024 * 1024; // 10MB
let annFiles = [];

function annUpdatePreview() {
  const grid = document.getElementById('annAttachPreview');
  const countEl = document.getElementById('annAttachCount');
  grid.innerHTML = '';
  annFiles.forEach((file, idx) => {
    const isPdf = file.type === 'application/pdf';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:12px;max-width:180px';
    if (isPdf) {
      wrap.innerHTML = `<span style="font-size:16px">📄</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${file.name}</span><button type="button" data-idx="${idx}" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:14px;font-weight:700;padding:0;flex-shrink:0">✕</button>`;
    } else {
      const reader = new FileReader();
      reader.onload = e => {
        wrap.innerHTML = `<img src="${e.target.result}" style="width:48px;height:48px;object-fit:cover;border-radius:6px"><button type="button" data-idx="${idx}" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;font-size:10px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>`;
        wrap.querySelector('button').addEventListener('click', () => { annFiles.splice(idx,1); annUpdatePreview(); annUpdateButtons(); });
      };
      reader.readAsDataURL(file);
    }
    if (isPdf) wrap.querySelector('button').addEventListener('click', () => { annFiles.splice(idx,1); annUpdatePreview(); annUpdateButtons(); });
    grid.appendChild(wrap);
  });
  if (annFiles.length > 0) {
    countEl.textContent = `${annFiles.length} / ${ANN_MAX_FILES} file${annFiles.length>1?'s':''} attached`;
    countEl.style.display = 'block';
  } else { countEl.style.display = 'none'; }
}

function annUpdateButtons() {
  const disabled = annFiles.length >= ANN_MAX_FILES;
  document.getElementById('annCameraBtn').style.opacity = disabled ? '0.4' : '1';
  document.getElementById('annFileBtn').style.opacity = disabled ? '0.4' : '1';
  document.getElementById('annCameraBtn').disabled = disabled;
  document.getElementById('annFileBtn').disabled = disabled;
}

function annHandleFiles(files) {
  for (const file of files) {
    if (annFiles.length >= ANN_MAX_FILES) { showToast(`Max ${ANN_MAX_FILES} files allowed`, true); break; }
    if (file.size > ANN_MAX_SIZE) { showToast(`${file.name} exceeds 10MB`, true); continue; }
    annFiles.push(file);
  }
  annUpdatePreview();
  annUpdateButtons();
}

document.getElementById('annCameraBtn').addEventListener('click', () => { if (annFiles.length < ANN_MAX_FILES) document.getElementById('annInputCamera').click(); });
document.getElementById('annFileBtn').addEventListener('click', () => { if (annFiles.length < ANN_MAX_FILES) document.getElementById('annInputFile').click(); });
document.getElementById('annInputCamera').addEventListener('change', e => { annHandleFiles(e.target.files); e.target.value=''; });
document.getElementById('annInputFile').addEventListener('change', e => { annHandleFiles(e.target.files); e.target.value=''; });

document.getElementById('saveAnnBtn').addEventListener('click', async () => {
  const id = document.getElementById('annEditId').value;
  const data = {
    title:    document.getElementById('annTitle').value.trim(),
    content:  document.getElementById('annContent').value.trim(),
    category: document.getElementById('annCategory').value,
    pinned:   document.getElementById('annPinned').checked,
    archived: document.getElementById('annArchived').checked,
    author_id: user.id,
  };
  if (!data.title||!data.content) { showToast('Please fill in all fields', true); return; }

  const btn = document.getElementById('saveAnnBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  try {
    // Upload attachments
    let attachments = [];
    for (const file of annFiles) {
      const ext = file.name.split('.').pop().toLowerCase();
      const fileName = `ann_${Date.now()}_${Math.random().toString(36).slice(2,6)}.${ext}`;
      const { error: upErr } = await supabase.storage.from('announcements').upload(fileName, file, { upsert: true });
      if (upErr) { showToast('File upload failed', true); btn.disabled=false; btn.textContent='Save →'; return; }
      const { data: urlData } = supabase.storage.from('announcements').getPublicUrl(fileName);
      attachments.push({ name: file.name, url: urlData.publicUrl, type: file.type });
    }
    if (attachments.length > 0) data.attachments = attachments;

    if (id) {
      await supabase.from('announcements').update(data).eq('id', id);
    } else {
      await supabase.from('announcements').insert(data);
      try {
        const { data:{ session: pushSession } } = await supabase.auth.getSession();
        await fetch('/api/send-push', {
          method:'POST',
          headers:{ 'Content-Type':'application/json','Authorization':`Bearer ${pushSession.access_token}` },
          body: JSON.stringify({ title:`📢 Redmyre House — ${data.title}`, message:data.content.length>100?data.content.substring(0,100)+'…':data.content, url:'/pages/announcements.html' })
        });
      } catch(pushErr){}
    }

    // Reset attachments
    annFiles = [];
    annUpdatePreview();
    annUpdateButtons();

    closeModal('annModal');
    await loadAnnouncements();
    showToast(id ? 'Announcement updated ✓' : 'Announcement posted ✓');
  } catch(e) { showToast(e.message||'Failed to save', true); }
  finally { btn.disabled=false; btn.textContent='Save →'; }
});

};

window.resendAnnouncement = async (id) => {
  const a = allAnns.find(x => x.id === id);

    await supabase.from('audit_logs').delete().eq('action', 'ANNOUNCEMENT_VIEWED').eq('record_id', id);
    const { data:{ session: pushSession } } = await supabase.auth.getSession();
    await fetch('/api/send-push', {
      method:'POST',
      headers:{ 'Content-Type':'application/json','Authorization':`Bearer ${pushSession.access_token}` },
      body: JSON.stringify({ title:`📢 Redmyre House — ${a.title}`, message:a.content.length>100?a.content.substring(0,100)+'…':a.content, url:'/pages/announcements.html' })
    });
    await loadAnnouncements();
    showToast('Announcement resent — read status reset ✓');
  } catch(e) { showToast('Failed to resend', true); }
};

function renderViewedList() {
  const list = document.getElementById('viewedList');
  const reminderWrap = document.getElementById('viewedReminderWrap');
  const viewed = viewedMap[currentViewedAnnId] || new Set();
  const readUsers = allProfilesList.filter(p => viewed.has(p.email));
  const notReadUsers = allProfilesList.filter(p => !viewed.has(p.email));
  const items = currentViewedTab === 'read' ? readUsers : notReadUsers;

  if (!items.length) {
    list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">${currentViewedTab==='read'?'No one has read this yet':'Everyone has read this! 🎉'}</div>`;
    reminderWrap.style.display = 'none';
    return;
  }

  list.innerHTML = items.map(p => {
    const initials = (p.full_name||'?').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
    const roleLabel = p.role.charAt(0).toUpperCase() + p.role.slice(1);
    const dotColor = currentViewedTab==='read' ? '#22c55e' : '#ef4444';
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:0.5px solid var(--border-light)">
      <div style="width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text);flex-shrink:0">${initials}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.full_name||p.email}</div>
        <div style="font-size:11px;color:var(--muted)">${roleLabel}</div>
      </div>
      <div style="width:8px;height:8px;border-radius:50%;background:${dotColor};flex-shrink:0"></div>
    </div>`;
  }).join('');

  reminderWrap.style.display = currentViewedTab==='notread' && notReadUsers.length > 0 ? 'block' : 'none';
}

window.sendReminder = async function() {
  const a = allAnns.find(x => x.id === currentViewedAnnId);
  if (!a) return;
  const viewed = viewedMap[currentViewedAnnId] || new Set();
  const notReadUsers = allProfilesList.filter(p => !viewed.has(p.email));
  if (!notReadUsers.length) { showToast('Everyone has read this!'); return; }
  if (!confirm(`Send reminder push to ${notReadUsers.length} user(s) who haven't read this?`)) return;
  const btn = document.getElementById('sendReminderBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const { data: notReadProfiles } = await supabase.from('profiles').select('id').in('email', notReadUsers.map(u=>u.email));
    const ids = (notReadProfiles||[]).map(p=>p.id);
    if (ids.length) {
      const { data:{ session: pushSession } } = await supabase.auth.getSession();
      for (const uid of ids) {
        await fetch('/api/send-push', {
          method:'POST',
          headers:{ 'Content-Type':'application/json','Authorization':`Bearer ${pushSession.access_token}` },
          body: JSON.stringify({ user_id: uid, title:'📢 Reminder: ' + a.title, message:'Please check the latest announcement', url:'/pages/announcements.html' })
        });
      }
    }
    showToast(`Reminder sent to ${notReadUsers.length} user(s) ✓`);
  } catch(e) { showToast('Failed to send reminder', true); }
  finally { btn.disabled = false; btn.textContent = '🔔 Send Reminder to Unread Users'; }
};

// Push Notifications
const VAPID_PUBLIC_KEY = 'BNyzSuyh9RRzRLNiPq1mngiuEH35QX3smFJoYQGWdOSdu_4koNy4s65I8WUpI1gxanRgJLNU0gDJfhW1PUdxQrI';
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4-base64String.length%4)%4);
  const base64 = (base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i=0;i<rawData.length;++i) outputArray[i]=rawData.charCodeAt(i);
  return outputArray;
}
let swRegistration = null;
async function initServiceWorker() {
  if (!('serviceWorker' in navigator)||!('PushManager' in window)) return;
  try {
    swRegistration = await navigator.serviceWorker.register('/sw.js');
    const permission = Notification.permission;
    if (permission==='default'&&!localStorage.getItem('push-dismissed')) document.getElementById('pushBanner').classList.add('show');
    if (permission==='granted') await subscribeUser();
  } catch(e){}
}
async function subscribeUser() {
  if (!swRegistration) return;
  try {
    let sub = await swRegistration.pushManager.getSubscription();
    if (!sub) sub = await swRegistration.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    await supabase.from('push_subscriptions').upsert({ user_id:user.id, subscription:sub.toJSON() },{ onConflict:'user_id' });
  } catch(e){}
}
document.getElementById('enablePushBtn').addEventListener('click', async () => {
  const permission = await Notification.requestPermission();
  if (permission==='granted') { await subscribeUser(); document.getElementById('pushBanner').classList.remove('show'); showToast('Notifications enabled ✓'); }
  else { document.getElementById('pushBanner').classList.remove('show'); showToast('Notifications blocked', true); }
});
document.getElementById('dismissPushBtn').addEventListener('click', () => {
  document.getElementById('pushBanner').classList.remove('show');
  localStorage.setItem('push-dismissed', '1');
});
initServiceWorker();

await loadAnnouncements();
