<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.content { padding: 24px; max-width: 900px; }
.ann-list { display:flex;flex-direction:column;gap:12px }
.ann-item { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;transition:box-shadow 0.15s }
.ann-item:hover { box-shadow:0 4px 16px rgba(0,0,0,0.07) }
.ann-item.pinned { border-color:#bfdbfe;background:linear-gradient(135deg,#f0f9ff,#eff6ff) }
.ann-top { display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px }
.ann-title { font-size:15px;font-weight:600 }
.ann-meta { font-size:12px;color:var(--muted);margin-top:3px }
.ann-body { font-size:13px;color:var(--text-2);line-height:1.7;white-space:pre-wrap }
.ann-footer { display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-light) }
.ann-actions { display:flex;gap:6px }
.pin-toggle { display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.15s }
.pin-toggle.on { border-color:var(--blue-400);background:var(--blue-50) }
.push-banner { background:var(--blue-50);border:1px solid var(--blue-100);border-radius:12px;padding:14px 18px;display:none;align-items:center;gap:12px;margin-bottom:16px }
.push-banner.show { display:flex }
.push-banner-btn { padding:7px 14px;border-radius:8px;background:var(--blue-600);border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap }
.push-banner-dismiss { font-size:18px;color:var(--muted);cursor:pointer;padding:0 4px;background:none;border:none;line-height:1 }
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    <div class="section-hdr">
      <div class="section-title">Announcements</div>
      <button class="btn-primary" id="addAnnBtn" style="display:none">+ New Announcement</button>
    </div>
    <div class="push-banner" id="pushBanner">
      <div style="font-size:20px;flex-shrink:0">🔔</div>
      <div style="font-size:13px;color:var(--blue-800);flex:1">Enable notifications to get alerted when new announcements are posted.</div>
      <button class="push-banner-btn" id="enablePushBtn">Enable Notifications</button>
      <button class="push-banner-dismiss" id="dismissPushBtn">✕</button>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="urgent">🚨 Urgent</button>
      <button class="filter-btn" data-filter="maintenance">🔧 Maintenance</button>
      <button class="filter-btn" data-filter="meeting">📅 Meeting</button>
      <button class="filter-btn" data-filter="reminder">🔔 Reminder</button>
      <button class="filter-btn" data-filter="general">📌 General</button>
    </div>
    <div class="ann-list" id="annList">
      <div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">Loading…</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="annModal">
  <div class="modal-box">
    <div class="modal-title" id="annModalTitle">New Announcement</div>
    <input type="hidden" id="annEditId">
    <div class="modal-field">
      <label class="modal-label">Title</label>
      <input class="modal-input" id="annTitle" placeholder="Announcement title…">
    </div>
    <div class="modal-field">
      <label class="modal-label">Content</label>
      <textarea class="modal-textarea" id="annContent" style="min-height:160px" placeholder="Write your announcement here…"></textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="modal-field">
        <label class="modal-label">Category</label>
        <select class="modal-select" id="annCategory">
          <option value="general">📌 General</option>
          <option value="maintenance">🔧 Maintenance</option>
          <option value="urgent">🚨 Urgent</option>
          <option value="meeting">📅 Meeting</option>
          <option value="reminder">🔔 Reminder</option>
        </select>
      </div>
      <div class="modal-field">
        <label class="modal-label">Pin to top</label>
        <label class="pin-toggle" id="pinToggle">
          <input type="checkbox" id="annPinned">
          <span id="pinLabel" style="font-size:13px;font-weight:500">Pin this announcement</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-danger" id="deleteAnnBtn" style="display:none;margin-right:auto">Delete</button>
      <button class="btn-secondary" onclick="closeModal('annModal')">Cancel</button>
      <button class="btn-primary" id="saveAnnBtn">Save →</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role, name } = ctx;
async function logActivity(action, record_id = null) {
  try {
    if (role === 'admin') return;
    await supabase.from('audit_logs').insert({
      user_email: user.email,
      user_role: role,
      action,
      record_id,
      created_at: new Date().toISOString()
    });
  } catch (e) {}
}
window.logActivity = logActivity;
await logActivity('PAGE_ENTER');
window.addEventListener('beforeunload', () => { logActivity('PAGE_EXIT'); });

if (role === 'admin') document.getElementById('addAnnBtn').style.display = 'inline-flex';

const CAT_BADGE = { urgent:'badge-red',maintenance:'badge-yellow',meeting:'badge-blue',reminder:'badge-purple',general:'badge-gray' };
const CAT_EMOJI = { urgent:'🚨',maintenance:'🔧',meeting:'📅',reminder:'🔔',general:'📌' };
let allAnns = [];
let currentFilter = 'all';

async function loadAnnouncements() {
  const { data } = await supabase.from('announcements').select('*').order('pinned',{ascending:false}).order('created_at',{ascending:false});
  allAnns = data || [];
  renderAnns();
}

function renderAnns() {
  const list = document.getElementById('annList');
  const filtered = currentFilter === 'all' ? allAnns : allAnns.filter(a => a.category === currentFilter);
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📢</div><div class="empty-title">No announcements yet</div><div style="font-size:13px;color:var(--muted)">${role==='admin'?'Click "+ New Announcement" to create one.':'Check back later for updates.'}</div></div>`;
    return;
  }
  list.innerHTML = filtered.map(a => `
    <div class="ann-item ${a.pinned?'pinned':''}" onclick="logActivity('ANNOUNCEMENT_VIEWED','${a.id}')">
      <div class="ann-top">
        <div>
          <div class="ann-title">${a.pinned?'📌 ':''}${a.title}</div>
          <div class="ann-meta">${new Date(a.created_at).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
        </div>
        <span class="badge ${CAT_BADGE[a.category]||'badge-gray'}">${CAT_EMOJI[a.category]||'📌'} ${a.category||'general'}</span>
      </div>
      <div class="ann-body">${a.content}</div>
      ${role==='admin'?`
        <div class="ann-footer">
          <span style="font-size:11px;color:var(--muted)">${a.pinned?'📌 Pinned':''}</span>
          <div class="ann-actions">
            <button class="btn-secondary" onclick="openEditAnn(${JSON.stringify(a).replace(/"/g,'&quot;')})">✏️ Edit</button>
            <button class="btn-danger" onclick="confirmDeleteAnn('${a.id}')">Delete</button>
          </div>
        </div>`:''}
    </div>`).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAnns();
  });
});

document.getElementById('pinToggle').addEventListener('click', () => {
  const cb = document.getElementById('annPinned');
  setTimeout(() => {
    document.getElementById('pinToggle').classList.toggle('on', cb.checked);
    document.getElementById('pinLabel').textContent = cb.checked ? '📌 Pinned!' : 'Pin this announcement';
  }, 0);
});

document.getElementById('addAnnBtn').addEventListener('click', () => {
  document.getElementById('annModalTitle').textContent = 'New Announcement';
  document.getElementById('annEditId').value = '';
  document.getElementById('annTitle').value = '';
  document.getElementById('annContent').value = '';
  document.getElementById('annCategory').value = 'general';
  document.getElementById('annPinned').checked = false;
  document.getElementById('pinToggle').classList.remove('on');
  document.getElementById('pinLabel').textContent = 'Pin this announcement';
  document.getElementById('deleteAnnBtn').style.display = 'none';
  document.getElementById('annModal').classList.add('open');
});

window.openEditAnn = (a) => {
  document.getElementById('annModalTitle').textContent = 'Edit Announcement';
  document.getElementById('annEditId').value = a.id;
  document.getElementById('annTitle').value = a.title;
  document.getElementById('annContent').value = a.content;
  document.getElementById('annCategory').value = a.category||'general';
  document.getElementById('annPinned').checked = a.pinned;
  document.getElementById('pinToggle').classList.toggle('on', a.pinned);
  document.getElementById('pinLabel').textContent = a.pinned ? '📌 Pinned!' : 'Pin this announcement';
  document.getElementById('deleteAnnBtn').style.display = 'inline-flex';
  document.getElementById('annModal').classList.add('open');
};

document.getElementById('saveAnnBtn').addEventListener('click', async () => {
  const id = document.getElementById('annEditId').value;
  const data = {
    title:    document.getElementById('annTitle').value.trim(),
    content:  document.getElementById('annContent').value.trim(),
    category: document.getElementById('annCategory').value,
    pinned:   document.getElementById('annPinned').checked,
    author_id: user.id,
  };
  if (!data.title||!data.content) { showToast('Please fill in all fields', true); return; }
  try {
    if (id) {
      await supabase.from('announcements').update(data).eq('id', id);
    } else {
      await supabase.from('announcements').insert(data);
      try {
        const { data:{ session: pushSession } } = await supabase.auth.getSession();
        await fetch('/api/send-push', {
          method:'POST',
          headers:{ 'Content-Type':'application/json','Authorization':`Bearer ${pushSession.access_token}` },
          body: JSON.stringify({ title:`📢 Redmyre House — ${data.title}`, message:data.content.length>100?data.content.substring(0,100)+'…':data.content, url:'/pages/announcements.html' })
        });
      } catch(pushErr){}
    }
    closeModal('annModal');
    await loadAnnouncements();
    showToast(id ? 'Announcement updated ✓' : 'Announcement posted ✓');
  } catch(e) { showToast(e.message||'Failed to save', true); }
});

window.confirmDeleteAnn = async (id) => {
  if (!confirm('Delete this announcement?')) return;
  await supabase.from('announcements').delete().eq('id', id);
  await loadAnnouncements();
  showToast('Announcement deleted');
};

document.getElementById('deleteAnnBtn').addEventListener('click', async () => {
  const id = document.getElementById('annEditId').value;
  if (!id) return;
  await window.confirmDeleteAnn(id);
  closeModal('annModal');
});

// Push Notifications
const VAPID_PUBLIC_KEY = 'BNyzSuyh9RRzRLNiPq1mngiuEH35QX3smFJoYQGWdOSdu_4koNy4s65I8WUpI1gxanRgJLNU0gDJfhW1PUdxQrI';
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4-base64String.length%4)%4);
  const base64 = (base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i=0;i<rawData.length;++i) outputArray[i]=rawData.charCodeAt(i);
  return outputArray;
}
let swRegistration = null;
async function initServiceWorker() {
  if (!('serviceWorker' in navigator)||!('PushManager' in window)) return;
  try {
    swRegistration = await navigator.serviceWorker.register('/sw.js');
    const permission = Notification.permission;
    if (permission==='default'&&!localStorage.getItem('push-dismissed')) document.getElementById('pushBanner').classList.add('show');
    if (permission==='granted') await subscribeUser();
  } catch(e){}
}
async function subscribeUser() {
  if (!swRegistration) return;
  try {
    let sub = await swRegistration.pushManager.getSubscription();
    if (!sub) sub = await swRegistration.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    await supabase.from('push_subscriptions').upsert({ user_id:user.id, subscription:sub.toJSON() },{ onConflict:'user_id' });
  } catch(e){}
}
document.getElementById('enablePushBtn').addEventListener('click', async () => {
  const permission = await Notification.requestPermission();
  if (permission==='granted') { await subscribeUser(); document.getElementById('pushBanner').classList.remove('show'); showToast('Notifications enabled ✓'); }
  else { document.getElementById('pushBanner').classList.remove('show'); showToast('Notifications blocked', true); }
});
document.getElementById('dismissPushBtn').addEventListener('click', () => {
  document.getElementById('pushBanner').classList.remove('show');
  localStorage.setItem('push-dismissed', '1');
});
initServiceWorker();

await loadAnnouncements();
</script>
</body>
</html>
