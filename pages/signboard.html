<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signboard Manager – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v4.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
.content{background:#111!important}
.sb-wrap{padding:24px;max-width:1500px;margin:0 auto}
.sb-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.sb-title{font-size:22px;font-weight:700;color:#fff;font-family:'DM Sans',sans-serif}
.sb-sub{font-size:13px;color:#777;margin-top:3px}
.sb-top-btns{display:flex;gap:10px}
.sb-btn{padding:9px 20px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;border:none;transition:all .2s}
.sb-btn-green{background:transparent;border:1.5px solid #22c55e;color:#22c55e}
.sb-btn-green:hover{background:rgba(34,197,94,.1);box-shadow:0 0 12px rgba(34,197,94,.15)}
.sb-btn-red{background:#dc2626;color:#fff}
.sb-btn-red:hover{background:#b91c1c;box-shadow:0 2px 16px rgba(220,38,38,.3)}
.sb-tabs{display:flex;gap:0;margin-bottom:24px;flex-wrap:wrap}
.sb-tab{padding:11px 22px;font-size:13px;font-weight:600;color:#666;cursor:pointer;border:1.5px solid #2a2a2a;background:#1a1a1a;font-family:'DM Sans',sans-serif;transition:all .2s}
.sb-tab:first-child{border-radius:10px 0 0 10px}
.sb-tab:last-child{border-radius:0 10px 10px 0}
.sb-tab+.sb-tab{border-left:none}
.sb-tab.active{background:#dc2626;color:#fff;border-color:#dc2626;box-shadow:0 2px 12px rgba(220,38,38,.25)}
.sb-tab:hover:not(.active){color:#aaa;background:#222}
.sb-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:768px){
.sb-grid{grid-template-columns:1fr}
.sb-top{flex-direction:column;gap:12px}
.sb-top-btns{width:100%}
.sb-top-btns .sb-btn{flex:1;text-align:center}
.sb-tabs{flex-wrap:wrap}
.sb-tab{padding:9px 14px;font-size:12px}
.sb-entry{flex-direction:column;align-items:flex-start;padding:14px 16px}
.sb-entry-actions{width:100%;justify-content:flex-end}
input[type="text"],input[type="number"],select,textarea{font-size:16px !important}
}
@media(max-width:380px){
.sb-tab{padding:8px 10px;font-size:11px}
.sb-entry-biz{font-size:12px}
}
.sb-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.sb-entry{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #f0f0f0;gap:12px}
.sb-entry:last-child{border-bottom:none}
.sb-floor-badge{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;font-family:'DM Sans',sans-serif}
.fb-g{color:#666;background:#f5f5f5;border:1px solid #e0e0e0}
.fb-l1{color:#dc2626;background:#fef2f2;border:1px solid #fecaca}
.fb-l2{color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe}
.fb-l3{color:#7c3aed;background:#f5f3ff;border:1px solid #ddd6fe}
.fb-l4{color:#059669;background:#ecfdf5;border:1px solid #a7f3d0}
.fb-l5{color:#d97706;background:#fffbeb;border:1px solid #fde68a}
.fb-l6{color:#0891b2;background:#ecfeff;border:1px solid #a5f3fc}
.sb-entry-info{flex:1;min-width:0}
.sb-entry-biz{font-size:13px;font-weight:600;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-entry-alt{font-size:12px;color:#999;margin-left:4px}
.sb-entry-meta{font-size:11px;color:#999;margin-top:2px}
.sb-entry-actions{display:flex;gap:4px;flex-shrink:0}
.sb-btn-e{padding:5px 14px;font-size:11px;font-weight:600;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;border:1px solid #ddd;background:#fff;color:#555;transition:all .12s}
.sb-btn-e:hover{background:#f5f5f5;color:#222}
.sb-btn-e.del{color:#dc2626;border-color:#fecaca}
.sb-btn-e.del:hover{background:#fef2f2}
.sb-right-label{font-size:15px;font-weight:700;color:#fff;margin-bottom:10px;font-family:'DM Sans',sans-serif}
.sb-preview-wrap{background:#fff;border-radius:12px;padding:18px;box-shadow:0 4px 24px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center}
.pv-frame{background:#fff;width:540px;height:960px;position:relative;font-family:'Helvetica Neue',Arial,sans-serif;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;}
.pv-frame.fullpage{padding:0;}
.sb-jpeg-row{display:flex;justify-content:flex-end;margin-top:10px;width:540px}
.sb-btn-jpeg{padding:7px 18px;font-size:12px;font-weight:600;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;border:none;background:#222;color:#fff;transition:all .15s}
.sb-btn-jpeg:hover{background:#333}
.sb-notice-editor{background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.sb-notice-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sb-notice-label{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.03em}
.sb-notice-status{font-size:11px;color:#22c55e;font-weight:600}
.sb-notice-status.unsaved{color:#f59e0b}
.sb-notice-body{width:100%;min-height:420px;padding:14px;font-size:13px;font-family:'Monaco','Courier New',monospace;border:1px solid #ddd;border-radius:8px;resize:vertical;color:#222;line-height:1.5}
.sb-notice-body:focus{outline:none;border-color:#dc2626}
.sb-notice-hint{font-size:11px;color:#999;margin-top:6px;line-height:1.5}
.sb-notice-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.sb-btn-save{padding:9px 22px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;border:none;background:#22c55e;color:#fff;transition:all .15s}
.sb-btn-save:hover{background:#16a34a;box-shadow:0 2px 12px rgba(34,197,94,.3)}
.sb-btn-save:disabled{background:#666;cursor:not-allowed}
.sb-btn-clear{padding:9px 22px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;border:1px solid #555;background:transparent;color:#aaa;transition:all .15s}
.sb-btn-clear:hover{background:#2a2a2a;color:#fff}
.sb-modal-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:9999;align-items:center;justify-content:center}
.sb-modal-bg.open{display:flex}
.sb-modal{background:#fff;border-radius:14px;width:440px;max-width:95vw;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.sb-modal h3{font-size:16px;font-weight:700;color:#222;margin-bottom:16px;font-family:'DM Sans',sans-serif}
.sb-modal label{font-size:12px;font-weight:600;color:#666;display:block;margin-bottom:4px;margin-top:12px}
.sb-modal input,.sb-modal select,.sb-modal textarea{width:100%;padding:9px 12px;font-size:13px;border:1px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif;color:#222}
.sb-modal input:focus,.sb-modal select:focus,.sb-modal textarea:focus{outline:none;border-color:#dc2626}
.sb-modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.sb-modal-btns .sb-btn{padding:8px 20px;font-size:13px}
.sb-btn-cancel{background:#f5f5f5;color:#555;border:1px solid #ddd}
.sb-btn-cancel:hover{background:#eee}
.sb-btn-modal-save{background:#dc2626;color:#fff}
.sb-btn-modal-save:hover{background:#b91c1c}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    <div class="sb-wrap">
      <div class="sb-top">
        <div><div class="sb-title">Signboard</div><div class="sb-sub">Lobby directory & fullpage board · 540 × 960 (전광판 규격)</div></div>
        <div class="sb-top-btns">
          <button class="sb-btn sb-btn-green" onclick="openAddModal()">+ Add entry</button>
          <button class="sb-btn sb-btn-red" onclick="downloadAllJPEG()">Download all JPEG</button>
        </div>
      </div>
      <div class="sb-tabs" id="tabBar"></div>
      <div class="sb-grid">
        <div id="leftPanel"></div>
        <div id="rightPanel"></div>
      </div>
    </div>
  </div>
</div>

<div class="sb-modal-bg" id="entryModal">
  <div class="sb-modal">
    <h3 id="modalTitle">Add Entry</h3>
    <input type="hidden" id="editId">
    <label>Page</label>
    <select id="fPage">
      <option value="1">Page 1 · G + L1</option>
      <option value="2">Page 2 · L2</option>
      <option value="3">Page 3 · L3</option>
      <option value="4">Page 4 · L4</option>
      <option value="5">Page 5 · L5</option>
      <option value="6">Page 6 · L6</option>
    </select>
    <label>Floor</label>
    <select id="fFloor" onchange="updateUnitOptions()">
      <option value="GROUND">GROUND</option>
      <option value="LEVEL 1">LEVEL 1</option>
      <option value="LEVEL 2">LEVEL 2</option>
      <option value="LEVEL 3">LEVEL 3</option>
      <option value="LEVEL 4">LEVEL 4</option>
      <option value="LEVEL 5">LEVEL 5</option>
      <option value="LEVEL 6">LEVEL 6</option>
    </select>
    <label>Business Name (엔터로 줄바꿈)</label>
    <textarea id="fBiz" rows="2" placeholder="e.g. Redmyre Medical Centre" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif;color:#222;resize:vertical;"></textarea>
    <label>Alt Name (optional, 엔터로 줄바꿈)</label>
    <textarea id="fAlt" rows="2" placeholder="e.g. 윤중병원" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif;color:#222;resize:vertical;"></textarea>
    <label>Sub Info (optional, 엔터로 줄바꿈)</label>
    <textarea id="fSub" rows="2" placeholder="e.g. Dr A Wong&#10;Dr B Kim" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif;color:#222;resize:vertical;"></textarea>
    <label>Unit Display</label>
    <select id="fUnit" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif;color:#222;"></select>
    <label>Sort Order</label>
    <input type="number" id="fSort" value="1">
    <div class="sb-modal-btns">
      <button class="sb-btn sb-btn-cancel" onclick="closeEntryModal()">Cancel</button>
      <button class="sb-btn sb-btn-modal-save" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:9998"></div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role } = ctx;

if (role !== 'admin') { window.location.href = '/pages/building.html'; }

const FLOOR_ORDER = ['GROUND','LEVEL 1','LEVEL 2','LEVEL 3','LEVEL 4','LEVEL 5','LEVEL 6'];
const UNIT_OPTIONS = {
  'GROUND':  ['Unit 1'],
  'LEVEL 1': ['1A','1B','1C','1D','1E','1F','1G','1H'],
  'LEVEL 2': ['2A','2B','2C','2D','2E','2F','2G','2H'],
  'LEVEL 3': ['3A','3B','3C','3D','3E','3F','3G','3H'],
  'LEVEL 4': ['4A','4B','4C','4D','4E','4F','4G','4H'],
  'LEVEL 5': ['5A','5B','5C','5D','5E','5F','5G','5H'],
  'LEVEL 6': ['6A','6B','6C','6D','6E','6F','6G','6H'],
};
window.updateUnitOptions = (currentVal='') => {
  const floor = document.getElementById('fFloor').value;
  const sel = document.getElementById('fUnit');
  const opts = UNIT_OPTIONS[floor] || [];
  sel.innerHTML = opts.map(u=>`<option value="${u}" ${u===currentVal?'selected':''}>${u}</option>`).join('');
};
const FLOOR_BADGE = {'GROUND':'fb-g','LEVEL 1':'fb-l1','LEVEL 2':'fb-l2','LEVEL 3':'fb-l3','LEVEL 4':'fb-l4','LEVEL 5':'fb-l5','LEVEL 6':'fb-l6'};
const FLOOR_SHORT = {'GROUND':'G','LEVEL 1':'L1','LEVEL 2':'L2','LEVEL 3':'L3','LEVEL 4':'L4','LEVEL 5':'L5','LEVEL 6':'L6'};
const FLOOR_LABEL = {'GROUND':'GROUND','LEVEL 1':'LEVEL 1','LEVEL 2':'LEVEL 2','LEVEL 3':'LEVEL 3','LEVEL 4':'LEVEL 4','LEVEL 5':'LEVEL 5','LEVEL 6':'LEVEL 6'};

const TOTAL_DIRECTORY_PAGES = 6;
const FULLPAGE_PAGE_A = 7;
const FULLPAGE_PAGE_B = 8;

const TAB_LABELS = {
  1:'Page 1 · G+L1', 2:'Page 2 · L2', 3:'Page 3 · L3',
  4:'Page 4 · L4',   5:'Page 5 · L5', 6:'Page 6 · L6',
  7:'Page 7 · Fullpage A', 8:'Page 8 · Fullpage B'
};

let allEntries = [];
let activeTab = 1;
let fullpageBodyA = '', savedFullpageBodyA = '';
let fullpageBodyB = '', savedFullpageBodyB = '';

async function loadEntries() {
  const { data } = await supabase.from('signboard_entries').select('*').order('page').order('floor').order('sort_order');
  allEntries = data || [];
  const { data: fdA } = await supabase.from('signboard_fullpage').select('content').eq('id',1).maybeSingle();
  if (fdA) { fullpageBodyA = fdA.content||''; savedFullpageBodyA = fullpageBodyA; }
  const { data: fdB } = await supabase.from('signboard_fullpage2').select('content').eq('id',1).maybeSingle();
  if (fdB) { fullpageBodyB = fdB.content||''; savedFullpageBodyB = fullpageBodyB; }
  render();
}

function render() {
  renderTabs();
  if (activeTab >= 1 && activeTab <= TOTAL_DIRECTORY_PAGES) {
    renderEntryList();
    renderDirectoryPreview();
  } else if (activeTab === FULLPAGE_PAGE_A) {
    renderFullpageEditor('A'); renderFullpagePreview('A');
  } else if (activeTab === FULLPAGE_PAGE_B) {
    renderFullpageEditor('B'); renderFullpagePreview('B');
  }
}

function renderTabs() {
  let html = '';
  for (let i=1; i<=8; i++) {
    html += `<button class="sb-tab ${activeTab===i?'active':''}" onclick="setTab(${i})">${TAB_LABELS[i]}</button>`;
  }
  document.getElementById('tabBar').innerHTML = html;
}

function renderEntryList() {
  const entries = allEntries.filter(e => e.page === activeTab);
  const grouped = {};
  entries.forEach(e => { if (!grouped[e.floor]) grouped[e.floor]=[]; grouped[e.floor].push(e); });
  let html = '<div class="sb-card">';
  FLOOR_ORDER.filter(f => grouped[f]).forEach(floor => {
    grouped[floor].forEach(e => {
      const badge = FLOOR_BADGE[floor]||'fb-g';
      const short = FLOOR_SHORT[floor]||'?';
      const alt = e.display_name_alt ? `<span class="sb-entry-alt">${e.display_name_alt}</span>` : '';
      const sub = e.sub_info ? e.sub_info.split('||')[0] : '';
      const meta = [e.unit_display, sub].filter(Boolean).join(' · ');
      html += `<div class="sb-entry"><div class="sb-floor-badge ${badge}">${short}</div><div class="sb-entry-info"><div class="sb-entry-biz">${e.business_name}${alt}</div><div class="sb-entry-meta">${meta}</div></div><div class="sb-entry-actions"><button class="sb-btn-e" onclick="openEditModal('${e.id}')">Edit</button><button class="sb-btn-e del" onclick="deleteEntry('${e.id}')">Del</button></div></div>`;
    });
  });
  html += '</div>';
  document.getElementById('leftPanel').innerHTML = html;
}

function renderDirectoryPreview() {
  const entries = allEntries.filter(e => e.page === activeTab)
    .sort((a,b) => {
      if (a.floor < b.floor) return -1;
      if (a.floor > b.floor) return 1;
      return a.sort_order - b.sort_order;
    });
  const grouped = {};
  entries.forEach(e => { if (!grouped[e.floor]) grouped[e.floor]=[]; grouped[e.floor].push(e); });

  const floors = FLOOR_ORDER.filter(f => grouped[f]);
  const floorLabel = floors.length === 1 ? floors[0] : floors.map(f => FLOOR_LABEL[f]).join(' & ');

  // 전체 유닛 수 계산 (자동 축소용)
  let totalUnits = 0;
  floors.forEach(f => {
    const units = {};
    grouped[f].forEach(e => { units[e.unit_display]=1; });
    totalUnits += Object.keys(units).length;
  });
  const bizSize = 19;
  const subSize = 12;

  function renderSub(sub) {
    if (!sub) return '';
    return sub.split(/\n|\|\|/).map(l=>l.trim()).filter(Boolean)
      .map(l=>`<div style="font-size:${subSize+3}px;font-weight:500;color:#334155;margin-top:2px;line-height:1.5;font-style:italic;">${l}</div>`).join('');
  }

  let rows = '';
  floors.forEach((floor, fi) => {
    if (floors.length > 1) {
      const mt = fi > 0 ? 'margin-top:12px;' : '';
      rows += `<div style="display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-shrink:0;${mt}">
        <div style="font-size:28px;font-weight:900;color:#0f172a;letter-spacing:1px;white-space:nowrap;">${floor}</div>
        <div style="flex:1;height:2px;background:#c9a961;"></div>
      </div>`;
    }

    // 같은 unit_display 묶기
    const unitMap = {};
    const unitOrder = [];
    grouped[floor].forEach(e => {
      if (!unitMap[e.unit_display]) { unitMap[e.unit_display]=[]; unitOrder.push(e.unit_display); }
      unitMap[e.unit_display].push(e);
    });

    unitOrder.forEach((unit, ui) => {
      const items = unitMap[unit];
      const isLast = ui === unitOrder.length-1 && fi === floors.length-1;
      const borderBottom = isLast ? 'none' : '1.5px solid #c9a961';

      let bizHtml = '';
      items.forEach((e, idx) => {
        const isLastItem = idx === items.length-1;
        const thisBizSize = (unit === '3A') ? 26 : bizSize;
        const bizLines = e.business_name.split(/\n/);
        const hasBreak = bizLines.length > 1;
        const altHtml = e.display_name_alt ? e.display_name_alt.split(/\n/).map(l=>`<div style="font-size:${subSize+3}px;font-weight:700;color:#0f172a;margin-top:1px;">${l.trim()}</div>`).join('') : '';

        if (idx === 0) {
          bizHtml += `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div style="flex:1;${hasBreak?'':'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'}">
              ${bizLines.map(l=>`<div style="font-size:${thisBizSize}px;font-weight:900;color:#0f172a;line-height:1.25;">${l}</div>`).join('')}
              ${altHtml}
            </div>
            <div style="font-size:${thisBizSize-4}px;font-weight:900;color:#0f172a;flex-shrink:0;padding-top:2px;">${unit}</div>
          </div>`;
        } else {
          bizHtml += `<div style="${hasBreak?'':'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'}">
            ${bizLines.map(l=>`<div style="font-size:${thisBizSize}px;font-weight:900;color:#0f172a;line-height:1.25;">${l}</div>`).join('')}
            ${altHtml}
          </div>`;
        }
        bizHtml += renderSub(e.sub_info);
        if (!isLastItem) {
          bizHtml += `<div style="border-top:1.5px solid #f0ece0;margin:6px 0;"></div>`;
        }
      });

      const flexVal = items.reduce((acc, e) => {
        let lines = e.business_name.split(/\n/).length;
        if (e.sub_info) lines += e.sub_info.split(/\n|\|\|/).filter(Boolean).length;
        if (e.display_name_alt) lines += e.display_name_alt.split(/\n/).filter(Boolean).length;
        return acc + lines;
      }, 0);

      rows += `<div style="flex:${Math.max(flexVal,1)};display:flex;flex-direction:column;justify-content:center;padding:8px 0;border-bottom:${borderBottom};min-height:0;">
        ${bizHtml}
      </div>`;
    });
  });

  // 단일층: 상단 큰 헤더. 다중층(Page1): rows 안에 층별 헤더만
  const topHeader = floors.length === 1 ? `
    <div style="padding:20px 32px 12px;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:14px;">
        <div style="font-size:28px;font-weight:900;color:#0f172a;letter-spacing:1px;white-space:nowrap;">${floorLabel}</div>
        <div style="flex:1;height:2px;background:#c9a961;"></div>
      </div>
    </div>` : '';

  const entryPad = floors.length > 1 ? '20px 32px 0' : '0 32px 0';

  document.getElementById('rightPanel').innerHTML = `
    <div class="sb-right-label">Preview · 540 × 960</div>
    <div class="sb-preview-wrap">
      <div class="pv-frame" id="pvFrame" style="background:#ffffff;overflow:hidden;">

        ${topHeader}

        <!-- 엔트리 -->
        <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;padding:${entryPad};">
          ${rows}
        </div>

        <!-- 푸터 -->
        <div style="background:#0f172a;padding:14px 32px;text-align:center;flex-shrink:0;">
          <div style="font-size:11px;font-weight:800;letter-spacing:3px;color:#fff;text-transform:uppercase;">SCA Facility Management</div>
          <div style="font-size:9px;color:#64748b;margin-top:3px;letter-spacing:1px;">Redmyre House · 9–13 Redmyre Road</div>
        </div>

      </div>
      <div class="sb-jpeg-row"><button class="sb-btn-jpeg" onclick="downloadJPEG()">Download JPEG (540×960)</button></div>
    </div>
  `;
}

function renderFullpageEditor(which) {
  const body = which==='A' ? fullpageBodyA : fullpageBodyB;
  const saved = which==='A' ? savedFullpageBodyA : savedFullpageBodyB;
  const unsaved = body !== saved;
  const label = which==='A' ? 'Fullpage A' : 'Fullpage B';
  document.getElementById('leftPanel').innerHTML = `
    <div class="sb-notice-editor">
      <div class="sb-notice-header">
        <div class="sb-notice-label">${label} HTML</div>
        <div class="sb-notice-status ${unsaved?'unsaved':''}" id="fullpageStatus">${unsaved?'● Unsaved':'✓ Saved'}</div>
      </div>
      <textarea class="sb-notice-body" id="fullpageBody" oninput="updateFullpagePreview('${which}')" placeholder="Enter full HTML...">${escapeHtml(body)}</textarea>
      <div class="sb-notice-hint">Full 540×960 canvas. No auto-logo/footer.</div>
      <div class="sb-notice-actions">
        <button class="sb-btn-clear" onclick="clearFullpage('${which}')">Clear</button>
        <button class="sb-btn-save" id="saveFullpageBtn" onclick="saveFullpage('${which}')">💾 Save Fullpage</button>
      </div>
    </div>`;
}

function renderFullpagePreview(which) {
  const body = which==='A' ? fullpageBodyA : fullpageBodyB;
  const label = which==='A' ? 'Fullpage A' : 'Fullpage B';
  document.getElementById('rightPanel').innerHTML = `
    <div class="sb-right-label">Preview · 540 × 960 (${label})</div>
    <div class="sb-preview-wrap">
      <div class="pv-frame fullpage" id="pvFrame">
        <div id="fullpagePreviewBody" style="width:100%;height:100%;overflow:hidden">${body||'<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ccc;font-style:italic;">Fullpage preview will appear here...</div>'}</div>
      </div>
      <div class="sb-jpeg-row"><button class="sb-btn-jpeg" onclick="downloadJPEG()">Download JPEG (540×960)</button></div>
    </div>`;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function hasUnsaved() {
  if (activeTab===FULLPAGE_PAGE_A) return fullpageBodyA!==savedFullpageBodyA;
  if (activeTab===FULLPAGE_PAGE_B) return fullpageBodyB!==savedFullpageBodyB;
  return false;
}

window.setTab = (t) => {
  if (hasUnsaved()) {
    if (!confirm('You have unsaved changes. Leave anyway?')) return;
    if (activeTab===FULLPAGE_PAGE_A) fullpageBodyA=savedFullpageBodyA;
    if (activeTab===FULLPAGE_PAGE_B) fullpageBodyB=savedFullpageBodyB;
  }
  activeTab = t; render();
};

window.updateFullpagePreview = (which) => {
  const val = document.getElementById('fullpageBody').value;
  if (which==='A') fullpageBodyA=val; else fullpageBodyB=val;
  const el = document.getElementById('fullpagePreviewBody');
  if (el) el.innerHTML = val||'<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ccc;font-style:italic;">Fullpage preview will appear here...</div>';
  updateFullpageStatus(which);
};

function updateFullpageStatus(which) {
  const el = document.getElementById('fullpageStatus');
  if (!el) return;
  const body = which==='A' ? fullpageBodyA : fullpageBodyB;
  const saved = which==='A' ? savedFullpageBodyA : savedFullpageBodyB;
  const unsaved = body!==saved;
  el.className = 'sb-notice-status'+(unsaved?' unsaved':'');
  el.textContent = unsaved?'● Unsaved':'✓ Saved';
}

window.saveFullpage = async (which) => {
  const btn = document.getElementById('saveFullpageBtn');
  btn.disabled=true; btn.textContent='Saving...';
  try {
    const table = which==='A' ? 'signboard_fullpage' : 'signboard_fullpage2';
    const content = which==='A' ? fullpageBodyA : fullpageBodyB;
    const { error } = await supabase.from(table).upsert({ id:1, content, updated_at: new Date().toISOString() });
    if (error) throw error;
    if (which==='A') savedFullpageBodyA=fullpageBodyA; else savedFullpageBodyB=fullpageBodyB;
    updateFullpageStatus(which);
    showToast('Fullpage saved');
  } catch(e) { showToast('Error: '+e.message, true); }
  finally { btn.disabled=false; btn.textContent='💾 Save Fullpage'; }
};

window.clearFullpage = (which) => {
  if (!confirm('Clear all fullpage content?')) return;
  if (which==='A') fullpageBodyA=''; else fullpageBodyB='';
  document.getElementById('fullpageBody').value='';
  const el = document.getElementById('fullpagePreviewBody');
  if (el) el.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ccc;font-style:italic;">Fullpage preview will appear here...</div>';
  updateFullpageStatus(which);
};

window.openAddModal = () => {
  if (activeTab<1||activeTab>TOTAL_DIRECTORY_PAGES) { showToast('Add entry only works on Page 1–6',true); return; }
  document.getElementById('modalTitle').textContent='Add Entry';
  document.getElementById('editId').value='';
  document.getElementById('fPage').value=activeTab;
  document.getElementById('fFloor').value='GROUND';
  updateUnitOptions();
  document.getElementById('fBiz').value='';
  document.getElementById('fAlt').value='';
  document.getElementById('fSub').value='';
  document.getElementById('fUnit').value='';
  document.getElementById('fSort').value='1';
  document.getElementById('entryModal').classList.add('open');
};

window.openEditModal = (id) => {
  const e = allEntries.find(x=>x.id===id);
  if (!e) return;
  document.getElementById('modalTitle').textContent='Edit Entry';
  document.getElementById('editId').value=e.id;
  document.getElementById('fPage').value=e.page;
  document.getElementById('fFloor').value=e.floor;
  updateUnitOptions(e.unit_display);
  document.getElementById('fBiz').value=e.business_name;
  document.getElementById('fAlt').value=e.display_name_alt||'';
  document.getElementById('fSub').value=e.sub_info||'';
  document.getElementById('fUnit').value=e.unit_display;
  document.getElementById('fSort').value=e.sort_order;
  document.getElementById('entryModal').classList.add('open');
};

window.closeEntryModal = () => { document.getElementById('entryModal').classList.remove('open'); };

window.saveEntry = async () => {
  const id = document.getElementById('editId').value;
  const obj = {
    page: parseInt(document.getElementById('fPage').value),
    floor: document.getElementById('fFloor').value,
    business_name: document.getElementById('fBiz').value.trim(),
    display_name_alt: document.getElementById('fAlt').value.trim()||null,
    sub_info: document.getElementById('fSub').value.trim()||null,
    unit_display: document.getElementById('fUnit').value.trim(),
    sort_order: parseInt(document.getElementById('fSort').value),
    updated_at: new Date().toISOString()
  };
  if (!obj.business_name||!obj.unit_display) { showToast('Business Name and Unit required',true); return; }
  let error;
  if (id) { ({error}=await supabase.from('signboard_entries').update(obj).eq('id',id)); }
  else { ({error}=await supabase.from('signboard_entries').insert(obj)); }
  if (error) { showToast('Error: '+error.message,true); return; }
  closeEntryModal();
  showToast(id?'Entry updated':'Entry added');
  await loadEntries();
};

window.deleteEntry = async (id) => {
  if (!confirm('Delete this entry?')) return;
  const {error} = await supabase.from('signboard_entries').delete().eq('id',id);
  if (error) { showToast('Error: '+error.message,true); return; }
  showToast('Entry deleted');
  await loadEntries();
};

window.downloadJPEG = async () => {
  const frame = document.getElementById('pvFrame');
  if (!frame) return;
  showToast('Generating JPEG (540×960)...');
  try {
    const images = frame.querySelectorAll('img');
    await Promise.all(Array.from(images).map(async (img) => {
      try {
        const src = img.getAttribute('src');
        if (!src||src.startsWith('data:')||src.startsWith('blob:')) return;
        const res = await fetch(src,{cache:'force-cache'});
        const blob = await res.blob();
        const dataUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(blob);
        });
        img.src = dataUrl;
        await new Promise((resolve) => {
          if (img.complete&&img.naturalHeight!==0) return resolve();
          img.onload=resolve; img.onerror=resolve;
          setTimeout(resolve,3000);
        });
      } catch(err) { console.warn('Image preload failed:',err); }
    }));
    await new Promise(r=>setTimeout(r,500));
    const canvas = await html2canvas(frame,{
      width:540, height:960, scale:2,
      useCORS:true, allowTaint:true,
      backgroundColor:'#ffffff', imageTimeout:15000, logging:false
    });
    const finalCanvas = document.createElement('canvas');
    finalCanvas.width=540; finalCanvas.height=960;
    const ctx2d = finalCanvas.getContext('2d');
    ctx2d.imageSmoothingEnabled=true; ctx2d.imageSmoothingQuality='high';
    ctx2d.drawImage(canvas,0,0,540,960);
    const link = document.createElement('a');
    link.download=`Signboard_Page${activeTab}.jpg`;
    link.href=finalCanvas.toDataURL('image/jpeg',0.95);
    link.click();
    showToast('JPEG downloaded! (540×960)');
  } catch(e) { showToast('Download failed: '+e.message,true); }
};

window.downloadAllJPEG = async () => {
  showToast('Generating all JPEGs...');
  const pages = [1,2,3,4,5,6,FULLPAGE_PAGE_A,FULLPAGE_PAGE_B];
  for (const p of pages) {
    activeTab=p; render();
    await new Promise(r=>setTimeout(r,600));
    await window.downloadJPEG();
    await new Promise(r=>setTimeout(r,400));
  }
  showToast('All JPEGs downloaded!');
};

function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent=msg;
  t.style.background=isError?'#991b1b':'#0f172a';
  t.style.display='block';
  setTimeout(()=>{t.style.display='none';},3000);
}

await loadEntries();
</script>
