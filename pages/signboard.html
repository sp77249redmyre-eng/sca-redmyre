<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signboard Manager – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32-v4.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon-v4.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=admin-neon-v4">
<link rel="stylesheet" href="/css/pages/signboard.css">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

























</head>
<body class="admin-neon-page">
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    <div class="sb-wrap">
      <div class="sb-top">
        <div><div class="sb-title">Signboard</div><div class="sb-sub">Lobby directory & fullpage board · 540 × 960 (전광판 규격)</div></div>
        <div class="sb-top-btns">
          <button class="sb-btn sb-btn-green" onclick="openAddModal()">+ Add entry</button>
          <button class="sb-btn sb-btn-red" onclick="downloadAllJPEG()">Download all JPEG</button>
        </div>
      </div>
      <div class="sb-tabs" id="tabBar"></div>
      <div class="sb-grid">
        <div id="leftPanel"></div>
        <div id="rightPanel"></div>
      </div>
    </div>
  </div>
</div>

<div class="sb-modal-bg" id="entryModal">
  <div class="sb-modal">
    <h3 id="modalTitle">Add Entry</h3>
    <input type="hidden" id="editId">
    <label>Page</label>
    <select id="fPage">
      <option value="1">Page 1 · G + L1</option>
      <option value="2">Page 2 · L2</option>
      <option value="3">Page 3 · L3</option>
      <option value="4">Page 4 · L4</option>
      <option value="5">Page 5 · L5</option>
      <option value="6">Page 6 · L6</option>
    </select>
    <label>Floor</label>
    <select id="fFloor" onchange="updateUnitOptions()">
      <option value="GROUND">GROUND</option>
      <option value="LEVEL 1">LEVEL 1</option>
      <option value="LEVEL 2">LEVEL 2</option>
      <option value="LEVEL 3">LEVEL 3</option>
      <option value="LEVEL 4">LEVEL 4</option>
      <option value="LEVEL 5">LEVEL 5</option>
      <option value="LEVEL 6">LEVEL 6</option>
    </select>
    <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;margin:4px 0 4px 0;">
      <div style="font-size:11px;color:#92400e;margin-bottom:6px;">아래 칸에서 글자를 드래그로 선택한 다음, 원하는 색을 클릭하세요 — 바로 적용됩니다.</div>
      <div id="colorSwatches" style="display:flex;gap:6px;flex-wrap:wrap;">
        <div class="sb-swatch" data-color="#dc2626" style="background:#dc2626"></div>
        <div class="sb-swatch" data-color="#ea580c" style="background:#ea580c"></div>
        <div class="sb-swatch" data-color="#d97706" style="background:#d97706"></div>
        <div class="sb-swatch" data-color="#16a34a" style="background:#16a34a"></div>
        <div class="sb-swatch" data-color="#0891b2" style="background:#0891b2"></div>
        <div class="sb-swatch" data-color="#2563eb" style="background:#2563eb"></div>
        <div class="sb-swatch" data-color="#7c3aed" style="background:#7c3aed"></div>
        <div class="sb-swatch" data-color="#db2777" style="background:#db2777"></div>
        <div class="sb-swatch" data-color="#0f172a" style="background:#0f172a" title="기본 검정"></div>
        <label style="width:26px;height:26px;border-radius:6px;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer;background:conic-gradient(red,orange,yellow,green,blue,violet,red);display:inline-block;position:relative;">
          <input type="color" id="fCustomColor" style="opacity:0;width:100%;height:100%;cursor:pointer;position:absolute;top:0;left:0;">
        </label>
      </div>
    </div>
    <label>Business Name (엔터로 줄바꿈)</label>
    <textarea id="fBiz" rows="2" placeholder="e.g. Redmyre Medical Centre" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif;color:#222;resize:vertical;"></textarea>
    <div style="display:flex;gap:6px;margin:4px 0 10px 0;">
      <button type="button" class="sb-btn-e" onclick="clearInlineColor('fBiz')">이 칸 색 전부 지우기</button>
    </div>
    <label>Alt Name (optional, 엔터로 줄바꿈)</label>
    <textarea id="fAlt" rows="2" placeholder="e.g. 윤중병원" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif;color:#222;resize:vertical;"></textarea>
    <div style="display:flex;gap:6px;margin:4px 0 10px 0;">
      <button type="button" class="sb-btn-e" onclick="clearInlineColor('fAlt')">이 칸 색 전부 지우기</button>
    </div>
    <label>Sub Info (optional, 엔터로 줄바꿈)</label>
    <textarea id="fSub" rows="2" placeholder="e.g. Dr A Wong&#10;Dr B Kim" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif;color:#222;resize:vertical;"></textarea>
    <div style="display:flex;gap:6px;margin:4px 0 10px 0;">
      <button type="button" class="sb-btn-e" onclick="clearInlineColor('fSub')">이 칸 색 전부 지우기</button>
    </div>
    <label>Unit Display</label>
    <select id="fUnit" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif;color:#222;"></select>
    <label>Short Name (Page 9 전체층 요약용, 비우면 Business Name 그대로 사용)</label>
    <input type="text" id="fShort" placeholder="e.g. Unification Council" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif;color:#222;">
    <label>Sort Order</label>
    <input type="number" id="fSort" value="1">
    <div class="sb-modal-btns">
      <button class="sb-btn sb-btn-cancel" onclick="closeEntryModal()">Cancel</button>
      <button class="sb-btn sb-btn-modal-save" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:9998"></div>

<script type="module" src="/js/signboard.js"></script>
</body>
</html>
