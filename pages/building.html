<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Management – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- 공통 CSS -->
<link rel="stylesheet" href="/css/style.css">
<style>
/* ── building.html 전용 스타일 ── */
.systems-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.sys-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.sys-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.07); }
.sys-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sys-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.sys-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.sys-status { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 100px; display: inline-block; }
.sys-note { font-size: 11px; color: var(--muted); margin-top: 7px; line-height: 1.4; }

@media(max-width:1100px) { .systems-grid { grid-template-columns: repeat(2, 1fr); } }
@media(max-width:768px)  { .systems-grid { grid-template-columns: 1fr 1fr; } }

/* ── View Popup ── */
.view-backdrop {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(15,23,42,0.45);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.view-backdrop.open { opacity: 1; pointer-events: all; }
.view-box {
  background: #fff;
  border-radius: 20px;
  width: 100%; max-width: 420px;
  margin: 16px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.18);
  overflow: hidden;
  transform: translateY(12px) scale(0.98);
  transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
}
.view-backdrop.open .view-box { transform: translateY(0) scale(1); }
.view-header {
  padding: 22px 22px 16px;
  display: flex; align-items: flex-start; justify-content: space-between;
  border-bottom: 1px solid #f1f5f9;
}
.view-title-row { display: flex; align-items: center; gap: 12px; }
.view-icon { width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.view-name { font-size: 20px; font-weight: 700; color: #0f172a; }
.view-close {
  width: 32px; height: 32px; border-radius: 50%;
  border: none; background: #f1f5f9; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #64748b; flex-shrink: 0;
  transition: background 0.15s;
}
.view-close:hover { background: #e2e8f0; }
.view-body { padding: 20px 22px 24px; }
.view-status-row { margin-bottom: 18px; }
.view-status-badge {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 14px; border-radius: 100px;
  font-size: 13px; font-weight: 600;
}
.view-status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.view-detail-label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.view-detail-text {
  font-size: 14px; color: #1e293b; line-height: 1.65;
  background: #f8fafc; border-radius: 12px; padding: 14px 16px;
  min-height: 60px;
}
.view-updated {
  margin-top: 16px;
  font-size: 12px; color: #94a3b8;
  display: flex; align-items: center; gap: 6px;
}
</style>
</head>
<body>

<!-- ① Sidebar 플레이스홀더 — layout.js가 자동 삽입 -->
<div id="sidebarPlaceholder"></div>

<!-- ② Main 영역 -->
<div class="main">

  <!-- ③ Topbar 플레이스홀더 — layout.js가 자동 삽입 -->
  <div id="topbarPlaceholder"></div>

  <div class="content" style="display:flex;flex-direction:column;gap:24px">

    <!-- OVERVIEW CARDS -->
    <div>
      <div class="section-hdr">
        <div class="section-title">Overview</div>
      </div>
      <div class="systems-grid">

        <a href="/pages/announcements.html" class="sys-card" style="text-decoration:none;color:inherit">
          <div class="sys-top">
            <div class="sys-icon" style="background:#eff6ff">📢</div>
            <span class="badge badge-blue" id="annCardBadge">Announcement</span>
          </div>
          <div class="sys-name" id="annCardTitle">Loading…</div>
          <div class="sys-note" id="annCardDate">—</div>
        </a>

        <a href="/pages/parking.html" class="sys-card" style="text-decoration:none;color:inherit">
          <div class="sys-top">
            <div class="sys-icon" style="background:#fef2f2">🚗</div>
            <span id="parkingCardBadge" class="badge badge-green">All Clear</span>
          </div>
          <div class="sys-name" id="parkingCardTitle">Parking</div>
          <div class="sys-note" id="parkingCardNote">No active incidents</div>
        </a>

        <a href="/pages/emergency.html" class="sys-card" style="text-decoration:none;color:inherit">
  <div class="sys-top">
    <div class="sys-icon" style="background:#fef2f2">🚨</div>
    <span class="badge badge-red">Emergency</span>
  </div>
  <div class="sys-name">Emergency Contacts</div>
  <div class="sys-note">Tap to view emergency contacts</div>
</a>

        <a href="/pages/works.html" class="sys-card" style="text-decoration:none;color:inherit">
          <div class="sys-top">
            <div class="sys-icon" style="background:#fffbeb">🔧</div>
            <span id="worksCardBadge" class="badge badge-blue">Works</span>
          </div>
          <div class="sys-name">Ongoing Works</div>
          <div class="sys-note" id="worksCardNote">Loading…</div>
        </a>

      </div>
    </div>

    <!-- BUILDING SYSTEMS -->
    <div>
      <div class="section-hdr">
        <div class="section-title">Building Systems</div>
        <button class="btn-primary" id="addCardBtn" style="display:none">+ Add System</button>
      </div>
      <div class="systems-grid" id="systemsGrid">
        <div style="padding:40px;text-align:center;color:var(--muted);font-size:13px;grid-column:span 4">Loading…</div>
      </div>
    </div>

  </div>
</div>

<!-- SYSTEM CARD MODAL -->
<div class="modal-backdrop" id="cardModal">
  <div class="modal-box">
    <div class="modal-title" id="cardModalTitle">Edit System</div>
    <input type="hidden" id="cardEditId">
    <div class="modal-field">
      <label class="modal-label">System Name</label>
      <select class="modal-select" id="cardName">
        <option value="">Select system…</option>
        <option value="Lift">🛗 Lift</option>
        <option value="HVAC">❄️ HVAC</option>
        <option value="Fire Safety (AFSS)">🔥 Fire Safety (AFSS)</option>
        <option value="Electrical">⚡ Electrical</option>
        <option value="Garage / Car Park">🚗 Garage / Car Park</option>
        <option value="Plumbing">💧 Plumbing</option>
        <option value="Stormwater / Drainage">🌊 Stormwater / Drainage</option>
        <option value="CCTV / Security">📹 CCTV / Security</option>
        <option value="Access Control">🚪 Access Control</option>
        <option value="Common Area Lighting">💡 Common Area Lighting</option>
        <option value="Waste Management">♻️ Waste Management</option>
      </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">Status</label>
      <select class="modal-select" id="cardStatus">
        <option value="normal">Normal ✅</option>
        <option value="inprog">In Progress 🔵</option>
        <option value="monitor">Monitoring ⚠️</option>
        <option value="pending">Pending 🟡</option>
        <option value="urgent">Urgent 🔴</option>
        <option value="investigation">Investigation 🟣</option>
        <option value="done">Completed ✅</option>
      </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">Note</label>
      <textarea class="modal-textarea" id="cardNote" style="min-height:100px" placeholder="Current status, ongoing works, notes…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-danger" id="deleteCardBtn" style="display:none;margin-right:auto">Delete</button>
      <button class="btn-secondary" onclick="closeModal('cardModal')">Cancel</button>
      <button class="btn-primary" id="saveCardBtn">Save →</button>
    </div>
  </div>
</div>

<!-- SYSTEM VIEW POPUP (non-admin) -->
<div class="view-backdrop" id="viewPopup" onclick="closeViewPopup(event)">
  <div class="view-box">
    <div class="view-header">
      <div class="view-title-row">
        <div class="view-icon" id="vpIcon"></div>
        <div class="view-name" id="vpName"></div>
      </div>
      <button class="view-close" onclick="document.getElementById('viewPopup').classList.remove('open')">✕</button>
    </div>
    <div class="view-body">
      <div class="view-status-row">
        <div class="view-status-badge" id="vpBadge">
          <div class="view-status-dot" id="vpDot"></div>
          <span id="vpStatusLabel"></span>
        </div>
      </div>
      <div class="view-detail-label">Details</div>
      <div class="view-detail-text" id="vpNote"></div>
      <div class="view-updated">
        <span>🕐</span>
        <span id="vpUpdated"></span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '/js/layout.js';

// layout.js 초기화 (sidebar + topbar + auth + role 제어 모두 처리)
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');

const { supabase, role } = ctx;

/* ── Admin 버튼 ── */
if (role === 'admin') {
  document.getElementById('addCardBtn').style.display = 'inline-flex';
}

/* ── Status Map ── */
const STATUS_MAP = {
  normal:      { label:'Normal',        bg:'var(--green-bg)', c:'var(--green-text)', dot:'var(--green)' },
  inprog:      { label:'In Progress',   bg:'var(--blue-50)',  c:'var(--blue-700)',   dot:'var(--blue-600)' },
  monitor:     { label:'Monitoring',    bg:'var(--yellow-bg)',c:'var(--yellow-text)',dot:'var(--yellow)' },
  pending:     { label:'Pending',       bg:'var(--yellow-bg)',c:'var(--yellow-text)',dot:'var(--yellow)' },
  investigation:{ label:'Investigation',bg:'#ede9fe',         c:'#5b21b6',           dot:'#8b5cf6' },
  urgent:      { label:'Urgent',        bg:'var(--red-bg)',   c:'var(--red-text)',   dot:'var(--red)' },
  done:        { label:'Completed',     bg:'var(--green-bg)', c:'var(--green-text)', dot:'var(--green)' },
};

const SYSTEM_ICONS = {
  'Lift':'🛗','HVAC':'❄️','Fire Safety (AFSS)':'🔥','Electrical':'⚡',
  'Garage / Car Park':'🚗','Plumbing':'💧','Stormwater / Drainage':'🌊',
  'CCTV / Security':'📹','Access Control':'🚪','Common Area Lighting':'💡',
  'Waste Management':'♻️',
};
const STATUS_BG_COLORS = {
  normal:'#ecfdf5',inprog:'#eff6ff',monitor:'#fffbeb',pending:'#fffbeb',
  urgent:'#fef2f2',investigation:'#ede9fe',done:'#ecfdf5',
};

const DEFAULT_CARDS = [
  {id:'d0',name:'Lift System',icon:'🛗',icon_bg:'#fffbeb',status:'monitor',note:'Lift 2 re-attended 16 Mar after entrapment incident. No fault found. TK Elevators monitoring.'},
  {id:'d1',name:'HVAC System',icon:'❄️',icon_bg:'#eff6ff',status:'inprog',note:'L4 condenser done. L1, L5, L6 works pending scheduling by Voyager.'},
  {id:'d2',name:'Fire Safety (AFSS)',icon:'🔥',icon_bg:'#fef2f2',status:'pending',note:'Annual Fire Safety Statement inspection due. Rectification works to follow.'},
  {id:'d3',name:'Electrical',icon:'⚡',icon_bg:'#fffbeb',status:'investigation',note:'Switchboard circuit labelling incomplete. Timer wiring fault under investigation.'},
];

let cardsData = [];
let editingCardIdx = null;

/* ── Overview Cards ── */
async function loadOverviewCards() {
  try {
    const { data: anns } = await supabase.from('announcements').select('*').order('created_at',{ascending:false}).limit(1);
    if (anns && anns.length) {
      document.getElementById('annCardTitle').textContent = anns[0].title;
      document.getElementById('annCardDate').textContent = new Date(anns[0].created_at).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
      if (anns[0].pinned) document.getElementById('annCardBadge').textContent = '📌 Pinned';
    } else {
      document.getElementById('annCardTitle').textContent = 'No announcements yet';
      document.getElementById('annCardDate').textContent = '—';
    }
  } catch(e){}

  try {
    const { data: parking } = await supabase.from('parking_reports').select('*').eq('status','active').order('created_at',{ascending:false});
    const count = parking?.length || 0;
    if (count > 0) {
      const latest = parking[0];
      document.getElementById('parkingCardBadge').className = 'badge badge-red';
      document.getElementById('parkingCardBadge').textContent = `${count} Active`;
      document.getElementById('parkingCardTitle').textContent = `🚨 ${latest.plate}`;
      document.getElementById('parkingCardNote').textContent = `${latest.location} — ${latest.violation==='disabled'?'Disabled bay':latest.violation==='occupied'?"Someone's bay":latest.violation}`;
    }
  } catch(e){}

  try {
    const { data: hvac } = await supabase.from('hvac_requests').select('*').eq('status','pending');
    const count = hvac?.length || 0;
    if (count > 0) {
      document.getElementById('hvacCardBadge').className = 'badge badge-yellow';
      document.getElementById('hvacCardBadge').textContent = `${count} Pending`;
      document.getElementById('hvacCardNote').textContent = `${hvac.filter(h=>h.type==='hot').length} too hot · ${hvac.filter(h=>h.type==='cold').length} too cold`;
    }
  } catch(e){}

  try {
    const { data: works } = await supabase.from('works').select('status,title');
    const active = works?.filter(w=>w.status!=='done') || [];
    const urgent = active.filter(w=>w.status==='urgent');
    document.getElementById('worksCardBadge').className = urgent.length ? 'badge badge-red' : active.length ? 'badge badge-yellow' : 'badge badge-green';
    document.getElementById('worksCardBadge').textContent = urgent.length ? `${urgent.length} Urgent` : `${active.length} Active`;
    document.getElementById('worksCardNote').textContent = active.length
      ? `${active.length} work${active.length!==1?'s':''} in progress`
      : 'All works completed ✓';
  } catch(e){}
}

/* ── Building System Cards ── */
async function loadCards() {
  const grid = document.getElementById('systemsGrid');
  try {
    const { data, error } = await supabase.from('building_cards').select('*').order('position');
    if (error) { cardsData = DEFAULT_CARDS; }
    else if (!data || data.length === 0) {
      const toInsert = DEFAULT_CARDS.map((c, i) => ({
        name:c.name,icon:c.icon,icon_bg:c.icon_bg,status:c.status,note:c.note,position:i
      }));
      const { data: inserted } = await supabase.from('building_cards').insert(toInsert).select();
      cardsData = inserted || DEFAULT_CARDS;
    } else {
      cardsData = data;
    }
  } catch(e) { cardsData = DEFAULT_CARDS; }

  grid.innerHTML = cardsData.map((c,i) => {
    const st = STATUS_MAP[c.status] || STATUS_MAP.normal;
    return `
      <div class="sys-card" onclick="${role==='admin'?`openEditCard(${i})`:`openViewCard(${i})`}">
        <div class="sys-top">
          <div class="sys-icon" style="background:${c.icon_bg||'#f1f5f9'}">${c.icon||'🔧'}</div>
          <div style="display:flex;align-items:center;gap:5px">
            <div style="width:8px;height:8px;border-radius:50%;background:${st.dot}"></div>
            <span style="font-size:11px;font-weight:600;color:${st.c}">${st.label}</span>
          </div>
        </div>
        <div class="sys-name">${c.name}</div>
        <div class="sys-status" style="background:${st.bg};color:${st.c}">${st.label}</div>
        <div class="sys-note">${c.note||''}</div>
        ${role==='admin'?'<div style="font-size:10px;color:var(--muted);margin-top:6px">Click to edit</div>':''}
      </div>`;
  }).join('');
}

/* ── View Popup (non-admin) ── */
window.openViewCard = (i) => {
  const c = cardsData[i];
  const st = STATUS_MAP[c.status] || STATUS_MAP.normal;
  document.getElementById('vpIcon').textContent = c.icon || '🔧';
  document.getElementById('vpIcon').style.background = c.icon_bg || '#f1f5f9';
  document.getElementById('vpName').textContent = c.name;
  document.getElementById('vpBadge').style.background = st.bg;
  document.getElementById('vpBadge').style.color = st.c;
  document.getElementById('vpDot').style.background = st.dot;
  document.getElementById('vpStatusLabel').textContent = st.label;
  document.getElementById('vpNote').textContent = c.note || 'No details available.';
  const updated = c.updated_at || c.created_at;
  document.getElementById('vpUpdated').textContent = updated
    ? 'Last updated: ' + new Date(updated).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})
    : 'Last updated: —';
  document.getElementById('viewPopup').classList.add('open');
};

window.closeViewPopup = (e) => {
  if (e.target === document.getElementById('viewPopup')) {
    document.getElementById('viewPopup').classList.remove('open');
  }
};

/* ── Card CRUD ── */
window.openAddCard = () => {
  editingCardIdx = null;
  document.getElementById('cardModalTitle').textContent = 'Add System';
  document.getElementById('cardEditId').value = '';
  document.getElementById('cardName').value = '';
  document.getElementById('cardStatus').value = 'normal';
  document.getElementById('cardNote').value = '';
  document.getElementById('deleteCardBtn').style.display = 'none';
  document.getElementById('cardModal').classList.add('open');
};

window.openEditCard = (i) => {
  if (role !== 'admin') return;
  editingCardIdx = i;
  const c = cardsData[i];
  document.getElementById('cardModalTitle').textContent = 'Edit System';
  document.getElementById('cardEditId').value = c.id||'';
  document.getElementById('cardName').value = c.name||'';
  document.getElementById('cardStatus').value = c.status||'normal';
  document.getElementById('cardNote').value = c.note||'';
  document.getElementById('deleteCardBtn').style.display = 'inline-flex';
  document.getElementById('cardModal').classList.add('open');
};

document.getElementById('addCardBtn').addEventListener('click', window.openAddCard);
document.getElementById('saveCardBtn').addEventListener('click', async () => {
  const sysName = document.getElementById('cardName').value;
  const status  = document.getElementById('cardStatus').value;
  const data = {
    name:     sysName,
    icon:     SYSTEM_ICONS[sysName] || '🔧',
    icon_bg:  STATUS_BG_COLORS[status] || '#f1f5f9',
    status:   status,
    note:     document.getElementById('cardNote').value.trim(),
    position: editingCardIdx !== null
  ? editingCardIdx
  : Date.now(),
  };
  if (!data.name) { showToast('Please enter a system name', true); return; }
  try {
    const id = document.getElementById('cardEditId').value;
    if (id && !id.startsWith('d')) {
      await supabase.from('building_cards').update(data).eq('id', id);
    } else {
      await supabase.from('building_cards').insert(data);
    }
    closeModal('cardModal');
    await loadCards();
    showToast('System card saved ✓');
  } catch(e) { showToast(e.message||'Failed to save', true); }
});

document.getElementById('deleteCardBtn').addEventListener('click', async () => {
  if (!confirm('Delete this system card?')) return;
  const id = document.getElementById('cardEditId').value;
  if (id && !id.startsWith('d')) await supabase.from('building_cards').delete().eq('id', id);
  closeModal('cardModal');
  await loadCards();
  showToast('Card deleted');
});

/* ── Init ── */
await loadOverviewCards();
await loadCards();
</script>
</body>
</html>
