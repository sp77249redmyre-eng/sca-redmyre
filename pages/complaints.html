<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resident Requests – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v4.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<style>
.ql-toolbar.ql-snow{border:0.5px solid #e2e8f0;border-radius:10px 10px 0 0;background:#f8fafc;padding:6px 8px}
.ql-container.ql-snow{border:0.5px solid #e2e8f0;border-top:none;border-radius:0 0 10px 10px;font-family:'DM Sans',sans-serif;font-size:15px;color:#0f172a}
.ql-editor{min-height:160px;padding:11px 14px}
.ql-editor.ql-blank::before{color:#94a3b8;font-style:normal}
</style>
<style>
.btn-new-request{padding:11px 22px!important;font-size:14px!important;font-weight:700!important;border-radius:10px!important;transform:scale(1.05);animation:newReqPulse 2s ease-in-out infinite;letter-spacing:0.02em}
.btn-new-request:hover{transform:scale(1.08);animation:none}
@keyframes newReqPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,0.6)}50%{box-shadow:0 0 0 10px rgba(37,99,235,0)}}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-num{font-size:26px;font-weight:600;letter-spacing:-1px}
.stat-label{font-size:12px;color:var(--muted);margin-top:3px}
.complaint-list{width:100%}
.ct{width:100%;border-collapse:separate;border-spacing:0 10px;font-size:13px}
.ct th{text-align:left;font-size:14px;font-weight:700;color:var(--text);padding:4px 14px;white-space:nowrap;letter-spacing:0.02em}
.ct tbody tr{background:var(--surface);transition:box-shadow 0.15s,transform 0.15s;cursor:pointer}
.ct tbody tr:hover{box-shadow:0 4px 14px rgba(0,0,0,0.06);transform:translateY(-1px)}
.ct td{padding:14px 14px;color:var(--text);vertical-align:middle;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.ct td:first-child{border-left:1px solid var(--border);border-top-left-radius:12px;border-bottom-left-radius:12px}
.ct td:last-child{border-right:1px solid var(--border);border-top-right-radius:12px;border-bottom-right-radius:12px}
.ct tr.status-resolved td{opacity:0.7}
.ct-title{font-size:14px;font-weight:600;color:var(--text)}
.ct-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;flex-shrink:0}
.ct-dot.open{background:var(--red)}
.ct-dot.inprog{background:var(--yellow)}
.ct-dot.resolved{background:var(--green)}
.photo-upload-area{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:all 0.15s;background:var(--bg)}
.photo-upload-area:hover{border-color:var(--blue-600);background:var(--blue-50)}
.photo-preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:8px}
.photo-preview-item{position:relative;border-radius:7px;overflow:hidden;aspect-ratio:1}
.photo-preview-item img{width:100%;height:100%;object-fit:cover}
.photo-preview-item .rm-photo{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.photo-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-top:8px}
.photo-gallery-item{border-radius:8px;overflow:hidden;aspect-ratio:1;cursor:pointer}
.photo-gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.15s}
.photo-gallery-item:hover img{transform:scale(1.05)}
.photo-lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;align-items:center;justify-content:center}
.photo-lightbox.open{display:flex}
.photo-lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain}
.photo-lightbox-close{position:fixed;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;z-index:1001}
.pdf-lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:1000;flex-direction:column;padding:16px}
.pdf-lightbox.open{display:flex}
.pdf-lightbox iframe{width:100%;flex:1;border:none;border-radius:10px;min-height:0}
@media(max-width:768px){.stats-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .ct thead{display:none}
  .ct{border-spacing:0 8px}
  .ct,.ct tbody,.ct tr{display:block;width:100%}
  .ct tr{margin-bottom:0;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
  .ct td{display:block;padding:4px 0;border:none !important;border-radius:0 !important}
}

/* Complaint Progress Bar */
.cpl-progress{display:flex;align-items:center;gap:0;margin-top:6px}
.cpl-step{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;white-space:nowrap}
.cpl-step-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.cpl-step.done .cpl-step-icon{background:#dcfce7;color:#166534}
.cpl-step.active .cpl-step-icon{background:#dbeafe;color:#1e40af;box-shadow:0 0 0 2px rgba(37,99,235,0.2)}
.cpl-step.idle .cpl-step-icon{background:#f1f5f9;color:#94a3b8}
.cpl-step.done .cpl-step-label{color:#166534}
.cpl-step.active .cpl-step-label{color:#1e40af}
.cpl-step.idle .cpl-step-label{color:#94a3b8}
.cpl-line{width:20px;height:2px;border-radius:1px;margin:0 2px}
.cpl-line.done{background:#22c55e}
.cpl-line.idle{background:#e2e8f0}

/* Unit Selection Styles */
.unit-auto-box{padding:14px 16px;background:var(--blue-50);border:1.5px solid var(--blue-200);border-radius:10px;margin-bottom:14px}
.unit-auto-label{font-size:11px;font-weight:600;color:var(--blue-600);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px}
.unit-auto-info{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.unit-auto-detail{font-size:12px;color:var(--muted)}
.unit-radio-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.unit-radio-item{display:flex;align-items:center;padding:12px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.15s}
.unit-radio-item:hover{border-color:var(--blue-400);background:var(--blue-50)}
.unit-radio-item input[type="radio"]{margin-right:12px;width:18px;height:18px;cursor:pointer}
.unit-radio-item input[type="radio"]:checked{accent-color:var(--blue-600)}
.unit-radio-item.selected{border-color:var(--blue-600);background:var(--blue-50)}
.unit-radio-info{flex:1}
.unit-radio-unit{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.unit-radio-detail{font-size:12px;color:var(--muted)}

/* Filter Bar */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:8px 16px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif}
.filter-btn:hover{border-color:var(--blue-400);color:var(--text)}
.filter-btn.active{background:var(--blue-50);border-color:var(--blue-600);color:var(--blue-600)}

/* View Tabs */
.view-tabs{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{padding:10px 18px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif}
.tab-btn:hover{border-color:var(--blue-400);color:var(--text)}
.tab-btn.active{background:var(--blue-50);border-color:var(--blue-600);color:var(--blue-600)}

/* Public Checkbox */
.public-checkbox{display:flex;align-items:center;gap:10px;padding:12px;background:var(--blue-50);border:1.5px solid var(--blue-200);border-radius:10px;cursor:pointer}
.public-checkbox input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:var(--blue-600)}
.public-checkbox-label{flex:1}
.public-checkbox-title{font-size:13px;font-weight:600;color:var(--text)}
.public-checkbox-desc{font-size:12px;color:var(--muted);margin-top:2px}

/* Public Badge */
.public-badge{display:inline-block;font-size:10px;font-weight:600;background:var(--blue-50);color:var(--blue-600);padding:2px 6px;border-radius:4px;margin-left:6px}
.yours-badge{display:inline-block;font-size:10px;font-weight:600;background:#fef3c7;color:#b45309;padding:2px 6px;border-radius:4px;margin-left:6px}

/* ───── 모바일 최적화 (PC 영향 0%) ───── */
@media(max-width:768px){
  /* 필터바 / 탭바 가로 스크롤로 정리 */
  .filter-bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
  .filter-bar::-webkit-scrollbar{display:none}
  .filter-btn{padding:8px 14px;font-size:12px;flex-shrink:0}
  .view-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
  .view-tabs::-webkit-scrollbar{display:none}
  .tab-btn{padding:9px 14px;font-size:12px;flex-shrink:0}

  /* 통계 숫자 살짝 축소 */
  .stat-num{font-size:22px}
  .stat-card{padding:12px}

  /* Detail Modal 패딩 축소 */
  #detailModal .modal-box > div[style*="padding:20px 24px"],
  #detailModal .modal-box > div[style*="padding:16px 24px"],
  #detailModal .modal-box > div[style*="padding:12px 24px"],
  #detailModal .modal-box > div[style*="padding:14px 24px"]{
    padding:14px 16px !important;
  }
  #detailModal #messageThread{padding:12px 16px}
  #detailModal #replyWrap{padding:12px 16px}
  #detailModal .modal-footer{padding:12px 16px !important}

  /* Reply textarea 모바일에선 작게 */
  #adminResponse{min-height:120px !important}
  #editMsgText{min-height:130px !important}
  #complaintBody{min-height:140px !important}

  /* 사진 갤러리 셀 축소 */
  .photo-gallery{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:5px}
  .photo-preview-grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}

  /* 사진 업로드 버튼 살짝 컴팩트 */
  #cpCameraBtn,#cpFileBtn{padding:10px 8px !important;font-size:12px !important}
  #cpCameraBtn span:first-child,#cpFileBtn span:first-child{font-size:18px !important}

  /* Progress bar 컴팩트 */
  .cpl-step-icon{width:18px;height:18px;font-size:9px}
  .cpl-step{font-size:10px}
  .cpl-line{width:14px}

  /* 모달 풀스크린 친화 */
  #complaintModal .modal-box,
  #editMsgModal .modal-box{max-height:94vh;padding:16px}
  .modal-footer{flex-direction:column-reverse;gap:8px}
  .modal-footer button{width:100%;height:46px;font-size:14px}
  #detailModal .modal-footer{flex-direction:row;flex-wrap:wrap}
  #detailModal .modal-footer button{width:auto;height:auto}

  /* Reply 액션 row */
  #replyWrap div[style*="display:flex;gap:8px;margin-top:10px"]{flex-direction:column}
  #adminStatusSelect{width:100%}

  /* Public 체크박스 패딩 축소 */
  .public-checkbox{padding:10px}
  .public-checkbox-title{font-size:12px}
  .public-checkbox-desc{font-size:11px}

  /* Unit auto/radio 박스 */
  .unit-auto-box{padding:12px}
  .unit-radio-item{padding:10px 12px}
}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">

    <!-- Page Hero -->
    <!-- Page Header -->
    <div class="page-header">
      <div class="page-header-icon">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><polyline points="2,7 12,14 22,7"/></svg>
      </div>
      <div class="page-header-body">
        <div class="page-header-title-row">
          <span class="page-header-title">Resident Requests</span>
          <button id="addComplaintBtn" style="display:none;padding:6px 14px;font-size:12px;font-weight:600;border-radius:7px;background:linear-gradient(135deg,var(--blue-800),var(--blue-600));color:#fff;border:none;cursor:pointer;font-family:'DM Sans',sans-serif">+ New Request</button>
        </div>
        <div class="page-header-sub">Submit and track maintenance requests, complaints, and service issues.</div>
      </div>
    </div>
    <div style="background:#DCFCE7;border:1px solid #86EFAC;border-radius:10px;padding:11px 24px;display:flex;align-items:flex-start;gap:10px;margin-bottom:20px">
      <span style="font-size:16px;flex-shrink:0;line-height:1.4">✅</span>
      <span style="font-size:13px;color:#166534;font-weight:600;line-height:1.4">Building management responds within 24-48 hours during business days.</span>
    </div>
    <!-- View Tabs (hidden for admin/committee/observer) -->
    <div class="view-tabs" id="viewTabs" style="display:none">
      <button class="tab-btn active" data-tab="mine">📋 My Requests</button>
      <button class="tab-btn" data-tab="public">🌐 Public Requests</button>
    </div>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="open">🔴 Open</button>
      <button class="filter-btn" data-filter="inprog">🟡 In Progress</button>
      <button class="filter-btn" data-filter="resolved">✅ Resolved</button>
    </div>
    <div class="complaint-list" id="complaintList">
      <div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">Loading…</div>
    </div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-backdrop" id="complaintModal">
  <div class="modal-box" style="max-width:640px;width:95%;max-height:92vh;overflow-y:auto">
    <div class="modal-title" id="complaintModalTitle">New Request</div>
    <input type="hidden" id="complaintEditId">
    <div class="modal-field">
      <label class="modal-label">Category</label>
      <select class="modal-select" id="complaintCategory">
        <option value="noise">🔊 Noise / Vibration</option>
        <option value="leak">💧 Leak / Plumbing</option>
        <option value="cleaning">🧹 Cleaning</option>
        <option value="parking">🚗 Parking</option>
        <option value="elevator">🛗 Elevator</option>
        <option value="access">🔒 Access / Security</option>
        <option value="hvac">❄️ HVAC / Temperature</option>
        <option value="common">🏢 Common Area</option>
        <option value="other">📝 Other</option>
      </select>
    </div>
    
    <!-- Unit Auto Selection (Single Unit) -->
    <div id="unitAutoBox" style="display:none">
      <div class="unit-auto-box">
        <div class="unit-auto-label">Your Location</div>
        <div class="unit-auto-info" id="unitAutoUnit">—</div>
        <div class="unit-auto-detail" id="unitAutoDetail">—</div>
      </div>
    </div>
    
    <!-- Unit Radio Selection (Multiple Units) -->
    <div id="unitRadioBox" style="display:none">
      <div class="modal-field">
        <label class="modal-label">Select Your Unit</label>
        <div class="unit-radio-list" id="unitRadioList"></div>
      </div>
    </div>
    
    <div class="modal-field">
      <label class="modal-label">Subject</label>
      <input class="modal-input" id="complaintTitle" placeholder="Brief description of the issue…">
    </div>
    <div class="modal-field">
      <label class="modal-label">Details</label>
      <textarea class="modal-textarea" id="complaintBody" placeholder="Please describe the issue in detail — location, time, frequency…" style="min-height:180px"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">Photos (optional)</label>
      <div style="display:flex;gap:10px;margin-top:4px">
        <button type="button" id="cpCameraBtn" style="flex:1;padding:12px;border:2px dashed var(--border);border-radius:10px;background:var(--bg);cursor:pointer;font-size:13px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:6px;transition:all 0.15s" onmouseover="this.style.borderColor='var(--blue-600)'" onmouseout="this.style.borderColor='var(--border)'">
          <span style="font-size:22px">📷</span>
          <span>Camera</span>
        </button>
        <button type="button" id="cpFileBtn" style="flex:1;padding:12px;border:2px dashed var(--border);border-radius:10px;background:var(--bg);cursor:pointer;font-size:13px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:6px;transition:all 0.15s" onmouseover="this.style.borderColor='var(--blue-600)'" onmouseout="this.style.borderColor='var(--border)'">
          <span style="font-size:22px">📁</span>
          <span>Photo / PDF</span>
        </button>
      </div>
      <input type="file" id="complaintPhotoInputCamera" accept="image/*" capture="environment" multiple style="display:none">
      <input type="file" id="complaintPhotoInputFile" accept="image/*,application/pdf" multiple style="display:none">
      <div class="photo-preview-grid" id="photoPreviewGrid"></div>
    </div>
    <div class="modal-field">
      <label class="public-checkbox">
        <input type="checkbox" id="complaintIsPublic">
        <div class="public-checkbox-label">
          <div class="public-checkbox-title">🌐 Make this request public</div>
          <div class="public-checkbox-desc">Your name will be hidden. Other residents will only see "A Resident".</div>
        </div>
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('complaintModal')">Cancel</button>
      <button class="btn-primary" id="saveComplaintBtn">Submit →</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal-box" style="max-width:720px;width:95%;min-height:600px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;padding:0">

    <div style="padding:20px 24px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
      <div>
        <div class="modal-title" style="margin-bottom:4px" id="detailModalTitle">Request Detail</div>
        <div style="font-size:13px;font-weight:500;color:var(--text)" id="detailSubmitter">—</div>
      </div>
      <span class="badge" id="detailStatusBadge"></span>
    </div>

    <div id="detailProgressWrap" style="padding:14px 24px;border-bottom:1px solid var(--border-light);flex-shrink:0"></div>

    <div style="padding:16px 24px;background:var(--bg);border-bottom:1px solid var(--border-light);flex-shrink:0">
      <div style="font-size:13px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px">Details</div>
      <div style="font-size:14px;color:#374151;line-height:1.7" id="detailBody">—</div>
    </div>



    <div id="messageThread" style="padding:16px 24px;display:flex;flex-direction:column;gap:12px;flex:1"></div>

    <div id="replyWrap" style="display:none;padding:16px 24px;border-top:1px solid var(--border-light);flex-shrink:0">
      <div style="font-size:13px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px">Your Reply</div>
      <textarea class="modal-textarea" id="adminResponse" placeholder="Type your reply…" style="min-height:180px;border-radius:10px;border-width:1.5px"></textarea>
      <div id="replyAttachWrap" style="display:none;margin-top:10px">
        <div style="font-size:13px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">Attachments (optional)</div>
        <div style="display:flex;gap:10px">
          <button type="button" id="replyCameraBtn" style="flex:1;padding:10px;border:2px dashed var(--border);border-radius:10px;background:var(--bg);cursor:pointer;font-size:13px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:4px" onmouseover="this.style.borderColor='var(--blue-600)'" onmouseout="this.style.borderColor='var(--border)'"><span style="font-size:20px">📷</span><span>Camera</span></button>
          <button type="button" id="replyFileBtn" style="flex:1;padding:10px;border:2px dashed var(--border);border-radius:10px;background:var(--bg);cursor:pointer;font-size:13px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:4px" onmouseover="this.style.borderColor='var(--blue-600)'" onmouseout="this.style.borderColor='var(--border)'"><span style="font-size:20px">📁</span><span>Photo / PDF</span></button>
        </div>
        <input type="file" id="replyPhotoInputCamera" accept="image/*" capture="environment" multiple style="display:none">
        <input type="file" id="replyPhotoInputFile" accept="image/*,application/pdf" multiple style="display:none">
        <div class="photo-preview-grid" id="replyPhotoPreviewGrid"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <select class="modal-select" id="adminStatusSelect" style="flex:1;min-width:140px;display:none">
          <option value="open">🔴 Open</option>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role, name } = ctx;
async function logActivity(action, record_id = null) {
  try {
    if (role === 'admin') return;
    await supabase.from('audit_logs').insert({
      user_email: user.email,
      user_role: role,
      action,
      record_id,
      created_at: new Date().toISOString()
    });
  } catch (e) {}
}

const canSubmit   = ['admin','committee','owner','tenant'];
const canViewAll  = ['admin','committee','observer'];
const privileged  = ['admin','committee','observer'];

if (canSubmit.includes(role))  document.getElementById('addComplaintBtn').style.display = 'inline-flex';
if (!canViewAll.includes(role)) document.getElementById('filterBar').style.display = 'none';

// 탭 표시 (admin/committee/observer는 기존대로 전체 보기 유지)
if (!canViewAll.includes(role)) {
  document.getElementById('viewTabs').style.display = 'flex';
}

// 탭 클릭 이벤트
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    if (currentTab === 'public') {
      await loadPublicComplaints();
    } else {
      renderComplaints();
    }
  });
});

const STATUS_MAP = {
  open:     { label:'Open',        cls:'badge-red' },
  inprog:   { label:'In Progress', cls:'badge-yellow' },
  resolved: { label:'Resolved',    cls:'badge-green' },
};
const CAT_EMOJI = { noise:'🔊',leak:'💧',cleaning:'🧹',parking:'🚗',elevator:'🛗',access:'🔒',hvac:'❄️',common:'🏢',other:'📝' };
const CAT_LABEL = { noise:'Noise / Vibration',leak:'Leak / Plumbing',cleaning:'Cleaning',parking:'Parking',elevator:'Elevator',access:'Access / Security',hvac:'HVAC / Temperature',common:'Common Area',other:'Other' };

let allComplaints = [];
let publicComplaints = [];
let currentFilter = 'all';
let currentTab = 'mine';
let myUnits = [];
let selectedUnit = null;
let currentComplaintId = null;
let pendingPhotos = [];
let pendingReplyPhotos = [];

async function loadComplaints() {
  let query = supabase.from('complaints').select('*').order('created_at',{ascending:false});
  if (!canViewAll.includes(role)) {
    const { data: occs } = await supabase.from('occupants')
      .select('unit, primary_email, business_email');
    const userEmail = user.email.toLowerCase();
    const matched = (occs || []).filter(o => {
      const primary = (o.primary_email || '').split(/[,;]/).map(e => e.trim().toLowerCase()).filter(Boolean);
      const business = (o.business_email || '').split(/[,;]/).map(e => e.trim().toLowerCase()).filter(Boolean);
      return primary.includes(userEmail) || business.includes(userEmail);
    });
    const unitList = [...new Set(matched.map(o => o.unit).filter(Boolean))];
    if (unitList.length) query = query.in('unit', unitList);
    else query = query.eq('user_id', user.id);
  }
  const { data } = await query;
  allComplaints = data || [];
  renderComplaints();
}

async function loadPublicComplaints() {
  const { data, error } = await supabase.rpc('get_public_complaints');
  if (error) {
    console.error('Failed to load public complaints:', error);
    publicComplaints = [];
  } else {
    publicComplaints = data || [];
  }
  renderComplaints();
}

function buildProgressBar(status) {
  const s1 = status==='open'?'active':status==='inprog'||status==='resolved'?'done':'idle';
  const s2 = status==='inprog'?'active':status==='resolved'?'done':'idle';
  const s3 = status==='resolved'?'done':'idle';
  const l1 = s1==='done'?'done':'idle';
  const l2 = s2==='done'?'done':'idle';
  return `<div class="cpl-progress">
    <div class="cpl-step ${s1}"><div class="cpl-step-icon">${s1==='done'?'✓':'📝'}</div><div class="cpl-step-label">Open</div></div>
    <div class="cpl-line ${l1}"></div>
    <div class="cpl-step ${s2}"><div class="cpl-step-icon">${s2==='done'?'✓':s2==='active'?'●':'○'}</div><div class="cpl-step-label">In Progress</div></div>
    <div class="cpl-line ${l2}"></div>
    <div class="cpl-step ${s3}"><div class="cpl-step-icon">${s3==='done'?'✅':'○'}</div><div class="cpl-step-label">Resolved</div></div>
  </div>`;
}

function renderComplaints() {
  const list = document.getElementById('complaintList');
  const isAdmin = canViewAll.includes(role);
  const isPublicTab = !isAdmin && currentTab === 'public';
  const sourceData = isPublicTab ? publicComplaints : allComplaints;
  const filtered = currentFilter==='all' ? sourceData : sourceData.filter(c=>c.status===currentFilter);
  
  if (!filtered.length) {
    const emptyTitle = isPublicTab 
      ? 'No Public Requests yet'
      : (currentFilter==='all' ? 'No Requests yet' : 'No '+currentFilter+' requests');
    const emptyDesc = isPublicTab
      ? 'Public requests from other residents will appear here.'
      : (canSubmit.includes(role) ? 'Click "+ New Request" to submit one.' : 'Check back later.');
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-title">${emptyTitle}</div><div style="font-size:13px;color:var(--muted)">${emptyDesc}</div></div>`;
    return;
  }
  
  const showSubmitter = isAdmin || isPublicTab;
  const rows = filtered.map(c => {
    const st = STATUS_MAP[c.status] || STATUS_MAP.open;
    const emoji = CAT_EMOJI[c.category] || '📝';
    const catLabel = CAT_LABEL[c.category] || c.category;
    const date = new Date(c.created_at).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
    const isOwn = c.user_id === user.id;
    
    // Public 탭에서는 완전 익명 ("A Resident"), Admin은 실제 이름
    let displayName;
    if (isPublicTab) {
      displayName = isOwn ? 'You' : 'A Resident';
    } else if (isAdmin) {
      displayName = isOwn ? 'You' : (c.submitter_name || 'Unknown');
    } else {
      displayName = isOwn ? 'You' : (c.submitter_name || 'Unknown');
    }
    const submitterCol = showSubmitter ? `<td style="font-size:13px;color:var(--text)">${displayName}</td>` : '';
    
    // 공개 요청 표시용 배지 (My Requests 탭에서 내 공개 요청 표시)
    const publicIndicator = (!isPublicTab && c.is_public) ? '<span class="public-badge">🌐 Public</span>' : '';
    const yoursIndicator = (isPublicTab && isOwn) ? '<span class="yours-badge">YOURS</span>' : '';
    
    const photoIcon = c.has_photos ? '📷' : '';
    const progressBar = buildProgressBar(c.status);
    
    const clickHandler = isPublicTab ? `openPublicDetail('${c.id}')` : `openDetail('${c.id}')`;
    
    return `<tr class="status-${c.status}" onclick="${clickHandler}">
      <td><span class="ct-dot ${c.status}"></span><span class="ct-title">${emoji} ${c.title}</span>${publicIndicator}${yoursIndicator}${progressBar}</td>
      <td style="font-size:13px;color:var(--text)">${catLabel}</td>
      ${submitterCol}
      <td style="font-size:13px;color:var(--text);white-space:nowrap">${date}</td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
      <td style="font-size:13px">${photoIcon}</td>
    </tr>`;
  }).join('');
  const submitterHeader = showSubmitter ? (isPublicTab ? '<th>From</th>' : '<th>Submitted by</th>') : '';
  list.innerHTML = `<table class="ct"><thead><tr><th>Subject</th><th>Category</th>${submitterHeader}<th>Date</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderComplaints();
  });
});

// Photo preview
document.getElementById('cpCameraBtn').addEventListener('click', () => document.getElementById('complaintPhotoInputCamera').click());
document.getElementById('cpFileBtn').addEventListener('click', () => document.getElementById('complaintPhotoInputFile').click());
document.getElementById('complaintPhotoInputCamera').addEventListener('change', (e) => previewPhotos(e.target.files));
document.getElementById('complaintPhotoInputFile').addEventListener('change', (e) => previewPhotos(e.target.files));

window.previewPhotos = (files) => {
  const grid = document.getElementById('photoPreviewGrid');
  for (const file of files) {
    if (file.size > 5*1024*1024) { showToast(`${file.name} is too large (max 5MB)`, true); continue; }
    const isPdf = file.type === 'application/pdf';
    const isImg = file.type.startsWith('image/');
    if (!isPdf && !isImg) { showToast(`${file.name}: only images or PDF allowed`, true); continue; }
    pendingPhotos.push(file);
    const idx = pendingPhotos.length - 1;
    const div = document.createElement('div');
    div.className = 'photo-preview-item';
    if (isPdf) {
      div.innerHTML = `<div style="width:100%;height:100%;background:#fef2f2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#991b1b;padding:4px;text-align:center;word-break:break-all;line-height:1.2"><div style="font-size:22px;margin-bottom:2px">📄</div><div>PDF</div></div><div class="rm-photo" data-idx="${idx}">✕</div>`;
      div.querySelector('.rm-photo').addEventListener('click', () => removePreviewPhoto(idx));
      grid.appendChild(div);
    } else {
      const reader = new FileReader();
      reader.onload = e => {
        div.innerHTML = `<img src="${e.target.result}"><div class="rm-photo" data-idx="${idx}">✕</div>`;
        div.querySelector('.rm-photo').addEventListener('click', () => removePreviewPhoto(idx));
        grid.appendChild(div);
      };
      reader.readAsDataURL(file);
    }
  }
  document.getElementById('complaintPhotoInputCamera').value = '';
  document.getElementById('complaintPhotoInputFile').value = '';
};

window.removePreviewPhoto = (idx) => {
  pendingPhotos.splice(idx, 1);
  const grid = document.getElementById('photoPreviewGrid');
  grid.innerHTML = '';
  pendingPhotos.forEach((f, i) => {
    const isPdf = f.type === 'application/pdf';
    const div = document.createElement('div');
    div.className = 'photo-preview-item';
    if (isPdf) {
      div.innerHTML = `<div style="width:100%;height:100%;background:#fef2f2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#991b1b;padding:4px;text-align:center;word-break:break-all;line-height:1.2"><div style="font-size:22px;margin-bottom:2px">📄</div><div>PDF</div></div><div class="rm-photo" data-idx="${i}">✕</div>`;
      div.querySelector('.rm-photo').addEventListener('click', () => removePreviewPhoto(i));
      grid.appendChild(div);
    } else {
      const reader = new FileReader();
      reader.onload = e => {
        div.innerHTML = `<img src="${e.target.result}"><div class="rm-photo" data-idx="${i}">✕</div>`;
        div.querySelector('.rm-photo').addEventListener('click', () => removePreviewPhoto(i));
        grid.appendChild(div);
      };
      reader.readAsDataURL(f);
    }
  });
};

// Add complaint
document.getElementById('addComplaintBtn').addEventListener('click', () => {
  document.getElementById('complaintModalTitle').textContent = 'New Request';
  document.getElementById('complaintEditId').value = '';
  document.getElementById('complaintCategory').value = 'noise';
  document.getElementById('complaintTitle').value = '';
  document.getElementById('complaintBody').value = '';
  document.getElementById('complaintIsPublic').checked = false;
  document.getElementById('photoPreviewGrid').innerHTML = '';
  pendingPhotos = [];
  renderUnitSelection();
  document.getElementById('complaintModal').classList.add('open');
  setTimeout(() => window._initQuillBody && window._initQuillBody(''), 50);
});

document.getElementById('saveComplaintBtn').addEventListener('click', async () => {
  const title    = document.getElementById('complaintTitle').value.trim();
  const body     = document.getElementById('complaintBody').value.trim();
  const category = document.getElementById('complaintCategory').value;
  const btn = document.getElementById('saveComplaintBtn');
  if (!title || !body) { showToast('Please fill in all fields', true); return; }
  
  // Get unit info
  let unitInfo = null;
  if (selectedUnit) {
    unitInfo = selectedUnit.unit;
  }
  
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const editId = document.getElementById('complaintEditId').value;
    if (editId) {
      const newIsPublic = document.getElementById('complaintIsPublic').checked;
      
      // 비공개 → 공개 전환 시 경고
      const original = allComplaints.find(x => x.id === editId);
      if (original && !original.is_public && newIsPublic) {
        btn.disabled = false; btn.textContent = 'Submit →';
        const confirmed = confirm(
          '⚠️ WARNING: Making this request public\n\n' +
          'All previous messages (your comments and management responses) will become visible to other residents.\n\n' +
          'Please make sure no sensitive information is included.\n\n' +
          'Continue?'
        );
        if (!confirmed) return;
        btn.disabled = true; btn.textContent = 'Submitting…';
      }
      
      let query = supabase.from('complaints').update({
        title, body, category,
        is_public: newIsPublic,
        updated_at: new Date().toISOString()
      }).eq('id', editId);
      if (role !== 'admin') query = query.eq('user_id', user.id);
      const { error } = await query;
      if (error) throw error;
      closeModal('complaintModal');
      await loadComplaints();
      if (currentTab === 'public') await loadPublicComplaints();
      showToast('Request updated ✓');
    } else {
      const { data: inserted, error } = await supabase.from('complaints').insert({
        title, body, category,
        user_id: user.id,
        submitter_name: name,
        submitter_role: role,
        unit: unitInfo,
        status: 'open',
        has_photos: pendingPhotos.length > 0,
        is_public: document.getElementById('complaintIsPublic').checked,
      }).select().single();
      if (error) throw error;
      // 첫 번째 메시지 insert (본문 + 사진)
      const uploadedPaths = [];
      if (pendingPhotos.length > 0) {
        for (const file of pendingPhotos) {
          const ext = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
          const path = `${inserted.id}/${fileName}`;
          const { error: upErr } = await supabase.storage.from('complaint-images').upload(path, file, { contentType: file.type });
          if (!upErr) uploadedPaths.push(path);
        }
      }
      await supabase.from('complaint_messages').insert({
        complaint_id: inserted.id,
        user_id: user.id,
        sender_name: name,
        sender_role: role,
        message: body,
        attachments: uploadedPaths
      });
      closeModal('complaintModal');
      pendingPhotos = [];
      await loadComplaints();
      await logActivity('COMPLAINT_CREATED', inserted.id);
      try {
        const { data: { session: pushSession } } = await supabase.auth.getSession();
        await fetch('/api/send-push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${pushSession.access_token}` },
          body: JSON.stringify({ target_role: 'admin', title: '📬 New Resident Request', message: `${title} — ${CAT_LABEL[category]||category}`, url: '/pages/complaints.html' })
        });
      } catch(pushErr) {}
      showToast('Request submitted ✓');
    }
  } catch(e) { showToast(e.message||'Failed to submit', true); }
  finally { btn.disabled = false; btn.textContent = 'Submit →'; }
});

// Detail modal
async function loadMessageThread(complaintId) {
  const thread = document.getElementById('messageThread');
  const { data: messages } = await supabase
    .from('complaint_messages')
    .select('*')
    .eq('complaint_id', complaintId)
    .order('created_at', { ascending: true });

  const threadMessages = (messages || []).slice(1);
  if (threadMessages.length === 0) {
    thread.innerHTML = '<div style="font-size:13px;color:var(--muted);text-align:center;padding:20px">No messages yet</div>';
    return;
  }

  thread.innerHTML = threadMessages.map(m => {
    const isAdmin = m.sender_role === 'admin';
    const isMine = m.user_id === user.id;
    const date = new Date(m.created_at).toLocaleString('en-AU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    const editBtns = isMine ? `<div style="display:flex;gap:6px;margin-top:8px"><button onclick="editMessage('${m.id}')" style="padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif">✏️ Edit</button><button onclick="deleteMessage('${m.id}')" style="padding:4px 10px;border:1px solid #fecaca;border-radius:6px;background:#fef2f2;color:#dc2626;font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif">🗑️ Delete</button></div>` : '';
    const attachments = m.attachments && m.attachments.length > 0 ? `
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:10px">
        ${m.attachments.map(path => {
          const { data: urlData } = supabase.storage.from('complaint-images').getPublicUrl(path);
          const url = urlData.publicUrl;
          const isPdf = path.toLowerCase().endsWith('.pdf');
          if (isPdf) return `<div onclick="openPdfLightbox('${url}')" style="border-radius:7px;overflow:hidden;aspect-ratio:1;background:#fef2f2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;cursor:pointer"><div style="font-size:24px">📄</div><div style="font-size:9px;color:#991b1b;text-align:center">PDF</div></div>`;
          return `<div class="photo-gallery-item"><img src="${url}" onclick="openLightbox('${url}')"></div>`;
        }).join('')}
      </div>` : '';
    return `
      <div id="msg-${m.id}" style="border-radius:10px;padding:14px 16px;${isAdmin ? 'background:#f0fdf4;border:1px solid #a7f3d0;' : 'background:var(--bg);border:1px solid var(--border-light);'}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="font-size:13px;font-weight:600;color:${isAdmin ? '#166534' : 'var(--text)'};">${m.sender_name || 'Unknown'} ${isAdmin ? '· SCA Management' : ''}</div>
          <div style="font-size:12px;color:var(--text-2)">${date}</div>
        </div>
        <div id="msgText-${m.id}" style="font-size:14px;color:#374151;line-height:1.7;white-space:pre-wrap">${m.message}</div>
        ${attachments}
        ${editBtns}
      </div>`;
  }).join('');
}

let editMsgNewPhotos = [];
let editMsgRemovedPaths = [];

window.editMessage = async function(msgId) {
  const textEl = document.getElementById('msgText-' + msgId);
  if (!textEl) return;
  document.getElementById('editMsgId').value = msgId;
  document.getElementById('editMsgText').value = textEl.textContent;
  editMsgNewPhotos = [];
  editMsgRemovedPaths = [];
  document.getElementById('editMsgNewPhotoGrid').innerHTML = '';
  // 기존 사진 로드
  const { data: msg } = await supabase.from('complaint_messages').select('attachments').eq('id', msgId).single();
  const existing = document.getElementById('editMsgExistingPhotos');
  existing.innerHTML = '';
  if (msg && msg.attachments && msg.attachments.length > 0) {

document.getElementById('saveAdminResponseBtn').addEventListener('click', async () => {

  if (!response && !status) { showToast('Please enter a reply or change status', true); return; }
  try {

      if (response) updateData.admin_response = response;
      await supabase.from('complaints').update(updateData).eq('id', currentComplaintId);
    }
    let insertedMsg = null;
    if (response) {
      const { data: _msg } = await supabase.from('complaint_messages').insert({
        complaint_id: currentComplaintId,
        user_id: user.id,
        sender_name: name,
        sender_role: role,
        message: response
      }).select('id').single();
      insertedMsg = _msg;
    }
    if (pendingReplyPhotos.length > 0 && insertedMsg) {
      const uploadedPaths = [];
      for (const f of pendingReplyPhotos) {
        const ext = f.name.split('.').pop();
        const path = `${currentComplaintId}/reply_${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
        await supabase.storage.from('complaint-images').upload(path, f, { upsert: false });
        uploadedPaths.push(path);

      await supabase.from('complaint_messages').update({ attachments: uploadedPaths }).eq('id', insertedMsg.id);
      await supabase.from('complaints').update({ has_photos: true }).eq('id', currentComplaintId);
      pendingReplyPhotos = [];

    try {

      const { data: { session: pushSession } } = await supabase.auth.getSession();

// 공개 요청용 대화 스레드 로드 (SECURITY DEFINER 함수 사용, RLS 우회)
async function loadPublicMessageThread(complaintId, isOwn) {
  const thread = document.getElementById('messageThread');
  const { data: messages, error } = await supabase.rpc('get_public_complaint_messages', { p_complaint_id: complaintId });
  
  if (error) {
    console.error('Failed to load public messages:', error);
    thread.innerHTML = '<div style="font-size:13px;color:var(--muted);text-align:center;padding:20px">Unable to load messages</div>';
    return;
  }
  
  const threadMessages = (messages || []).slice(1);
  if (threadMessages.length === 0) {
    thread.innerHTML = '<div style="font-size:13px;color:var(--muted);text-align:center;padding:20px">No messages yet</div>';
    return;
  }
  
  thread.innerHTML = threadMessages.map(m => {
    const isAdmin = m.sender_role === 'admin';
    const isMine = m.user_id === user.id;
    const date = new Date(m.created_at).toLocaleString('en-AU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    
    // 공개 요청: 요청자 이름은 "A Resident"로 익명화 (본인이 아닐 때)
    let senderName;
    if (isAdmin) {
      senderName = m.sender_name || 'Management';
    } else if (isMine) {
      senderName = `${m.sender_name || 'You'} (You)`;
    } else {
      senderName = 'A Resident';
    }
    
    const editBtns = isMine ? `<div style="display:flex;gap:6px;margin-top:8px"><button onclick="editMessage('${m.id}')" style="padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif">✏️ Edit</button><button onclick="deleteMessage('${m.id}')" style="padding:4px 10px;border:1px solid #fecaca;border-radius:6px;background:#fef2f2;color:#dc2626;font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif">🗑️ Delete</button></div>` : '';
    const attachments = m.attachments && m.attachments.length > 0 ? `
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:10px">
        ${m.attachments.map(path => {
          const { data: urlData } = supabase.storage.from('complaint-images').getPublicUrl(path);
          const url = urlData.publicUrl;
          const isPdf = path.toLowerCase().endsWith('.pdf');
          if (isPdf) return `<div onclick="openPdfLightbox('${url}')" style="border-radius:7px;overflow:hidden;aspect-ratio:1;background:#fef2f2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;cursor:pointer"><div style="font-size:24px">📄</div><div style="font-size:9px;color:#991b1b;text-align:center">PDF</div></div>`;
          return `<div class="photo-gallery-item"><img src="${url}" onclick="openLightbox('${url}')"></div>`;
        }).join('')}
      </div>` : '';
    
    return `
      <div id="msg-${m.id}" style="border-radius:10px;padding:14px 16px;${isAdmin ? 'background:#f0fdf4;border:1px solid #a7f3d0;' : 'background:var(--bg);border:1px solid var(--border-light);'}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="font-size:13px;font-weight:600;color:${isAdmin ? '#166534' : 'var(--text)'};">${senderName} ${isAdmin ? '· SCA Management' : ''}</div>
          <div style="font-size:12px;color:var(--text-2)">${date}</div>
        </div>
        <div id="msgText-${m.id}" style="font-size:14px;color:#374151;line-height:1.7;white-space:pre-wrap">${m.message}</div>
        ${attachments}
        ${editBtns}
      </div>`;
  }).join('');
}

// Load user's units from occupants table
async function loadMyUnits() {
  try {
    // 전체 occupants 가져오기
    const { data, error } = await supabase
      .from('occupants')
      .select('*');
    
    if (error) throw error;
    
    // 이메일 정확히 매칭 (콤마/세미콜론으로 구분된 이메일 처리)
    const userEmail = user.email.toLowerCase();
    myUnits = (data || []).filter(occ => {
      const primaryEmails = (occ.primary_email || '').split(/[,;]/).map(e => e.trim().toLowerCase());
      const businessEmails = (occ.business_email || '').split(/[,;]/).map(e => e.trim().toLowerCase());
      return primaryEmails.includes(userEmail) || businessEmails.includes(userEmail);
    });
  } catch (e) {
    console.error('Failed to load units:', e);
    myUnits = [];
  }
}

// Render unit selection UI
function renderUnitSelection() {
  const autoBox = document.getElementById('unitAutoBox');
  const radioBox = document.getElementById('unitRadioBox');
  
  autoBox.style.display = 'none';
  radioBox.style.display = 'none';
  
  if (myUnits.length === 1) {
    // Single unit - auto select
    selectedUnit = myUnits[0];
    document.getElementById('unitAutoUnit').textContent = `Unit ${selectedUnit.unit}`;
    document.getElementById('unitAutoDetail').textContent = `${selectedUnit.level}, ${selectedUnit.suite}${selectedUnit.business_name ? ' — ' + selectedUnit.business_name : ''}`;
    autoBox.style.display = 'block';
  } else if (myUnits.length > 1) {
    // Multiple units - show radio selection
    const list = document.getElementById('unitRadioList');
    list.innerHTML = myUnits.map((u, idx) => `
      <label class="unit-radio-item" data-idx="${idx}">
        <input type="radio" name="unitRadio" value="${idx}" ${idx === 0 ? 'checked' : ''}>
        <div class="unit-radio-info">
          <div class="unit-radio-unit">Unit ${u.unit}</div>
          <div class="unit-radio-detail">${u.level}, ${u.suite}${u.business_name ? ' — ' + u.business_name : ''}</div>
        </div>
      </label>
    `).join('');
    
    selectedUnit = myUnits[0];
    
    document.querySelectorAll('input[name="unitRadio"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const idx = parseInt(e.target.value);
        selectedUnit = myUnits[idx];
        document.querySelectorAll('.unit-radio-item').forEach(item => item.classList.remove('selected'));
        e.target.closest('.unit-radio-item').classList.add('selected');
      });
    });
    
    document.querySelector('.unit-radio-item').classList.add('selected');
    radioBox.style.display = 'block';
  } else {
    // No units
    selectedUnit = null;
  }
}

if (canSubmit.includes(role)) await loadMyUnits();
await loadComplaints();

supabase.channel('complaints-realtime')
  .on('postgres_changes', {event: '*', schema: 'public', table: 'complaints'}, async () => { 
    await loadComplaints();
    if (currentTab === 'public') await loadPublicComplaints();
  })
  .on('postgres_changes', {event: '*', schema: 'public', table: 'complaint_messages'}, async () => {
    if (currentComplaintId) {
      if (currentTab === 'public') {
        const c = publicComplaints.find(x => x.id === currentComplaintId);
        const isOwn = c ? c.user_id === user.id : false;
        await loadPublicMessageThread(currentComplaintId, isOwn);
      } else {
        await loadMessageThread(currentComplaintId);
      }
    }
  })
  .subscribe();
</script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script>
let _qBody, _qReply, _qEdit;
function _initQ(varRef, taId, placeholder, val) {
  const ta = document.getElementById(taId);
  if (!ta || !window.Quill) return;
  if (!varRef.q) {
    const d = document.createElement('div');
    ta.parentNode.insertBefore(d, ta);
    ta.style.display = 'none';
    varRef.q = new Quill(d, {theme:'snow', modules:{toolbar:[['bold','italic',{color:[]}]]}, placeholder});
    varRef.q.on('text-change', () => { ta.value = varRef.q.root.innerHTML; });
  }
  varRef.q.root.innerHTML = val || '';
  ta.value = val || '';
}
window._initQuillBody  = (v) => _initQ(_qBody  = _qBody  || {}, 'complaintBody',  'Please describe the issue in detail…', v);
window._initQuillReply = (v) => _initQ(_qReply = _qReply || {}, 'adminResponse',  'Type your reply…', v);
window._initQuillEdit  = (v) => _initQ(_qEdit  = _qEdit  || {}, 'editMsgText',    'Edit your message…', v);
</script>
