<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resident Requests – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-num{font-size:26px;font-weight:600;letter-spacing:-1px}
.stat-label{font-size:12px;color:var(--muted);margin-top:3px}
.complaint-list{display:flex;flex-direction:column;gap:10px}
.complaint-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:box-shadow 0.12s;cursor:pointer}
.complaint-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.06)}
.complaint-card.status-open{border-left:3px solid var(--red)}
.complaint-card.status-inprog{border-left:3px solid var(--yellow)}
.complaint-card.status-resolved{border-left:3px solid var(--green);opacity:0.75}
.cc-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.cc-title{font-size:14px;font-weight:600}
.cc-meta{font-size:11px;color:var(--muted);margin-top:3px}
.cc-body{font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:10px;white-space:pre-wrap}
.cc-footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border-light);flex-wrap:wrap;gap:8px}
.cc-submitter{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.photo-upload-area{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:all 0.15s;background:var(--bg)}
.photo-upload-area:hover{border-color:var(--blue-600);background:var(--blue-50)}
.photo-preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:8px}
.photo-preview-item{position:relative;border-radius:7px;overflow:hidden;aspect-ratio:1}
.photo-preview-item img{width:100%;height:100%;object-fit:cover}
.photo-preview-item .rm-photo{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.photo-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-top:8px}
.photo-gallery-item{border-radius:8px;overflow:hidden;aspect-ratio:1;cursor:pointer}
.photo-gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.15s}
.photo-gallery-item:hover img{transform:scale(1.05)}
.photo-lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;align-items:center;justify-content:center}
.photo-lightbox.open{display:flex}
.photo-lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain}
.photo-lightbox-close{position:fixed;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;z-index:1001}
@media(max-width:768px){.stats-row{grid-template-columns:repeat(2,1fr)}}

/* Unit Selection Styles */
.unit-auto-box{padding:14px 16px;background:var(--blue-50);border:1.5px solid var(--blue-200);border-radius:10px;margin-bottom:14px}
.unit-auto-label{font-size:11px;font-weight:600;color:var(--blue-600);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px}
.unit-auto-info{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.unit-auto-detail{font-size:12px;color:var(--muted)}
.unit-radio-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.unit-radio-item{display:flex;align-items:center;padding:12px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.15s}
.unit-radio-item:hover{border-color:var(--blue-400);background:var(--blue-50)}
.unit-radio-item input[type="radio"]{margin-right:12px;width:18px;height:18px;cursor:pointer}
.unit-radio-item input[type="radio"]:checked{accent-color:var(--blue-600)}
.unit-radio-item.selected{border-color:var(--blue-600);background:var(--blue-50)}
.unit-radio-info{flex:1}
.unit-radio-unit{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.unit-radio-detail{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    <div class="section-hdr">
      <div class="section-title">Resident Requests</div>
      <button class="btn-primary" id="addComplaintBtn" style="display:none">+ New Request</button>
    </div>
    <div id="statsWrap" style="display:none">
      <div class="stats-row">
        <div class="stat-card"><div class="stat-num" id="statTotal" style="color:var(--blue-600)">—</div><div class="stat-label">Total</div></div>
        <div class="stat-card"><div class="stat-num" id="statOpen" style="color:var(--red)">—</div><div class="stat-label">Open</div></div>
        <div class="stat-card"><div class="stat-num" id="statInprog" style="color:var(--yellow)">—</div><div class="stat-label">In Progress</div></div>
        <div class="stat-card"><div class="stat-num" id="statResolved" style="color:var(--green)">—</div><div class="stat-label">Resolved</div></div>
      </div>
    </div>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="open">🔴 Open</button>
      <button class="filter-btn" data-filter="inprog">🟡 In Progress</button>
      <button class="filter-btn" data-filter="resolved">✅ Resolved</button>
    </div>
    <div class="complaint-list" id="complaintList">
      <div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">Loading…</div>
    </div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-backdrop" id="complaintModal">
  <div class="modal-box">
    <div class="modal-title" id="complaintModalTitle">New Request</div>
    <input type="hidden" id="complaintEditId">
    <div class="modal-field">
      <label class="modal-label">Category</label>
      <select class="modal-select" id="complaintCategory">
        <option value="noise">🔊 Noise / Vibration</option>
        <option value="leak">💧 Leak / Plumbing</option>
        <option value="cleaning">🧹 Cleaning</option>
        <option value="parking">🚗 Parking</option>
        <option value="elevator">🛗 Elevator</option>
        <option value="access">🔒 Access / Security</option>
        <option value="hvac">❄️ HVAC / Temperature</option>
        <option value="common">🏢 Common Area</option>
        <option value="other">📝 Other</option>
      </select>
    </div>
    
    <!-- Unit Auto Selection (Single Unit) -->
    <div id="unitAutoBox" style="display:none">
      <div class="unit-auto-box">
        <div class="unit-auto-label">Your Location</div>
        <div class="unit-auto-info" id="unitAutoUnit">—</div>
        <div class="unit-auto-detail" id="unitAutoDetail">—</div>
      </div>
    </div>
    
    <!-- Unit Radio Selection (Multiple Units) -->
    <div id="unitRadioBox" style="display:none">
      <div class="modal-field">
        <label class="modal-label">Select Your Unit</label>
        <div class="unit-radio-list" id="unitRadioList"></div>
      </div>
    </div>
    
    <div class="modal-field">
      <label class="modal-label">Subject</label>
      <input class="modal-input" id="complaintTitle" placeholder="Brief description of the issue…">
    </div>
    <div class="modal-field">
      <label class="modal-label">Details</label>
      <textarea class="modal-textarea" id="complaintBody" placeholder="Please describe the issue in detail — location, time, frequency…"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">Photos (optional)</label>
      <div class="photo-upload-area" id="photoUploadArea">
        <div style="font-size:22px;margin-bottom:6px">📷</div>
        <div style="font-size:13px;color:var(--muted)">Click to add photos</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">Max 5MB per photo</div>
      </div>
      <input type="file" id="complaintPhotoInput" accept="image/*" multiple style="display:none">
      <div class="photo-preview-grid" id="photoPreviewGrid"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('complaintModal')">Cancel</button>
      <button class="btn-primary" id="saveComplaintBtn">Submit →</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div class="modal-title" style="margin-bottom:0" id="detailModalTitle">Request Detail</div>
      <span class="badge" id="detailStatusBadge"></span>
    </div>
    <div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:5px">Submitted by</div>
      <div style="font-size:13px;color:var(--text)" id="detailSubmitter">—</div>
    </div>
    <div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:5px">Details</div>
      <div style="font-size:13px;color:var(--text-2);line-height:1.6;white-space:pre-wrap" id="detailBody">—</div>
    </div>
    <div id="detailPhotosWrap" style="margin-bottom:14px;display:none">
      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px">Photos</div>
      <div class="photo-gallery" id="detailPhotoGallery"></div>
    </div>
    <div id="adminResponseWrap" style="display:none">
      <div style="border-top:1px solid var(--border-light);padding-top:16px;margin-top:4px">
        <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px">Admin Response</div>
        <textarea class="modal-textarea" id="adminResponse" placeholder="Add a response or note for the resident…" style="min-height:80px"></textarea>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <select class="modal-select" id="adminStatusSelect" style="flex:1;min-width:140px">
            <option value="open">🔴 Open</option>
            <option value="inprog">🟡 In Progress</option>
            <option value="resolved">✅ Resolved</option>
          </select>
          <button class="btn-primary" id="saveAdminResponseBtn">Save Response →</button>
        </div>
      </div>
    </div>
    <div id="existingResponseWrap" style="display:none;margin-top:12px">
      <div style="background:var(--green-bg);border:1px solid #a7f3d0;border-radius:10px;padding:12px 14px">
        <div style="font-size:11px;font-weight:600;color:var(--green-text);margin-bottom:4px">Admin Response</div>
        <div style="font-size:13px;color:var(--green-text);line-height:1.5" id="existingResponseText">—</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-danger" id="deleteComplaintBtn" style="display:none;margin-right:auto">Delete</button>
      <button class="btn-secondary" onclick="closeModal('detailModal')">Close</button>
    </div>
  </div>
</div>

<div class="photo-lightbox" id="photoLightbox" onclick="closeLightbox()">
  <div class="photo-lightbox-close" onclick="closeLightbox()">✕</div>
  <img id="lightboxImg" src="" alt="">
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role, name } = ctx;
async function logActivity(action, record_id = null) {
  try {
    if (role === 'admin') return;
    await supabase.from('audit_logs').insert({
      user_email: user.email,
      user_role: role,
      action,
      record_id,
      created_at: new Date().toISOString()
    });
  } catch (e) {}
}
await logActivity('PAGE_ENTER');
window.addEventListener('beforeunload', () => { logActivity('PAGE_EXIT'); });

const canSubmit   = ['admin','committee','owner','tenant'];
const canViewAll  = ['admin','committee','observer'];
const privileged  = ['admin','committee','observer'];

if (canSubmit.includes(role))  document.getElementById('addComplaintBtn').style.display = 'inline-flex';
if (canViewAll.includes(role)) document.getElementById('statsWrap').style.display = 'block';

const STATUS_MAP = {
  open:     { label:'Open',        cls:'badge-red' },
  inprog:   { label:'In Progress', cls:'badge-yellow' },
  resolved: { label:'Resolved',    cls:'badge-green' },
};
const CAT_EMOJI = { noise:'🔊',leak:'💧',cleaning:'🧹',parking:'🚗',elevator:'🛗',access:'🔒',hvac:'❄️',common:'🏢',other:'📝' };
const CAT_LABEL = { noise:'Noise / Vibration',leak:'Leak / Plumbing',cleaning:'Cleaning',parking:'Parking',elevator:'Elevator',access:'Access / Security',hvac:'HVAC / Temperature',common:'Common Area',other:'Other' };

let allComplaints = [];
let currentFilter = 'all';
let myUnits = [];
let selectedUnit = null;
let currentComplaintId = null;
let pendingPhotos = [];

async function loadComplaints() {
  let query = supabase.from('complaints').select('*').order('created_at',{ascending:false});
  if (!canViewAll.includes(role)) query = query.eq('user_id', user.id);
  const { data } = await query;
  allComplaints = data || [];
  if (canViewAll.includes(role)) {
    document.getElementById('statTotal').textContent    = allComplaints.length;
    document.getElementById('statOpen').textContent     = allComplaints.filter(c=>c.status==='open').length;
    document.getElementById('statInprog').textContent   = allComplaints.filter(c=>c.status==='inprog').length;
    document.getElementById('statResolved').textContent = allComplaints.filter(c=>c.status==='resolved').length;
  }
  renderComplaints();
}

function renderComplaints() {
  const list = document.getElementById('complaintList');
  const filtered = currentFilter==='all' ? allComplaints : allComplaints.filter(c=>c.status===currentFilter);
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-title">${currentFilter==='all'?'No Requests yet':'No '+currentFilter+' requests'}</div><div style="font-size:13px;color:var(--muted)">${canSubmit.includes(role)?'Click "+ New Request" to submit one.':'Check back later.'}</div></div>`;
    return;
  }
  list.innerHTML = filtered.map(c => {
    const st = STATUS_MAP[c.status] || STATUS_MAP.open;
    const emoji = CAT_EMOJI[c.category] || '📝';
    const catLabel = CAT_LABEL[c.category] || c.category;
    const date = new Date(c.created_at).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
    const isOwn = c.user_id === user.id;
    return `
      <div class="complaint-card status-${c.status}" onclick="openDetail('${c.id}')">
        <div class="cc-header">
          <div>
            <div class="cc-title">${emoji} ${c.title}</div>
            <div class="cc-meta">${catLabel} · ${date}</div>
          </div>
          <span class="badge ${st.cls}">${st.label}</span>
        </div>
        <div class="cc-body">${c.body?.length>150?c.body.substring(0,150)+'…':c.body||''}</div>
        ${c.admin_response?`<div style="background:var(--green-bg);border-radius:8px;padding:8px 12px;margin-bottom:8px"><div style="font-size:11px;font-weight:600;color:var(--green-text);margin-bottom:2px">Response</div><div style="font-size:12px;color:var(--green-text)">${c.admin_response.length>100?c.admin_response.substring(0,100)+'…':c.admin_response}</div></div>`:''}
        <div class="cc-footer">
          <div class="cc-submitter">${canViewAll.includes(role)&&!isOwn?`👤 ${c.submitter_name||'Unknown'}`:isOwn?'👤 You':''}</div>
          ${c.has_photos?'<span style="font-size:11px;color:var(--muted)">📷 Photos attached</span>':''}
        </div>
      </div>`;
  }).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderComplaints();
  });
});

// Photo preview
document.getElementById('photoUploadArea').addEventListener('click', () => document.getElementById('complaintPhotoInput').click());
document.getElementById('complaintPhotoInput').addEventListener('change', (e) => previewPhotos(e.target.files));

window.previewPhotos = (files) => {
  const grid = document.getElementById('photoPreviewGrid');
  for (const file of files) {
    if (file.size > 5*1024*1024) { showToast(`${file.name} is too large (max 5MB)`, true); continue; }
    pendingPhotos.push(file);
    const reader = new FileReader();
    reader.onload = e => {
      const idx = pendingPhotos.length - 1;
      const div = document.createElement('div');
      div.className = 'photo-preview-item';
      div.innerHTML = `<img src="${e.target.result}"><div class="rm-photo" data-idx="${idx}">✕</div>`;
      div.querySelector('.rm-photo').addEventListener('click', () => removePreviewPhoto(idx));
      grid.appendChild(div);
    };
    reader.readAsDataURL(file);
  }
  document.getElementById('complaintPhotoInput').value = '';
};

window.removePreviewPhoto = (idx) => {
  pendingPhotos.splice(idx, 1);
  const grid = document.getElementById('photoPreviewGrid');
  grid.innerHTML = '';
  pendingPhotos.forEach((f, i) => {
    const reader = new FileReader();
    reader.onload = e => {
      const div = document.createElement('div');
      div.className = 'photo-preview-item';
      div.innerHTML = `<img src="${e.target.result}"><div class="rm-photo" data-idx="${i}">✕</div>`;
      div.querySelector('.rm-photo').addEventListener('click', () => removePreviewPhoto(i));
      grid.appendChild(div);
    };
    reader.readAsDataURL(f);
  });
};

// Add complaint
document.getElementById('addComplaintBtn').addEventListener('click', () => {
  document.getElementById('complaintModalTitle').textContent = 'New Request';
  document.getElementById('complaintEditId').value = '';
  document.getElementById('complaintCategory').value = 'noise';
  document.getElementById('complaintTitle').value = '';
  document.getElementById('complaintBody').value = '';
  document.getElementById('photoPreviewGrid').innerHTML = '';
  pendingPhotos = [];
  renderUnitSelection();
  document.getElementById('complaintModal').classList.add('open');
});

document.getElementById('saveComplaintBtn').addEventListener('click', async () => {
  const title    = document.getElementById('complaintTitle').value.trim();
  const body     = document.getElementById('complaintBody').value.trim();
  const category = document.getElementById('complaintCategory').value;
  const btn = document.getElementById('saveComplaintBtn');
  if (!title || !body) { showToast('Please fill in all fields', true); return; }
  
  // Get unit info
  let unitInfo = null;
  if (selectedUnit) {
    unitInfo = selectedUnit.unit;
  }
  
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const { data: inserted, error } = await supabase.from('complaints').insert({
      title, body, category,
      user_id: user.id,
      submitter_name: name,
      submitter_role: role,
      unit: unitInfo,
      status: 'open',
      has_photos: pendingPhotos.length > 0,
    }).select().single();
    if (error) throw error;
    if (pendingPhotos.length > 0) {
      for (const file of pendingPhotos) {
        const ext = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
        await supabase.storage.from('complaint-images').upload(`${inserted.id}/${fileName}`, file, { contentType: file.type });
      }
    }
    closeModal('complaintModal');
    pendingPhotos = [];
    await loadComplaints();
    await logActivity('COMPLAINT_CREATED', inserted.id);
    showToast('Request submitted ✓');
  } catch(e) { showToast(e.message||'Failed to submit', true); }
  finally { btn.disabled = false; btn.textContent = 'Submit →'; }
});

// Detail modal
window.openDetail = async (id) => {
  const c = allComplaints.find(x => x.id === id);
  if (!c) return;
  currentComplaintId = id;
  const st = STATUS_MAP[c.status] || STATUS_MAP.open;
  const emoji = CAT_EMOJI[c.category] || '📝';
  const catLabel = CAT_LABEL[c.category] || c.category;
  const date = new Date(c.created_at).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('detailModalTitle').textContent = `${emoji} ${c.title}`;
  document.getElementById('detailStatusBadge').className = `badge ${st.cls}`;
  document.getElementById('detailStatusBadge').textContent = st.label;
  document.getElementById('detailSubmitter').textContent = `${c.submitter_name||'Unknown'} · ${catLabel} · ${date}`;
  document.getElementById('detailBody').textContent = c.body || '—';
  const photosWrap = document.getElementById('detailPhotosWrap');
  const gallery    = document.getElementById('detailPhotoGallery');
  if (c.has_photos) {
    const { data: files } = await supabase.storage.from('complaint-images').list(id);
    if (files && files.length > 0) {
      photosWrap.style.display = 'block';
      gallery.innerHTML = files.map(f => {
        const { data: urlData } = supabase.storage.from('complaint-images').getPublicUrl(`${id}/${f.name}`);
        return `<div class="photo-gallery-item"><img src="${urlData.publicUrl}" onclick="openLightbox('${urlData.publicUrl}')"></div>`;
      }).join('');
    } else { photosWrap.style.display = 'none'; }
  } else { photosWrap.style.display = 'none'; }
  const existingWrap = document.getElementById('existingResponseWrap');
  const adminWrap    = document.getElementById('adminResponseWrap');
  if (c.admin_response) {
    existingWrap.style.display = 'block';
    document.getElementById('existingResponseText').textContent = c.admin_response;
  } else { existingWrap.style.display = 'none'; }
  if (role === 'admin') {
    adminWrap.style.display = 'block';
    document.getElementById('adminResponse').value = c.admin_response || '';
    document.getElementById('adminStatusSelect').value = c.status;
    document.getElementById('deleteComplaintBtn').style.display = 'inline-flex';
  } else {
    adminWrap.style.display = 'none';
    document.getElementById('deleteComplaintBtn').style.display = 'none';
  }
  document.getElementById('detailModal').classList.add('open');
};

document.getElementById('saveAdminResponseBtn').addEventListener('click', async () => {
  const response = document.getElementById('adminResponse').value.trim();
  const status   = document.getElementById('adminStatusSelect').value;
  try {
    await supabase.from('complaints').update({ admin_response: response||null, status, updated_at: new Date().toISOString() }).eq('id', currentComplaintId);
    closeModal('detailModal');
    await loadComplaints();
    showToast('Response saved ✓');
  } catch(e) { showToast('Failed to save', true); }
});

document.getElementById('deleteComplaintBtn').addEventListener('click', async () => {
  if (!confirm('Delete this complaint?')) return;
  try {
    const { data: files } = await supabase.storage.from('complaint-images').list(currentComplaintId);
    if (files && files.length > 0) await supabase.storage.from('complaint-images').remove(files.map(f=>`${currentComplaintId}/${f.name}`));
    await supabase.from('complaints').delete().eq('id', currentComplaintId);
    closeModal('detailModal');
    await loadComplaints();
    showToast('Request deleted');
  } catch(e) { showToast('Failed to delete', true); }
});

window.openLightbox  = (url) => { document.getElementById('lightboxImg').src = url; document.getElementById('photoLightbox').classList.add('open'); };
window.closeLightbox = ()    => document.getElementById('photoLightbox').classList.remove('open');

// Load user's units from occupants table
async function loadMyUnits() {
  try {
    // 전체 occupants 가져오기
    const { data, error } = await supabase
      .from('occupants')
      .select('*');
    
    if (error) throw error;
    
    // 이메일 정확히 매칭 (콤마/세미콜론으로 구분된 이메일 처리)
    const userEmail = user.email.toLowerCase();
    myUnits = (data || []).filter(occ => {
      const primaryEmails = (occ.primary_email || '').split(/[,;]/).map(e => e.trim().toLowerCase());
      const businessEmails = (occ.business_email || '').split(/[,;]/).map(e => e.trim().toLowerCase());
      return primaryEmails.includes(userEmail) || businessEmails.includes(userEmail);
    });
  } catch (e) {
    console.error('Failed to load units:', e);
    myUnits = [];
  }
}

// Render unit selection UI
function renderUnitSelection() {
  const autoBox = document.getElementById('unitAutoBox');
  const radioBox = document.getElementById('unitRadioBox');
  
  autoBox.style.display = 'none';
  radioBox.style.display = 'none';
  
  if (myUnits.length === 1) {
    // Single unit - auto select
    selectedUnit = myUnits[0];
    document.getElementById('unitAutoUnit').textContent = `Unit ${selectedUnit.unit}`;
    document.getElementById('unitAutoDetail').textContent = `${selectedUnit.level}, ${selectedUnit.suite}${selectedUnit.business_name ? ' — ' + selectedUnit.business_name : ''}`;
    autoBox.style.display = 'block';
  } else if (myUnits.length > 1) {
    // Multiple units - show radio selection
    const list = document.getElementById('unitRadioList');
    list.innerHTML = myUnits.map((u, idx) => `
      <label class="unit-radio-item" data-idx="${idx}">
        <input type="radio" name="unitRadio" value="${idx}" ${idx === 0 ? 'checked' : ''}>
        <div class="unit-radio-info">
          <div class="unit-radio-unit">Unit ${u.unit}</div>
          <div class="unit-radio-detail">${u.level}, ${u.suite}${u.business_name ? ' — ' + u.business_name : ''}</div>
        </div>
      </label>
    `).join('');
    
    selectedUnit = myUnits[0];
    
    document.querySelectorAll('input[name="unitRadio"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const idx = parseInt(e.target.value);
        selectedUnit = myUnits[idx];
        document.querySelectorAll('.unit-radio-item').forEach(item => item.classList.remove('selected'));
        e.target.closest('.unit-radio-item').classList.add('selected');
      });
    });
    
    document.querySelector('.unit-radio-item').classList.add('selected');
    radioBox.style.display = 'block';
  } else {
    // No units
    selectedUnit = null;
  }
}

if (canSubmit.includes(role)) await loadMyUnits();
await loadComplaints();
</script>
