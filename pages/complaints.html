<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role, name } = ctx;
async function logActivity(action, record_id = null) {
  try {
    if (role === 'admin') return;
    await supabase.from('audit_logs').insert({
      user_email: user.email,
      user_role: role,
      action,
      record_id,
      created_at: new Date().toISOString()
    });
  } catch (e) {}
}

const canSubmit = ['admin','committee','owner','tenant'];
const isAdmin = role === 'admin';

if (canSubmit.includes(role)) document.getElementById('addComplaintBtn').style.display = 'inline-flex';

const STATUS_MAP = {
  open:     { label:'Open',        cls:'badge-red' },
  inprog:   { label:'In Progress', cls:'badge-yellow' },
  resolved: { label:'Resolved',    cls:'badge-green' },
};
const CAT_EMOJI = { noise:'🔊',leak:'💧',cleaning:'🧹',parking:'🚗',elevator:'🛗',access:'🔒',hvac:'❄️',common:'🏢',other:'📝' };
const CAT_LABEL = { noise:'Noise / Vibration',leak:'Leak / Plumbing',cleaning:'Cleaning',parking:'Parking',elevator:'Elevator',access:'Access / Security',hvac:'HVAC / Temperature',common:'Common Area',other:'Other' };

let allComplaints = [];
let myUnits = [];
let selectedUnit = null;
let currentComplaintId = null;
let pendingPhotos = [];
let pendingReplyPhotos = [];
let expandedComplaintId = null;

// Unread conversation state. Stored per signed-in user without changing the DB schema,
// matching the existing HVAC request-page approach.
let unreadMessageCounts = {};
let unreadMessageLabels = {};
const COMPLAINT_READ_STATE_PREFIX = 'resident-request-read-v1:';
const COMPLAINT_FEATURE_INIT_PREFIX = 'resident-request-feature-init-v1:';
let complaintMessagesCache = {};

function getComplaintReadStateKey(reqId) {
  return `${COMPLAINT_READ_STATE_PREFIX}${user?.id || 'anonymous'}:${reqId}`;
}

function getComplaintFeatureInitKey() {
  return `${COMPLAINT_FEATURE_INIT_PREFIX}${user?.id || 'anonymous'}`;
}

function getComplaintFeatureInitAt() {
  try {
    const key = getComplaintFeatureInitKey();
    let value = localStorage.getItem(key);
    if (!value) {
      value = new Date().toISOString();
      localStorage.setItem(key, value);
    }
    return value;
  } catch (e) {
    return new Date().toISOString();
  }
}

function getComplaintLastReadAt(reqId, createdAt = null) {
  try {
    const stored = localStorage.getItem(getComplaintReadStateKey(reqId));
    if (stored) return stored;

    const featureInit = new Date(getComplaintFeatureInitAt()).getTime();
    const created = createdAt ? new Date(createdAt).getTime() : 0;
    // For Admin, a request created after this feature was introduced is a real
    // NEW request and the original resident message must remain unread until Admin opens it.
    // Other roles keep the original request as their own baseline, so they do not get NEW on themselves.
    const baselineMs = (role === 'admin' && created > featureInit)
      ? Math.max(0, created - 1)
      : (created > featureInit ? created : featureInit);
    const baseline = new Date(baselineMs || Date.now()).toISOString();
    localStorage.setItem(getComplaintReadStateKey(reqId), baseline);
    return baseline;
  } catch (e) {
    return createdAt || new Date().toISOString();
  }
}

function setComplaintLastReadAt(reqId, isoTime) {
  try { localStorage.setItem(getComplaintReadStateKey(reqId), isoTime); }
  catch (e) {}
}

function unreadIndicatorHtml(reqId) {
  const count = Number(unreadMessageCounts[reqId] || 0);
  if (!count) return '';
  // Admin sees a resident's new message as NEW. Residents see an
  // administrator's new message as REPLY. Keep the badge text explicit.
  const badgeText = role === 'admin' ? 'NEW' : 'REPLY';
  return `<span class="rr-new-badge" aria-label="${badgeText}">${badgeText}</span>`;
}

function applyUnreadVisual(reqId) {
  const card = document.querySelector(`.resident-request-card[data-cid="${reqId}"]`);
  if (!card) return;

  const hasUnread = Number(unreadMessageCounts[reqId] || 0) > 0;
  card.classList.toggle('has-unread-message', hasUnread);

  const title = card.querySelector('.resident-request-title');
  if (!title) return;
  title.querySelectorAll('.rr-new-badge').forEach(el => el.remove());
  if (hasUnread) {
    // NEW / REPLY must be a visible text badge immediately before the title.
    title.insertAdjacentHTML('afterbegin', unreadIndicatorHtml(reqId));
  }
}

function markComplaintRead(reqId) {
  const messages = complaintMessagesCache[reqId] || [];
  const newest = messages.reduce((latest, m) => {
    const ts = m?.created_at ? new Date(m.created_at).getTime() : 0;
    return ts > latest ? ts : latest;
  }, 0);
  const complaint = allComplaints.find(c => String(c.id) === String(reqId));
  const fallback = complaint?.created_at ? new Date(complaint.created_at).getTime() : Date.now();
  const readAt = new Date(newest || fallback).toISOString();
  setComplaintLastReadAt(reqId, readAt);
  unreadMessageCounts[reqId] = 0;
  unreadMessageLabels[reqId] = '';
  applyUnreadVisual(reqId);
}

async function refreshUnreadIndicators(requests) {
  const items = (requests || []).filter(r => r?.id);
  const ids = [...new Set(items.map(r => String(r.id)))];
  if (!ids.length || !user?.id) return;

  try {
    const { data, error } = await supabase.from('complaint_messages')
      .select('complaint_id, user_id, sender_role, created_at')
      .in('complaint_id', ids)
      .order('created_at', { ascending: true });
    if (error) return;

    const grouped = {};
    (data || []).forEach(m => {
      const id = String(m.complaint_id);
      (grouped[id] ||= []).push(m);
    });

    items.forEach(c => {
      const id = String(c.id);
      const messages = grouped[id] || [];
      const replies = messages.slice(1);
      const lastRead = getComplaintLastReadAt(id, c.created_at);
      const cutoff = new Date(lastRead).getTime() || 0;

      // Admin: any unread message from a non-admin sender is NEW, including the
      // original request message. Resident/owner/tenant: only unread admin replies
      // are REPLY. Do not rely on user_id, so the badge works across accounts.
      const incoming = role === 'admin'
        ? messages.filter(m => String(m.sender_role || '').toLowerCase() !== 'admin')
        : replies.filter(m => String(m.sender_role || '').toLowerCase() === 'admin');
      const unread = incoming.filter(m => {
        const ts = m.created_at ? new Date(m.created_at).getTime() : 0;
        return ts > cutoff;
      });
      unreadMessageCounts[id] = unread.length;
      unreadMessageLabels[id] = unread.length ? (role === 'admin' ? 'NEW MESSAGE' : 'NEW REPLY') : '';
      applyUnreadVisual(id);
    });
  } catch (e) {}
}

async function refreshUnreadForComplaint(id) {
  const complaint = allComplaints.find(c => String(c.id) === String(id));
  if (complaint) await refreshUnreadIndicators([complaint]);
}

async function loadComplaints(options = {}) {
  // Admin can review all requests. Every other role sees only its own requests.
  // This client-side filter is an additional restriction; database RLS must
  // enforce the same rule for actual data security.
  const refreshUnread = options.refreshUnread !== false;
  let query = supabase
    .from('complaints')
    .select('*');
  if (role !== 'admin') query = query.eq('user_id', user.id);
  const { data, error } = await query.order('created_at', { ascending: false });
  if (error) {
    console.error('Failed to load requests:', error);
    allComplaints = [];
  } else {
    allComplaints = data || [];
  }
  renderComplaints();
  // A complaints-row update (status/title/body/etc.) is not a message event.
  // Only INSERT or the message realtime channel should recalculate NEW/REPLY.
  if (refreshUnread) await refreshUnreadIndicators(allComplaints);
}

function buildProgressBar(status) {
  const s1 = status==='open'?'active':status==='inprog'||status==='resolved'?'done':'idle';
  const s2 = status==='inprog'?'active':status==='resolved'?'done':'idle';
  const s3 = status==='resolved'?'done':'idle';
  const l1 = s1==='done'?'done':'idle';
  const l2 = s2==='done'?'done':'idle';
  return `<div class="cpl-progress">
    <div class="cpl-step ${s1}"><div class="cpl-step-icon">${s1==='done'?'✓':'📝'}</div><div class="cpl-step-label">Open</div></div>
    <div class="cpl-line ${l1}"></div>
    <div class="cpl-step ${s2}"><div class="cpl-step-icon">${s2==='done'?'✓':s2==='active'?'●':'○'}</div><div class="cpl-step-label">In Progress</div></div>
    <div class="cpl-line ${l2}"></div>
    <div class="cpl-step ${s3}"><div class="cpl-step-icon">${s3==='done'?'✅':'○'}</div><div class="cpl-step-label">Resolved</div></div>
  </div>`;
}

function getRequestPreview(body) {
  const el = document.createElement('div');
  el.innerHTML = body || '';
  return String(el.textContent || el.innerText || '').replace(/\s+/g, ' ').trim();
}

function renderComplaints() {
  const list = document.getElementById('complaintList');
  // Rescue the detail box before re-rendering because openInlineDetail physically
  // moves it from #detailModal into the expanded request card.
  const modalEl = document.getElementById('detailModal');
  const boxEl = document.getElementById('detailModalBox');
  if (modalEl && boxEl && boxEl.parentElement !== modalEl) {
    modalEl.appendChild(boxEl);
  }

  const sourceData = allComplaints;

  if (!sourceData.length) {
    const emptyDesc = canSubmit.includes(role) ? 'Click "+ New Request" to submit one.' : 'Check back later.';
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-title">No Requests yet</div><div style="font-size:13px;color:var(--muted)">${emptyDesc}</div></div>`;
    return;
  }

  const cards = sourceData.map(c => {
    const st = STATUS_MAP[c.status] || STATUS_MAP.open;
    const normalizedStatus = ['open','inprog','resolved'].includes(c.status) ? c.status : 'open';
    const emoji = CAT_EMOJI[c.category] || '📝';
    const catLabel = CAT_LABEL[c.category] || c.category || 'Other';
    const dateObj = new Date(c.created_at);
    const date = dateObj.toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'});
    const time = dateObj.toLocaleTimeString('en-AU', {hour:'numeric', minute:'2-digit'});
    const isOwn = c.user_id === user.id;

    // Admin sees the real submitter. All other roles see only You / A Resident.
    const displayName = isAdmin
      ? (isOwn ? 'You' : (c.submitter_name || 'Unknown'))
      : (isOwn ? 'You' : 'A Resident');

    const unreadBadge = unreadIndicatorHtml(c.id);
    return `<div class="resident-request-card status-${normalizedStatus}${Number(unreadMessageCounts[c.id] || 0) > 0 ? ' has-unread-message' : ''}" data-cid="${c.id}" onclick="toggleDetail('${c.id}')">
      <div class="resident-request-title-wrap">
        <div class="resident-request-title">${unreadBadge}<span>${emoji} ${c.title || 'Untitled Request'}</span></div>        <div class="resident-request-meta">
          <span>${catLabel}</span><span class="resident-request-meta-sep">•</span><span>${displayName}</span><span class="resident-request-meta-sep">•</span><span>${date} ${time}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  list.innerHTML = `<div class="resident-request-list">${cards}</div>`;

  if (expandedComplaintId) {
    const stillThere = sourceData.some(c => String(c.id) === String(expandedComplaintId));
    if (stillThere) openInlineDetail(expandedComplaintId);
    else expandedComplaintId = null;
  }
}

async function openInlineDetail(id) {
  await window.openDetail(id);

  const card = document.querySelector(`.resident-request-card[data-cid="${id}"]`);
  const box = document.getElementById('detailModalBox');
  if (!card || !box) return;

  const c = allComplaints.find(x => String(x.id) === String(id));
  const status = c ? c.status : 'open';
  const PASTEL = { open:'#fecaca', inprog:'#fde68a', resolved:'#e2e8f0' };

  card.classList.add('cpl-row-expanded', `status-${status}`);
  const detailRow = document.createElement('div');
  detailRow.className = 'resident-request-detail-row';
  detailRow.innerHTML = `<div class="resident-request-detail-box status-${status}"><div id="cplDetailSlot"></div></div>`;
  card.after(detailRow);

  box.style.background = PASTEL[status] || PASTEL.open;
  document.getElementById('cplDetailSlot').appendChild(box);
}

function closeInlineDetail() {
  const modal = document.getElementById('detailModal');
  document.querySelectorAll('.resident-request-detail-row').forEach(el => {
    const box = el.querySelector('#detailModalBox');
    if (box && modal) modal.appendChild(box);
    el.remove();
  });
  document.querySelectorAll('.resident-request-card.cpl-row-expanded').forEach(el => {
    el.classList.remove('cpl-row-expanded','status-open','status-inprog','status-resolved');
  });
}

window.toggleDetail = async (id) => {
  if (String(expandedComplaintId) === String(id)) {
    closeInlineDetail();
    expandedComplaintId = null;
    return;
  }
  closeInlineDetail();
  expandedComplaintId = id;
  await openInlineDetail(id);
};

window.closeDetailPanel = () => {
  closeInlineDetail();
  expandedComplaintId = null;
};

    const isImg = file.type.startsWith('image/');
    if (!isPdf && !isImg) { showToast(`${file.name}: only images or PDF allowed`, true); continue; }
    pendingPhotos.push(file);

document.getElementById('saveComplaintBtn').addEventListener('click', async () => {
  const title    = document.getElementById('complaintTitle').value.trim();
  const body     = document.getElementById('complaintBody').value.trim();
  const category = document.getElementById('complaintCategory').value;
  const btn = document.getElementById('saveComplaintBtn');
  if (!title || !body) { showToast('Please fill in all fields', true); return; }

  // Get unit info
  let unitInfo = null;
  if (selectedUnit) {
    unitInfo = selectedUnit.unit;
  }

  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const editId = document.getElementById('complaintEditId').value;
    if (editId) {
      // All requests are private. Keep the existing database column for
      // backward compatibility and force edited requests to private.
      let query = supabase.from('complaints').update({
        title, body, category,
        is_public: false,
        updated_at: new Date().toISOString()
      }).eq('id', editId);
      if (role !== 'admin') query = query.eq('user_id', user.id);
      const { data: updatedComplaint, error } = await query.select('id').maybeSingle();
      if (error) throw error;
      if (!updatedComplaint) throw new Error('Request could not be updated.');

      // BUG FIX: newly-added photos in the Edit Request modal were being silently
      // dropped — this branch never uploaded pendingPhotos or attached them anywhere.
      // Upload them now and attach to the request's original message.
      if (pendingPhotos.length > 0) {
        try {
          const editUploadedPaths = [];
          for (const file of pendingPhotos) {
            const ext = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
            const path = `${editId}/${fileName}`;
            const { error: editUpErr } = await supabase.storage.from('complaint-images').upload(path, file, { contentType: file.type });
            if (editUpErr) throw editUpErr;
            editUploadedPaths.push(path);
          }
          const { data: firstMsg, error: firstMsgErr } = await supabase
            .from('complaint_messages')
            .select('id, attachments')
            .eq('complaint_id', editId)
            .order('created_at', { ascending: true })
            .limit(1)
            .maybeSingle();
          if (firstMsgErr) throw firstMsgErr;
          if (firstMsg) {
            const mergedAttachments = [...(Array.isArray(firstMsg.attachments) ? firstMsg.attachments : []), ...editUploadedPaths];
            const { error: attachUpdErr } = await supabase.from('complaint_messages')
              .update({ attachments: mergedAttachments })
              .eq('id', firstMsg.id);
            if (attachUpdErr) throw attachUpdErr;
            const { error: hasPhotoErr } = await supabase.from('complaints')
              .update({ has_photos: true })
              .eq('id', editId);
            if (hasPhotoErr) console.warn('has_photos flag update failed:', hasPhotoErr);
          }        } catch (photoErr) {
          console.error('Failed to attach new photos to edited request:', photoErr);
          showToast('Request updated, but new photos failed to upload', true);
        }
      }

      closeModal('complaintModal');
      pendingPhotos = [];
      await loadComplaints();
      showToast('Request updated ✓');
    } else {
      const { data: inserted, error } = await supabase.from('complaints').insert({
        title, body, category,
        user_id: user.id,
        submitter_name: name,
        submitter_role: role,
        unit: unitInfo,
        status: 'open',
        has_photos: pendingPhotos.length > 0,
        is_public: false,
      }).select().single();
      if (error) throw error;
      // 첫 번째 메시지 insert (본문 + 사진)
      const uploadedPaths = [];
      if (pendingPhotos.length > 0) {
        for (const file of pendingPhotos) {
          const ext = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
          const path = `${inserted.id}/${fileName}`;
          const { error: upErr } = await supabase.storage.from('complaint-images').upload(path, file, { contentType: file.type });
          if (upErr) throw upErr;
          uploadedPaths.push(path);
        }
      }
      const { error: messageInsertError } = await supabase.from('complaint_messages').insert({
        complaint_id: inserted.id,
        user_id: user.id,
        sender_name: name,
        sender_role: role,
        message: body,
        attachments: uploadedPaths
      });
      if (messageInsertError) {
        if (uploadedPaths.length) await supabase.storage.from('complaint-images').remove(uploadedPaths);
        await supabase.from('complaints').delete().eq('id', inserted.id).eq('user_id', user.id);
        throw messageInsertError;
      }
      closeModal('complaintModal');
      pendingPhotos = [];
      await loadComplaints();
      await logActivity('COMPLAINT_CREATED', inserted.id);
      try {
        const { data: { session: pushSession } } = await supabase.auth.getSession();
        await fetch('/api/send-push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${pushSession.access_token}` },
          body: JSON.stringify({ target_role: 'admin', title: '📬 New Resident Request', message: `${title} — ${CAT_LABEL[category]||category}`, url: '/pages/complaints.html' })
        });
      } catch(pushErr) {}
      showToast('Request submitted ✓');
    }
  } catch(e) { showToast(e.message||'Failed to submit', true); }
  finally { btn.disabled = false; btn.textContent = 'Submit →'; }
});

async function loadMessageThread(complaintId, complaint = null) {
  const thread = document.getElementById('messageThread');
  if (!complaint) complaint = allComplaints.find(x => x.id === complaintId) || null;
  const { data: messages } = await supabase
    .from('complaint_messages')
    .select('*')
    .eq('complaint_id', complaintId)
    .order('created_at', { ascending: true });
  complaintMessagesCache[complaintId] = messages || [];

  // BUG FIX: the first message carries the ORIGINAL request's photos/PDFs.
  // It's intentionally excluded from the reply thread below (its text duplicates
  // detailBody), but its attachments still need to be shown somewhere — render
  // them right under the Description box.
  const originalMsg = (messages || [])[0] || null;
  const originalAttachEl = document.getElementById('detailOriginalAttachments');
  if (originalAttachEl) originalAttachEl.innerHTML = originalMsg ? renderAttachmentsHtml(originalMsg.attachments) : '';

  const threadMessages = (messages || []).slice(1);
  if (threadMessages.length === 0) {
    thread.innerHTML = '<div style="font-size:13px;color:var(--muted);text-align:center;padding:20px">No messages yet</div>';
    markComplaintRead(complaintId);
    return;
  }

  thread.innerHTML = threadMessages.map(m => {
    const isSenderAdmin = m.sender_role === 'admin';
    const isMine = m.user_id === user.id;
    // Requests are private. Admin sees the sender's real name; residents see
    // the names within their own request conversation only.
    const displaySenderName = isSenderAdmin
      ? (isMine ? 'You' : (m.sender_name || 'SCA Management'))
      : isAdmin
        ? (isMine ? 'You' : (m.sender_name || 'Unknown'))
        : (isMine ? 'You' : (m.sender_name || 'Unknown'));
    const date = new Date(m.created_at).toLocaleString('en-AU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    const editBtns = isMine ? `<div style="display:flex;gap:6px;margin-top:8px"><button onclick="editMessage('${m.id}')" style="padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif">✏️ Edit</button><button onclick="deleteMessage('${m.id}')" style="padding:4px 10px;border:1px solid #fecaca;border-radius:6px;background:#fef2f2;color:#dc2626;font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif">🗑️ Delete</button></div>` : '';
    const attachments = m.attachments && m.attachments.length > 0 ? `
      <div style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.06em;margin-top:12px;margin-bottom:6px">📎 Attachments</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px">
        ${m.attachments.map(path => {
          const { data: urlData } = supabase.storage.from('complaint-images').getPublicUrl(path);
          const url = urlData.publicUrl;
          const isPdf = path.toLowerCase().endsWith('.pdf');
          if (isPdf) return `<div onclick="openPdfLightbox('${url}')" style="border-radius:7px;overflow:hidden;aspect-ratio:1;background:#fef2f2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;cursor:pointer"><div style="font-size:24px">📄</div><div style="font-size:9px;color:#991b1b;text-align:center">PDF</div></div>`;
          return `<div class="photo-gallery-item"><img src="${url}" onclick="openLightbox('${url}')"></div>`;
        }).join('')}
      </div>` : '';
    return `
      <div id="msg-${m.id}" style="border-radius:10px;padding:14px 16px;background:#fff;border:1px solid var(--border-light).">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="font-size:13px;font-weight:600;color:${isAdmin ? 'var(--blue-600)' : 'var(--text)'};">${displaySenderName} ${isAdmin ? '· SCA Management' : ''}</div>
          <div style="font-size:12px;color:var(--text-2)">${date}</div>
        </div>
        ${(()=>{ const hasHtml=/<[a-z][\s\S]*>/i.test(m.message||''); const rendered=hasHtml?m.message:(m.message||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); return `<div id="msgText-${m.id}" style="font-size:15px;font-weight:500;color:#0f172a;line-height:1.7">${rendered}</div>`; })()}
        ${attachments}
        ${editBtns}
      </div>`;
  }).join('');
  markComplaintRead(complaintId);
}

function handleEditMsgFiles(files) {
  const grid = document.getElementById('editMsgNewPhotoGrid');
  Array.from(files).forEach(f => {
    editMsgNewPhotos.push(f);
    const idx = editMsgNewPhotos.length - 1;
    const item = document.createElement('div');
    item.className = 'photo-preview-item';
    if (f.type === 'application/pdf') {
      const pdfUrl = URL.createObjectURL(f);
      item.innerHTML = `<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fef2f2;border-radius:7px;padding:4px;cursor:pointer" onclick="openPdfLightbox('${pdfUrl}')"><div style="font-size:24px">📄</div><div style="font-size:9px;color:#991b1b;word-break:break-all;text-align:center">${f.name}</div></div><div class="rm-photo" onclick="event.stopPropagation();removeEditNewPhoto(${idx},this)">✕</div>`;
    } else {
      const url = URL.createObjectURL(f);

    }

  });
}window.removeEditNewPhoto = (idx, el) => {
  editMsgNewPhotos[idx] = null;

};

document.getElementById('editMsgCameraBtn').addEventListener('click', () => document.getElementById('editMsgPhotoInputCamera').click());
document.getElementById('editMsgFileBtn').addEventListener('click', () => document.getElementById('editMsgPhotoInputFile').click());

document.getElementById('editMsgPhotoInputFile').addEventListener('change', e => { handleEditMsgFiles(e.target.files); e.target.value=''; });

document.getElementById('saveEditMsgBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveEditMsgBtn');
  const msgId = document.getElementById('editMsgId').value;
  const newText = document.getElementById('editMsgText').value.trim();
  if (!msgId || !newText) { showToast('Please enter a message', true); return; }
  if (btn.disabled) return;
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Saving…';
  let newlyUploadedPaths = [];
  try {
    const { data: msg, error: fetchError } = await supabase.from('complaint_messages')
      .select('attachments')
      .eq('id', msgId)
      .eq('user_id', user.id)
      .single();
    if (fetchError) throw fetchError;

    let attachments = Array.isArray(msg?.attachments) ? [...msg.attachments] : [];
    const removed = [...editMsgRemovedPaths];
    attachments = attachments.filter(path => !removed.includes(path));

    for (const f of editMsgNewPhotos.filter(Boolean)) {
      const ext = f.name.split('.').pop();
      const path = `${currentComplaintId}/reply_${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const { error: uploadError } = await supabase.storage.from('complaint-images').upload(path, f, { upsert: false });
      if (uploadError) throw uploadError;
      newlyUploadedPaths.push(path);
      attachments.push(path);
    }

    const { error: updateError } = await supabase.from('complaint_messages')
      .update({ message: newText, attachments })
      .eq('id', msgId)
      .eq('user_id', user.id);
    if (updateError) throw updateError;

    if (removed.length) {
      const { error: removeError } = await supabase.storage.from('complaint-images').remove(removed);
      if (removeError) console.warn('Old attachment cleanup failed:', removeError);
    }

    const { error: photoFlagError } = await supabase.from('complaints')
      .update({ has_photos: attachments.length > 0 })
      .eq('id', currentComplaintId);
    if (photoFlagError) console.warn('Photo flag update failed:', photoFlagError);

    closeModal('editMsgModal');
    editMsgNewPhotos = [];
    editMsgRemovedPaths = [];
    await loadMessageThread(currentComplaintId);
    showToast('Message updated ✓');
  } catch(e) {
    if (newlyUploadedPaths.length) {
      try { await supabase.storage.from('complaint-images').remove(newlyUploadedPaths); } catch(cleanupErr) {}
    }
    console.error('Failed to update message:', e);
    showToast(e?.message || 'Failed to update message', true);
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});

window.deleteMessage = async function(msgId) {

window.openDetail = async (id) => {
  const c = allComplaints.find(x => x.id === id);
  if (!c) return;
  // SAFETY NET: if #detailModalBox was ever orphaned (detached from the document by an
  // unrelated re-render), rebuild it isn't possible here, but bail out cleanly instead of
  // throwing and aborting the caller mid-flight, which used to leave the UI unresponsive.
  if (!document.getElementById('detailModalTitle')) {
    console.error('openDetail: detail modal elements missing from DOM, aborting render');
    return;
  }
  currentComplaintId = id;
  const st = STATUS_MAP[c.status] || STATUS_MAP.open;
  const emoji = CAT_EMOJI[c.category] || '📝';
  const catLabel = CAT_LABEL[c.category] || c.category;
  const date = new Date(c.created_at).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  document.getElementById('detailStatusBadge').className = `badge ${st.cls}`;
  document.getElementById('detailStatusBadge').textContent = st.label;

    replyWrap.style.display = 'block';
    replyWrap.style.background = 'transparent';
    document.getElementById('adminResponse').style.borderColor = '';
    document.getElementById('adminResponse').style.background = '#fff';
    document.getElementById('adminResponse').value = '';
    statusSel.style.display = 'block';
    statusSel.value = c.status;
    document.getElementById('deleteComplaintBtn').style.display = 'inline-flex';
    document.getElementById('editComplaintBtn').style.display = 'inline-flex';
    document.getElementById('replyAttachWrap').style.display = 'block';
    pendingReplyPhotos = [];
    document.getElementById('replyPhotoPreviewGrid').innerHTML = '';
  } else if (canSubmit.includes(role) && c.user_id === user.id) {
    replyWrap.style.display = 'block';

    document.getElementById('adminResponse').style.borderColor = '';
    document.getElementById('adminResponse').style.background = '';

};

document.getElementById('saveAdminResponseBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveAdminResponseBtn');

  // Quill writes HTML into the hidden textarea. An untouched editor is not
  // actually an empty string — it can contain `<p><br></p>`. Detect real text
  // separately so a status-only save never creates a blank reply message.
  const rawResponse = document.getElementById('adminResponse').value || '';
  const response = rawResponse.trim();
  const responseProbe = document.createElement('div');
  responseProbe.innerHTML = response;
  const responseText = (responseProbe.textContent || responseProbe.innerText || '')
    .replace(/\u00a0/g, ' ')
    .trim();
  const hasResponse = responseText.length > 0;

  const status = document.getElementById('adminStatusSelect').value || null;
  const currentComplaint = allComplaints.find(x => x.id === currentComplaintId);
  const currentStatus = currentComplaint?.status || null;
  const statusChanged = role === 'admin' && !!status && status !== currentStatus;

  // Allow: reply, attachment-only reply, or an actual status change.
  // Do not save anything when the editor is visually blank and the status
  // has not changed.
  if (!hasResponse && pendingReplyPhotos.length === 0 && !statusChanged) {
    showToast('Please enter a reply, add an attachment, or change status', true);
    return;
  }

  if (btn.disabled) return;
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Saving…';
  let insertedMsg = null;
  let uploadedPaths = [];

  try {
    if (role === 'admin' && (statusChanged || hasResponse)) {
      const updateData = { updated_at: new Date().toISOString() };
      if (statusChanged) updateData.status = status;
      if (hasResponse) updateData.admin_response = response;

      const { data: updatedComplaint, error: complaintError } = await supabase.from('complaints')
        .update(updateData).eq('id', currentComplaintId).select('id').maybeSingle();
      if (complaintError) throw complaintError;
      if (!updatedComplaint) throw new Error('Request could not be updated.');
    }

    // Create a message only when there is real reply text or an attachment.
    // A status-only save must NOT create a complaint_messages row.
    if (hasResponse || pendingReplyPhotos.length > 0) {
      const { data: msg, error: messageError } = await supabase.from('complaint_messages').insert({
        complaint_id: currentComplaintId,
        user_id: user.id,
        sender_name: name,        sender_role: role,
        message: hasResponse ? response : ''
      }).select('id').single();
      if (messageError) throw messageError;
      insertedMsg = msg;
    }

    if (pendingReplyPhotos.length > 0 && insertedMsg) {
      for (const f of pendingReplyPhotos) {
        const ext = f.name.split('.').pop();
        const path = `${currentComplaintId}/reply_${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
        const { error: uploadError } = await supabase.storage.from('complaint-images').upload(path, f, { upsert: false });
        if (uploadError) throw uploadError;
        uploadedPaths.push(path);
      }
      const { error: attachError } = await supabase.from('complaint_messages')
        .update({ attachments: uploadedPaths }).eq('id', insertedMsg.id).eq('user_id', user.id);
      if (attachError) throw attachError;
      const { error: photoFlagError } = await supabase.from('complaints')
        .update({ has_photos: true }).eq('id', currentComplaintId);
      if (photoFlagError) throw photoFlagError;
    }

    // Push notification only when an actual reply/attachment was added.
    // A status-only change should not generate a blank "New Reply" notification.
    if (hasResponse || pendingReplyPhotos.length > 0) {
      try {
        const c = allComplaints.find(x => x.id === currentComplaintId);
        const { data: { session: pushSession } } = await supabase.auth.getSession();
        if (pushSession?.access_token) {
          if (role === 'admin' && c?.user_id) {
            const pushMessage = hasResponse
              ? responseText.substring(0,80)
              : 'Management added an attachment to your request.';
            await fetch('/api/send-push', {
              method:'POST',
              headers:{'Content-Type':'application/json','Authorization':`Bearer ${pushSession.access_token}`},
              body:JSON.stringify({
                user_id:c.user_id,
                title:'📬 New Reply from Management',
                message:pushMessage,
                url:'/pages/complaints.html'
              })
            });
          } else if (role !== 'admin' && c?.user_id) {
            const pushMessage = hasResponse
              ? `${name}: ${responseText.substring(0,60)}`
              : `${name}: Added an attachment`;
            await fetch('/api/send-push', {
              method:'POST',
              headers:{'Content-Type':'application/json','Authorization':`Bearer ${pushSession.access_token}`},
              body:JSON.stringify({
                target_role:'admin',
                title:'📬 Resident Replied',
                message:pushMessage,
                url:'/pages/complaints.html'
              })
            });
          }
        }
      } catch(pushErr) {}
    }

    const hadReply = hasResponse || pendingReplyPhotos.length > 0;
    document.getElementById('adminResponse').value = '';
    pendingReplyPhotos = [];
    document.getElementById('replyPhotoPreviewGrid').innerHTML = '';
    await loadMessageThread(currentComplaintId);
    await loadComplaints();

    if (hadReply) {
      showToast('Reply sent ✓');
    } else {
      showToast('Status updated ✓');
    }
  } catch(e) {
    if (uploadedPaths.length) {
      try { await supabase.storage.from('complaint-images').remove(uploadedPaths); } catch(cleanupErr) {}
    }
    console.error('Failed to save reply/status:', e);
    showToast(e?.message || 'Failed to save', true);
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});

function handleReplyFiles(files) {
  const grid = document.getElementById('replyPhotoPreviewGrid');
  Array.from(files).forEach(f => {
    pendingReplyPhotos.push(f);
    const idx = pendingReplyPhotos.length - 1;
    const item = document.createElement('div');
    item.className = 'photo-preview-item';
    if (f.type === 'application/pdf') {
      const pdfUrl = URL.createObjectURL(f);
      item.innerHTML = `<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fef2f2;border-radius:7px;padding:4px;cursor:pointer" onclick="openPdfLightbox('${pdfUrl}')"><div style="font-size:24px">📄</div><div style="font-size:9px;color:#991b1b;word-break:break-all;text-align:center">${f.name}</div></div><div class="rm-photo" onclick="event.stopPropagation();removeReplyPhoto(${idx},this)">✕</div>`;
    } else {
      const url = URL.createObjectURL(f);
      item.innerHTML = `<img src="${url}" onclick="openLightbox('${url}')" style="cursor:pointer"><div class="rm-photo" onclick="event.stopPropagation();removeReplyPhoto(${idx},this)">✕</div>`;
    }
    grid.appendChild(item);
  });
}

window.removeReplyPhoto = (idx, el) => {
  pendingReplyPhotos[idx] = null;
  el.closest('.photo-preview-item').remove();
  pendingReplyPhotos = pendingReplyPhotos.filter(x => x !== null);
};

document.getElementById('replyPhotoInputCamera').addEventListener('change', e => { handleReplyFiles(e.target.files); e.target.value=''; });
document.getElementById('replyPhotoInputFile').addEventListener('change', e => { handleReplyFiles(e.target.files); e.target.value=''; });

document.getElementById('deleteComplaintBtn').addEventListener('click', async () => {
  if (!confirm('Delete this complaint?')) return;
  const btn = document.getElementById('deleteComplaintBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    const { data: files, error: listError } = await supabase.storage.from('complaint-images').list(currentComplaintId);
    if (listError) throw listError;
    if (files && files.length > 0) {
      const { error: removeError } = await supabase.storage.from('complaint-images').remove(files.map(f => `${currentComplaintId}/${f.name}`));
      if (removeError) throw removeError;
    }
    const { error: deleteError } = await supabase.from('complaints').delete().eq('id', currentComplaintId);
    if (deleteError) throw deleteError;
    closeInlineDetail();
    expandedComplaintId = null;
    await loadComplaints();
    showToast('Request deleted ✓');
  } catch(e) {
    console.error('Failed to delete request:', e);
    showToast(e?.message || 'Failed to delete', true);
  } finally {
    btn.disabled = false;
  }
});

// Backdrop click to close — with unsaved content warning
function handleBackdropClick(e, modalId, checkFn) {
  if (e.target.id !== modalId) return;
  if (checkFn()) {
    if (!confirm('You have unsaved content. Close anyway?')) return;
  }
  closeModal(modalId);
}

// Load user's units from occupants table
async function loadMyUnits() {
  try {
    // 전체 occupants 가져오기
    const { data, error } = await supabase
      .from('occupants')
      .select('*');

    if (error) throw error;

    // 이메일 정확히 매칭 (콤마/세미콜론으로 구분된 이메일 처리)
    const userEmail = user.email.toLowerCase();
    myUnits = (data || []).filter(occ => {
      const primaryEmails = (occ.primary_email || '').split(/[,;]/).map(e => e.trim().toLowerCase());
      const businessEmails = (occ.business_email || '').split(/[,;]/).map(e => e.trim().toLowerCase());
      return primaryEmails.includes(userEmail) || businessEmails.includes(userEmail);
    });
  } catch (e) {
    console.error('Failed to load units:', e);
    myUnits = [];
  }
}

// Render unit selection UI
function renderUnitSelection() {
  const autoBox = document.getElementById('unitAutoBox');
  const radioBox = document.getElementById('unitRadioBox');

  autoBox.style.display = 'none';
  radioBox.style.display = 'none';

  if (myUnits.length === 1) {
    // Single unit - auto select
    selectedUnit = myUnits[0];
    document.getElementById('unitAutoUnit').textContent = `Unit ${selectedUnit.unit}`;
    document.getElementById('unitAutoDetail').textContent = `${selectedUnit.level}, ${selectedUnit.suite}${selectedUnit.business_name ? ' — ' + selectedUnit.business_name : ''}`;
    autoBox.style.display = 'block';
  } else if (myUnits.length > 1) {
    // Multiple units - show radio selection
    const list = document.getElementById('unitRadioList');
    list.innerHTML = myUnits.map((u, idx) => `
      <label class="unit-radio-item" data-idx="${idx}">
        <input type="radio" name="unitRadio" value="${idx}" ${idx === 0 ? 'checked' : ''}>
        <div class="unit-radio-info">
          <div class="unit-radio-unit">Unit ${u.unit}</div>
          <div class="unit-radio-detail">${u.level}, ${u.suite}${u.business_name ? ' — ' + u.business_name : ''}</div>
        </div>
      </label>
    `).join('');

    selectedUnit = myUnits[0];

    document.querySelectorAll('input[name="unitRadio"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const idx = parseInt(e.target.value);
        selectedUnit = myUnits[idx];
        document.querySelectorAll('.unit-radio-item').forEach(item => item.classList.remove('selected'));
        e.target.closest('.unit-radio-item').classList.add('selected');
      });
    });

    document.querySelector('.unit-radio-item').classList.add('selected');
    radioBox.style.display = 'block';
  } else {
    // No units
    selectedUnit = null;
  }
}

if (canSubmit.includes(role)) await loadMyUnits();

supabase.channel('complaints-realtime')
  .on('postgres_changes', {event: '*', schema: 'public', table: 'complaints'}, async (payload) => {
    // A new complaint may create NEW for Admin. A status/title/body/admin_response
    // update must NOT create NEW or REPLY because no message was added.
    await loadComplaints({ refreshUnread: payload?.eventType === 'INSERT' });
  })
  .on('postgres_changes', {event: '*', schema: 'public', table: 'complaint_messages'}, async (payload) => {
    const complaintId = payload?.new?.complaint_id || payload?.old?.complaint_id || null;
    if (complaintId && String(currentComplaintId) === String(complaintId)) {
      await loadMessageThread(complaintId);
    }
    if (complaintId) {
      await refreshUnreadForComplaint(complaintId);
    }
  })
  .subscribe();
</script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script>
let _qBody, _qReply, _qEdit;
function _initQ(varRef, taId, placeholder, val) {
  const ta = document.getElementById(taId);
  if (!ta || !window.Quill) return;
  if (!varRef.q) {
    const d = document.createElement('div');
    ta.parentNode.insertBefore(d, ta);
    ta.style.display = 'none';
    varRef.q = new Quill(d, {theme:'snow', modules:{toolbar:[['bold','italic',{color:[]}]]}, placeholder});
    varRef.q.on('text-change', () => { ta.value = varRef.q.root.innerHTML; });
  }
  varRef.q.root.innerHTML = val || '';
  ta.value = val || '';
}
window._initQuillBody  = (v) => _initQ(_qBody  = _qBody  || {}, 'complaintBody',  'Please describe the issue in detail…', v);
window._initQuillReply = (v) => _initQ(_qReply = _qReply || {}, 'adminResponse',  'Type your reply…', v);
window._initQuillEdit  = (v) => _initQ(_qEdit  = _qEdit  || {}, 'editMsgText',    'Edit your message…', v);
</script>
