<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Management – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card-header{display:flex;flex-direction:column;gap:4px;padding:16px 20px;border-bottom:1px solid var(--border-light)}
.card-title{font-size:14px;font-weight:600}
.card-desc{font-size:12px;color:var(--muted)}
.section-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px}
.cleanup-body{padding:20px;display:flex;flex-direction:column;gap:20px}
.cleanup-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.files-found{font-size:13px;color:var(--muted)}
.files-found span{font-weight:600;color:var(--text)}
.status-box{padding:10px 14px;background:var(--bg);border:1px solid var(--border-light);border-radius:8px;font-size:13px;color:var(--muted);font-style:italic;min-height:40px;display:flex;align-items:center}
.status-box.ready{color:var(--text-2);font-style:normal}
.status-box.loading{color:var(--blue-700);font-style:normal}
.status-box.success{color:var(--green);font-style:normal}
.status-box.error{color:var(--red);font-style:normal}
.cleanup-footer{font-size:11px;color:var(--muted);padding-top:4px;border-top:1px solid var(--border-light)}
.divider{height:1px;background:var(--border-light)}
.preview-list{display:flex;flex-direction:column;gap:10px}
.preview-item{background:var(--bg);border:1px solid var(--border-light);border-radius:10px;padding:12px 14px}
.preview-item-row{display:flex;gap:6px;font-size:12px;line-height:1.6}
.preview-item-label{color:var(--muted);min-width:60px;font-weight:500}
.preview-item-val{color:var(--text);font-weight:500}
.preview-files{margin-top:8px;padding-top:8px;border-top:1px solid var(--border-light)}
.preview-files-label{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
.preview-file{font-size:11px;color:var(--text-2);padding:2px 0;display:flex;align-items:center;gap:6px}
.preview-file::before{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--muted);flex-shrink:0}
.preview-empty{font-size:13px;color:var(--muted);padding:16px 0;text-align:center}
.badge-declined{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--red-bg);color:var(--red-text)}
.badge-expired{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--amber-50);color:var(--amber-900)}
.badge-removed{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--border-light);color:var(--text-2)}
@media(max-width:768px){
  .cleanup-row{flex-direction:column;align-items:flex-start}
  .cleanup-row .btn-primary,.cleanup-row .btn-danger{width:100%}
}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">

    <div style="margin-bottom:20px">
      <div class="section-title">System Management</div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Junk Cleanup</div>
        <div class="card-desc">Remove unused files from declined / expired / removed quotes</div>
      </div>
      <div class="cleanup-body">

        <div>
          <div class="section-label">Scan</div>
          <div class="cleanup-row">
            <button class="btn-primary" id="scanBtn">Scan Junk Files</button>
            <div class="files-found">Files found: <span id="fileCount">—</span></div>
          </div>
        </div>

        <div id="previewSection" style="display:none">
          <div class="divider"></div>
          <div>
            <div class="section-label">Junk Quotes</div>
            <div class="preview-list" id="previewList"></div>
          </div>
        </div>

        <div class="divider"></div>

        <div>
          <div class="section-label">Delete</div>
          <button class="btn-danger" id="deleteBtn" disabled style="opacity:0.45;cursor:not-allowed">Delete Junk Files</button>
        </div>

        <div class="divider"></div>

        <div>
          <div class="section-label">Status</div>
          <div class="status-box ready" id="statusBox">Ready</div>
        </div>

        <div class="cleanup-footer" id="lastCleanup">Last cleanup: —</div>

      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role } = ctx;

if (role !== 'admin') { window.location.href = '/pages/building.html'; }

let junkFilePaths = [];
let junkQuoteIds = [];

function setStatus(text, type = 'ready') {
  const box = document.getElementById('statusBox');
  box.textContent = text;
  box.className = 'status-box ' + type;
}

function setDeleteBtn(enabled) {
  const btn = document.getElementById('deleteBtn');
  btn.disabled = !enabled;
  btn.style.opacity = enabled ? '1' : '0.45';
  btn.style.cursor = enabled ? 'pointer' : 'not-allowed';
}

function getFilename(path) {
  if (!path || typeof path !== 'string') return path;
  return path.split('/').pop();
}

function renderPreview(quotes) {
  const section = document.getElementById('previewSection');
  const list = document.getElementById('previewList');

  if (!quotes || !quotes.length) {
    section.style.display = 'block';
    list.innerHTML = '<div class="preview-empty">No junk quotes found</div>';
    return;
  }

  const badgeClass = { declined: 'badge-declined', expired: 'badge-expired', removed: 'badge-removed' };

  list.innerHTML = quotes.map(q => {
    let parsed = null;
    try { parsed = q.comment ? (typeof q.comment === 'string' ? JSON.parse(q.comment) : q.comment) : null; } catch {}
    const files = parsed?.files || [];
    const project = q.project || q.project_title || '—';
    const vendor = q.vendor || '—';
    const shortId = q.id ? q.id.slice(0, 8) : '—';
    const badge = badgeClass[q.status] || 'badge-removed';

    const filesHtml = files.length
      ? `<div class="preview-files">
          <div class="preview-files-label">Files</div>
          ${files.map(f => {
            const name = getFilename(typeof f === 'string' ? f : f?.path);
            return `<div class="preview-file">${name || '—'}</div>`;
          }).join('')}
        </div>`
      : `<div class="preview-files"><div class="preview-files-label" style="color:var(--muted)">Files</div><div class="preview-file" style="color:var(--muted)">No files</div></div>`;

    return `
      <div class="preview-item">
        <div class="preview-item-row"><span class="preview-item-label">Project</span><span class="preview-item-val">${project}</span></div>
        <div class="preview-item-row"><span class="preview-item-label">Vendor</span><span class="preview-item-val">${vendor}</span></div>
        <div class="preview-item-row"><span class="preview-item-label">Quote ID</span><span class="preview-item-val" style="font-family:monospace;font-size:11px">${shortId}</span></div>
        <div class="preview-item-row"><span class="preview-item-label">Status</span><span class="${badge}">${q.status}</span></div>
        ${filesHtml}
      </div>`;
  }).join('');

  section.style.display = 'block';
}

async function scanJunkFiles() {
  const scanBtn = document.getElementById('scanBtn');
  scanBtn.disabled = true;
  scanBtn.textContent = 'Scanning…';
  setStatus('Scanning...', 'loading');
  setDeleteBtn(false);
  document.getElementById('fileCount').textContent = '—';
  document.getElementById('previewSection').style.display = 'none';
  junkFilePaths = [];
  junkQuoteIds = [];

  try {
    const { data: quotes, error } = await supabase
      .from('quotes')
      .select('id, status, comment, work_status, completion_date, project, project_title, vendor')
      .in('status', ['declined', 'expired', 'removed'])
      .is('work_status', null)
      .is('completion_date', null);

    if (error) throw error;

    if (!quotes || !quotes.length) {
      document.getElementById('fileCount').textContent = '0';
      setStatus('No junk files found.', 'ready');
      setDeleteBtn(false);
      renderPreview([]);
      return;
    }

    junkFilePaths = [];
    junkQuoteIds = [];

    for (const q of quotes) {
      junkQuoteIds.push(q.id);
      if (!q.comment) continue;
      let parsed = null;
      try { parsed = typeof q.comment === 'string' ? JSON.parse(q.comment) : q.comment; } catch { continue; }
      if (!parsed) continue;
      const files = parsed.files;
      if (!files || !Array.isArray(files)) continue;
      for (const f of files) {
        if (f && typeof f === 'string') junkFilePaths.push(f);
        else if (f && f.path) junkFilePaths.push(f.path);
      }
    }

    document.getElementById('fileCount').textContent = junkFilePaths.length;
    renderPreview(quotes);

    if (junkQuoteIds.length === 0) {
      setStatus('No junk records found.', 'ready');
      setDeleteBtn(false);
    } else {
      setStatus(`${junkQuoteIds.length} quote${junkQuoteIds.length > 1 ? 's' : ''} (${junkFilePaths.length} file${junkFilePaths.length !== 1 ? 's' : ''}) ready for deletion.`, 'ready');
      setDeleteBtn(true);
    }

  } catch (e) {
    console.error('Scan error:', e);
    setStatus('Error occurred', 'error');
    showToast('Scan failed', true);
  } finally {
    scanBtn.disabled = false;
    scanBtn.textContent = 'Scan Junk Files';
  }
}

async function deleteJunkFiles() {
  if (!junkQuoteIds.length) return;
  if (!confirm(`Delete ${junkQuoteIds.length} quote${junkQuoteIds.length > 1 ? 's' : ''} and ${junkFilePaths.length} file${junkFilePaths.length !== 1 ? 's' : ''}?\nThis action cannot be undone.`)) return;

  const deleteBtn = document.getElementById('deleteBtn');
  const scanBtn = document.getElementById('scanBtn');
  deleteBtn.disabled = true;
  deleteBtn.style.opacity = '0.45';
  deleteBtn.style.cursor = 'not-allowed';
  scanBtn.disabled = true;
  setStatus('Deleting...', 'loading');

  try {
    if (junkFilePaths.length > 0) {
      const { error: storageError } = await supabase.storage
        .from('quotes')
        .remove(junkFilePaths);
      if (storageError) throw storageError;
    }

    const { error: dbError } = await supabase
      .from('quotes')
      .delete()
      .in('id', junkQuoteIds);
    if (dbError) throw dbError;

    const now = new Date();
    document.getElementById('lastCleanup').textContent =
      'Last cleanup: ' + now.toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });

    junkFilePaths = [];
    junkQuoteIds = [];
    document.getElementById('fileCount').textContent = '0';
    document.getElementById('previewSection').style.display = 'none';
    setStatus('Cleanup complete ✓', 'success');
    setDeleteBtn(false);
    showToast('Cleanup complete ✓');

  } catch (e) {
    console.error('Delete error:', e);
    setStatus('Error occurred', 'error');
    showToast('Delete failed', true);
    setDeleteBtn(true);
  } finally {
    scanBtn.disabled = false;
  }
}

document.getElementById('scanBtn').addEventListener('click', scanJunkFiles);
document.getElementById('deleteBtn').addEventListener('click', deleteJunkFiles);
</script>
</body>
</html>
