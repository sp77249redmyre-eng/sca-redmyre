<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVAC / Temperature – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.content{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.submit-form{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px}
.form-title{font-size:16px;font-weight:600;margin-bottom:4px}
.form-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.type-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.type-btn{padding:20px 16px;border-radius:12px;border:2px solid var(--border);background:var(--surface);cursor:pointer;transition:all 0.15s;text-align:center;font-family:'DM Sans',sans-serif}
.type-btn:hover{border-color:var(--blue-400);background:var(--blue-50)}
.type-btn.hot{border-color:#ef4444;background:#fef2f2}
.type-btn.cold{border-color:#3b82f6;background:#eff6ff}
.type-icon{font-size:36px;margin-bottom:8px}
.type-label{font-size:14px;font-weight:600}
.type-sub{font-size:11px;color:var(--muted);margin-top:3px}
.form-field{margin-bottom:14px}
.form-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;display:block}
.form-select{width:100%;height:44px;padding:0 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg)}
.form-select:focus{border-color:var(--blue-600);outline:none}
.form-textarea{width:100%;min-height:80px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);resize:vertical;outline:none}
.form-textarea:focus{border-color:var(--blue-600)}
.btn-submit{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:9px;background:linear-gradient(135deg,var(--blue-800),var(--blue-600));color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;width:100%;justify-content:center}
.req-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border-light)}
.req-row:last-child{border-bottom:none}
.req-info{flex:1}
.req-title{font-size:13px;font-weight:600}
.req-meta{font-size:11px;color:var(--muted);margin-top:2px}
.req-comment{font-size:11px;color:var(--text-2);margin-top:3px;font-style:italic}
.req-actions{display:flex;gap:6px;flex-shrink:0}
.limits-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--bg);border-radius:10px;margin-bottom:16px;flex-wrap:wrap}
.limits-bar label{font-size:12px;color:var(--muted);font-weight:500}
.limits-input{width:64px;height:34px;padding:0 8px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:'DM Sans',sans-serif;text-align:center}
.limits-save{padding:6px 12px;border-radius:7px;background:var(--blue-600);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.my-req-row{display:flex;align-items:start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border-light)}
.my-req-row:last-child{border-bottom:none}
.empty-state{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.filter-tabs{display:flex;gap:8px;margin-bottom:12px}
.filter-tab{padding:6px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif;color:var(--muted)}
.filter-tab.active{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
.filter-tab:hover:not(.active){border-color:var(--blue-400);color:var(--text)}
.progress-bar{display:flex;align-items:center;gap:0;margin-top:10px;padding:12px 16px;background:var(--bg);border-radius:10px}
.progress-step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;position:relative}
.progress-icon{font-size:20px;margin-bottom:2px}
.progress-label{font-size:10px;color:var(--muted);font-weight:500;text-align:center}
.progress-line{height:2px;background:var(--border);flex:1;margin:0 -4px;position:relative;top:-14px}
.progress-line.active{background:var(--blue-600)}
.step-completed .progress-icon{filter:none}
.step-active .progress-icon{animation:pulse 1.5s ease-in-out infinite}
.step-pending .progress-icon{opacity:0.3}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

/* Unit Selection Styles */
.unit-auto-box{padding:14px 16px;background:var(--blue-50);border:1.5px solid var(--blue-200);border-radius:10px;margin-bottom:18px}
.unit-auto-label{font-size:11px;font-weight:600;color:var(--blue-600);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px}
.unit-auto-info{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.unit-auto-detail{font-size:12px;color:var(--muted)}
.unit-radio-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.unit-radio-item{display:flex;align-items:center;padding:12px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.15s}
.unit-radio-item:hover{border-color:var(--blue-400);background:var(--blue-50)}
.unit-radio-item input[type="radio"]{margin-right:12px;width:18px;height:18px;cursor:pointer}
.unit-radio-item input[type="radio"]:checked{accent-color:var(--blue-600)}
.unit-radio-item.selected{border-color:var(--blue-600);background:var(--blue-50)}
.unit-radio-info{flex:1}
.unit-radio-unit{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.unit-radio-detail{font-size:12px;color:var(--muted)}

@media(max-width:900px){.content{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    <div class="submit-form">
      <div class="form-title">Report a Temperature Issue</div>
      <div class="form-sub">Select your issue and location. Building management will review and adjust.</div>
      <div class="type-btns">
        <button class="type-btn" id="btnHot" data-type="hot"><div class="type-icon">🥵</div><div class="type-label">Too Hot</div><div class="type-sub">Temperature will be lowered</div></button>
        <button class="type-btn" id="btnCold" data-type="cold"><div class="type-icon">🥶</div><div class="type-label">Too Cold</div><div class="type-sub">Temperature will be raised</div></button>
      </div>
      
      <!-- Unit Auto Selection (Single Unit) -->
      <div id="unitAutoBox" style="display:none">
        <div class="unit-auto-box">
          <div class="unit-auto-label">Your Location</div>
          <div class="unit-auto-info" id="unitAutoUnit">—</div>
          <div class="unit-auto-detail" id="unitAutoDetail">—</div>
        </div>
      </div>
      
      <!-- Unit Radio Selection (Multiple Units) -->
      <div id="unitRadioBox" style="display:none">
        <div class="form-field">
          <label class="form-label">Select Your Unit</label>
          <div class="unit-radio-list" id="unitRadioList">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
      
      <!-- Manual Selection (Original Floor/Suite) -->
      <div class="form-field" id="floorField">
        <label class="form-label">Floor</label>
        <select class="form-select" id="hvacLevel">
          <option value="">Select floor…</option>
          <option>Level 1</option><option>Level 2</option><option>Level 3</option>
          <option>Level 4</option><option>Level 5</option><option>Level 6</option>
        </select>
      </div>
      <div class="form-field" id="suiteField">
        <label class="form-label">Suite</label>
        <select class="form-select" id="hvacTenancy">
          <option value="">Select suite…</option>
          <option>Tenancy A</option><option>Tenancy B</option><option>Tenancy C</option>
          <option>Tenancy D</option><option>Tenancy E</option><option>Tenancy F</option>
          <option>Tenancy G</option><option>Tenancy H</option>
        </select>
      </div>
      
      <div class="form-field">
        <label class="form-label">Additional Comments (optional)</label>
        <textarea class="form-textarea" id="hvacComment" placeholder="e.g. It has been very hot since this morning…"></textarea>
      </div>
      <button class="btn-submit" id="submitHvacBtn">Submit Request →</button>
    </div>

    <div>
      <div class="section-hdr"><div class="section-title">My Requests</div></div>
      <div class="section-content">
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="ongoing">Ongoing</button>
          <button class="filter-tab" data-filter="completed">Completed</button>
        </div>
        <div id="myList"><div class="empty-state">Loading…</div></div>
      </div>
    </div>
  </div>

  <div id="adminPanel" style="display:none">
    <div class="content">
      <div>
        <div class="section-hdr"><div class="section-title">Temperature Limits</div></div>
        <div class="section-content" style="padding:20px">
          <div class="limits-bar">
            <label>Min:</label><input class="limits-input" id="minTemp" placeholder="20" type="number" step="0.5">
            <label>Max:</label><input class="limits-input" id="maxTemp" placeholder="26" type="number" step="0.5">
            <button class="limits-save" id="saveLimitsBtn">Save</button>
          </div>
        </div>
      </div>
      <div>
        <div class="section-hdr"><div class="section-title">Pending Requests</div></div>
        <div class="section-content" id="pendingList"><div class="empty-state">Loading…</div></div>
      </div>
    </div>
    <div class="content">
      <div>
        <div class="section-hdr"><div class="section-title">In Progress</div></div>
        <div class="section-content" id="progressList"><div class="empty-state">Loading…</div></div>
      </div>
      <div>
        <div class="section-hdr"><div class="section-title">Completed</div></div>
        <div class="section-content" id="completedList"><div class="empty-state">Loading…</div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role, name } = ctx;

let selectedType = null;
let allMyRequests = [];
let currentFilter = 'all';
let myUnits = []; // User's units from occupants table
let selectedUnit = null; // Selected unit object

// Load user's units from occupants table
async function loadMyUnits() {
  try {
    // Search occupants by email
    const { data, error } = await supabase
      .from('occupants')
      .select('*')
      .or(`primary_email.eq.${user.email},business_email.ilike.%${user.email}%`);
    
    if (error) throw error;
    
    myUnits = data || [];
    renderUnitSelection();
  } catch (e) {
    console.error('Failed to load units:', e);
    myUnits = [];
    renderUnitSelection();
  }
}

// Render unit selection UI based on number of units
function renderUnitSelection() {
  const autoBox = document.getElementById('unitAutoBox');
  const radioBox = document.getElementById('unitRadioBox');
  const floorField = document.getElementById('floorField');
  const suiteField = document.getElementById('suiteField');
  
  // Hide all boxes first
  autoBox.style.display = 'none';
  radioBox.style.display = 'none';
  floorField.style.display = 'none';
  suiteField.style.display = 'none';
  
  if (myUnits.length === 1) {
    // Case 1: Single unit - auto select
    selectedUnit = myUnits[0];
    document.getElementById('unitAutoUnit').textContent = `Unit ${selectedUnit.unit}`;
    document.getElementById('unitAutoDetail').textContent = `${selectedUnit.level}, ${selectedUnit.suite}${selectedUnit.business_name ? ' — ' + selectedUnit.business_name : ''}`;
    autoBox.style.display = 'block';
  } else if (myUnits.length > 1) {
    // Case 2: Multiple units - show radio selection
    const list = document.getElementById('unitRadioList');
    list.innerHTML = myUnits.map((u, idx) => `
      <label class="unit-radio-item" data-idx="${idx}">
        <input type="radio" name="unitRadio" value="${idx}" ${idx === 0 ? 'checked' : ''}>
        <div class="unit-radio-info">
          <div class="unit-radio-unit">Unit ${u.unit}</div>
          <div class="unit-radio-detail">${u.level}, ${u.suite}${u.business_name ? ' — ' + u.business_name : ''}</div>
        </div>
      </label>
    `).join('');
    
    // Select first unit by default
    selectedUnit = myUnits[0];
    
    // Add radio change listeners
    document.querySelectorAll('input[name="unitRadio"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const idx = parseInt(e.target.value);
        selectedUnit = myUnits[idx];
        
        // Update selected styling
        document.querySelectorAll('.unit-radio-item').forEach(item => item.classList.remove('selected'));
        e.target.closest('.unit-radio-item').classList.add('selected');
      });
    });
    
    // Set initial selected state
    document.querySelector('.unit-radio-item').classList.add('selected');
    
    radioBox.style.display = 'block';
  } else {
    // Case 3: No units - show manual Floor/Suite selection
    selectedUnit = null;
    floorField.style.display = 'block';
    suiteField.style.display = 'block';
  }
}

// Type button click
document.getElementById('btnHot').addEventListener('click', () => {
  selectedType = 'hot';
  document.getElementById('btnHot').className = 'type-btn hot';
  document.getElementById('btnCold').className = 'type-btn';
});
document.getElementById('btnCold').addEventListener('click', () => {
  selectedType = 'cold';
  document.getElementById('btnCold').className = 'type-btn cold';
  document.getElementById('btnHot').className = 'type-btn';
});

// Submit HVAC request
document.getElementById('submitHvacBtn').addEventListener('click', async () => {
  if (!selectedType) { showToast('Please select Too Hot or Too Cold', true); return; }
  
  let level, tenancy;
  
  if (selectedUnit) {
    // Use selected unit
    level = selectedUnit.level;
    // Map Suite to Tenancy (Suite A → Tenancy A)
    tenancy = selectedUnit.suite.replace('Suite', 'Tenancy');
  } else {
    // Manual selection
    level = document.getElementById('hvacLevel').value;
    tenancy = document.getElementById('hvacTenancy').value;
    if (!level || !tenancy) { showToast('Please select floor and suite', true); return; }
  }
  
  try {
    await supabase.from('hvac_requests').insert({ 
      user_id: user.id, 
      user_name: name, 
      type: selectedType, 
      level, 
      tenancy, 
      comment: document.getElementById('hvacComment').value.trim(), 
      status: 'pending' 
    });
    
    showToast('Request submitted! Building management will review shortly ✓');
    selectedType = null;
    document.getElementById('btnHot').className = 'type-btn';
    document.getElementById('btnCold').className = 'type-btn';
    document.getElementById('hvacComment').value = '';
    
    // Reset manual selection if used
    if (!selectedUnit) {
      document.getElementById('hvacLevel').value = '';
      document.getElementById('hvacTenancy').value = '';
    }
    
    if (role !== 'admin') await loadMyRequests();
  } catch(e) { 
    showToast(e.message || 'Failed to submit', true); 
  }
});

// Filter tabs
document.querySelectorAll('.filter-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    currentFilter = tab.dataset.filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderMyRequests();
  });
});

function getProgressBar(status, type) {
  const steps = [
    { icon: '📝', label: 'Pending', status: 'pending' },
    { icon: '✅', label: 'Approved', status: 'approved' },
    { icon: type === 'hot' ? '❄️' : '🔥', label: 'Adjusting', status: 'processing' },
    { icon: '🎉', label: 'Done', status: 'completed' }
  ];
  
  const currentIndex = steps.findIndex(s => s.status === status);
  
  let html = '<div class="progress-bar">';
  
  steps.forEach((step, idx) => {
    const stepClass = idx < currentIndex ? 'step-completed' : 
                     idx === currentIndex ? 'step-active' : 'step-pending';
    
    html += `<div class="progress-step ${stepClass}">
      <div class="progress-icon">${step.icon}</div>
      <div class="progress-label">${step.label}</div>
    </div>`;
    
    if (idx < steps.length - 1) {
      const lineClass = idx < currentIndex ? 'active' : '';
      html += `<div class="progress-line ${lineClass}"></div>`;
    }
  });
  
  html += '</div>';
  return html;
}

function renderMyRequests() {
  const list = document.getElementById('myList');
  
  let filtered = allMyRequests;
  if (currentFilter === 'ongoing') {
    filtered = allMyRequests.filter(r => ['pending', 'approved', 'processing'].includes(r.status));
  } else if (currentFilter === 'completed') {
    filtered = allMyRequests.filter(r => ['completed', 'rejected', 'failed'].includes(r.status));
  }
  
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">No requests in this category</div>';
    return;
  }
  
  list.innerHTML = filtered.map(r => `
    <div class="my-req-row">
      <div style="font-size:20px">${r.type === 'hot' ? '🥵' : '🥶'}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600">${r.type === 'hot' ? 'Too Hot' : 'Too Cold'} — ${r.level}, ${r.tenancy}</div>
        <div style="font-size:11px;color:var(--muted)">${new Date(r.created_at).toLocaleString('en-AU', {day:'numeric', month:'short', year:'numeric'})}</div>
        ${r.comment ? `<div style="font-size:11px;color:var(--text-2);font-style:italic;margin-top:2px">"${r.comment}"</div>` : ''}
        ${['pending', 'approved', 'processing'].includes(r.status) ? getProgressBar(r.status, r.type) : ''}
      </div>
      <span class="badge ${r.status === 'pending' ? 'badge-yellow' : r.status === 'completed' ? 'badge-green' : r.status === 'approved' || r.status === 'processing' ? 'badge-blue' : 'badge-red'}">${r.status}</span>
    </div>
  `).join('');
}

async function loadMyRequests() {
  const { data } = await supabase.from('hvac_requests').select('*').eq('user_id', user.id).order('created_at', {ascending: false}).limit(20);
  allMyRequests = data || [];
  renderMyRequests();
}

if (role === 'admin') {
  document.getElementById('adminPanel').style.display = 'block';
  await loadAdminData();
  
  supabase.channel('hvac_admin')
    .on('postgres_changes', {event: '*', schema: 'public', table: 'hvac_requests'}, () => {
      loadAdminData();
    })
    .subscribe();
} else {
  await loadMyUnits(); // Load user's units
  await loadMyRequests();
  
  supabase.channel('hvac_user')
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'hvac_requests',
      filter: `user_id=eq.${user.id}`
    }, () => {
      loadMyRequests();
    })
    .subscribe();
}

async function loadAdminData() {
  // Load temperature limits
  const { data: settings } = await supabase.from('settings').select('*').in('key', ['temp_min', 'temp_max']);
  if (settings) {
    const minSetting = settings.find(s => s.key === 'temp_min');
    const maxSetting = settings.find(s => s.key === 'temp_max');
    if (minSetting) document.getElementById('minTemp').value = minSetting.value;
    if (maxSetting) document.getElementById('maxTemp').value = maxSetting.value;
  }

  // Load pending requests
  const { data: pending } = await supabase.from('hvac_requests').select('*').eq('status', 'pending').order('created_at', {ascending: false});
  const pendingList = document.getElementById('pendingList');
  if (!pending || !pending.length) {
    pendingList.innerHTML = '<div class="empty-state">No pending requests</div>';
  } else {
    pendingList.innerHTML = pending.map(r => `
      <div class="req-row">
        <div style="font-size:24px">${r.type === 'hot' ? '🥵' : '🥶'}</div>
        <div class="req-info">
          <div class="req-title">${r.type === 'hot' ? 'Too Hot' : 'Too Cold'} — ${r.level}, ${r.tenancy}</div>
          <div class="req-meta">${r.user_name} • ${new Date(r.created_at).toLocaleString('en-AU', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</div>
          ${r.comment ? `<div class="req-comment">"${r.comment}"</div>` : ''}
        </div>
        <div class="req-actions">
          <button class="btn-secondary" onclick="approveRequest('${r.id}')">✅ Approve</button>
          <button class="btn-secondary" onclick="rejectRequest('${r.id}')">❌ Reject</button>
        </div>
      </div>
    `).join('');
  }

  // Load in-progress requests
  const { data: progress } = await supabase.from('hvac_requests').select('*').in('status', ['approved', 'processing']).order('created_at', {ascending: false});
  const progressList = document.getElementById('progressList');
  if (!progress || !progress.length) {
    progressList.innerHTML = '<div class="empty-state">No requests in progress</div>';
  } else {
    progressList.innerHTML = progress.map(r => `
      <div class="req-row">
        <div style="font-size:24px">${r.type === 'hot' ? '🥵' : '🥶'}</div>
        <div class="req-info">
          <div class="req-title">${r.type === 'hot' ? 'Too Hot' : 'Too Cold'} — ${r.level}, ${r.tenancy}</div>
          <div class="req-meta">${r.user_name} • ${new Date(r.created_at).toLocaleString('en-AU', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</div>
          ${r.comment ? `<div class="req-comment">"${r.comment}"</div>` : ''}
        </div>
        <span class="badge ${r.status === 'approved' ? 'badge-blue' : 'badge-yellow'}">${r.status}</span>
      </div>
    `).join('');
  }

  // Load completed requests
  const { data: completed } = await supabase.from('hvac_requests').select('*').in('status', ['completed', 'failed', 'rejected']).order('created_at', {ascending: false}).limit(10);
  const completedList = document.getElementById('completedList');
  if (!completed || !completed.length) {
    completedList.innerHTML = '<div class="empty-state">No completed requests</div>';
  } else {
    completedList.innerHTML = completed.map(r => `
      <div class="req-row">
        <div style="font-size:24px">${r.type === 'hot' ? '🥵' : '🥶'}</div>
        <div class="req-info">
          <div class="req-title">${r.type === 'hot' ? 'Too Hot' : 'Too Cold'} — ${r.level}, ${r.tenancy}</div>
          <div class="req-meta">${r.user_name} • ${new Date(r.created_at).toLocaleString('en-AU', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</div>
          ${r.comment ? `<div class="req-comment">"${r.comment}"</div>` : ''}
        </div>
        <span class="badge ${r.status === 'completed' ? 'badge-green' : 'badge-red'}">${r.status}</span>
      </div>
    `).join('');
  }
}

// Admin actions
window.approveRequest = async (id) => {
  await supabase.from('hvac_requests').update({status: 'approved', approved_at: new Date().toISOString()}).eq('id', id);
  showToast('Request approved ✓');
  await loadAdminData();
};

window.rejectRequest = async (id) => {
  await supabase.from('hvac_requests').update({status: 'rejected'}).eq('id', id);
  showToast('Request rejected');
  await loadAdminData();
};

// Save temperature limits
document.getElementById('saveLimitsBtn').addEventListener('click', async () => {
  const min = parseFloat(document.getElementById('minTemp').value);
  const max = parseFloat(document.getElementById('maxTemp').value);
  if (isNaN(min) || isNaN(max)) { showToast('Please enter valid numbers', true); return; }
  if (min >= max) { showToast('Min must be less than Max', true); return; }
  
  await supabase.from('settings').upsert([
    { key: 'temp_min', value: min.toString() },
    { key: 'temp_max', value: max.toString() }
  ]);
  showToast('Temperature limits saved ✓');
});
</script>
</body>
