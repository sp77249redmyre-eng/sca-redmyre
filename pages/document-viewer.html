<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Viewer - Redmyre House</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;color:#102653;background:#e9eef5}
.viewer-shell{height:100%;display:flex;flex-direction:column}
.viewer-top{height:58px;flex-shrink:0;background:#fff;border-bottom:1px solid #dbe5f1;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:16px}
.viewer-name{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.viewer-actions button{height:34px;padding:0 13px;border:1px solid #d4e1f1;background:#f7faff;border-radius:7px;color:#153568;font-weight:600;cursor:pointer}
.viewer-actions button.primary{background:#0874e8;color:#fff;border-color:#0874e8}
.viewer-toolbar{height:48px;flex-shrink:0;background:#30363d;color:#fff;display:flex;align-items:center;justify-content:center;gap:16px}
.viewer-toolbar button{min-width:32px;height:30px;background:#414951;border:1px solid #59636d;border-radius:5px;color:#fff;font-size:18px;cursor:pointer}
.viewer-toolbar span{font-size:13px;min-width:48px;text-align:center}
.viewer-scroll{flex:1;min-height:0;overflow:auto;padding:22px;background:#e8edf4;display:flex;flex-direction:column;align-items:center;gap:18px}
.pdfjs-pages{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
.pdfjs-page{background:#fff;box-shadow:0 2px 12px rgba(16,40,80,.16);line-height:0}
.pdfjs-page canvas{display:block;max-width:none}
.viewer-message{margin:auto;color:#586b86;text-align:center;padding:28px}
.viewer-message.error{color:#b42318}
.viewer-scroll img{max-width:100%;height:auto;object-fit:contain;box-shadow:0 2px 12px rgba(16,40,80,.16)}
@media(max-width:700px){.viewer-top{padding:0 10px}.viewer-name{font-size:13px}.viewer-actions{gap:4px}.viewer-actions button{padding:0 8px;font-size:11px}.viewer-scroll{padding:10px}}
@media print{html,body{height:auto;background:#fff}.viewer-top,.viewer-toolbar{display:none!important}.viewer-scroll{display:block;overflow:visible;padding:0;background:#fff}.pdfjs-pages{display:block}.pdfjs-page{box-shadow:none;break-after:page;margin:0 auto}.pdfjs-page:last-child{break-after:auto}}
</style>
</head>
<body>
<div class="viewer-shell">
  <header class="viewer-top">
    <div class="viewer-name" id="viewerName">Document</div>
    <div class="viewer-actions">
      <button id="downloadBtn" type="button">Download</button>
      <button id="printBtn" type="button">Print</button>
      <button id="closeBtn" class="primary" type="button">Close</button>
    </div>
  </header>
  <div class="viewer-toolbar">
    <span id="pageInfo">Loading PDF...</span>
    <button id="zoomOut" type="button" title="Zoom out">−</button>
    <span id="zoomValue">100%</span>
    <button id="zoomIn" type="button" title="Zoom in">+</button>
  </div>
  <main class="viewer-scroll" id="viewerScroll"><div class="viewer-message">Loading document...</div></main>
</div>
<script type="module" src="/js/document-viewer.js?v=20261112"></script>
</body>
</html>
