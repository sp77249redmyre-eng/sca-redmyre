<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ongoing Works – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v4.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
/* ── Layout ── */
.content{padding:24px}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.section-heading{display:flex;align-items:center;gap:10px}
.section-heading-bar{width:4px;height:20px;border-radius:2px;background:#2563eb;flex-shrink:0}
.section-heading-text{font-size:16px;font-weight:600;color:#1e293b}
.section-heading-count{font-size:12px;font-weight:600;padding:2px 10px;border-radius:100px;background:#dbeafe;color:#1e40af}

/* ── Emergency Work Button ── */
.btn-emergency{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:10px;background:linear-gradient(135deg,#991b1b,#ef4444);color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(239,68,68,0.3);transition:all 0.2s}
.btn-emergency:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(239,68,68,0.4)}
.btn-em-icon{width:24px;height:24px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.btn-em-label{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.btn-em-main{font-size:13px;font-weight:600}
.btn-em-sub{font-size:10px;opacity:0.75;margin-top:2px;font-weight:400}

/* ── Works List — card-based ── */
#worksList{display:flex;flex-direction:column;gap:14px}

/* ── Work Card ── */
.work-card{background:#fff;border:0.5px solid #e2e8f0;border-radius:16px;overflow:hidden;transition:box-shadow 0.2s}
.work-card:hover{box-shadow:0 6px 24px rgba(0,0,0,0.07)}

/* Category left-border */
.wcat-General   {border-left:5px solid #2563eb}
.wcat-HVAC      {border-left:5px solid #d97706}
.wcat-Fire      {border-left:5px solid #dc2626}
.wcat-Electrical{border-left:5px solid #ca8a04}
.wcat-Security  {border-left:5px solid #7c3aed}
.wcat-Plumbing  {border-left:5px solid #0891b2}
.wcat-Lift      {border-left:5px solid #059669}
.wcat-Other     {border-left:5px solid #94a3b8}

/* Emergency card */
.work-card.is-emergency{border-color:#fecaca;border-left:5px solid #ef4444}
.work-card.is-emergency .wcard-hdr{background:#fff5f5}

/* ── Card Header ── */
.wcard-hdr{padding:16px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:#f8fafc;border-bottom:0.5px solid #f1f5f9}
.wcard-hdr-left{display:flex;align-items:flex-start;gap:14px;flex:1}
.wcard-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.wcard-info{flex:1}
.wcard-title{font-size:15px;font-weight:600;color:#1e293b;margin-bottom:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wcard-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta-chip{font-size:12px;color:#64748b;display:flex;align-items:center;gap:3px}
.meta-sep{width:3px;height:3px;border-radius:50%;background:#cbd5e1;flex-shrink:0}

/* Emergency badge */
.badge-emergency{background:#fee2e2;color:#991b1b;border:0.5px solid #fecaca;font-size:10px;font-weight:600;padding:2px 8px;border-radius:100px}

/* Status badge in header */
.badge{display:inline-flex;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600}
.badge-gray{background:#f1f5f9;color:#475569;border:0.5px solid #e2e8f0}
.badge-blue{background:#dbeafe;color:#1e40af;border:0.5px solid #bfdbfe}
.badge-yellow{background:#fef3c7;color:#92400e;border:0.5px solid #fde68a}
.badge-green{background:#dcfce7;color:#166534;border:0.5px solid #bbf7d0}

/* ── Progress Stepper ── */
.stepper{padding:14px 20px;display:flex;align-items:center;border-bottom:0.5px solid #f1f5f9;background:#fff}
.step{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.step-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;border:2px solid;transition:all 0.2s}
.step-circle.done{background:#dcfce7;border-color:#16a34a;color:#16a34a}
.step-circle.active{background:#dbeafe;border-color:#2563eb;color:#2563eb}
.step-circle.idle{background:#f8fafc;border-color:#e2e8f0;color:#94a3b8}
.step-text{display:flex;flex-direction:column;min-width:0}
.step-name{font-size:12px;font-weight:600;white-space:nowrap}
.step-name.done{color:#16a34a}
.step-name.active{color:#2563eb}
.step-name.idle{color:#94a3b8}
.step-date{font-size:11px;color:#94a3b8;margin-top:1px;white-space:nowrap}
.step-line{flex:1;height:2px;border-radius:2px;margin:0 6px}
.step-line.done{background:#16a34a}
.step-line.active{background:linear-gradient(90deg,#16a34a 50%,#e2e8f0 50%)}
.step-line.idle{background:#e2e8f0}

/* ── Card Body — collapsed ── */
.wcard-body{padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:all 0.15s;background:#eff6ff;border-bottom:0.5px solid #dbeafe}
.wcard-body:hover{background:#dbeafe}
.wcard-vendor{font-size:13px;color:#64748b;display:none}
.wcard-vendor span{font-weight:600;color:#1e293b}
.expand-hint{font-size:14px;color:#1e40af;display:flex;align-items:center;gap:6px;font-weight:600}

/* ── Accordion ── */
.work-accordion{display:none;background:#f8fafc;border-top:0.5px solid #f1f5f9;padding:18px 20px}
.work-accordion.open{display:block}

.acc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.acc-title{font-size:15px;font-weight:600;color:#1e293b}
.acc-btns{display:flex;gap:6px}
.btn-edit-sm{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;background:#fff;border:0.5px solid #e2e8f0;color:#64748b;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.12s}
.btn-edit-sm:hover{border-color:#2563eb;color:#2563eb}
.btn-close-sm{display:inline-flex;align-items:center;gap:4px;padding:8px 16px;border-radius:8px;background:#fee2e2;border:0.5px solid #fca5a5;color:#dc2626;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.12s}
.btn-close-sm:hover{background:#fecaca;border-color:#ef4444;color:#dc2626}

.acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.acc-item{display:flex;flex-direction:column;gap:3px}
.acc-lbl{font-size:14px;color:#0f172a;text-transform:uppercase;letter-spacing:0.05em;font-weight:700}
.acc-val{font-size:15px;color:#0f172a;font-weight:500}

.scope-box{padding:12px 14px;background:#fff;border:0.5px solid #e2e8f0;border-radius:10px;margin-bottom:12px}
.scope-lbl{font-size:14px;color:#0f172a;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;margin-bottom:7px}
.scope-txt{font-size:15px;color:#0f172a;line-height:1.7}

.inote-box{padding:12px 14px;background:#f0f7ff;border:0.5px solid #dbeafe;border-radius:10px;margin-bottom:12px}
.inote-lbl{font-size:13px;color:#1e40af;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;margin-bottom:7px}
.inote-txt{font-size:15px;color:#1e40af;line-height:1.7}

.files-lbl{font-size:14px;color:#0f172a;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;margin-bottom:10px;margin-top:4px}
.file-preview{display:flex;align-items:center;gap:10px;padding:11px 16px;background:#fff;border:0.5px solid #e2e8f0;border-radius:8px;font-size:14px;margin-bottom:8px;cursor:pointer;transition:all 0.12s}
.file-preview:hover{border-color:#2563eb;background:#eff6ff}
.file-icon{font-size:18px;flex-shrink:0}
.file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2563eb;font-weight:500}
.file-del{color:#ef4444;cursor:pointer;font-size:16px;padding:0 4px}

/* ── Status Control ── */
.status-select-box{background:#fff;border:0.5px solid #e2e8f0;border-radius:12px;padding:14px;margin-top:4px}
.status-ctrl-lbl{font-size:12px;font-weight:600;color:#1e293b;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px}
.status-btn-row{display:flex;gap:8px;flex-wrap:wrap}
.status-btn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;border:0.5px solid #e2e8f0;background:#fff;cursor:pointer;color:#64748b;transition:all 0.15s;font-family:'DM Sans',sans-serif}
.status-btn:hover{border-color:#2563eb;color:#2563eb}
.status-btn.active-sched{background:#f1f5f9;color:#475569;border-color:#94a3b8}
.status-btn.active-prog{background:#dbeafe;color:#1e40af;border-color:#2563eb}
.status-btn.active-done{background:#dcfce7;color:#166534;border-color:#16a34a}

.completion-date-box{background:#ecfdf5;border:0.5px solid #86efac;border-radius:10px;padding:14px;margin-top:12px}
.completion-date-lbl{font-size:11px;font-weight:600;color:#166534;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px}
.completion-date-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Inputs */
.modal-input{padding:9px 12px;border:0.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;background:#fff;color:#1e293b;transition:border-color 0.15s}
.modal-input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.08)}

/* Buttons */
.btn-primary{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all 0.15s;white-space:nowrap;box-shadow:0 2px 6px rgba(37,99,235,0.2)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,0.3)}
.btn-secondary{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;background:#fff;border:0.5px solid #e2e8f0;color:#475569;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s}
.btn-secondary:hover{border-color:#2563eb;color:#2563eb}

/* Empty */
.empty-state{text-align:center;padding:64px 24px;color:#94a3b8}

/* Toast */
.toast{position:fixed;bottom:28px;right:28px;padding:14px 22px;border-radius:12px;color:#fff;font-size:14px;display:none;z-index:9999;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,0.15)}

/* Modal */
.modal-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,0.6);display:none;align-items:center;justify-content:center;z-index:1000;overflow-y:auto;backdrop-filter:blur(2px)}
.modal-backdrop.open{display:flex}
.modal-box{background:#fff;border-radius:18px;padding:28px;max-width:640px;width:92%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25)}
.modal-title{font-size:20px;font-weight:600;color:#1e293b;margin-bottom:24px}
.modal-field{margin-bottom:18px}
.modal-label{font-size:13px;font-weight:700;color:#0f172a;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:7px}
.modal-input{width:100%;padding:11px 14px;border:0.5px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;background:#fff;color:#1e293b;box-sizing:border-box}
.modal-select{width:100%;padding:11px 14px;border:0.5px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;background:#fff;color:#1e293b;box-sizing:border-box}
.modal-textarea{width:100%;min-height:80px;padding:11px 14px;border:0.5px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;background:#fff;color:#1e293b;resize:vertical;box-sizing:border-box}
.modal-footer{display:flex;gap:12px;margin-top:24px;justify-content:flex-end;flex-wrap:wrap}

/* Mobile */
@media(max-width:768px){
  .stepper{flex-wrap:nowrap;overflow-x:auto;padding:12px 14px}
  .step-text{display:none}
  .wcard-hdr{flex-direction:column}
  .acc-grid{grid-template-columns:1fr}
  .btn-emergency .btn-em-sub{display:none}
  .status-btn{width:100%;justify-content:center}
  .completion-date-row{flex-direction:column;align-items:stretch}
  .completion-date-row .btn-primary{width:100%;justify-content:center}
}

/* ── 모바일 추가 최적화 ── */
@media(max-width:768px){
  .top-bar{flex-direction:column;align-items:stretch;gap:10px}
  .btn-emergency{width:100%;justify-content:center}
  .work-card{border-radius:12px}
  .wcard-hdr{flex-wrap:wrap;gap:8px;padding:12px 14px}
  .wcard-hdr-left{flex:1}
  .wcard-icon{width:36px;height:36px;font-size:18px}
  .wcard-title{font-size:14px}
  .wcard-meta{font-size:11px;gap:4px}
  .stepper{padding:10px 12px;gap:0}
  .step-text{display:none}
  .step-circle{width:24px;height:24px;font-size:11px}
  .step-line{margin:0 4px}
  .wcard-body{padding:14px;justify-content:center}
  .work-accordion{padding:14px}
  .acc-grid{grid-template-columns:1fr}
  .status-select-box{padding:12px}
  .status-btn-row{flex-direction:column}
  .status-btn{width:100%;padding:10px;font-size:13px;justify-content:center}
  .completion-date-row{flex-direction:column}
  .completion-date-row .btn-primary{width:100%;justify-content:center;padding:10px}
  .modal-box{border-radius:14px;padding:20px}
  .modal-title{font-size:17px}
  .btn-em-sub{display:none}
  /* iOS 줌인 방지 (works 자체 정의 덮어씀) */
  .modal-input,.modal-select,.modal-textarea{font-size:16px !important;height:48px}
  .modal-textarea{height:auto;min-height:110px}
}
@media(max-width:380px){
  .wcard-title{font-size:13px}
  .wcard-meta{font-size:10px}
  .step-circle{width:22px;height:22px;font-size:10px}
  .modal-box{padding:16px}
}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">

    <!-- Page Hero -->
    <!-- Page Header -->
    <div class="page-header">
      <div class="page-header-icon">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </div>
      <div class="page-header-body">
        <div class="page-header-title-row">
          <span class="page-header-title">Active Works</span>
          <span id="worksCount" style="font-size:12px;font-weight:700;background:#dbeafe;color:#1e40af;padding:2px 9px;border-radius:99px;display:none"></span>
          <button id="addWorkBtn" style="display:none;background:#dc2626;color:#fff;border:none;padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap" onclick="openAddEmergencyWork()">🚨 Emergency Work</button>
        </div>
        <div class="page-header-sub">Track active building works, repairs, and contractor projects.</div>
      </div>
    </div>
    <div id="worksList">
      <div style="padding:24px;text-align:center;color:#94a3b8">Loading…</div>
    </div>
  </div>
</div>

<!-- EMERGENCY WORK MODAL -->
<div class="modal-backdrop" id="emergencyModal">
  <div class="modal-box" style="max-width:640px">
    <div class="modal-title">Emergency Work <span style="font-size:14px;color:#ef4444;font-weight:500">(No Committee Approval)</span></div>
    <div class="modal-field">
      <label class="modal-label">Project Description</label>
      <input type="text" class="modal-input" id="emergencyProject" placeholder="e.g., Emergency roof leak repair">
    </div>
    <div class="modal-field">
      <label class="modal-label">Vendor / Contractor</label>
      <input type="text" class="modal-input" id="emergencyVendor" placeholder="Company name">
    </div>
    <div class="modal-field">
      <label class="modal-label">Amount (AUD) (ex GST)</label>
      <input type="text" class="modal-input" id="emergencyAmount" placeholder="0.00" oninput="formatAmount(this)">
    </div>
    <div class="modal-field">
      <label class="modal-label">Category</label>
      <select class="modal-select" id="emergencyCategory">
        <option value="General">General</option>
        <option value="HVAC">HVAC</option>
        <option value="Fire">Fire</option>
        <option value="Electrical">Electrical</option>
        <option value="Security">Security</option>
        <option value="Plumbing">Plumbing</option>
        <option value="Lift">Lift</option>
              </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">Notes</label>
      <textarea class="modal-textarea" id="emergencyNotes" placeholder="Reason for emergency work"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">📎 Attach Files (Internal Only)</label>
      <input type="file" id="emergencyFileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" style="display:none">
      <button class="btn-secondary" onclick="document.getElementById('emergencyFileInput').click()">+ Choose Files</button>
      <div id="emergencyFilePreview" style="margin-top:10px"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('emergencyModal')">Cancel</button>
      <button class="btn-primary" id="saveEmergencyBtn" onclick="saveEmergencyWork()">Save Emergency Work →</button>
    </div>
  </div>
</div>

<!-- EDIT WORK MODAL -->
<div class="modal-backdrop" id="editModal">
  <div class="modal-box" style="max-width:640px">
    <div class="modal-title">Edit Work</div>
    <input type="hidden" id="editWorkId">
    <div class="modal-field">
      <label class="modal-label">Project Description</label>
      <input type="text" class="modal-input" id="editProject">
    </div>
    <div class="modal-field">
      <label class="modal-label">Vendor / Contractor</label>
      <input type="text" class="modal-input" id="editVendor">
    </div>
    <div class="modal-field">
      <label class="modal-label">Amount (AUD) (ex GST)</label>
      <input type="text" class="modal-input" id="editAmount" oninput="formatAmount(this)">
    </div>
    <div class="modal-field">
      <label class="modal-label">Category</label>
      <select class="modal-select" id="editCategory">
        <option value="General">General</option>
        <option value="HVAC">HVAC</option>
        <option value="Fire">Fire</option>
        <option value="Electrical">Electrical</option>
        <option value="Security">Security</option>
        <option value="Plumbing">Plumbing</option>
        <option value="Lift">Lift</option>
              </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">Notes</label>
      <textarea class="modal-textarea" id="editNotes"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">Internal Notes</label>
      <textarea class="modal-textarea" id="editInternalNotes" style="background:#f0f7ff;border-color:#dbeafe"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">Work Start Date</label>
      <input type="date" class="modal-input" id="editWorkDate">
    </div>
    <div class="modal-field">
      <label class="modal-label">📎 Attach Files (Internal Only)</label>
      <input type="file" id="editFileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" style="display:none">
      <button class="btn-secondary" onclick="document.getElementById('editFileInput').click()">+ Choose Files</button>
      <div id="editFilePreview" style="margin-top:10px"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('editModal')">Cancel</button>
      <button class="btn-primary" onclick="saveEdit()">Save Changes →</button>
    </div>
  </div>
</div>

<div id="fileViewerModal" tabindex="-1" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;flex-direction:column;padding:16px;outline:none" onclick="if(event.target===this)closeViewer()">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-shrink:0" onclick="event.stopPropagation()">
    <span id="viewerFileName" style="color:#e5e7eb;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:calc(100% - 120px)"></span>
    <div style="display:flex;gap:8px;flex-shrink:0">
      <button onclick="printViewer()" style="background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;padding:6px 14px;display:flex;align-items:center;gap:6px">🖨 Print</button>
      <button onclick="closeViewer()" style="background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:22px;cursor:pointer;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center">&times;</button>
    </div>
  </div>
  <div id="viewerContent" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:10px" onclick="event.stopPropagation()"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '/js/layout.js';
import { parseComment } from '/js/common.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role } = ctx;
const privileged = ['admin','committee','observer'];
const canViewInternal = privileged.includes(role);

// HTML 인라인 onclick에서 접근 가능하도록 window에 노출
window._role = role;
window._canViewInternal = canViewInternal;

if (role === 'admin') {
  document.getElementById('addWorkBtn').style.display = 'inline-flex';
}

window.showToast = (msg, isError=false) => {
  const t = document.getElementById('toast');
  t.textContent = msg; 
  t.style.background = isError ? '#991b1b' : '#0f172a';
  t.style.display = 'block'; 
  setTimeout(()=>t.style.display='none', 3000);
};

window.formatAmount = (input) => {
  let val = input.value.replace(/[^0-9.]/g, '');
  if (val) input.value = parseFloat(val).toLocaleString('en-AU');
};

let allWorks = [];
let openAccordionId = null;
let emergencyFiles = [];
let editFiles = [];
let deletedFilePaths = [];
let currentWorkStatus = {};



async function getSignedUrl(path) {
  if (!path) return '';
  const { data, error } = await supabase.storage.from('quotes').createSignedUrl(path, 3600);
  if (error) throw error;
  return data.signedUrl;
}

async function uploadFile(file, quoteId) {
  const safeName = file.name.replace(/[^\w.\- ]+/g,'_');
  const path = `${quoteId}/${Date.now()}-${safeName}`;
  const { error } = await supabase.storage.from('quotes').upload(path, file, { contentType: file.type });
  if (error) throw error;
  return { path, name: safeName, type: file.type || '', size: file.size };
}

let _viewerCurrentUrl = '';
window.openFileViewer = async function(path, name, type) {
  try {
    if (!path) throw new Error('No file path');
    let url;
    if (path.startsWith('http')) {
      url = path;
    } else {
      const cleanPath = path.replace(/^quotes\//, '');
      const { data, error } = await supabase.storage.from('quotes').createSignedUrl(cleanPath, 3600);
      if (error || !data?.signedUrl) throw new Error('Signed URL failed');
      url = data.signedUrl;
    }
    _viewerCurrentUrl = url;
    document.getElementById('viewerFileName').textContent = name || '';
    let html = '';
    if ((type && type.includes('pdf')) || (name && name.toLowerCase().endsWith('.pdf'))) {
      html = `<iframe src="${url}" style="width:100%;flex:1;border:none;min-height:0"></iframe>`;
    } else if (['png','jpg','jpeg','gif','webp','svg'].some(e => name?.toLowerCase().endsWith('.'+e))) {
      html = `<div style="flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;min-height:0"><img src="${url}" style="max-width:100%;max-height:100%;object-fit:contain;display:block" alt="${name}"></div>`;
    } else {
      html = `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px"><div style="font-size:52px">📎</div><a href="${url}" download="${name}" style="padding:12px 28px;background:#3b82f6;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:15px">⬇ Download ${name}</a></div>`;
    }
    document.getElementById('viewerContent').innerHTML = html;
    document.getElementById('fileViewerModal').style.display = 'flex';
    document.getElementById('fileViewerModal').focus();
  } catch(e) {
    console.error('openFileViewer failed:', e);
    alert('Failed to load file');
  }
};

window.closeViewer = function() {
  document.getElementById('fileViewerModal').style.display = 'none';
  document.getElementById('viewerContent').innerHTML = '';
};

window.printViewer = function() {
  if (!_viewerCurrentUrl) return;
  const w = window.open(_viewerCurrentUrl, '_blank');
  if (w) w.onload = () => { w.focus(); w.print(); };
};

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && document.getElementById('fileViewerModal').style.display === 'flex') closeViewer();
});

// 카테고리별 아이콘/배경
const CAT_ICON = { General:'🏗️', HVAC:'❄️', Fire:'🔥', Electrical:'⚡', Security:'🔒', Plumbing:'💧', Lift:'🛗' };
const CAT_ICON_BG = { General:'#eff6ff', HVAC:'#fffbeb', Fire:'#fef2f2', Electrical:'#fefce8', Security:'#ede9fe', Plumbing:'#ecfeff', Lift:'#ecfdf5' };

async function loadWorks() {
  const { data } = await supabase
    .from('quotes')
    .select('*')
    .is('completion_date', null)
    .not('work_status', 'is', null)
    .not('status', 'eq', 'removed')
    .order('created_at', {ascending: false});
  
  allWorks = data || [];

  // 카운트 업데이트
  const cnt = document.getElementById('worksCount');
  if (cnt) { cnt.textContent = allWorks.length || ''; cnt.style.display = allWorks.length ? 'inline-flex' : 'none'; }

  renderWorks();
}

function renderWorks() {
  const list = document.getElementById('worksList');
  if (!allWorks.length) {
    list.innerHTML = `<div class="empty-state"><div style="font-size:48px;margin-bottom:16px">📋</div><div style="font-size:16px;font-weight:600;color:#475569">No ongoing works</div><div style="font-size:13px;color:#94a3b8;margin-top:6px">All works completed or none assigned yet.</div></div>`;
    return;
  }
  list.innerHTML = allWorks.map(w => workCard(w)).join('');
}

function workCard(w) {
  const parsed = parseComment(w.comment);
  const ws = w.work_status || 'scheduled';
  const cat = w.category || 'General';
  const isEmergency = w.is_emergency === true;
  const _role = window._role;
  const _canViewInternal = window._canViewInternal;

  const icon = CAT_ICON[cat] || '🔧';
  const iconBg = CAT_ICON_BG[cat] || '#f1f5f9';

  // Status badge
  let statusBadge = '';
  if (ws === 'scheduled')  statusBadge = '<span class="badge badge-gray">📅 Scheduled</span>';
  else if (ws === 'in_progress') statusBadge = '<span class="badge badge-blue">🔵 In Progress</span>';
  else if (ws === 'completed')   statusBadge = '<span class="badge badge-green">✅ Completed</span>';

  // Stepper
  const startDate = new Date(w.work_start_date || w.created_at).toLocaleDateString('en-AU',{day:'numeric',month:'short'});
  let s1class='idle', s2class='idle', s3class='idle';
  let l1class='idle', l2class='idle';
  if (ws === 'scheduled')  { s1class='active'; }
  else if (ws === 'in_progress') { s1class='done'; s2class='active'; l1class='done'; }
  else if (ws === 'completed')   { s1class='done'; s2class='done'; s3class='done'; l1class='done'; l2class='done'; }

  const stepperHtml = `
    <div class="stepper">
      <div class="step">
        <div class="step-circle ${s1class}">${s1class==='done'?'✓':s1class==='active'?'●':'○'}</div>
        <div class="step-text">
          <span class="step-name ${s1class}">Scheduled</span>
          <span class="step-date">${startDate}</span>
        </div>
      </div>
      <div class="step-line ${l1class}"></div>
      <div class="step">
        <div class="step-circle ${s2class}">${s2class==='done'?'✓':s2class==='active'?'●':'○'}</div>
        <div class="step-text">
          <span class="step-name ${s2class}">In Progress</span>
          <span class="step-date">${ws==='in_progress'||ws==='completed'?startDate:'—'}</span>
        </div>
      </div>
      <div class="step-line ${l2class}"></div>
      <div class="step">
        <div class="step-circle ${s3class}">${s3class==='done'?'✓':'○'}</div>
        <div class="step-text">
          <span class="step-name ${s3class}">Completed</span>
          <span class="step-date">${ws==='completed'?startDate:'—'}</span>
        </div>
      </div>
    </div>`;

  // Status control (admin only)
  let statusControlHtml = '';
  if (_role === 'admin') {
    statusControlHtml = `
      <div class="status-select-box">
        <div class="status-ctrl-lbl">Work Status</div>
        <div class="status-btn-row">
          <button class="status-btn ${ws==='scheduled'?'active-sched':''}" onclick="changeWorkStatus('${w.id}','scheduled');event.stopPropagation();">📅 Scheduled</button>
          <button class="status-btn ${ws==='in_progress'?'active-prog':''}" onclick="changeWorkStatus('${w.id}','in_progress');event.stopPropagation();">🔵 In Progress</button>
          <button class="status-btn ${ws==='completed'?'active-done':''}" onclick="changeWorkStatus('${w.id}','completed');event.stopPropagation();">✅ Completed</button>
        </div>
        ${ws==='completed'?`
          <div class="completion-date-box">
            <div class="completion-date-lbl">Set Completion Date to Move to Reports</div>
            <div class="completion-date-row">
              <input type="date" class="modal-input" id="complete-date-${w.id}" value="${new Date().toISOString().split('T')[0]}" onclick="event.stopPropagation();" style="width:auto">
              <button class="btn-primary" onclick="moveToReports('${w.id}');event.stopPropagation();">Move to Reports →</button>
            </div>
          </div>`:''}
      </div>`;
  }

  // Scope
  let descHtml = w.notes ? `
    <div class="scope-box">
      <div class="scope-lbl">Scope</div>
      <div class="scope-txt">${w.notes.includes("<") ? w.notes : w.notes.replace(/\n/g,"<br>")}</div>
    </div>` : '';

  // Internal notes
  let privateHtml = _canViewInternal && parsed.note ? `
    <div class="inote-box">
      <div class="inote-lbl">🔒 Internal Notes</div>
      <div class="inote-txt">${parsed.note.includes("<") ? parsed.note : parsed.note.replace(/\n/g,"<br>")}</div>
    </div>` : '';

  // Files
  let filesHtml = '';
  if (_canViewInternal && parsed.files && parsed.files.length > 0) {
    filesHtml = `<div class="files-lbl">📎 Attached Files (Internal Only)</div>`;
    parsed.files.forEach(f => {
      filesHtml += `<div class="file-preview" onclick="openFileViewer('${f.path}','${f.name}','${f.type}');event.stopPropagation();">
        <span class="file-icon">📄</span>
        <span class="file-name">${f.name}</span>
      </div>`;
    });
  }

  const catClass = `wcat-${cat.replace(/[^a-zA-Z]/g,'')}`;
  const emergencyClass = isEmergency ? 'is-emergency' : catClass;

  return `
    <div class="work-card ${emergencyClass}" id="card-${w.id}">
      <div class="wcard-hdr">
        <div class="wcard-hdr-left">
          <div class="wcard-icon" style="background:${isEmergency?'#fee2e2':iconBg}">${isEmergency?'🚨':icon}</div>
          <div class="wcard-info">
            <div class="wcard-title">
              ${w.project || 'Untitled'}
              ${isEmergency?'<span class="badge-emergency">EMERGENCY</span>':''}
            </div>
            <div class="wcard-meta">
              <span class="meta-chip">📅 ${new Date(w.work_start_date||w.created_at).toLocaleDateString('en-AU')}</span>
              <span class="meta-sep"></span>
              <span class="meta-chip">${cat}</span>
              <span class="meta-sep"></span>
              <span class="meta-chip">${w.vendor||'—'}</span>
            </div>
          </div>
        </div>
        ${statusBadge}
      </div>
      ${stepperHtml}
      <div class="wcard-body" onclick="toggleAccordion('${w.id}')">
        <div class="wcard-vendor">Contractor: <span>${w.vendor||'—'}</span></div>
        <div class="expand-hint">▼ Details</div>
      </div>
      <div class="work-accordion" id="accordion-${w.id}">
        <div class="acc-top">
          <div class="acc-title">${w.project||'Untitled'}</div>
          <div class="acc-btns">
            ${_role==='admin'?`<button class="btn-edit-sm" onclick="openEditWork('${w.id}');event.stopPropagation();">✏️ Edit</button>`:''}
            <button class="btn-close-sm" onclick="closeAccordion('${w.id}');event.stopPropagation();">✕ Close</button>
          </div>
        </div>
        <div class="acc-grid">
          <div class="acc-item"><span class="acc-lbl">Vendor</span><span class="acc-val">${w.vendor||'—'}</span></div>
          <div class="acc-item"><span class="acc-lbl">Work Start Date</span><span class="acc-val">${new Date(w.work_start_date||w.created_at).toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})}</span></div>
        </div>
        ${descHtml}
        ${privateHtml}
        ${filesHtml}
        ${statusControlHtml}
      </div>
    </div>`;
}

window.toggleAccordion = (id) => {
  if (openAccordionId && openAccordionId !== id) closeAccordion(openAccordionId);
  const acc = document.getElementById(`accordion-${id}`);
  if (!acc) return;
  if (acc.classList.contains('open')) { 
    closeAccordion(id); 
    return; 
  }
  acc.classList.add('open');
  openAccordionId = id;
};

window.closeAccordion = (id) => {
  const acc = document.getElementById(`accordion-${id}`);
  if (acc) acc.classList.remove('open');
  if (openAccordionId === id) openAccordionId = null;
};

window.closeModal = (id) => document.getElementById(id).classList.remove('open');

window.changeWorkStatus = async (quoteId, newStatus) => {
  try {
    const { error } = await supabase
      .from('quotes')
      .update({ work_status: newStatus })
      .eq('id', quoteId);

    if (error) throw error;

    showToast('Status updated');
    await loadWorks();
  } catch(e) {
    console.error('Status change failed:', e);
    alert('Failed: ' + e.message);
  }
};

window.moveToReports = async (quoteId) => {
  const dateInput = document.getElementById(`complete-date-${quoteId}`);
  const completionDate = dateInput.value;

  if (!completionDate) {
    alert('Please select completion date');
    return;
  }

  if (!confirm('Move this work to Reports?')) return;

  try {
    const { error } = await supabase
      .from('quotes')
      .update({ 
        completion_date: completionDate,
        work_status: 'completed'
      })
      .eq('id', quoteId);

    if (error) throw error;

    // 완료 알림 — 전체 입주자
    try {
      const { data: q } = await supabase.from('quotes').select('project, project_title, vendor').eq('id', quoteId).single();
      const projectName = q?.project || q?.project_title || 'A work item';
      const { data: { session: pushSession } } = await supabase.auth.getSession();
      await fetch('/api/send-push', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${pushSession.access_token}` },
        body: JSON.stringify({
          title: '✅ Work Completed',
          message: `${projectName} has been completed.`,
          url: '/pages/works.html'
        })
      });
    } catch(pushErr) {}

    showToast('Work moved to Reports');
    await loadWorks();
  } catch(e) {
    console.error('Move to reports failed:', e);
    alert('Failed: ' + e.message);
  }
};

window.openAddEmergencyWork = () => {
  document.getElementById('emergencyProject').value = '';
  document.getElementById('emergencyVendor').value = '';
  document.getElementById('emergencyAmount').value = '';
  document.getElementById('emergencyCategory').value = 'General';
  document.getElementById('emergencyNotes').value = '';
  emergencyFiles = [];
  document.getElementById('emergencyFilePreview').innerHTML = '';
  document.getElementById('emergencyModal').classList.add('open');
};

document.getElementById('editFileInput').addEventListener('change', e => {
  Array.from(e.target.files).forEach(file => {
    editFiles.push({ file, name: file.name });
  });
  const preview = document.getElementById('editNewFilePreview') || document.getElementById('editFilePreview');
  preview.innerHTML = editFiles.map((f,i) => `
    <div class="file-preview">
      <span class="file-icon">📄</span>
      <span class="file-name">${f.name}</span>
      <span class="file-del" onclick="editFiles.splice(${i},1);document.getElementById('editFileInput').dispatchEvent(new Event('change'))">✕</span>
    </div>`).join('');
  e.target.value = '';
});

document.getElementById('emergencyFileInput').addEventListener('change', e => {
  Array.from(e.target.files).forEach(f => {
    emergencyFiles.push({ 
      file: f, 
      name: f.name, 
      size: (f.size/1024).toFixed(1)+' KB', 
      type: f.type
    });
  });
  updateEmergencyFilePreview();
});

function updateEmergencyFilePreview() {
  const preview = document.getElementById('emergencyFilePreview');
  preview.innerHTML = emergencyFiles.map((f,i) => `
    <div class="file-preview">
      <span class="file-icon">📄</span>
      <span class="file-name">${f.name}</span>
      <span style="font-size:11px;color:#94a3b8">${f.size}</span>
      <span class="file-del" onclick="removeEmergencyFile(${i});event.stopPropagation()">✕</span>
    </div>
  `).join('');
}

window.removeEmergencyFile = idx => {
  emergencyFiles.splice(idx, 1);
  updateEmergencyFilePreview();
};

window.saveEmergencyWork = async () => {
  const project = document.getElementById('emergencyProject').value.trim();
  const vendor = document.getElementById('emergencyVendor').value.trim();
  let amountStr = document.getElementById('emergencyAmount').value.replace(/[^0-9.]/g, '');
  const amount = parseFloat(amountStr) || 0;
  const category = document.getElementById('emergencyCategory').value;
  const notes = document.getElementById('emergencyNotes').value.trim();

  if (!project || !vendor || amount <= 0) {
    alert('Required: Project, Vendor, Amount');
    return;
  }

  const saveBtn = document.getElementById('saveEmergencyBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  try {
    const quoteId = crypto.randomUUID();
    const projectId = crypto.randomUUID();
    const fileData = [];

    for (const f of emergencyFiles) {
      if (f.file) {
        const uploaded = await uploadFile(f.file, quoteId);
        fileData.push({
          path: uploaded.path,
          name: uploaded.name,
          type: uploaded.type,
          size: uploaded.size,
          visibility: 'internal'
        });
      }
    }

    const commentPayload = {
      note: 'Emergency work — authorised by management to ensure building safety',
      files: fileData,
      category: category,
      priority: 'Urgent'
    };

    const { error } = await supabase.from('quotes').insert({
      id: quoteId,
      project_id: projectId,
      project: project,
      vendor: vendor,
      amount: Number(amount),
      notes: notes,
      comment: commentPayload,
      category: category,
      status: 'approved',
      work_status: 'scheduled',
      is_emergency: true,
      work_start_date: new Date().toISOString().split('T')[0]
    });

    if (error) throw error;

    showToast('Emergency work saved');
    closeModal('emergencyModal');
    await loadWorks();
  } catch(e) {
    console.error('Save emergency work failed:', e);
    alert('Failed: ' + e.message);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save Emergency Work →';
  }
};

window.openEditWork = (quoteId) => {
  const work = allWorks.find(w => w.id === quoteId);
  if (!work) return;
  
  editFiles = [];
  deletedFilePaths = [];
  document.getElementById('editFilePreview').innerHTML = '';
  
  const parsed = parseComment(work.comment);
  
  document.getElementById('editWorkId').value = work.id;
  document.getElementById('editProject').value = work.project || '';
  document.getElementById('editVendor').value = work.vendor || '';
  document.getElementById('editAmount').value = work.amount ? Number(work.amount).toLocaleString('en-AU') : '';
  document.getElementById('editCategory').value = work.category || 'General';
  document.getElementById('editNotes').value = work.notes || '';
  document.getElementById('editInternalNotes').value = parsed.note || '';
  
  const workStartDate = work.work_start_date
    ? new Date(work.work_start_date).toISOString().split('T')[0]
    : new Date(work.created_at).toISOString().split('T')[0];
  document.getElementById('editWorkDate').value = workStartDate;

  // 기존 파일 목록 표시
  const preview = document.getElementById('editFilePreview');
  const existingFiles = parsed.files || [];
  if (existingFiles.length > 0) {
    preview.innerHTML = '<div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em">Saved Files</div>' +
      existingFiles.map((f, i) => `
        <div class="file-preview" id="existing-file-${i}">
          <span class="file-icon">📄</span>
          <span class="file-name">${f.name}</span>
          <span class="file-del" onclick="removeExistingFile(${i},'${f.path}');event.stopPropagation()">✕</span>
        </div>`).join('') +
      '<div id="editNewFilePreview"></div>';
  } else {
    preview.innerHTML = '<div id="editNewFilePreview"></div>';
  }
  
  document.getElementById('editModal').classList.add('open');
};

window.removeExistingFile = (index, path) => {
  deletedFilePaths.push(path);
  const el = document.getElementById(`existing-file-${index}`);
  if (el) el.remove();
};

window.saveEdit = async () => {
  const id = document.getElementById('editWorkId').value;
  const project = document.getElementById('editProject').value.trim();
  const vendor = document.getElementById('editVendor').value.trim();
  let amountStr = document.getElementById('editAmount').value.replace(/[^0-9.]/g, '');
  const amount = parseFloat(amountStr) || 0;
  const category = document.getElementById('editCategory').value;
  const notes = document.getElementById('editNotes').value.trim();
  const internalNote = document.getElementById('editInternalNotes').value.trim();
  const workStartDate = document.getElementById('editWorkDate').value;

  if (!project || !vendor || amount <= 0) {
    alert('Required: Project, Vendor, Amount');
    return;
  }

  try {
    const work = allWorks.find(w => w.id === id);
    const parsed = parseComment(work.comment);
    
    // 삭제된 파일 제외
    const existingFiles = (parsed.files || []).filter(f => !deletedFilePaths.includes(f.path));
    const newFileData = [];
    for (const f of editFiles) {
      if (f.file) {
        const uploaded = await uploadFile(f.file, id);
        newFileData.push({ path: uploaded.path, name: uploaded.name, type: uploaded.type, size: uploaded.size, visibility: 'internal' });
      }
    }

    // Storage에서 삭제
    if (deletedFilePaths.length > 0) {
      const cleanPaths = deletedFilePaths.map(p => p.replace(/^quotes\//, ''));
      await supabase.storage.from('quotes').remove(cleanPaths);
    }

    const updatedComment = {
      ...parsed,
      note: internalNote,
      category: category,
      files: [...existingFiles, ...newFileData]
    };

    const { error } = await supabase
      .from('quotes')
      .update({
        project: project,
        vendor: vendor,
        amount: Number(amount),
        category: category,
        notes: notes,
        comment: updatedComment,
        work_start_date: workStartDate || null
      })
      .eq('id', id);

    if (error) throw error;

    editFiles = [];
    showToast('Work updated');
    closeModal('editModal');
    await loadWorks();
  } catch(e) {
    console.error('Edit failed:', e);
    alert('Failed: ' + e.message);
  }
};

loadWorks();
</script>
</body>
</html>
