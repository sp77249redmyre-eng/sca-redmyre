<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ongoing Works – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="sidebarPlaceholder"></div>

<main class="main">
  <div id="topbarPlaceholder"></div>
  
  <div class="content">
    
    <!-- Section Header -->
    <div class="section-hdr">
      <div class="section-title">Ongoing Works</div>
      <div style="display:flex;gap:8px">
        <button class="btn-secondary" id="btnNewWork" style="display:none">+ New Work</button>
        <button class="btn-primary" id="btnEmergency" style="display:none">🔥 Emergency Work</button>
      </div>
    </div>

    <!-- Works List -->
    <div class="works-card" id="worksList">
      <div style="padding:40px;text-align:center;color:var(--muted)">Loading works...</div>
    </div>

  </div>
</main>

<!-- Work Modal -->
<div class="modal-backdrop" id="workModal">
  <div class="modal-box">
    <div class="modal-title" id="workModalTitle">New Work</div>
    
    <div class="modal-field">
      <label class="modal-label">Project Name *</label>
      <input type="text" class="modal-input" id="workProject" placeholder="e.g., Elevator Repair">
    </div>

    <div class="modal-field">
      <label class="modal-label">Category *</label>
      <select class="modal-select" id="workCategory">
        <option value="">Select category</option>
        <option value="Plumbing">Plumbing</option>
        <option value="Electrical">Electrical</option>
        <option value="HVAC">HVAC</option>
        <option value="Elevator">Elevator</option>
        <option value="Painting">Painting</option>
        <option value="Cleaning">Cleaning</option>
        <option value="Security">Security</option>
        <option value="Landscaping">Landscaping</option>
        <option value="General">General</option>
      </select>
    </div>

    <div class="modal-field">
      <label class="modal-label">Cost (Ex GST) *</label>
      <input type="number" class="modal-input" id="workCost" placeholder="0.00" step="0.01" min="0">
    </div>

    <div class="modal-field">
      <label class="modal-label">Contractor *</label>
      <select class="modal-select" id="workContractor">
        <option value="">Select contractor</option>
      </select>
    </div>

    <div class="modal-field">
      <label class="modal-label">Description</label>
      <textarea class="modal-textarea" id="workDescription" placeholder="Work details..."></textarea>
    </div>

    <div class="modal-field">
      <label class="modal-label">Private Notes (Internal Only)</label>
      <textarea class="modal-textarea" id="workNotes" placeholder="Internal notes..."></textarea>
      <div class="private-hint">⚠️ This field is NOT visible to residents or contractors</div>
    </div>

    <div class="modal-field">
      <label class="modal-label">Status</label>
      <select class="modal-select" id="workStatus">
        <option value="scheduled">Scheduled</option>
        <option value="inprog">In Progress</option>
        <option value="urgent">Urgent</option>
      </select>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('workModal')">Cancel</button>
      <button class="btn-primary" onclick="saveWork()">Save Work</button>
    </div>
  </div>
</div>

<!-- Complete Modal -->
<div class="modal-backdrop" id="completeModal">
  <div class="modal-box">
    <div class="modal-title">Mark as Completed</div>
    
    <input type="hidden" id="completeWorkId">
    
    <div class="modal-field">
      <label class="modal-label">Completion Date *</label>
      <input type="date" class="modal-input" id="completeDate">
    </div>

    <div class="modal-field">
      <label class="modal-label">Completion Notes</label>
      <textarea class="modal-textarea" id="completeNotes" placeholder="Final notes about completion..."></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('completeModal')">Cancel</button>
      <button class="btn-primary" onclick="confirmComplete()">Complete Work</button>
    </div>
  </div>
</div>

<!-- Photo Lightbox -->
<div class="modal-backdrop" id="photoLightbox" onclick="closeLightbox()">
  <img id="lightboxImg" style="max-width:90%;max-height:90%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.5)">
</div>

<!-- File Upload Modal -->
<div class="modal-backdrop" id="uploadModal">
  <div class="modal-box">
    <div class="modal-title">Upload Photos / Documents</div>
    <input type="file" id="fileInput" multiple style="margin-bottom:16px">
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('uploadModal')">Cancel</button>
      <button class="btn-primary" onclick="uploadFiles()">Upload</button>
    </div>
  </div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:14px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,0.3)"></div>

<script type="module">
import { initLayout } from '/js/layout.js';

// 🔥 STEP 1 — layout.js 통합
const ctx = await initLayout();
if (!ctx) {
  window.location.href = '/index.html';
  throw new Error('Layout initialization failed');
}

const { supabase, role, permissions } = ctx;

// 🔥 STEP 2 — 전역 변수
let allWorks = [];
let allContractors = [];
let selectedWork = null;
let openAccordionId = null;
let uploadWorkId = null;

const STATUS_MAP = {
  scheduled: { label: 'Scheduled', badge: 'badge-blue' },
  inprog: { label: 'In Progress', badge: 'badge-yellow' },
  urgent: { label: 'Urgent', badge: 'badge-red' },
  completed: { label: 'Completed', badge: 'badge-green' }
};

const BUCKET = 'works-photos';

// 🔥 STEP 3 — 권한 기반 버튼 제어
function initPermissions() {
  const canCreate = window.checkActionPermission('create_work', permissions, role);
  const canUpload = window.checkActionPermission('upload_files', permissions, role);
  
  document.getElementById('btnNewWork').style.display = canCreate ? '' : 'none';
  document.getElementById('btnEmergency').style.display = canCreate ? '' : 'none';
  
  window.canCreateWork = canCreate;
  window.canCompleteWork = window.checkActionPermission('complete_work', permissions, role);
  window.canEditWork = window.checkActionPermission('edit_work', permissions, role);
  window.canUploadFiles = canUpload;
  window.canDeleteFiles = window.checkActionPermission('delete_files', permissions, role);
}

// 🔥 STEP 4 — Contractors 로드
async function loadContractors() {
  try {
    const { data } = await supabase
      .from('contractors')
      .select('id, name')
      .order('name');
    
    allContractors = data || [];
    const sel = document.getElementById('workContractor');
    sel.innerHTML = '<option value="">Select contractor</option>' + 
      allContractors.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  } catch(e) {
    console.error('Failed to load contractors:', e);
  }
}

// 🔥 STEP 5 — Works 로드 (DB 레벨 필터링)
async function loadWorks() {
  try {
    const { data } = await supabase
      .from('works')
      .select(`
        *,
        contractor:contractors(id, name)
      `)
      .is('completed_date', null)
      .order('updated_at', { ascending: false });
    
    allWorks = data || [];
    renderWorks(allWorks);
  } catch(e) {
    console.error('Failed to load works:', e);
    document.getElementById('worksList').innerHTML = 
      '<div style="padding:40px;text-align:center;color:var(--red)">Failed to load works</div>';
  }
}

// 🔥 STEP 6 — Works 렌더링
function renderWorks(works) {
  const list = document.getElementById('worksList');
  
  if (works.length === 0) {
    list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">No active works</div>';
    return;
  }
  
  list.innerHTML = works.map(w => {
    const st = STATUS_MAP[w.status] || STATUS_MAP.scheduled;
    
    // 🔥 챗이사 최종: fallback 제거 - contractor 없으면 명확히 표시
    const contractorName = w.contractor?.name || '⚠️ Missing Contractor';
    const contractorStyle = w.contractor?.name ? '' : 'color:var(--red);font-weight:600';
    
    const lastUpdated = new Date(w.updated_at).toLocaleDateString('en-AU', {
      day: 'numeric', month: 'short', year: 'numeric'
    });
    
    return `
      <div class="work-row" onclick="toggleAccordion('${w.id}')">
        <div><span class="badge ${st.badge}">${st.label}</span></div>
        <div>
          <div class="work-title-text">${w.project_name}</div>
          <div class="work-meta-text">${w.category}</div>
        </div>
        <div class="work-meta-text" style="${contractorStyle}">${contractorName}</div>
        <div class="work-meta-text" style="text-align:right">${lastUpdated}</div>
      </div>
      <div class="work-accordion" id="acc-${w.id}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
          <div>
            <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:8px">DESCRIPTION</div>
            <div style="font-size:13px;line-height:1.6">${w.description || 'No description'}</div>
          </div>
          <div>
            <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:8px">DETAILS</div>
            <div style="font-size:12px;line-height:1.8">
              <div><strong>Cost:</strong> $${w.cost.toFixed(2)}</div>
              <div><strong>Category:</strong> ${w.category}</div>
              <div style="${contractorStyle}"><strong>Contractor:</strong> ${contractorName}</div>
              ${w.is_emergency ? '<div style="color:var(--red);font-weight:600">⚠️ EMERGENCY</div>' : ''}
            </div>
          </div>
        </div>
        
        ${w.private_notes ? `
          <div style="background:var(--yellow-bg);border:1px solid #fed7aa;border-radius:10px;padding:12px;margin-bottom:20px">
            <div style="font-size:11px;font-weight:600;color:#92400e;margin-bottom:6px">PRIVATE NOTES</div>
            <div style="font-size:12px;color:#92400e;white-space:pre-wrap">${w.private_notes}</div>
          </div>
        ` : ''}
        
        ${w.completion_notes ? `
          <div style="background:var(--green-bg);border:1px solid #86efac;border-radius:10px;padding:12px;margin-bottom:20px">
            <div style="font-size:11px;font-weight:600;color:var(--green-text);margin-bottom:6px">COMPLETION NOTES</div>
            <div style="font-size:12px;color:var(--green-text);white-space:pre-wrap">${w.completion_notes}</div>
          </div>
        ` : ''}
        
        <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:10px">PHOTOS / DOCUMENTS</div>
        <div class="photo-gallery" id="gallery-${w.id}">
          <div style="font-size:13px;color:var(--muted)">Loading...</div>
        </div>
        
        <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
          ${window.canUploadFiles ? `<button class="btn-secondary" onclick="openUploadModal('${w.id}',event)">📎 Upload Files</button>` : ''}
          ${window.canEditWork ? `<button class="btn-secondary" onclick="editWork('${w.id}',event)">✏️ Edit</button>` : ''}
          ${window.canCompleteWork ? `<button class="btn-primary" onclick="openCompleteModal('${w.id}',event)">✓ Mark Complete</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

// 🔥 STEP 7 — Accordion 토글
window.toggleAccordion = async (id) => {
  const acc = document.getElementById(`acc-${id}`);
  if (!acc) return;
  
  if (openAccordionId && openAccordionId !== id) {
    document.getElementById(`acc-${openAccordionId}`)?.classList.remove('open');
  }
  
  const isOpening = !acc.classList.contains('open');
  acc.classList.toggle('open');
  openAccordionId = isOpening ? id : null;
  
  if (isOpening) {
    await loadPhotos(id);
  }
};

window.closeAccordion = (id) => {
  const acc = document.getElementById(`acc-${id}`);
  if (acc) acc.classList.remove('open');
  if (openAccordionId === id) openAccordionId = null;
};

// 🔥 STEP 8 — New Work 모달
document.getElementById('btnNewWork').addEventListener('click', () => {
  selectedWork = null;
  document.getElementById('workModalTitle').textContent = 'New Work';
  document.getElementById('workProject').value = '';
  document.getElementById('workCategory').value = '';
  document.getElementById('workCost').value = '';
  document.getElementById('workContractor').value = '';
  document.getElementById('workDescription').value = '';
  document.getElementById('workNotes').value = '';
  document.getElementById('workStatus').value = 'scheduled';
  window.openModal('workModal');
});

// 🔥 STEP 9 — Emergency Work 모달
document.getElementById('btnEmergency').addEventListener('click', () => {
  selectedWork = null;
  document.getElementById('workModalTitle').textContent = '🔥 Emergency Work';
  document.getElementById('workProject').value = '';
  document.getElementById('workCategory').value = '';
  document.getElementById('workCost').value = '';
  document.getElementById('workContractor').value = '';
  document.getElementById('workDescription').value = '';
  document.getElementById('workNotes').value = '';
  document.getElementById('workStatus').value = 'urgent';
  window.openModal('workModal');
});

// 🔥 STEP 10 — Edit Work
window.editWork = (id, e) => {
  e.stopPropagation();
  selectedWork = allWorks.find(w => w.id === id);
  if (!selectedWork) return;
  
  document.getElementById('workModalTitle').textContent = 'Edit Work';
  document.getElementById('workProject').value = selectedWork.project_name;
  document.getElementById('workCategory').value = selectedWork.category;
  document.getElementById('workCost').value = selectedWork.cost;
  document.getElementById('workContractor').value = selectedWork.contractor_id || '';
  document.getElementById('workDescription').value = selectedWork.description || '';
  document.getElementById('workNotes').value = selectedWork.private_notes || '';
  document.getElementById('workStatus').value = selectedWork.status;
  window.openModal('workModal');
};

// 🔥 STEP 11 — Save Work (validation 강화)
window.saveWork = async () => {
  const projectName = document.getElementById('workProject').value.trim();
  const category = document.getElementById('workCategory').value.trim();
  const costInput = document.getElementById('workCost').value;
  const contractorId = document.getElementById('workContractor').value;
  const description = document.getElementById('workDescription').value.trim();
  const privateNotes = document.getElementById('workNotes').value.trim();
  const status = document.getElementById('workStatus').value;
  
  // 🔥 필수 필드 검증
  if (!projectName) {
    window.showToast('Please enter project name', true);
    return;
  }
  
  if (!category) {
    window.showToast('Please select category', true);
    return;
  }
  
  // 🔥 cost validation 강화
  const cost = parseFloat(costInput);
  if (isNaN(cost) || cost <= 0) {
    window.showToast('Please enter valid cost (greater than 0)', true);
    return;
  }
  
  // 🔥 contractor 필수
  if (!contractorId) {
    window.showToast('Please select contractor', true);
    return;
  }
  
  const isEmergency = status === 'urgent';
  
  const data = {
    project_name: projectName,
    category: category,
    cost: cost,
    contractor_id: contractorId,
    description: description,
    private_notes: privateNotes,
    status: status,
    is_emergency: isEmergency,
    updated_at: new Date().toISOString()
  };
  
  try {
    if (selectedWork) {
      await supabase.from('works').update(data).eq('id', selectedWork.id);
      window.showToast('Work updated');
    } else {
      await supabase.from('works').insert(data);
      window.showToast('Work created');
    }
    
    window.closeModal('workModal');
    await loadWorks();
  } catch(e) {
    console.error('Failed to save work:', e);
    window.showToast('Failed to save: ' + e.message, true);
  }
};

// 🔥 STEP 12 — Complete Work (completion_notes 필드 사용)
window.openCompleteModal = (id, e) => {
  if (e) e.stopPropagation();
  selectedWork = allWorks.find(w => w.id === id);
  document.getElementById('completeWorkId').value = id;
  
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('completeDate').value = today;
  document.getElementById('completeNotes').value = '';
  window.openModal('completeModal');
};

window.confirmComplete = async () => {
  const id = document.getElementById('completeWorkId').value;
  const date = document.getElementById('completeDate').value;
  const notes = document.getElementById('completeNotes').value.trim();
  
  if (!date) {
    window.showToast('Please select completion date', true);
    return;
  }
  
  try {
    const work = allWorks.find(w => w.id === id);
    if (!work) {
      window.showToast('Work not found', true);
      return;
    }
    
    // 🔥 챗이사 최종: completion_notes 필드에 저장
    await supabase.from('works').update({
      status: 'completed',
      completed_date: date,
      completion_notes: notes || null,
      updated_at: new Date().toISOString()
    }).eq('id', id);
    
    window.closeModal('completeModal');
    if (openAccordionId) closeAccordion(openAccordionId);
    await loadWorks();
    window.showToast('Work completed ✓ (Report auto-generated)');
  } catch(e) {
    console.error('Failed to complete work:', e);
    window.showToast('Failed to complete work: ' + e.message, true);
  }
};

// 🔥 STEP 13 — File Upload
window.openUploadModal = (workId, e) => {
  if (e) e.stopPropagation();
  uploadWorkId = workId;
  document.getElementById('fileInput').value = '';
  window.openModal('uploadModal');
};

window.uploadFiles = async () => {
  const files = document.getElementById('fileInput').files;
  if (!files || files.length === 0) {
    window.showToast('Please select files', true);
    return;
  }
  
  try {
    for (const file of files) {
      const filePath = `${uploadWorkId}/${Date.now()}_${file.name}`;
      await supabase.storage.from(BUCKET).upload(filePath, file);
    }
    
    window.closeModal('uploadModal');
    window.showToast('Files uploaded');
    if (openAccordionId === uploadWorkId) await loadPhotos(uploadWorkId);
  } catch(e) {
    console.error('Upload failed:', e);
    window.showToast('Upload failed: ' + e.message, true);
  }
};

// 🔥 STEP 14 — Load Photos
async function loadPhotos(workId) {
  const gallery = document.getElementById(`gallery-${workId}`);
  if (!gallery) return;
  
  try {
    const { data } = await supabase.storage.from(BUCKET).list(workId);
    
    if (!data || data.length === 0) {
      gallery.innerHTML = '<div style="font-size:13px;color:var(--muted)">No photos or documents yet.</div>';
      return;
    }
    
    gallery.innerHTML = data.map(file => {
      const { data: urlData } = supabase.storage.from(BUCKET).getPublicUrl(`${workId}/${file.name}`);
      const isImage = /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name);
      
      return `
        <div class="photo-gallery-item">
          ${isImage
            ? `<img src="${urlData.publicUrl}" onclick="openLightbox('${urlData.publicUrl}')">`
            : `<div style="height:100%;display:flex;align-items:center;justify-content:center;background:#f1f5f9;color:var(--muted);font-size:11px;cursor:pointer" onclick="window.open('${urlData.publicUrl}','_blank')">📄 ${file.name}</div>`}
          ${window.canDeleteFiles ? `<button class="delete-photo-btn" onclick="deletePhoto('${workId}','${file.name}',event)">✕</button>` : ''}
        </div>`;
    }).join('');
  } catch(e) {
    gallery.innerHTML = '<div style="font-size:13px;color:var(--muted)">Failed to load files.</div>';
  }
}

window.deletePhoto = async (workId, fileName, e) => {
  e.stopImmediatePropagation();
  if (!confirm('Delete this file?')) return;
  
  try {
    await supabase.storage.from(BUCKET).remove([`${workId}/${fileName}`]);
    window.showToast('File deleted');
    if (openAccordionId === workId) await loadPhotos(workId);
  } catch(e) {
    window.showToast('Delete failed', true);
  }
};

window.openLightbox = (url) => {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('photoLightbox').classList.add('open');
};

window.closeLightbox = () => {
  document.getElementById('photoLightbox').classList.remove('open');
};

// 🔥 STEP 15 — Initialize
initPermissions();
await loadContractors();
await loadWorks();

</script>
</body>
</html>
