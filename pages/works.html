<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ongoing Works – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue-900:#0f2456;--blue-800:#1e3a8a;--blue-700:#1e4fa3;--blue-600:#2563eb;
  --blue-400:#60a5fa;--blue-100:#dbeafe;--blue-50:#eff6ff;
  --bg:#f0f4f8;--surface:#fff;--border:#e2e8f0;--border-light:#f1f5f9;
  --text:#0f172a;--text-2:#475569;--muted:#94a3b8;
  --green:#10b981;--green-bg:#ecfdf5;--green-text:#065f46;
  --yellow:#f59e0b;--yellow-bg:#fffbeb;--yellow-text:#92400e;
  --red:#ef4444;--red-bg:#fef2f2;--red-text:#991b1b;
}
.content{padding:24px}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--blue-600)}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;display:inline-block;white-space:nowrap}
.badge-green{background:var(--green-bg);color:var(--green-text)}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow-text)}
.badge-blue{background:var(--blue-50);color:var(--blue-700)}
.badge-red{background:var(--red-bg);color:var(--red-text)}
.badge-gray{background:var(--border-light);color:var(--text-2)}
.btn-primary{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:linear-gradient(135deg,var(--blue-800),var(--blue-600));color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-secondary{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text-2);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-num{font-size:26px;font-weight:600;letter-spacing:-1px}
.stat-label{font-size:12px;color:var(--muted);margin-top:3px}
.works-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.work-row{display:grid;grid-template-columns:120px 140px 120px 1fr 160px 100px;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border-light);transition:background 0.12s}
.work-row:last-child{border-bottom:none}
.work-row:hover{background:var(--bg)}
.work-title-text{font-size:13px;font-weight:600}
.work-meta-text{font-size:11px;color:var(--muted);margin-top:2px}
.work-accordion{display:none;background:var(--bg);border-top:1px solid var(--border-light);padding:18px 20px;animation:slideDown 0.2s ease}
.work-accordion.open{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.2)}
.empty-state{text-align:center;padding:60px 24px;color:var(--muted)}
.photo-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.photo-gallery-item{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;cursor:pointer;background:var(--bg)}
.photo-gallery-item img{width:100%;height:100%;object-fit:cover}
.photo-lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;align-items:center;justify-content:center}
.photo-lightbox.open{display:flex}
.photo-lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain}
.photo-lightbox-close{position:fixed;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;z-index:1001}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    <div class="section-hdr">
      <div class="section-title">Ongoing Works</div>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="statTotal" style="color:var(--blue-600)">—</div><div class="stat-label">Total Active</div></div>
      <div class="stat-card"><div class="stat-num" id="statUrgent" style="color:var(--red)">—</div><div class="stat-label">Urgent</div></div>
      <div class="stat-card"><div class="stat-num" id="statApproved" style="color:var(--green)">—</div><div class="stat-label">Approved</div></div>
      <div class="stat-card"><div class="stat-num" id="statAmount" style="color:var(--text)">$0</div><div class="stat-label">Total Value</div></div>
    </div>

    <div class="works-card">
      <div style="display:grid;grid-template-columns:120px 140px 120px 1fr 160px 100px;gap:14px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">
        <div>Date</div>
        <div>Category</div>
        <div>Priority</div>
        <div>Project</div>
        <div>Contractor</div>
        <div style="text-align:right">Amount</div>
      </div>
      <div id="worksList">
        <div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">Loading…</div>
      </div>
    </div>

  <div class="photo-lightbox" id="photoLightbox" onclick="closeLightbox()">
    <div class="photo-lightbox-close" onclick="closeLightbox()">✕</div>
    <img id="lightboxImg" src="" alt="">
  </div>

<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role } = ctx;

const privileged = ['admin','committee','observer'];

window.showToast = (msg, isError=false) => {
  const t = document.getElementById('toast');
  t.textContent = msg; 
  t.style.background = isError ? '#991b1b' : '#0f172a';
  t.style.display = 'block'; 
  setTimeout(()=>t.style.display='none', 3000);
};

let allWorks = [];
let openAccordionId = null;

function parseComment(comment) {
  try {
    if (!comment) return { note:'', files:[], category:'General', priority:'Normal' };
    const obj = typeof comment === 'string' ? JSON.parse(comment) : comment;
    let files = Array.isArray(obj?.files) ? obj.files : [];
    return {
      note: obj?.note || '',
      files: files.filter(f => f && f.path),
      category: obj?.category || 'General',
      priority: obj?.priority || 'Normal'
    };
  } catch(e) { 
    return { note:'', files:[], category:'General', priority:'Normal' }; 
  }
}

async function loadWorks() {
  const { data } = await supabase
    .from('quotes')
    .select('*')
    .eq('status', 'approved')
    .order('created_at', {ascending: false});
  allWorks = data || [];

  const totalAmount = allWorks.reduce((sum, w) => sum + (Number(w.amount) || 0), 0);
  
  document.getElementById('statTotal').textContent = allWorks.length;
  document.getElementById('statUrgent').textContent = allWorks.filter(w => {
    const parsed = parseComment(w.comment);
    return (parsed.priority || '').toLowerCase() === 'urgent';
  }).length;
  document.getElementById('statApproved').textContent = allWorks.length;
  document.getElementById('statAmount').textContent = '$' + totalAmount.toLocaleString('en-AU', {minimumFractionDigits: 0});

  renderWorks();
}

function renderWorks() {
  const list = document.getElementById('worksList');
  if (!allWorks.length) {
    list.innerHTML = `<div class="empty-state"><div style="font-size:48px;margin-bottom:16px">📋</div><div style="font-size:16px;font-weight:600;color:var(--text-2)">No approved works</div></div>`;
    return;
  }
  list.innerHTML = allWorks.map(w => workRow(w)).join('');
}

function workRow(w) {
  const parsed = parseComment(w.comment);
  const priorityClass = (parsed.priority || '').toLowerCase() === 'urgent' ? 'badge-red' : (parsed.priority || '').toLowerCase() === 'high' ? 'badge-yellow' : 'badge-gray';
  
  return `
    <div class="work-row" id="row-${w.id}">
      <div onclick="toggleAccordion('${w.id}')" style="display:contents;cursor:pointer">
        <div class="work-meta-text">${new Date(w.created_at).toLocaleDateString('en-AU')}</div>
        <div class="work-meta-text">${w.category || 'General'}</div>
        <div>
          <span class="badge ${priorityClass}">
            ${parsed.priority || 'Normal'}
          </span>
        </div>
        <div>
          <div class="work-title-text">${w.project || 'Untitled'}</div>
        </div>
        <div class="work-meta-text">${w.vendor || '—'}</div>
        <div style="text-align:right;font-size:13px;font-weight:600">$${Number(w.amount || 0).toLocaleString('en-AU')}</div>
      </div>
    </div>
    ${buildAccordion(w)}`;
}

function buildAccordion(w) {
  const parsed = parseComment(w.comment);
  const updated = new Date(w.updated_at||w.created_at).toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});

  let descHtml = w.notes ? `
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light)">
      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">Scope</div>
      <p style="font-size:13px;color:var(--text-2);line-height:1.7">${w.notes}</p>
    </div>` : '';

  let privateHtml = privileged.includes(role) && parsed.note ? `
    <div style="margin-top:12px">
      <div style="background:#f0f7ff;border:1px solid #dbeafe;border-radius:10px;padding:14px">
        <div style="font-size:11px;font-weight:600;color:var(--blue-700);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">🔒 Internal Notes</div>
        <p style="font-size:13px;color:var(--text-2);line-height:1.7">${parsed.note}</p>
      </div>
    </div>` : '';

  return `
    <div class="work-accordion" id="accordion-${w.id}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:12px">
        <div>
          <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">${w.project || 'Untitled'}</div>
          <span class="badge badge-green">Approved</span>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn-secondary" onclick="closeAccordion('${w.id}')" style="padding:5px 10px;font-size:11px">✕</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
        <div><div style="font-size:11px;color:var(--muted);text-transform:uppercase">Vendor</div><div style="font-size:13px">${w.vendor || '—'}</div></div>
        <div><div style="font-size:11px;color:var(--muted);text-transform:uppercase">Amount</div><div style="font-size:13px;font-weight:600">$${Number(w.amount || 0).toLocaleString('en-AU')}</div></div>
        <div><div style="font-size:11px;color:var(--muted);text-transform:uppercase">Approved</div><div style="font-size:13px">${updated}</div></div>
      </div>
      ${descHtml}
      ${privateHtml}
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light)">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Quote Files</div>
        <div class="photo-gallery" id="gallery-${w.id}"><div style="font-size:13px;color:var(--muted)">Loading…</div></div>
      </div>
    </div>`;
}

window.toggleAccordion = async (id) => {
  if (openAccordionId && openAccordionId !== id) closeAccordion(openAccordionId);
  const acc = document.getElementById(`accordion-${id}`);
  if (!acc) return;
  if (acc.classList.contains('open')) { closeAccordion(id); return; }
  acc.classList.add('open');
  openAccordionId = id;
  await loadPhotos(id);
};

window.closeAccordion = (id) => {
  const acc = document.getElementById(`accordion-${id}`);
  if (acc) acc.classList.remove('open');
  if (openAccordionId === id) openAccordionId = null;
};

async function loadPhotos(quoteId) {
  const gallery = document.getElementById(`gallery-${quoteId}`);
  if (!gallery) return;
  try {
    const { data } = await supabase.storage.from('quotes').list(`${quoteId}`);
    if (!data || data.length === 0) { 
      gallery.innerHTML = '<div style="font-size:13px;color:var(--muted)">No files.</div>'; 
      return; 
    }
    gallery.innerHTML = data.map(file => {
      const { data: urlData } = supabase.storage.from('quotes').getPublicUrl(`${quoteId}/${file.name}`);
      return `<div class="photo-gallery-item"><img src="${urlData.publicUrl}" onclick="openLightbox('${urlData.publicUrl}'); event.stopPropagation();"></div>`;
    }).join('');
  } catch(e) { 
    console.error('Load photos error:', e);
    gallery.innerHTML = 'Error loading files.'; 
  }
}

window.openLightbox = (url) => {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('photoLightbox').classList.add('open');
};

window.closeLightbox = () => document.getElementById('photoLightbox').classList.remove('open');

loadWorks();
</script>
</body>
</html>
