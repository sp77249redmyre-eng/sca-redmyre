<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ongoing Works – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v4.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/pages/works.css">



</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">

    <div class="page-header">
      <div class="page-header-icon">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </div>
      <div class="page-header-body">
        <div class="page-header-title-row">
          <span class="page-header-title">Active Works</span>
          <span id="worksCount" style="font-size:12px;font-weight:700;background:#dbeafe;color:#1e40af;padding:2px 9px;border-radius:99px;display:none"></span>
          <button id="addWorkBtn" style="display:none;background:#1e3a8a;color:#fff;border:none;padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap" onclick="openAddEmergencyWork()">+ Direct Work Order</button>
        </div>
        <div class="page-header-sub">Track active building works, repairs, and contractor projects.</div>
      </div>
    </div>

    <div id="worksList">
      <div style="padding:24px;text-align:center;color:#475569">Loading…</div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════
     DIRECT WORK ORDER — 대형 2열 모달
     quotes.html Add New Quote와 동일한 레이아웃
     ═══════════════════════════════════════════════ -->
<div class="modal-backdrop" id="emergencyModal" onclick="if(event.target===this)closeModal('emergencyModal')">
  <div class="dwo-modal-box">

    <!-- 타이틀 -->
    <div class="dwo-modal-title">Add Direct Work Order</div>

    <!-- 좌측: 기본 정보 -->
    <div class="dwo-left-col">

      <div class="dwo-field">
        <label class="dwo-label">Project / Works Description</label>
        <select id="emergencyProject" class="dwo-select">
          <option value="Building Manager Direct Work">Building Manager Direct Work</option>
          <option value="Committee Approved Work">Committee Approved Work</option>
        </select>
      </div>

      <div class="dwo-field">
        <label class="dwo-label">Vendor / Contractor</label>
        <input type="text" id="emergencyVendor" class="dwo-input" placeholder="Company name">
      </div>

      <div class="dwo-field">
        <label class="dwo-label">Amount (AUD, ex GST)</label>
        <input type="text" id="emergencyAmount" class="dwo-input" placeholder="0.00" oninput="formatAmount(this)">
      </div>

      <div class="dwo-field">
        <label class="dwo-label">Category</label>
        <select id="emergencyCategory" class="dwo-select">
          <option value="General">General</option>
          <option value="HVAC">HVAC</option>
          <option value="Fire">Fire</option>
          <option value="Electrical">Electrical</option>
          <option value="Security">Security</option>
          <option value="Plumbing">Plumbing</option>
          <option value="Lift">Lift</option>
        </select>
      </div>

      <div class="dwo-field">
        <label class="dwo-label">Priority</label>
        <select id="emergencyPriority" class="dwo-select">
          <option value="Normal">Normal</option>
          <option value="High">High</option>
          <option value="Urgent">Urgent</option>
        </select>
      </div>

    </div>

    <!-- 우측: 메모 + 첨부 -->
    <div class="dwo-right-col">

      <!-- Scope / Notes (Public) -->
      <div class="dwo-field">
        <label class="dwo-label">Scope / Notes (Public)</label>
        <div class="dwo-rte-toolbar">
          <button type="button" onclick="dwoRteCmd('emergencyNotes','bold')"><b>B</b></button>
          <button type="button" onclick="dwoRteCmd('emergencyNotes','italic')"><i>I</i></button>
          <button type="button" onclick="dwoRteCmd('emergencyNotes','underline')"><u>U</u></button>
          <div class="dwo-rte-sep"></div>
          <button type="button" onclick="dwoRteColor('emergencyNotes','#dc2626')" style="color:#dc2626">A</button>
          <button type="button" onclick="dwoRteColor('emergencyNotes','#d97706')" style="color:#d97706">A</button>
          <button type="button" onclick="dwoRteColor('emergencyNotes','#2563eb')" style="color:#2563eb">A</button>
          <button type="button" onclick="dwoRteColor('emergencyNotes','#16a34a')" style="color:#16a34a">A</button>
          <button type="button" onclick="dwoRteColor('emergencyNotes','inherit')" style="color:#475569;font-size:11px">&#10005;</button>
          <div class="dwo-rte-sep"></div>
          <button type="button" onclick="dwoRteClear('emergencyNotes')" style="font-size:10px">CLR</button>
        </div>
        <div class="dwo-rte-textarea" id="emergencyNotes" contenteditable="true" data-placeholder="Brief description visible to owners and occupants..."></div>
      </div>

      <!-- Internal Notes -->
      <div class="dwo-field">
        <label class="dwo-label">Internal Notes <span class="in-tag">Committee only</span></label>
        <div class="dwo-rte-toolbar dwo-rte-toolbar-inote">
          <button type="button" onclick="dwoRteCmd('emergencyInternalNotes','bold')"><b>B</b></button>
          <button type="button" onclick="dwoRteCmd('emergencyInternalNotes','italic')"><i>I</i></button>
          <button type="button" onclick="dwoRteCmd('emergencyInternalNotes','underline')"><u>U</u></button>
          <div class="dwo-rte-sep"></div>
          <button type="button" onclick="dwoRteColor('emergencyInternalNotes','#dc2626')" style="color:#dc2626">A</button>
          <button type="button" onclick="dwoRteColor('emergencyInternalNotes','#d97706')" style="color:#d97706">A</button>
          <button type="button" onclick="dwoRteColor('emergencyInternalNotes','#2563eb')" style="color:#2563eb">A</button>
          <button type="button" onclick="dwoRteColor('emergencyInternalNotes','#16a34a')" style="color:#16a34a">A</button>
          <button type="button" onclick="dwoRteColor('emergencyInternalNotes','inherit')" style="color:#475569;font-size:11px">&#10005;</button>
          <div class="dwo-rte-sep"></div>
          <button type="button" onclick="dwoRteClear('emergencyInternalNotes')" style="font-size:10px">CLR</button>
        </div>
        <div class="dwo-rte-textarea dwo-rte-textarea-inote" id="emergencyInternalNotes" contenteditable="true" data-placeholder="Private notes for building management and committee only..."></div>
      </div>

      <!-- Attachments -->
      <div class="dwo-field">
        <label class="dwo-label">Attachments</label>
        <input type="file" id="emergencyFileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx" style="display:none">
        <div class="dwo-upload-area" onclick="document.getElementById('emergencyFileInput').click()">
          <div>Click to upload files (PDF, Word, Excel, Images)</div>
        </div>
        <div class="dwo-file-list" id="emergencyFilePreview"></div>
      </div>

    </div>

    <!-- 푸터 -->
    <div class="dwo-footer">
      <button class="dwo-btn-cancel" onclick="closeModal('emergencyModal')">Cancel</button>
      <button class="dwo-btn-save" id="saveEmergencyBtn" onclick="saveEmergencyWork()">Save Direct Work Order →</button>
    </div>

  </div>
</div>

<!-- EDIT WORK MODAL -->
<div class="modal-backdrop" id="editModal">
  <div class="modal-box" style="max-width:640px">
    <div class="modal-title">Edit Work</div>
    <input type="hidden" id="editWorkId">
    <div class="modal-field">
      <label class="modal-label">Project Description</label>
      <input type="text" class="modal-input" id="editProject">
    </div>
    <div class="modal-field">
      <label class="modal-label">Vendor / Contractor</label>
      <input type="text" class="modal-input" id="editVendor">
    </div>
    <div class="modal-field">
      <label class="modal-label">Amount (AUD) (ex GST)</label>
      <input type="text" class="modal-input" id="editAmount" oninput="formatAmount(this)">
    </div>
    <div class="modal-field">
      <label class="modal-label">Category</label>
      <select class="modal-select" id="editCategory">
        <option value="General">General</option>
        <option value="HVAC">HVAC</option>
        <option value="Fire">Fire</option>
        <option value="Electrical">Electrical</option>
        <option value="Security">Security</option>
        <option value="Plumbing">Plumbing</option>
        <option value="Lift">Lift</option>
      </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">Notes</label>
      <div class="rte-wrap">
        <div class="rte-toolbar">
          <button type="button" onclick="rteCmd('editNotes','bold')"><b>B</b></button>
          <button type="button" onclick="rteCmd('editNotes','italic')"><i>I</i></button>
          <button type="button" onclick="rteCmd('editNotes','underline')"><u>U</u></button>
          <div class="rte-sep"></div>
          <button type="button" onclick="rteColor('editNotes','#dc2626')" style="color:#dc2626">A</button>
          <button type="button" onclick="rteColor('editNotes','#d97706')" style="color:#d97706">A</button>
          <button type="button" onclick="rteColor('editNotes','#2563eb')" style="color:#2563eb">A</button>
          <button type="button" onclick="rteColor('editNotes','#16a34a')" style="color:#16a34a">A</button>
          <button type="button" onclick="rteColor('editNotes','inherit')" style="color:#475569;font-size:11px">&#10005;</button>
          <div class="rte-sep"></div>
          <button type="button" onclick="rteClear('editNotes')" style="font-size:10px">CLR</button>
        </div>
        <div class="modal-textarea rte-textarea" id="editNotes" contenteditable="true" style="min-height:140px;outline:none"></div>
      </div>
    </div>
    <div class="modal-field">
      <label class="modal-label">Internal Notes</label>
      <div class="rte-wrap">
        <div class="rte-toolbar rte-toolbar-inote">
          <button type="button" onclick="rteCmd('editInternalNotes','bold')"><b>B</b></button>
          <button type="button" onclick="rteCmd('editInternalNotes','italic')"><i>I</i></button>
          <button type="button" onclick="rteCmd('editInternalNotes','underline')"><u>U</u></button>
          <div class="rte-sep"></div>
          <button type="button" onclick="rteColor('editInternalNotes','#dc2626')" style="color:#dc2626">A</button>
          <button type="button" onclick="rteColor('editInternalNotes','#d97706')" style="color:#d97706">A</button>
          <button type="button" onclick="rteColor('editInternalNotes','#2563eb')" style="color:#2563eb">A</button>
          <button type="button" onclick="rteColor('editInternalNotes','#16a34a')" style="color:#16a34a">A</button>
          <button type="button" onclick="rteColor('editInternalNotes','inherit')" style="color:#475569;font-size:11px">&#10005;</button>
          <div class="rte-sep"></div>
          <button type="button" onclick="rteClear('editInternalNotes')" style="font-size:10px">CLR</button>
        </div>
        <div class="modal-textarea rte-textarea rte-textarea-inote" id="editInternalNotes" contenteditable="true" style="min-height:140px;outline:none"></div>
      </div>
    </div>
    <div class="modal-field">
      <label class="modal-label">Work Start Date</label>
      <input type="date" class="modal-input" id="editWorkDate">
    </div>
    <div class="modal-field">
      <label class="modal-label">Attach files (internal only)</label>
      <input type="file" id="editFileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" style="display:none">
      <button class="btn-secondary" onclick="document.getElementById('editFileInput').click()">+ Choose Files</button>
      <div id="editFilePreview" style="margin-top:10px"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('editModal')">Cancel</button>
      <button class="btn-primary" onclick="saveEdit()">Save Changes →</button>
    </div>
  </div>
</div>

<div id="fileViewerModal" tabindex="-1" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;flex-direction:column;padding:16px;outline:none" onclick="if(event.target===this)closeViewer()">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-shrink:0" onclick="event.stopPropagation()">
    <span id="viewerFileName" style="color:#e5e7eb;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:calc(100% - 120px)"></span>
    <div style="display:flex;gap:8px;flex-shrink:0">
      <button onclick="printViewer()" style="background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;padding:6px 14px;display:flex;align-items:center;gap:6px">Print</button>
      <button onclick="closeViewer()" style="background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:22px;cursor:pointer;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center">&times;</button>
    </div>
  </div>
  <div id="viewerContent" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:10px" onclick="event.stopPropagation()"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/js/works.js"></script>
</body>
</html>
