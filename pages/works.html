<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ongoing Works – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue-900:#0f2456;--blue-800:#1e3a8a;--blue-700:#1e4fa3;--blue-600:#2563eb;
  --blue-400:#60a5fa;--blue-100:#dbeafe;--blue-50:#eff6ff;
  --bg:#f0f4f8;--surface:#fff;--border:#e2e8f0;--border-light:#f1f5f9;
  --text:#0f172a;--text-2:#475569;--muted:#94a3b8;
  --green:#10b981;--green-bg:#ecfdf5;--green-text:#065f46;
  --yellow:#f59e0b;--yellow-bg:#fffbeb;--yellow-text:#92400e;
  --red:#ef4444;--red-bg:#fef2f2;--red-text:#991b1b;
}
.content{padding:24px}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--blue-600)}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;display:inline-block;white-space:nowrap}
.badge-green{background:var(--green-bg);color:var(--green-text)}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow-text)}
.badge-blue{background:var(--blue-50);color:var(--blue-700)}
.badge-red{background:var(--red-bg);color:var(--red-text)}
.badge-gray{background:var(--border-light);color:var(--text-2)}
.btn-primary{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:linear-gradient(135deg,var(--blue-800),var(--blue-600));color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-secondary{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text-2);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-danger{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;background:var(--red-bg);border:1px solid #fecaca;color:var(--red-text);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-num{font-size:26px;font-weight:600;letter-spacing:-1px}
.stat-label{font-size:12px;color:var(--muted);margin-top:3px}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:100px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
.filter-btn.active{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.works-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.work-row{display:grid;grid-template-columns:120px 140px 120px 1fr 160px;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border-light);cursor:pointer;transition:background 0.12s}
.work-row:last-child{border-bottom:none}
.work-row:hover{background:var(--bg)}
.work-title-text{font-size:13px;font-weight:600}
.work-meta-text{font-size:11px;color:var(--muted);margin-top:2px}
.work-accordion{display:none;background:var(--bg);border-top:1px solid var(--border-light);padding:18px 20px;animation:slideDown 0.2s ease}
.work-accordion.open{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.5);z-index:500;align-items:center;justify-content:center;padding:20px}
.modal-backdrop.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:600;margin-bottom:22px}
.modal-field{margin-bottom:14px}
.modal-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:7px;display:block}
.modal-input{width:100%;height:44px;padding:0 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);outline:none}
.modal-input:focus{border-color:var(--blue-600);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.modal-textarea{width:100%;min-height:100px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);outline:none;resize:vertical;line-height:1.6}
.modal-textarea:focus{border-color:var(--blue-600);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.modal-select{width:100%;height:44px;padding:0 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.private-hint{font-size:12px;color:#92400e;background:#fef9f0;border:1px solid #fed7aa;border-radius:8px;padding:8px 12px;margin-top:6px}
.toast{position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.2)}
.empty-state{text-align:center;padding:60px 24px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-title{font-size:16px;font-weight:600;color:var(--text-2);margin-bottom:8px}
.photo-upload-area{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:all 0.15s;margin-top:4px;background:var(--bg)}
.photo-upload-area:hover{border-color:var(--blue-600);background:var(--blue-50)}
.photo-preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px}
.photo-preview-item{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1}
.photo-preview-item img{width:100%;height:100%;object-fit:cover}
.photo-preview-item .remove-photo{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.photo-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.photo-gallery-item{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;cursor:pointer;background:var(--bg)}
.photo-gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.15s}
.photo-gallery-item:hover img{transform:scale(1.05)}
.photo-gallery-item .delete-photo-btn{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(239,68,68,0.9);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center;cursor:pointer;border:none}
.photo-gallery-item:hover .delete-photo-btn{display:flex}
.photo-lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;align-items:center;justify-content:center}
.photo-lightbox.open{display:flex}
.photo-lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain}
.photo-lightbox-close{position:fixed;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;z-index:1001;line-height:1}
.quote-files-section{margin-top:12px;padding:14px;background:#fef9f0;border:1px solid #fed7aa;border-radius:10px}
.quote-files-label{font-size:11px;font-weight:600;color:#92400e;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.quote-file-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#fff;border:1px solid #fed7aa;border-radius:8px;font-size:12px;margin-bottom:5px}
.quote-file-item:last-child{margin-bottom:0}
.quote-file-item a{flex:1;color:#92400e;font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quote-file-item a:hover{text-decoration:underline}
.work-files-section{margin-top:12px}
.work-files-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px}
@media(max-width:900px){.work-row{grid-template-columns:120px 140px 120px 1fr 160px}}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    <div class="section-hdr">
      <div class="section-title">Ongoing Works</div>
      <button class="btn-primary" id="addWorkBtn" style="display:none">+ Emergency Work</button>
    </div>

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="statTotal" style="color:var(--blue-600)">—</div><div class="stat-label">Total Active</div></div>
      <div class="stat-card"><div class="stat-num" id="statUrgent" style="color:var(--red)">—</div><div class="stat-label">Urgent</div></div>
      <div class="stat-card"><div class="stat-num" id="statInprog" style="color:var(--yellow)">—</div><div class="stat-label">In Progress</div></div>
      <div class="stat-card"><div class="stat-num" id="statDone" style="color:var(--green)">—</div><div class="stat-label">Completed</div></div>
    </div>

    <!-- FILTERS -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="in_progress">🔵 In Progress</button>
      <button class="filter-btn" data-filter="scheduled">📅 Scheduled</button>
    </div>

    <!-- WORKS LIST -->
    <div class="works-card">
      <div style="display:grid;grid-template-columns:120px 140px 120px 1fr 160px;gap:14px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">
        <div>Date</div>
        <div>Category</div>
        <div>Priority</div>
        <div>Project</div>
        <div>Contractor</div>
      </div>
      <div id="worksList">
        <div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">Loading…</div>
      </div>
    </div>

  <input type="file" id="photoUploadInput" accept="image/*,application/pdf" multiple style="display:none">

  <!-- LIGHTBOX -->
  <div class="photo-lightbox" id="photoLightbox" onclick="closeLightbox()">
    <div class="photo-lightbox-close" onclick="closeLightbox()">✕</div>
    <img id="lightboxImg" src="" alt="">
  </div>

<!-- COMPLETE MODAL -->
<div class="modal-backdrop" id="completeModal">
  <div class="modal-box" style="max-width:420px">
    <div class="modal-title">✅ Complete & Move to Reports</div>
    <input type="hidden" id="completeWorkId">
    <p style="font-size:13px;color:var(--text-2);margin-bottom:18px;line-height:1.6">This work will be marked as completed and will appear in Financial Reports.</p>
    <div class="modal-field">
      <label class="modal-label">Completion Date</label>
      <input class="modal-input" type="date" id="completeDate">
    </div>
    <div class="modal-field">
      <label class="modal-label">Completion Notes (optional)</label>
      <textarea class="modal-textarea" id="completeNotes" placeholder="Any final notes…" style="min-height:80px"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('completeModal')">Cancel</button>
      <button class="btn-primary" onclick="confirmComplete()" style="background:linear-gradient(135deg,#065f46,#10b981)">✅ Mark Complete →</button>
    </div>
  </div>
</div>

<!-- WORK MODAL (EMERGENCY WORK) -->
<div class="modal-backdrop" id="workModal">
  <div class="modal-box" style="max-width:680px">
    <div class="modal-title" id="workModalTitle">Emergency Work</div>
    <input type="hidden" id="workEditId">
    
    <div class="modal-field">
      <label class="modal-label">Project / Works Description</label>
      <input type="text" class="modal-input" id="workProject" placeholder="e.g., Emergency roof repair">
    </div>
    <div class="modal-field">
      <label class="modal-label">Vendor / Contractor</label>
      <input type="text" class="modal-input" id="workVendor" placeholder="Company name">
    </div>
    <div class="modal-field">
      <label class="modal-label">Amount (AUD) (ex GST)</label>
      <input type="text" class="modal-input" id="workAmount" placeholder="0.00" oninput="formatAmount(this)">
    </div>
    <div class="modal-field">
      <label class="modal-label">Category</label>
      <select class="modal-select" id="workCategory">
        <option value="General">General</option>
        <option value="HVAC">HVAC</option>
        <option value="Fire">Fire</option>
        <option value="Electrical">Electrical</option>
        <option value="Security">Security</option>
        <option value="Plumbing">Plumbing</option>
        <option value="Lift">Lift</option>
        <option value="Legal">Legal</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">Priority</label>
      <select class="modal-select" id="workPriority">
        <option value="Normal">Normal</option>
        <option value="High">High</option>
        <option value="Urgent">Urgent</option>
      </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">Scope / Notes (Public)</label>
      <textarea class="modal-textarea" id="workNotes" placeholder="Brief description visible to everyone…"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">🔒 Internal Notes (Admin / Committee / Observer)</label>
      <textarea class="modal-textarea" id="workInternalNote" placeholder="Private notes..." style="background:var(--purple-bg);border-color:#c4b5fd"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">📎 Attach Files</label>
      <input type="file" id="modalFileInput" multiple accept="image/*,application/pdf" style="display:none" onchange="uploadFilesFromModal(this.files)">
      <button class="btn-primary" onclick="document.getElementById('modalFileInput').click()">+ Choose Files</button>
      <div id="modalUploadPreview" class="photo-preview-grid" style="margin-top:12px"></div>
    </div>

    <div class="modal-footer">
      <button class="btn-danger" id="deleteWorkBtn" style="display:none;margin-right:auto">Delete</button>
      <button class="btn-secondary" onclick="closeModal('workModal')">Cancel</button>
      <button class="btn-primary" onclick="saveWork()">Save Emergency Work →</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role, name } = ctx;

const privileged = ['admin','committee','observer'];
const canViewQuoteFiles = ['admin','committee'].includes(role);

if (role === 'admin') {
  document.getElementById('addWorkBtn').style.display = 'inline-flex';
}

window.closeModal = id => document.getElementById(id).classList.remove('open');

window.showToast = (msg, isError=false) => {
  const t = document.getElementById('toast');
  t.textContent = msg; 
  t.style.background = isError ? '#991b1b' : '#0f172a';
  t.style.display = 'block'; 
  setTimeout(()=>t.style.display='none', 3000);
};

const STATUS_MAP = {
  in_progress: {label:'In Progress', cls:'badge-blue'},
  scheduled: {label:'Scheduled', cls:'badge-gray'},
  completed: {label:'Completed', cls:'badge-green'}
};

let allWorks = [];
let currentFilter = 'all';
let openAccordionId = null;
let selectedWork = null;
let currentUploadFiles = [];

async function loadWorks() {
  const { data } = await supabase
    .from('quotes')
    .select('*')
    .is('completion_date', null)
    .not('status', 'is', null)
    .order('created_at', {ascending: true});
  allWorks = data || [];

  document.getElementById('statTotal').textContent = allWorks.length;
  document.getElementById('statUrgent').textContent = allWorks.filter(w => (w.priority || '').toLowerCase() === 'urgent').length;
  document.getElementById('statInprog').textContent = allWorks.filter(w => w.status === 'in_progress').length;
  document.getElementById('statDone').textContent = allWorks.filter(w => w.status === 'completed').length;

  renderWorks();
}

function renderWorks() {
  const list = document.getElementById('worksList');
  let filtered = currentFilter === 'all' ? allWorks : allWorks.filter(w => w.status === currentFilter);
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🔧</div><div class="empty-title">No works found</div></div>`;
    return;
  }

  let html = filtered.map(w => workRow(w)).join('');
  list.innerHTML = html;
}

function workRow(w) {
  const st = STATUS_MAP[w.status] || {label: w.status, cls: 'badge-gray'};
  const dateStr = new Date(w.created_at).toLocaleDateString('en-AU', {
    day:'2-digit', month:'short', year:'numeric'
  });

  return `
    <div class="work-row" id="row-${w.id}">
      <div onclick="toggleAccordion('${w.id}')" style="display:contents;cursor:pointer">

        <!-- Date -->
        <div class="work-meta-text">
          ${dateStr}
        </div>

        <!-- Category -->
        <div class="work-meta-text">
          ${w.category || 'General'}
        </div>

        <!-- Priority -->
        <div>
          <span class="badge ${
            (w.priority || '').toLowerCase() === 'urgent' ? 'badge-red' :
            (w.priority || '').toLowerCase() === 'high' ? 'badge-yellow' :
            'badge-gray'
          }">
            ${w.priority || 'Normal'}
          </span>
        </div>

        <!-- Project -->
        <div>
          <div class="work-title-text">${w.project || 'Untitled'}</div>
          <div class="work-meta-text">
            <span class="badge ${st.cls}" style="font-size:10px">${st.label}</span>
          </div>
        </div>

        <!-- Contractor -->
        <div class="work-meta-text">
          ${w.vendor || '—'}
        </div>

      </div>
    </div>
    ${buildAccordion(w)}`;
}

function buildAccordion(w) {
  const st = STATUS_MAP[w.status] || {label:w.status, cls:'badge-gray'};
  const updated = new Date(w.updated_at||w.created_at).toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
  const vendorName = w.vendor || '—';

  let descHtml = w.description || w.notes ? `
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light)">
      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">Description</div>
      <p style="font-size:13px;color:var(--text-2);line-height:1.7">${w.description || w.notes}</p>
    </div>` : '';

  let privateHtml = '';
  if (privileged.includes(role) && w.private_notes) {
    privateHtml = `
    <div style="margin-top:12px">
      <div style="background:#fef9f0;border:1px solid #fed7aa;border-radius:10px;padding:14px">
        <div style="font-size:11px;font-weight:600;color:#92400e;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">⚠️ Private Notes</div>
        <p style="font-size:13px;color:var(--text-2);line-height:1.7">${w.private_notes}</p>
      </div>
    </div>`;
  }

  let quoteFilesHtml = '';
  if (canViewQuoteFiles && w.quote_files) {
    let qFiles = [];
    try { qFiles = typeof w.quote_files === 'string' ? JSON.parse(w.quote_files) : (w.quote_files || []); } catch(e) {}
    if (qFiles.length > 0) {
      const fileItems = qFiles.map(f => {
        const icon = f.name && f.name.endsWith('.pdf') ? '📄' : '🖼️';
        return `<div class="quote-file-item">
          <span>${icon}</span>
          <a href="#" onclick="openQuoteFile('${f.path}','${(f.name||'').replace(/'/g,"\\'")}','${f.type||''}');return false">${f.name || 'Unnamed file'}</a>
          <span style="font-size:10px;font-weight:600;background:#fed7aa;color:#92400e;padding:2px 6px;border-radius:4px;flex-shrink:0">Restricted</span>
        </div>`;
      }).join('');
      quoteFilesHtml = `
      <div class="quote-files-section">
        <div class="quote-files-label">🔒 Quote Files <span style="font-size:10px;font-weight:500;opacity:0.7">(Admin & Committee only)</span></div>
        ${fileItems}
      </div>`;
    }
  }

  const workFilesHtml = `
  <div class="work-files-section">
    <div class="work-files-label">📁 Work Files <span style="font-size:10px;font-weight:500;opacity:0.7">(Visible to all)</span></div>
    <div class="photo-gallery" id="gallery-${w.id}">
      <div style="font-size:13px;color:var(--muted);padding:4px 0">Loading…</div>
    </div>
    ${role === 'admin' ? `<div style="margin-top:10px"><label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:7px 12px;background:var(--blue-50);border:1px solid var(--blue-100);border-radius:8px;font-size:12px;font-weight:600;color:var(--blue-700)"><span>📎</span><span>Upload Files</span><input type="file" accept="image/*,application/pdf" multiple style="display:none" onchange="uploadWorkFiles('${w.id}',this.files)"></label></div>` : ''}
  </div>`;

  return `
    <div class="work-accordion" id="accordion-${w.id}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:12px">
        <div>
          <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">${w.project || 'Untitled'}</div>
          <span class="badge ${st.cls}">${st.label}</span>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          ${role === 'admin' ? `<button class="btn-secondary" onclick="event.stopPropagation();openEditWorkById('${w.id}')" style="padding:5px 10px;font-size:11px">✏️ Edit</button>` : ''}
          ${role === 'admin' ? `<button class="btn-primary" onclick="event.stopPropagation();openCompleteModal('${w.id}')" style="padding:5px 10px;font-size:11px">✅ Complete</button>` : ''}
          <button class="btn-secondary" onclick="event.stopPropagation();closeAccordion('${w.id}')" style="padding:5px 10px;font-size:11px">✕</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:4px">
        <div>
          <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:4px">Vendor</div>
          <div style="font-size:13px;color:var(--text)">${vendorName}</div>
        </div>
        <div>
          <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:4px">Last Updated</div>
          <div style="font-size:13px;color:var(--text)">${updated}</div>
        </div>
      </div>
      ${descHtml}
      ${privateHtml}
      ${quoteFilesHtml}
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light)">
        ${workFilesHtml}
      </div>
    </div>`;
}

window.openQuoteFile = async (path, name, type) => {
  if (!canViewQuoteFiles) { showToast('You do not have permission to view this file', true); return; }
  try {
    const { data, error } = await supabase.storage.from('quotes').createSignedUrl(path, 3600);
    if (error) throw error;
    window.open(data.signedUrl, '_blank');
  } catch(e) {
    showToast('Cannot open file: ' + e.message, true);
  }
};

window.uploadWorkFiles = async (workId, files) => {
  if (!files || files.length === 0) return;
  showToast('Uploading…');
  try {
    for (let file of Array.from(files)) {
      const fileExt = file.name.split('.').pop().toLowerCase();
      const fileName = `${Date.now()}-${Math.random().toString(36).slice(2)}.${fileExt}`;
      await supabase.storage.from('quotes').upload(`quotes/${workId}/work/${fileName}`, file, { upsert: true });
    }
    showToast('Files uploaded ✓');
    if (openAccordionId === workId) await loadPhotos(workId);
  } catch(e) {
    showToast('Upload failed: ' + e.message, true);
  }
};

window.toggleAccordion = async (id) => {
  if (openAccordionId && openAccordionId !== id) closeAccordion(openAccordionId);
  const acc = document.getElementById(`accordion-${id}`);
  if (!acc) return;
  if (acc.classList.contains('open')) {
    closeAccordion(id);
    return;
  }
  acc.classList.add('open');
  openAccordionId = id;
  await loadPhotos(id);
};

window.closeAccordion = (id) => {
  const acc = document.getElementById(`accordion-${id}`);
  if (acc) acc.classList.remove('open');
  if (openAccordionId === id) openAccordionId = null;
};

window.openEditWorkById = (id) => {
  selectedWork = allWorks.find(w => w.id === id);
  openEditWork();
};

window.openAddWork = () => {
  document.getElementById('workModalTitle').textContent = 'Emergency Work';
  document.getElementById('workEditId').value = '';
  document.getElementById('workProject').value = '';
  document.getElementById('workVendor').value = '';
  document.getElementById('workAmount').value = '';
  document.getElementById('workCategory').value = 'General';
  document.getElementById('workPriority').value = 'Urgent';
  document.getElementById('workNotes').value = '';
  document.getElementById('workInternalNote').value = '';
  document.getElementById('modalUploadPreview').innerHTML = '';
  currentUploadFiles = [];
  document.getElementById('workModal').classList.add('open');
};

window.openEditWork = () => {
  if (!selectedWork) return;
  const w = selectedWork;
  document.getElementById('workModalTitle').textContent = 'Edit Emergency Work';
  document.getElementById('workEditId').value = w.id;
  document.getElementById('workProject').value = w.project || '';
  document.getElementById('workVendor').value = w.vendor || '';
  document.getElementById('workAmount').value = w.amount ? Number(w.amount).toLocaleString('en-AU') : '';
  document.getElementById('workCategory').value = w.category || 'General';
  document.getElementById('workPriority').value = w.priority || 'Urgent';
  document.getElementById('workNotes').value = w.notes || w.description || '';
  document.getElementById('workInternalNote').value = w.private_notes || '';
  document.getElementById('deleteWorkBtn').style.display = 'inline-flex';
  document.getElementById('modalUploadPreview').innerHTML = '';
  currentUploadFiles = [];
  document.getElementById('workModal').classList.add('open');
};

window.formatAmount = function(input) {
  let val = input.value.replace(/[^0-9.]/g, '');
  if (val) input.value = parseFloat(val).toLocaleString('en-AU');
};

window.saveWork = async () => {
  const id = document.getElementById('workEditId').value;
  const project = document.getElementById('workProject').value.trim();
  const vendor = document.getElementById('workVendor').value.trim();
  let amountStr = document.getElementById('workAmount').value.replace(/[^0-9.]/g, '');
  const amount = parseFloat(amountStr) || 0;
  const category = document.getElementById('workCategory').value;
  const priority = document.getElementById('workPriority').value;
  const notes = document.getElementById('workNotes').value.trim();
  const internalNote = document.getElementById('workInternalNote').value.trim();

  if (!project || !vendor) {
    showToast('Project and Vendor are required', true);
    return;
  }

  try {
    const quoteId = id || crypto.randomUUID();

    const fileData = [];
    for (let file of currentUploadFiles) {
      const fileExt = file.name.split('.').pop().toLowerCase();
      const fileName = `${Date.now()}-${Math.random().toString(36).slice(2)}.${fileExt}`;
      await supabase.storage.from('quotes').upload(`quotes/${quoteId}/work/${fileName}`, file, { upsert: true });
      fileData.push({
        path: `quotes/${quoteId}/work/${fileName}`,
        name: file.name,
        type: file.type,
        size: file.size
      });
    }

    const commentPayload = {
      note: internalNote,
      files: fileData,
      category: category,
      priority: priority
    };

    const data = {
      id: quoteId,
      project: project,
      vendor: vendor,
      amount: amount,
      category: category,
      notes: notes,
      source: 'emergency',
      status: 'scheduled',
      priority: priority,
      completion_date: null,
      comment: commentPayload,
      updated_at: new Date().toISOString()
    };

    if (id) {
      await supabase.from('quotes').update(data).eq('id', id);
    } else {
      await supabase.from('quotes').insert(data);
    }

    closeModal('workModal');
    if (openAccordionId) closeAccordion(openAccordionId);
    await loadWorks();
    showToast('Emergency Work saved ✓');
  } catch(e) { 
    showToast('Failed to save: ' + (e.message || e), true); 
  }
};

window.deleteWork = async () => {
  if (!confirm('Delete this work?')) return;
  const id = document.getElementById('workEditId').value;
  try {
    const { data: files } = await supabase.storage.from('quotes').list(`quotes/${id}/work`);
    if (files && files.length > 0) {
      await supabase.storage.from('quotes').remove(files.map(f => `quotes/${id}/work/${f.name}`));
    }
  } catch(e) {}
  await supabase.from('quotes').delete().eq('id', id);
  closeModal('workModal');
  if (openAccordionId) closeAccordion(openAccordionId);
  await loadWorks();
  showToast('Work deleted');
};

window.uploadFilesFromModal = (files) => {
  currentUploadFiles = Array.from(files);
  const preview = document.getElementById('modalUploadPreview');
  preview.innerHTML = currentUploadFiles.map((file, i) => `
    <div class="photo-preview-item">
      ${file.type.startsWith('image/') 
        ? `<img src="${URL.createObjectURL(file)}">` 
        : `<div style="height:100%;display:flex;align-items:center;justify-content:center;background:#f1f5f9;color:var(--muted);font-size:11px">📄 ${file.name}</div>`}
      <button class="remove-photo" onclick="removeModalFile(${i});event.stopPropagation()">✕</button>
    </div>
  `).join('');
};

window.removeModalFile = (index) => {
  currentUploadFiles.splice(index, 1);
  uploadFilesFromModal(currentUploadFiles);
};

async function loadPhotos(workId) {
  const gallery = document.getElementById(`gallery-${workId}`);
  if (!gallery) return;
  try {
    const { data } = await supabase.storage.from('quotes').list(`quotes/${workId}/work`);
    if (!data || data.length === 0) {
      gallery.innerHTML = '<div style="font-size:13px;color:var(--muted)">No photos or documents yet.</div>';
      return;
    }
    gallery.innerHTML = data.map(file => {
      const { data: urlData } = supabase.storage.from('quotes').getPublicUrl(`quotes/${workId}/work/${file.name}`);
      const isImage = /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name);
      return `
        <div class="photo-gallery-item">
          ${isImage 
            ? `<img src="${urlData.publicUrl}" onclick="openLightbox('${urlData.publicUrl}')">` 
            : `<div style="height:100%;display:flex;align-items:center;justify-content:center;background:#f1f5f9;color:var(--muted);font-size:11px;cursor:pointer" onclick="window.open('${urlData.publicUrl}','_blank')">📄 ${file.name}</div>`}
          ${role === 'admin' ? `<button class="delete-photo-btn" onclick="deletePhoto('${workId}','${file.name}',event)">✕</button>` : ''}
        </div>`;
    }).join('');
  } catch(e) {
    gallery.innerHTML = '<div style="font-size:13px;color:var(--muted)">Failed to load files.</div>';
  }
}

window.deletePhoto = async (workId, fileName, e) => {
  e.stopImmediatePropagation();
  if (!confirm('Delete this file?')) return;
  try {
    await supabase.storage.from('quotes').remove([`quotes/${workId}/work/${fileName}`]);
    showToast('File deleted');
    if (openAccordionId === workId) await loadPhotos(workId);
  } catch(e) {
    showToast('Delete failed', true);
  }
};

window.openLightbox = (url) => {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('photoLightbox').classList.add('open');
};

window.closeLightbox = () => {
  document.getElementById('photoLightbox').classList.remove('open');
};

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderWorks();
  });
});

window.openCompleteModal = (id) => {
  selectedWork = allWorks.find(w => w.id === id);
  document.getElementById('completeWorkId').value = id;
  document.getElementById('completeDate').value = '';
  document.getElementById('completeNotes').value = '';
  document.getElementById('completeModal').classList.add('open');
};

window.confirmComplete = async () => {
  const id = document.getElementById('completeWorkId').value;
  const date = document.getElementById('completeDate').value;
  const notes = document.getElementById('completeNotes').value.trim();
  if (!date) { showToast('Please select completion date', true); return; }
  try {
    const existing = allWorks.find(w=>w.id===id)?.private_notes || '';

    await supabase.from('quotes').update({
      status: 'completed',
      completion_date: date,
      private_notes: notes
        ? existing + "\n\n[Completion] " + notes
        : existing,
      updated_at: new Date().toISOString()
    }).eq('id', id);
    closeModal('completeModal');
    if (openAccordionId) closeAccordion(openAccordionId);
    await loadWorks();
    showToast('Work marked as completed');
  } catch(e) { showToast('Failed to complete work', true); }
};

document.getElementById('addWorkBtn').addEventListener('click', openAddWork);
document.getElementById('deleteWorkBtn').addEventListener('click', deleteWork);

await loadWorks();
</script>
</body>
</html>
