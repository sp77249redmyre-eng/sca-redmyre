<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.stat-num{font-size:26px;font-weight:700;margin-top:6px}
.stat-label{font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:0.05em}
.content{padding:24px}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:3px;height:14px;background:var(--blue-600);border-radius:10px}
</style>
</head>
<body>
<div id="sidebar"></div>
<div id="topbar"></div>

<div class="content">
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Expenses (YTD)</div>
      <div class="stat-num" id="statTotal">$0.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Monthly Average</div>
      <div class="stat-num" id="statAvg">$0.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Budget Utilization</div>
      <div class="stat-num" id="statUtil">0%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Projected Annual</div>
      <div class="stat-num" id="statProjected">$0.00</div>
    </div>
  </div>

  <div class="section-hdr">
    <div class="section-title">Detailed Expenses</div>
  </div>

  <div class="table-container">
    <table id="expensesTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Category</th>
          <th style="text-align:right">Amount</th>
          <th style="text-align:center">Actions</th>
        </tr>
      </thead>
      <tbody id="expenseList"></tbody>
    </table>
  </div>
</div>

<div class="modal" id="expenseModal">
  <div class="modal-content" style="max-width:440px">
    <div class="modal-header">
      <h3 id="modalTitle">Edit Expense</h3>
      <button class="modal-close" onclick="closeModal('expenseModal')">&times;</button>
    </div>
    <input type="hidden" id="expenseEditId">
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">
      <div><label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Date</label><input type="date" id="expenseDate" class="input-fld"></div>
      <div><label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Description</label><input type="text" id="expenseDesc" class="input-fld" placeholder="e.g. Garden Maintenance"></div>
      <div><label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Category</label>
        <select id="expenseCategory" class="input-fld">
          <option value="Maintenance">Maintenance</option>
          <option value="Repairs">Repairs</option>
          <option value="Cleaning">Cleaning</option>
          <option value="Utilities">Utilities</option>
          <option value="Admin">Admin</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div><label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Amount ($)</label><input type="number" id="expenseAmount" class="input-fld" step="0.01"></div>
      <div><label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Notes</label><textarea id="expenseNotes" class="input-fld" rows="2"></textarea></div>
    </div>
    <div style="margin-top:20px;display:flex;gap:8px">
      <button class="btn-primary" id="saveExpenseBtn" style="flex:1">Save Changes</button>
      <button class="btn-danger-outline" id="deleteExpenseBtn">Delete</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import { supabase } from '/js/auth.js';
import { initLayout } from '/js/layout.js';

let userRole = 'resident';
let expensesData = [];

async function init() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { window.location.href = '/'; return; }
  
  const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
  userRole = profile?.role || 'resident';
  
  initLayout('Reports');
  await loadReport();
}

async function loadReport() {
  const { data, error } = await supabase.from('expenses').select('*').order('expense_date', { ascending: false });
  if (error) return;
  expensesData = data;
  renderExpenses(data);
  updateStats(data);
}

function renderExpenses(data) {
  const list = document.getElementById('expenseList');
  if (!data?.length) {
    list.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--muted)">No records found</td></tr>';
    return;
  }
  list.innerHTML = data.map(e => `
    <tr>
      <td>${new Date(e.expense_date).toLocaleDateString('en-AU')}</td>
      <td style="font-weight:500">${e.description}</td>
      <td><span class="badge badge-gray">${e.category}</span></td>
      <td style="text-align:right;font-weight:600">$${e.amount.toLocaleString(undefined,{minimumFractionDigits:2})}</td>
      <td style="text-align:center">
        <button class="btn-icon" onclick="openEditExpense('${e.id}')">✏️</button>
      </td>
    </tr>
  `).join('');
}

function updateStats(data) {
  const total = data.reduce((sum, e) => sum + (e.amount || 0), 0);
  document.getElementById('statTotal').textContent = '$' + total.toLocaleString(undefined, {minimumFractionDigits:2});
  
  const avg = data.length ? total / 12 : 0; 
  document.getElementById('statAvg').textContent = '$' + avg.toLocaleString(undefined, {minimumFractionDigits:2});
  
  const projected = avg * 12;
  document.getElementById('statProjected').textContent = '$' + projected.toLocaleString(undefined, {minimumFractionDigits:2});
}

window.openEditExpense = (id) => {
  const e = expensesData.find(ex => ex.id === id);
  if (!e) return;
  document.getElementById('expenseEditId').value = e.id;
  document.getElementById('expenseDate').value = e.expense_date;
  document.getElementById('expenseDesc').value = e.description;
  document.getElementById('expenseCategory').value = e.category;
  document.getElementById('expenseAmount').value = e.amount;
  document.getElementById('expenseNotes').value = e.notes || '';
  document.getElementById('expenseModal').classList.add('open');
};

window.closeModal = (id) => document.getElementById(id).classList.remove('open');

document.getElementById('saveExpenseBtn').addEventListener('click', async () => {
  const id = document.getElementById('expenseEditId').value;
  const data = {
    expense_date: document.getElementById('expenseDate').value,
    description: document.getElementById('expenseDesc').value.trim(),
    category: document.getElementById('expenseCategory').value,
    amount: parseFloat(document.getElementById('expenseAmount').value) || 0,
    notes: document.getElementById('expenseNotes').value.trim()
  };
  await supabase.from('expenses').update(data).eq('id', id);
  closeModal('expenseModal');
  await loadReport();
});

document.getElementById('deleteExpenseBtn').addEventListener('click', async () => {
  if (!confirm('Delete this record?')) return;
  const id = document.getElementById('expenseEditId').value;
  await supabase.from('expenses').delete().eq('id', id);
  closeModal('expenseModal');
  await loadReport();
});

init();
</script>
</body>
</html>
