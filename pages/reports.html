<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.stat-num{font-size:26px;font-weight:700;margin-top:6px}
.stat-label{font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:0.05em}
.content{padding:24px}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:3px;height:14px;background:var(--blue-600);border-radius:10px}
</style>
</head>
<body>
<div id="sidebar"></div>
<div id="topbar"></div>

<div class="content">
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Expenses (YTD)</div>
      <div class="stat-num" id="statTotal">$0.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Monthly Average</div>
      <div class="stat-num" id="statAvg">$0.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Budget Utilization</div>
      <div class="stat-num" id="statUtil">0%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Projected Annual</div>
      <div class="stat-num" id="statProjected">$0.00</div>
    </div>
  </div>

  <div class="section-hdr">
    <div class="section-title">Detailed Expenses</div>
    </div>

  <div class="table-container">
    <table id="expensesTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Category</th>
          <th style="text-align:right">Amount</th>
          </tr>
      </thead>
      <tbody id="expenseList"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import { supabase } from '/js/auth.js';
import { initLayout } from '/js/layout.js';

let user;
let expensesData = [];

async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '/'; return; }
  user = session.user;
  
  initLayout('Reports'); // 사이드바/탑바 로드
  await loadReport();
}

async function loadReport() {
  const { data, error } = await supabase.from('expenses').select('*').order('expense_date', { ascending: false });
  if (error) return;
  expensesData = data;
  renderExpenses(data);
  updateStats(data);
}

// [삭제 완료] loadWorks, renderWorksStatus 등 Ongoing 관련 로직 제거

function renderExpenses(data) {
  const list = document.getElementById('expenseList');
  if (!data?.length) {
    list.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--muted)">No records found</td></tr>';
    return;
  }
  
  // 수정 버튼 없이 깔끔하게 지출 내역만 출력
  list.innerHTML = data.map(e => `
    <tr>
      <td>${new Date(e.expense_date).toLocaleDateString('en-AU')}</td>
      <td style="font-weight:500">${e.description}</td>
      <td><span class="badge badge-gray">${e.category}</span></td>
      <td style="text-align:right;font-weight:600">$${e.amount.toLocaleString(undefined,{minimumFractionDigits:2})}</td>
    </tr>
  `).join('');
}

function updateStats(data) {
  const total = data.reduce((sum, e) => sum + (e.amount || 0), 0);
  document.getElementById('statTotal').textContent = '$' + total.toLocaleString(undefined, {minimumFractionDigits:2});
  
  const avg = data.length ? total / 12 : 0; 
  document.getElementById('statAvg').textContent = '$' + avg.toLocaleString(undefined, {minimumFractionDigits:2});
  
  const projected = avg * 12;
  document.getElementById('statProjected').textContent = '$' + projected.toLocaleString(undefined, {minimumFractionDigits:2});
}

// [삭제 완료] openAddExpense, openEditExpense, submitExpense 등 모든 팝업/수정 기능 제거

init();
</script>
</body>
</html>
