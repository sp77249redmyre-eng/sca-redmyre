<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.stat-num{font-size:26px;font-weight:600;letter-spacing:-1px}
.stat-label{font-size:12px;color:var(--muted);margin-top:3px}
.stat-sub{font-size:11px;color:var(--muted);margin-top:6px}
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text-2)}
.filter-input{padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);outline:none;width:180px}
.filter-input:focus{border-color:var(--blue-600)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer}
.cat-name{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.cat-amount{font-size:18px;font-weight:600}
.cat-count{font-size:11px;color:var(--muted);margin-top:3px}
.cat-bar{height:4px;background:var(--border);border-radius:100px;margin-top:10px;overflow:hidden}
.cat-fill{height:100%;background:var(--blue-600);border-radius:100px}
.table-head{display:grid;gap:10px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--border-light)}
.th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;cursor:pointer;user-select:none}
.sort-arrow{font-size:10px;opacity:0.5;margin-left:2px}
.sort-arrow.asc,.sort-arrow.desc{opacity:1;color:var(--blue-600)}
.table-row{display:grid;gap:10px;padding:13px 20px;border-bottom:1px solid var(--border-light);align-items:center;transition:background 0.12s}
.table-row:last-child{border-bottom:none}
.table-row:hover{background:var(--bg)}
.report-accordion{display:none;background:var(--bg);border-top:1px solid var(--border-light);padding:18px 20px}
.report-accordion.open{display:block}
.detail-section{margin-bottom:16px}
.detail-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px}
.detail-value{font-size:13px;color:var(--text)}
.file-preview{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:12px;margin-top:6px;cursor:pointer}
.file-icon{font-size:16px}
.file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-size{font-size:11px;color:var(--muted)}
.inline-viewer{margin:12px 0;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px}

/* 모바일 최적화 */
@media(max-width:768px){
  .stats-row{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:12px}
  .stat-num{font-size:20px}
  .cat-grid{grid-template-columns:1fr;gap:8px}
  .cat-card{padding:12px}
  .cat-amount{font-size:16px}
  
  .filter-bar{gap:6px}
  .filter-select, .filter-input{
    width:100%;
    padding:10px;
    font-size:14px;
  }
  .btn-secondary{width:100%;justify-content:center;padding:10px}
  
  .table-head{display:none}
  
  .table-row{
    display:block;
    padding:14px;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:10px;
    background:var(--surface);
  }
  .table-row > div{
    margin-bottom:8px;
    display:block;
  }
  .table-row > div:last-child{margin-bottom:0}
  
  .table-row > div::before{
    content:attr(data-mobile-label);
    display:block;
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:4px;
  }
  .table-row > div:first-child::before{content:"Date"}
  .table-row > div:nth-child(2)::before{content:"Project"}
  .table-row > div:nth-child(3)::before{content:"Vendor"}
  .table-row > div:nth-child(4)::before{content:"Category"}
  .table-row > div:nth-child(5)::before{content:"Amount"}
  
  .report-accordion{padding:14px}
  .detail-section > div{
    grid-template-columns:1fr;
  }
  .file-preview button{
    font-size:12px;
    padding:6px 10px;
  }
}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    <div class="filter-bar">
      <select class="filter-select" id="filterPeriod">
        <option value="thismonth">This Month</option>
        <option value="lastmonth">Last Month</option>
        <option value="thisquarter">This Quarter</option>
        <option value="thisyear" selected>This Year</option>
        <option value="alltime">All Time</option>
        <option value="custom">Custom Range</option>
      </select>
      <input type="date" class="filter-input" id="dateFrom" style="display:none;width:140px">
      <input type="date" class="filter-input" id="dateTo" style="display:none;width:140px">
      <select class="filter-select" id="filterCategory">
        <option value="all">All Categories</option>
        <option value="HVAC">HVAC</option><option value="Fire">Fire</option><option value="Electrical">Electrical</option>
        <option value="Security">Security</option><option value="Plumbing">Plumbing</option><option value="Lift">Lift</option>
        <option value="General">General</option><option value="Legal">Legal</option><option value="Other">Other</option>
      </select>
      <select class="filter-select" id="filterType">
        <option value="all">All Works</option>
        <option value="regular">Regular Quotes</option>
        <option value="emergency">Emergency Works</option>
      </select>
      <button class="btn-secondary" id="refreshBtn">↻ Refresh</button>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Total Spend</div><div class="stat-num" id="statTotal" style="color:var(--blue-600)">$0</div><div class="stat-sub" id="statPeriodLabel">—</div></div>
      <div class="stat-card"><div class="stat-label">Regular Quotes</div><div class="stat-num" id="statRegularTotal" style="color:var(--green)">$0</div><div class="stat-sub" id="statRegularCount">0 quotes</div></div>
      <div class="stat-card"><div class="stat-label">Emergency Works</div><div class="stat-num" id="statEmergencyTotal" style="color:#ef4444">$0</div><div class="stat-sub" id="statEmergencyCount">0 works</div></div>
      <div class="stat-card"><div class="stat-label">Largest Expense</div><div class="stat-num" id="statLargest" style="color:var(--text)">$0</div><div class="stat-sub" id="statLargestLabel">—</div></div>
    </div>

    <div class="section-title" style="margin-bottom:16px">Spend by Category</div>
    <div class="cat-grid" id="catGrid"><div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;grid-column:span 4">Loading…</div></div>

    <div class="section-title" style="margin-bottom:16px">Approved Quotes</div>
    <div class="card" style="margin-bottom:20px">
      <div class="table-head" style="grid-template-columns:120px 1fr 100px 110px 100px">
        <div class="th" onclick="sortQuotes('date')" id="th-date">Date <span class="sort-arrow" id="arr-date">↕</span></div>
        <div class="th" onclick="sortQuotes('project')" id="th-project">Project <span class="sort-arrow" id="arr-project">↕</span></div>
        <div class="th" onclick="sortQuotes('vendor')" id="th-vendor">Vendor <span class="sort-arrow" id="arr-vendor">↕</span></div>
        <div class="th" onclick="sortQuotes('category')" id="th-category">Category <span class="sort-arrow" id="arr-category">↕</span></div>
        <div class="th" onclick="sortQuotes('amount')" id="th-amount" style="text-align:right">Amount <span class="sort-arrow" id="arr-amount">↕</span></div>
      </div>
      <div id="quotesList"><div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">Loading…</div></div>
      <div style="padding:12px 20px;background:var(--bg);border-top:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;color:var(--muted)" id="quotesTotal">—</span>
        <span style="font-size:14px;font-weight:600" id="quotesTotalAmount">$0.00</span>
      </div>
    </div>
  </div>
</div>

<div id="fileViewerModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:9999;align-items:center;justify-content:center" onclick="if(event.target===this)closeViewer()">
  <div style="background:#fff;border-radius:14px;padding:20px;max-width:900px;width:92%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,0.3)">
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
      <button onclick="closeViewer()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#6b7280;line-height:1">&times;</button>
    </div>
    <div id="viewerContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role } = ctx;

if (!['admin','committee','observer'].includes(role)) window.location.href='/pages/building.html';

const CAT_LABELS = { 'HVAC':'HVAC','Fire':'Fire','Electrical':'Electrical','Security':'Security','Plumbing':'Plumbing','Lift':'Lift','General':'General','Legal':'Legal','Other':'Other' };
const CAT_COLORS = { 'HVAC':'#2563eb','Fire':'#ef4444','Electrical':'#f59e0b','Security':'#8b5cf6','Plumbing':'#06b6d4','Lift':'#10b981','General':'#6b7280','Legal':'#f97316','Other':'#94a3b8' };
const CAT_BG    = { 'HVAC':'#eff6ff','Fire':'#fef2f2','Electrical':'#fffbeb','Security':'#ede9fe','Plumbing':'#ecfeff','Lift':'#ecfdf5','General':'#f3f4f6','Legal':'#fff7ed','Other':'#f1f5f9' };

const fmt = n => '$'+Number(n||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});

function parseQuoteCategory(q) {
  try { if (q.comment) { const c=typeof q.comment==='string'?JSON.parse(q.comment):q.comment; if (c?.category) return c.category; } } catch {}
  return q.category||'Other';
}

function catBadge(cat) {
  const label=CAT_LABELS[cat]||cat||'Other';
  const color=CAT_COLORS[cat]||'#94a3b8';
  const bg=CAT_BG[cat]||'#f1f5f9';
  return `<span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;background:${bg};color:${color};border:1px solid ${color}22">${label}</span>`;
}

let dateFrom=null, dateTo=null;
let currentQuotesData=[];
let currentSortKey='date';
let currentSortDir='desc';

function parseComment(comment) {
  try {
    if (!comment) return { note:'', files:[], category:'General', priority:'Normal' };
    const obj = typeof comment === 'string' ? JSON.parse(comment) : comment;
    let files = Array.isArray(obj?.files) ? obj.files : [];
    return {
      note: obj?.note || '',
      files: files.filter(f => f && f.path),
      category: obj?.category || 'General',
      priority: obj?.priority || 'Normal'
    };
  } catch(e) { 
    return { note:'', files:[], category:'General', priority:'Normal' }; 
  }
}

window.openFileViewer = async function(path, name, type) {
  try {
    let url;
    if (path.startsWith('http')) {
      url = path;
    } else {
      const cleanPath = path.replace(/^quotes\//, '');
      const { data, error } = await supabase.storage.from('quotes').createSignedUrl(cleanPath, 3600);
      if (error || !data?.signedUrl) throw new Error('Signed URL failed');
      url = data.signedUrl;
    }
    let html = '';
    if ((type && type.includes('pdf')) || (name && name.toLowerCase().endsWith('.pdf'))) {
      html = `<iframe src="${url}" style="width:100%;height:500px;border:none;border-radius:6px"></iframe>`;
    } else {
      html = `<img src="${url}" style="max-width:100%;max-height:70vh;border-radius:6px;display:block;margin:auto" alt="${name}">`;
    }
    document.getElementById('viewerContent').innerHTML = `<div style="font-size:13px;font-weight:600;color:#1f2937;margin-bottom:10px">📎 ${name}</div>` + html;
    document.getElementById('fileViewerModal').style.display = 'flex';
  } catch(e) {
    console.error('openFileViewer failed:', e);
    alert('Failed to load file');
  }
};

window.closeViewer = function() {
  document.getElementById('fileViewerModal').style.display = 'none';
  document.getElementById('viewerContent').innerHTML = '';
};

window.deleteFile = async function(quoteId, filePath, fileName) {
  if (!confirm(`⚠️ 파일을 영구 삭제하시겠습니까?\n\n${fileName}\n\n삭제 후 복구 불가능합니다.`)) return;
  try {
    const { data: quote, error: fetchError } = await supabase.from('quotes').select('comment').eq('id', quoteId).single();
    if (fetchError) throw fetchError;
    const parsed = parseComment(quote.comment);
    const updatedFiles = parsed.files.filter(f => f.path !== filePath);
    const updatedComment = { ...parsed, files: updatedFiles };
    const { error: updateError } = await supabase.from('quotes').update({ comment: updatedComment }).eq('id', quoteId);
    if (updateError) throw updateError;
    const { error: storageError } = await supabase.storage.from('quotes').remove([filePath]);
    if (storageError) console.warn('Storage deletion warning:', storageError);
    await loadReport();
    alert('✓ 파일이 삭제되었습니다.');
  } catch(e) {
    console.error('File deletion failed:', e);
    alert('삭제 실패: ' + e.message);
  }
};

window.showToast = (msg, isError=false) => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#991b1b' : '#0f172a';
  t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 3000);
};

window.toggleReportAccordion = function(quoteId) {
  const accordion = document.getElementById(`accordion-${quoteId}`);
  if (!accordion) return;
  accordion.classList.toggle('open');
};

document.getElementById('filterPeriod').addEventListener('change', updateDateRange);
document.getElementById('filterCategory').addEventListener('change', loadReport);
document.getElementById('filterType').addEventListener('change', loadReport);
document.getElementById('refreshBtn').addEventListener('click', loadReport);

function updateDateRange() {
  const period=document.getElementById('filterPeriod').value;
  const fromEl=document.getElementById('dateFrom');
  const toEl=document.getElementById('dateTo');
  if (period==='custom') { fromEl.style.display='block'; toEl.style.display='block'; return; }
  fromEl.style.display='none'; toEl.style.display='none';
  const now=new Date(); const y=now.getFullYear(); const m=now.getMonth();
  if (period==='thismonth')   { dateFrom=new Date(y,m,1); dateTo=new Date(y,m+1,0); }
  else if (period==='lastmonth')   { dateFrom=new Date(y,m-1,1); dateTo=new Date(y,m,0); }
  else if (period==='thisquarter') { const q=Math.floor(m/3); dateFrom=new Date(y,q*3,1); dateTo=new Date(y,q*3+3,0); }
  else if (period==='thisyear')    { dateFrom=new Date(y,0,1); dateTo=new Date(y,11,31); }
  else { dateFrom=null; dateTo=null; }
  loadReport();
}

async function loadReport() {
  const period=document.getElementById('filterPeriod').value;
  const catFilter=document.getElementById('filterCategory').value;
  const typeFilter=document.getElementById('filterType').value;
  if (period==='custom') {
    const fromVal=document.getElementById('dateFrom').value;
    const toVal=document.getElementById('dateTo').value;
    if (fromVal) dateFrom=new Date(fromVal);
    if (toVal)   dateTo=new Date(toVal);
  }
  const periodLabel = period==='alltime'?'All time':period==='thisyear'?`Jan–Dec ${new Date().getFullYear()}`:period==='thismonth'?new Date().toLocaleString('en-AU',{month:'long',year:'numeric'}):'—';
  document.getElementById('statPeriodLabel').textContent=periodLabel;

  let qQuery=supabase.from('quotes').select('*')
    .not('completion_date','is',null)
    .eq('work_status','completed')
    .not('status','eq','removed')
    .order('completion_date',{ascending:false});

  if (dateFrom) qQuery=qQuery.gte('completion_date',dateFrom.toISOString().split('T')[0]);
  if (dateTo)   qQuery=qQuery.lte('completion_date',new Date(dateTo.getTime()+86400000).toISOString().split('T')[0]);
  if (typeFilter==='regular')   qQuery=qQuery.eq('is_emergency',false);
  if (typeFilter==='emergency') qQuery=qQuery.eq('is_emergency',true);

  const { data:reportsRaw } = await qQuery;
  const reports=(reportsRaw||[]).map(q=>({...q,_cat:parseQuoteCategory(q)})).filter(q=>catFilter==='all'||q._cat===catFilter);
  const reportsData=reports||[];
  const regularData=reportsData.filter(q=>!q.is_emergency);
  const emergencyData=reportsData.filter(q=>q.is_emergency);
  const reportTotal=reportsData.reduce((s,q)=>s+Number(q.amount||0),0);
  const regularTotal=regularData.reduce((s,q)=>s+Number(q.amount||0),0);
  const emergencyTotal=emergencyData.reduce((s,q)=>s+Number(q.amount||0),0);
  const grandTotal=reportTotal;
  const allItems=reportsData.map(q=>({label:q.project||'—',amount:Number(q.amount||0)})).sort((a,b)=>b.amount-a.amount);

  document.getElementById('statTotal').textContent=fmt(grandTotal);
  document.getElementById('statRegularTotal').textContent=fmt(regularTotal);
  document.getElementById('statRegularCount').textContent=`${regularData.length} quote${regularData.length!==1?'s':''}`;
  document.getElementById('statEmergencyTotal').textContent=fmt(emergencyTotal);
  document.getElementById('statEmergencyCount').textContent=`${emergencyData.length} work${emergencyData.length!==1?'s':''}`;
  document.getElementById('statLargest').textContent=allItems.length?fmt(allItems[0].amount):'$0';
  document.getElementById('statLargestLabel').textContent=allItems.length?allItems[0].label.substring(0,30):'—';

  const catTotals={};
  reportsData.forEach(q=>{const c=q._cat||parseQuoteCategory(q);catTotals[c]=(catTotals[c]||0)+Number(q.amount||0);});
  const maxCat=Math.max(...Object.values(catTotals),1);
  const catGrid=document.getElementById('catGrid');
  const sortedCats=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  if (!sortedCats.length) { catGrid.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;grid-column:span 4">No data for this period</div>'; }
  else {
    catGrid.innerHTML=sortedCats.map(([cat,total])=>{
      const qCount=reportsData.filter(q=>(q._cat||parseQuoteCategory(q))===cat).length;
      const color=CAT_COLORS[cat]||'var(--blue-600)';
      const pct=Math.round(total/grandTotal*100);
      return `<div class="cat-card" style="border-top:3px solid ${color}" onclick="filterByCat('${cat}')"><div class="cat-name">${CAT_LABELS[cat]||cat}</div><div class="cat-amount" style="color:${color}">${fmt(total)}</div><div class="cat-count">${qCount} report${qCount!==1?'s':''} · ${pct}% of total</div><div class="cat-bar"><div class="cat-fill" style="width:${Math.round(total/maxCat*100)}%;background:${color}"></div></div></div>`;
    }).join('');
  }
  currentQuotesData=reportsData; currentSortKey='date'; currentSortDir='desc';
  renderQuotesList();
  document.getElementById('quotesTotal').textContent=`${reportsData.length} report${reportsData.length!==1?'s':''}`;
  document.getElementById('quotesTotalAmount').textContent=fmt(reportTotal);
}

function renderQuotesList() {
  const list=document.getElementById('quotesList');
  if (!currentQuotesData.length) { list.innerHTML='<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">No reports for this period</div>'; return; }
  const sorted=[...currentQuotesData].sort((a,b)=>{
    let av,bv;
    if (currentSortKey==='date')     {av=new Date(a.completion_date);bv=new Date(b.completion_date);}
    if (currentSortKey==='project')  {av=(a.project||'').toLowerCase();bv=(b.project||'').toLowerCase();}
    if (currentSortKey==='vendor')   {av=(a.vendor||a.contractor||'').toLowerCase();bv=(b.vendor||b.contractor||'').toLowerCase();}
    if (currentSortKey==='category') {av=(a._cat||'').toLowerCase();bv=(b._cat||'').toLowerCase();}
    if (currentSortKey==='amount')   {av=Number(a.amount||0);bv=Number(b.amount||0);}
    if (av<bv) return currentSortDir==='asc'?-1:1;
    if (av>bv) return currentSortDir==='asc'?1:-1;
    return 0;
  });
  list.innerHTML=sorted.map(q=>{
    const parsed = parseComment(q.comment);
    const emergencyBadge = q.is_emergency ? '<span style="font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:#fef2f2;color:#dc2626;margin-left:6px">EMERGENCY</span>' : '';
    const filesHtml = parsed.files.length ? parsed.files.map(f=>`
      <div class="file-preview" onclick="openFileViewer('${f.path}','${f.name}','${f.type}');event.stopPropagation()">
        <span class="file-icon">📎</span>
        <span class="file-name">${f.name}</span>
        <span class="file-size">${f.size?Math.round(f.size/1024)+'KB':''}</span>
        ${role==='admin'?`<button onclick="deleteFile('${q.id}','${f.path}','${f.name}');event.stopPropagation()" style="margin-left:auto;padding:4px 8px;font-size:11px;background:#fee;color:#dc2626;border:1px solid #fca;border-radius:6px;cursor:pointer;font-weight:600">🗑️ 삭제</button>`:''}
      </div>
    `).join('') : '<div style="font-size:12px;color:var(--muted);font-style:italic">No files attached</div>';
    
    return `
    <div>
      <div class="table-row" style="grid-template-columns:120px 1fr 100px 110px 100px" onclick="toggleReportAccordion('${q.id}')">
        <div style="font-size:12px;color:var(--text-2)">${new Date(q.completion_date).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}</div>
        <div style="font-size:13px;font-weight:500">${q.project||q.title||'—'}${emergencyBadge}</div>
        <div style="font-size:12px;color:var(--text-2)">${q.vendor||q.contractor||'—'}</div>
        <div>${catBadge(q._cat)}</div>
        <div style="font-size:13px;font-weight:600;text-align:right">${fmt(q.amount)}</div>
      </div>
      <div class="report-accordion" id="accordion-${q.id}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px">
          <div class="detail-section">
            <div class="detail-label">Project Description</div>
            <div class="detail-value">${q.project||'—'}</div>
          </div>
          <div class="detail-section">
            <div class="detail-label">Vendor / Contractor</div>
            <div class="detail-value">${q.vendor||'—'}</div>
          </div>
          <div class="detail-section">
            <div class="detail-label">Amount (AUD, ex GST)</div>
            <div class="detail-value">${fmt(q.amount)}</div>
          </div>
          <div class="detail-section">
            <div class="detail-label">Completion Date</div>
            <div class="detail-value">${new Date(q.completion_date).toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})}</div>
          </div>
        </div>
        ${q.notes?`<div class="detail-section"><div class="detail-label">Notes</div><div class="detail-value">${q.notes}</div></div>`:''}
        ${parsed.note?`<div class="detail-section"><div class="detail-label">Internal Note</div><div class="detail-value" style="font-style:italic;color:var(--muted)">${parsed.note}</div></div>`:''}
        <div class="detail-section">
          <div class="detail-label">Attached Files</div>
          ${filesHtml}
        </div>
        ${role==='admin'?`<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:8px">
          <button onclick="deleteReport('${q.id}');event.stopPropagation();" style="padding:7px 18px;background:#fff;color:#dc2626;border:1px solid #fca5a5;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Delete</button>
        </div>`:''}
      </div>
    </div>`;
  }).join('');
  ['date','project','vendor','category','amount'].forEach(k=>{
    const arr=document.getElementById('arr-'+k);
    if (!arr) return;
    if (k===currentSortKey) { arr.textContent=currentSortDir==='asc'?'↑':'↓'; arr.className='sort-arrow '+currentSortDir; }
    else { arr.textContent='↕'; arr.className='sort-arrow'; }
  });
}

window.deleteReport = async function(id) {
  if (!confirm('Permanently delete this record? This cannot be undone.')) return;
  try {
    const { error } = await supabase.from('quotes').update({ status: 'removed' }).eq('id', id);
    if (error) throw error;
    showToast('Record deleted');
    await loadReport();
  } catch(e) {
    console.error('deleteReport error:', e);
    showToast('Failed to delete', true);
  }
};

window.sortQuotes = (key) => {
  if (currentSortKey===key) { currentSortDir=currentSortDir==='asc'?'desc':'asc'; }
  else { currentSortKey=key; currentSortDir=(key==='category'||key==='vendor'||key==='project')?'asc':'desc'; }
  renderQuotesList();
};

window.filterByCat = (cat) => {
  document.getElementById('filterCategory').value=cat;
  loadReport();
  document.getElementById('quotesList').scrollIntoView({behavior:'smooth',block:'start'});
};

updateDateRange();
</script>
</body>
</html>
