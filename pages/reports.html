<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v4.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
/* ── Filter Bar ── */
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-select{padding:7px 11px;border:0.5px solid #e2e8f0;border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;background:#fff;color:#475569;transition:border-color 0.15s}
.filter-select:focus{outline:none;border-color:#2563eb}
.filter-input{padding:7px 12px;border:0.5px solid #e2e8f0;border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;background:#fff;color:#1e293b;outline:none;width:140px;transition:border-color 0.15s}
.filter-input:focus{border-color:#2563eb}
.btn-refresh{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:linear-gradient(135deg,#1e3a8a,#2563eb);border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif;box-shadow:0 2px 8px rgba(37,99,235,0.2)}
.btn-refresh:hover{box-shadow:0 4px 14px rgba(37,99,235,0.3);transform:translateY(-1px)}

/* ── Stats Row ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:#fff;border:0.5px solid #e2e8f0;border-radius:14px;padding:20px;transition:box-shadow 0.2s;position:relative;overflow:hidden}
.stat-card:hover{box-shadow:0 6px 20px rgba(0,0,0,0.07);transform:translateY(-1px)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0;background:var(--stat-color,#e2e8f0)}
.stat-label{font-size:11px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px}
.stat-num{font-size:26px;font-weight:600;letter-spacing:-1px;margin-bottom:4px}
.stat-sub{font-size:11px;color:#94a3b8;margin-top:2px}

/* ── Section Heading ── */
.section-heading{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-heading-bar{width:4px;height:18px;border-radius:2px;background:#2563eb;flex-shrink:0}
.section-heading-text{font-size:15px;font-weight:600;color:#1e293b}

/* ── Category Grid ── */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
.cat-card{background:#fff;border:0.5px solid #e2e8f0;border-radius:12px;padding:16px;cursor:pointer;border-top:3px solid;transition:all 0.15s}
.cat-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.08);transform:translateY(-2px)}
.cat-name{font-size:12px;font-weight:600;color:#475569;margin-bottom:4px}
.cat-amount{font-size:18px;font-weight:600;margin-bottom:3px}
.cat-count{font-size:11px;color:#94a3b8;margin-top:3px}
.cat-bar-wrap{height:4px;background:#f1f5f9;border-radius:100px;margin-top:10px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:100px;transition:width 0.4s ease}

/* ── Table ── */
.reports-card{background:#fff;border:0.5px solid #e2e8f0;border-radius:16px;overflow:hidden;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.table-head{display:grid;gap:10px;padding:11px 20px;background:#f8fafc;border-bottom:0.5px solid #f1f5f9}
.th{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:0.07em;cursor:pointer;user-select:none;transition:color 0.12s}
.th:hover{color:#2563eb}
.sort-arrow{font-size:10px;opacity:0.5;margin-left:2px}
.sort-arrow.asc,.sort-arrow.desc{opacity:1;color:#2563eb}
.table-row{display:grid;gap:10px;padding:14px 20px;border:1px solid #e2e8f0;border-radius:12px;margin:8px 12px;align-items:center;transition:all 0.12s;cursor:pointer;background:#fff}
.table-row:hover{background:#f8fafc;box-shadow:0 2px 8px rgba(0,0,0,0.04);transform:translateY(-1px)}
.r-date{font-size:12px;color:#64748b}
.r-title{font-size:13px;font-weight:600;color:#1e293b;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.r-vendor{font-size:12px;color:#64748b}
.r-amount{font-size:13px;font-weight:600;color:#1e293b;text-align:right}
.badge-emergency{background:#fee2e2;color:#991b1b;border:0.5px solid #fecaca;font-size:10px;font-weight:600;padding:2px 7px;border-radius:100px}
.cat-badge{display:inline-flex;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:600}

/* ── Report Accordion ── */
.report-accordion{display:none;background:#f8fafc;border-top:0.5px solid #f1f5f9;padding:20px}
.report-accordion.open{display:block}
.racc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.racc-item{display:flex;flex-direction:column;gap:4px}
.detail-label{font-size:13px;font-weight:700;color:#0f172a;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:3px}
.detail-value{font-size:13px;color:#374151;font-weight:400}
.file-preview{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border:0.5px solid #e2e8f0;border-radius:9px;font-size:12px;margin-top:6px;cursor:pointer;transition:all 0.12s}
.file-preview:hover{border-color:#2563eb;background:#eff6ff}
.file-icon{font-size:16px;flex-shrink:0}
.file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2563eb;font-weight:500}
.file-size{font-size:11px;color:#94a3b8}
.racc-footer{display:flex;justify-content:flex-end;padding-top:14px;border-top:0.5px solid #f1f5f9;margin-top:4px}
.btn-delete{padding:7px 18px;background:#fff;color:#dc2626;border:0.5px solid #fca5a5;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s}
.btn-delete:hover{background:#fef2f2;border-color:#ef4444}
.tbl-footer{padding:12px 20px;background:#f8fafc;border-top:0.5px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center}

/* Toast */
.toast{position:fixed;bottom:28px;right:28px;padding:14px 22px;border-radius:12px;color:#fff;font-size:14px;display:none;z-index:9999;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,0.15)}

/* ── 모바일 ── */
@media(max-width:768px){
  .stats-row{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px}
  .stat-num{font-size:20px}
  .cat-grid{grid-template-columns:1fr 1fr;gap:8px}
  .cat-card{padding:12px}
  .cat-amount{font-size:15px}
  .filter-bar{gap:6px}
  .filter-select,.filter-input{width:100%;padding:10px;font-size:14px}
  .btn-refresh{width:100%;justify-content:center;padding:10px}
  .table-head{display:none}
  .table-row{display:block;padding:14px;border:0.5px solid #e2e8f0;border-radius:12px;margin-bottom:8px;background:#fff}
  .table-row>div{margin-bottom:8px;display:block}
  .table-row>div:last-child{margin-bottom:0}
  .table-row>div::before{content:attr(data-mobile-label);display:block;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px}
  .r-amount{text-align:left}
  .racc-grid{grid-template-columns:1fr}
  .report-accordion{padding:14px}
}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">

    <!-- Filter Bar -->
    <div class="filter-bar">
      <select class="filter-select" id="filterPeriod">
        <option value="thismonth">This Month</option>
        <option value="lastmonth">Last Month</option>
        <option value="thisquarter">This Quarter</option>
        <option value="thisyear" selected>This Year</option>
        <option value="alltime">All Time</option>
        <option value="custom">Custom Range</option>
      </select>
      <input type="date" class="filter-input" id="dateFrom" style="display:none">
      <input type="date" class="filter-input" id="dateTo" style="display:none">
      <select class="filter-select" id="filterCategory">
        <option value="all">All Categories</option>
        <option value="HVAC">HVAC</option>
        <option value="Fire">Fire</option>
        <option value="Electrical">Electrical</option>
        <option value="Security">Security</option>
        <option value="Plumbing">Plumbing</option>
        <option value="Lift">Lift</option>
        <option value="General">General</option>
        <option value="Legal">Legal</option>
              </select>
      <select class="filter-select" id="filterType">
        <option value="all">All Works</option>
        <option value="regular">Regular Quotes</option>
        <option value="emergency">Emergency Works</option>
      </select>
      <button class="btn-refresh" id="refreshBtn">↻ Refresh</button>
    </div>

    <!-- Cost Analysis Link -->
    <div style="display:flex;justify-content:flex-end;margin-bottom:20px">
      <a href="/pages/cost-dashboard.html" style="display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:9px;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;font-size:12px;font-weight:600;text-decoration:none;box-shadow:0 2px 8px rgba(37,99,235,0.2);transition:all 0.15s" onmouseover="this.style.boxShadow='0 4px 14px rgba(37,99,235,0.35)'" onmouseout="this.style.boxShadow='0 2px 8px rgba(37,99,235,0.2)'">
        💹 Cost Analysis →
      </a>
    </div>

    <!-- Approved Quotes Table -->
    <div class="section-heading">
      <div class="section-heading-bar"></div>
      <div class="section-heading-text">Approved Quotes</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 20px;margin-bottom:14px">
      <span style="font-size:13px;font-weight:600;color:#64748b" id="quotesTotalCount">—</span>
      <div style="display:flex;align-items:center;gap:16px">
        <span style="font-size:12px;color:#64748b">ex GST: <span id="quotesTotalExGST2" style="font-weight:600;color:#1e293b">$0.00</span></span>
        <span style="font-size:12px;color:#64748b">GST: <span id="quotesTotalGST2" style="font-weight:600;color:#1e293b">$0.00</span></span>
        <span style="font-size:14px;font-weight:700;color:#1e3a8a">Total: <span id="quotesTotalAmount2">$0.00</span></span>
      </div>
    </div>
    <div class="reports-card">
      <div class="table-head" style="grid-template-columns:110px 1fr 1fr 110px 100px">
        <div class="th" onclick="sortQuotes('date')" id="th-date">Date <span class="sort-arrow" id="arr-date">↕</span></div>
        <div class="th" onclick="sortQuotes('project')" id="th-project">Project <span class="sort-arrow" id="arr-project">↕</span></div>
        <div class="th" onclick="sortQuotes('vendor')" id="th-vendor">Vendor <span class="sort-arrow" id="arr-vendor">↕</span></div>
        <div class="th" onclick="sortQuotes('category')" id="th-category">Category <span class="sort-arrow" id="arr-category">↕</span></div>
        <div class="th" onclick="sortQuotes('amount')" id="th-amount" style="text-align:right">Amount <span class="sort-arrow" id="arr-amount">↕</span></div>
      </div>
      <div id="quotesList">
        <div style="padding:24px;text-align:center;color:#94a3b8;font-size:13px">Loading…</div>
      </div>
      <div class="tbl-footer">
        <span style="font-size:12px;color:#64748b" id="quotesTotal">—</span>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
          <span style="font-size:12px;color:#64748b">ex GST: <span id="quotesTotalExGST" style="font-weight:600;color:#1e293b">$0.00</span></span>
          <span style="font-size:12px;color:#64748b">GST (10%): <span id="quotesTotalGST" style="font-weight:600;color:#1e293b">$0.00</span></span>
          <span style="font-size:14px;font-weight:700;color:#1e293b">inc GST: <span id="quotesTotalAmount">$0.00</span></span>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="fileViewerModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.65);z-index:9999;align-items:center;justify-content:center;backdrop-filter:blur(2px)" onclick="if(event.target===this)closeViewer()">
  <div style="background:#fff;border-radius:16px;padding:20px;max-width:900px;width:92%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,0.3)">
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
      <button onclick="closeViewer()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;line-height:1">&times;</button>
    </div>
    <div id="viewerContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '/js/layout.js';
import { parseComment } from '/js/common.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role } = ctx;
if (!['admin','committee','observer'].includes(role)) window.location.href='/pages/building.html';

const CAT_LABELS = { 'HVAC':'HVAC','Fire':'Fire','Electrical':'Electrical','Security':'Security','Plumbing':'Plumbing','Lift':'Lift','General':'General','Legal':'Legal', };
const CAT_COLORS = { 'HVAC':'#d97706','Fire':'#dc2626','Electrical':'#ca8a04','Security':'#7c3aed','Plumbing':'#0891b2','Lift':'#059669','General':'#2563eb','Legal':'#db2777', };
const CAT_BG    = { 'HVAC':'#fef3c7','Fire':'#fee2e2','Electrical':'#fefce8','Security':'#ede9fe','Plumbing':'#ecfeff','Lift':'#dcfce7','General':'#dbeafe','Legal':'#fce7f3', };

const fmt = n => '$'+Number(n||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});

function parseQuoteCategory(q) {
  try { if (q.comment) { const c=typeof q.comment==='string'?JSON.parse(q.comment):q.comment; if (c?.category) return c.category; } } catch {}
  return q.category||'General';
}

function catBadge(cat) {
  const label=CAT_LABELS[cat]||cat||'Other';
  const color=CAT_COLORS[cat]||'#94a3b8';
  const bg=CAT_BG[cat]||'#f1f5f9';
  return `<span class="cat-badge" style="background:${bg};color:${color};border:0.5px solid ${color}33">${label}</span>`;
}

let dateFrom=null, dateTo=null;
let currentQuotesData=[];
let currentSortKey='date';
let currentSortDir='desc';



window.openFileViewer = async function(path, name, type) {
  try {
    let url;
    if (path.startsWith('http')) {
      url = path;
    } else {
      const cleanPath = path.replace(/^quotes\//, '');
      const { data, error } = await supabase.storage.from('quotes').createSignedUrl(cleanPath, 3600);
      if (error || !data?.signedUrl) throw new Error('Signed URL failed');
      url = data.signedUrl;
    }
    let html = '';
    if ((type && type.includes('pdf')) || (name && name.toLowerCase().endsWith('.pdf'))) {
      html = `<iframe src="${url}" style="width:100%;height:500px;border:none;border-radius:6px"></iframe>`;
    } else {
      html = `<img src="${url}" style="max-width:100%;max-height:70vh;border-radius:6px;display:block;margin:auto" alt="${name}">`;
    }
    document.getElementById('viewerContent').innerHTML = `<div style="font-size:13px;font-weight:600;color:#1e293b;margin-bottom:10px">📎 ${name}</div>` + html;
    document.getElementById('fileViewerModal').style.display = 'flex';
  } catch(e) {
    console.error('openFileViewer failed:', e);
    alert('Failed to load file');
  }
};

window.closeViewer = function() {
  document.getElementById('fileViewerModal').style.display = 'none';
  document.getElementById('viewerContent').innerHTML = '';
};

window.deleteFile = async function(quoteId, filePath, fileName) {
  if (!confirm(`⚠️ 파일을 영구 삭제하시겠습니까?\n\n${fileName}\n\n삭제 후 복구 불가능합니다.`)) return;
  try {
    const { data: quote, error: fetchError } = await supabase.from('quotes').select('comment').eq('id', quoteId).single();
    if (fetchError) throw fetchError;
    const parsed = parseComment(quote.comment);
    const updatedFiles = parsed.files.filter(f => f.path !== filePath);
    const updatedComment = { ...parsed, files: updatedFiles };
    const { error: updateError } = await supabase.from('quotes').update({ comment: updatedComment }).eq('id', quoteId);
    if (updateError) throw updateError;
    // Storage 경로 정규화 (quotes/ prefix 중복 제거)
    const cleanPath = filePath.replace(/^quotes\//, '');
    const { error: storageError } = await supabase.storage.from('quotes').remove([cleanPath]);
    if (storageError) {
      console.error('Storage deletion failed:', storageError);
      alert('파일 DB 제거는 완료됐으나 Storage 삭제 실패: ' + storageError.message);
      return;
    }
    await loadReport();
    alert('✓ 파일이 완전히 삭제되었습니다.');
  } catch(e) {
    console.error('File deletion failed:', e);
    alert('삭제 실패: ' + e.message);
  }
};

window.showToast = (msg, isError=false) => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#991b1b' : '#0f172a';
  t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 3000);
};

window.toggleReportAccordion = function(quoteId) {
  const accordion = document.getElementById(`accordion-${quoteId}`);
  if (!accordion) return;
  accordion.classList.toggle('open');
};

document.getElementById('filterPeriod').addEventListener('change', updateDateRange);
document.getElementById('filterCategory').addEventListener('change', loadReport);
document.getElementById('filterType').addEventListener('change', loadReport);
document.getElementById('refreshBtn').addEventListener('click', loadReport);

function updateDateRange() {
  const period=document.getElementById('filterPeriod').value;
  const fromEl=document.getElementById('dateFrom');
  const toEl=document.getElementById('dateTo');
  if (period==='custom') { fromEl.style.display='block'; toEl.style.display='block'; return; }
  fromEl.style.display='none'; toEl.style.display='none';
  const now=new Date(); const y=now.getFullYear(); const m=now.getMonth();
  if (period==='thismonth')   { dateFrom=new Date(y,m,1); dateTo=new Date(y,m+1,0); }
  else if (period==='lastmonth')   { dateFrom=new Date(y,m-1,1); dateTo=new Date(y,m,0); }
  else if (period==='thisquarter') { const q=Math.floor(m/3); dateFrom=new Date(y,q*3,1); dateTo=new Date(y,q*3+3,0); }
  else if (period==='thisyear')    { dateFrom=new Date(y,0,1); dateTo=new Date(y,11,31); }
  else { dateFrom=null; dateTo=null; }
  loadReport();
}

async function loadReport() {
  const period=document.getElementById('filterPeriod').value;
  const catFilter=document.getElementById('filterCategory').value;
  const typeFilter=document.getElementById('filterType').value;
  if (period==='custom') {
    const fromVal=document.getElementById('dateFrom').value;
    const toVal=document.getElementById('dateTo').value;
    if (fromVal) dateFrom=new Date(fromVal);
    if (toVal)   dateTo=new Date(toVal);
  }
  const periodLabel = period==='alltime'?'All time':period==='thisyear'?`Jan–Dec ${new Date().getFullYear()}`:period==='thismonth'?new Date().toLocaleString('en-AU',{month:'long',year:'numeric'}):'—';
  // periodLabel은 footer 표시용으로 보존

  let qQuery=supabase.from('quotes').select('*')
    .not('completion_date','is',null)
    .eq('work_status','completed')
    .not('status','eq','removed')
    .order('completion_date',{ascending:false});

  if (dateFrom) qQuery=qQuery.gte('completion_date',dateFrom.toISOString().split('T')[0]);
  if (dateTo)   qQuery=qQuery.lte('completion_date',new Date(dateTo.getTime()+86400000).toISOString().split('T')[0]);
  if (typeFilter==='regular')   qQuery=qQuery.eq('is_emergency',false);
  if (typeFilter==='emergency') qQuery=qQuery.eq('is_emergency',true);

  const { data:reportsRaw } = await qQuery;
  const reports=(reportsRaw||[]).map(q=>({...q,_cat:parseQuoteCategory(q)})).filter(q=>catFilter==='all'||q._cat===catFilter);
  const reportsData=reports||[];
  const reportTotal=reportsData.reduce((s,q)=>s+(Number(q.amount)||0),0);
  currentQuotesData=reportsData; currentSortKey='date'; currentSortDir='desc';
  renderQuotesList();
  document.getElementById('quotesTotal').textContent=`${reportsData.length} report${reportsData.length!==1?'s':''}`;
  document.getElementById('quotesTotalExGST').textContent=fmt(reportTotal);
  document.getElementById('quotesTotalGST').textContent=fmt(reportTotal*0.1);
  document.getElementById('quotesTotalAmount').textContent=fmt(reportTotal*1.1);
  document.getElementById('quotesTotalCount').textContent=`${reportsData.length} report${reportsData.length!==1?'s':''}`;
  document.getElementById('quotesTotalExGST2').textContent=fmt(reportTotal);
  document.getElementById('quotesTotalGST2').textContent=fmt(reportTotal*0.1);
  document.getElementById('quotesTotalAmount2').textContent=fmt(reportTotal*1.1);
}

function renderQuotesList() {
  const list=document.getElementById('quotesList');
  if (!currentQuotesData.length) {
    list.innerHTML='<div style="padding:32px;text-align:center;color:#94a3b8;font-size:13px">No reports for this period</div>';
    return;
  }
  const sorted=[...currentQuotesData].sort((a,b)=>{
    let av,bv;
    if (currentSortKey==='date')     {av=new Date(a.completion_date);bv=new Date(b.completion_date);}
    if (currentSortKey==='project')  {av=(a.project||'').toLowerCase();bv=(b.project||'').toLowerCase();}
    if (currentSortKey==='vendor')   {av=(a.vendor||a.contractor||'').toLowerCase();bv=(b.vendor||b.contractor||'').toLowerCase();}
    if (currentSortKey==='category') {av=(a._cat||'').toLowerCase();bv=(b._cat||'').toLowerCase();}
    if (currentSortKey==='amount')   {av=Number(a.amount||0);bv=Number(b.amount||0);}
    if (av<bv) return currentSortDir==='asc'?-1:1;
    if (av>bv) return currentSortDir==='asc'?1:-1;
    return 0;
  });
  list.innerHTML=sorted.map(q=>{
    const parsed = parseComment(q.comment);
    const emergencyBadge = q.is_emergency ? '<span class="badge-emergency">EMERGENCY</span>' : '';
    const filesHtml = parsed.files.length ? parsed.files.map(f=>`
      <div class="file-preview" onclick="openFileViewer('${f.path}','${f.name}','${f.type}');event.stopPropagation()">
        <span class="file-icon">📎</span>
        <span class="file-name">${f.name}</span>
        <span class="file-size">${f.size?Math.round(f.size/1024)+'KB':''}</span>
        ${role==='admin'?`<button onclick="deleteFile('${q.id}','${f.path}','${f.name}');event.stopPropagation()" style="margin-left:auto;padding:3px 8px;font-size:11px;background:#fee2e2;color:#dc2626;border:0.5px solid #fca5a5;border-radius:6px;cursor:pointer;font-weight:600">🗑️ 삭제</button>`:''}
      </div>`).join('')
      : '<div style="font-size:12px;color:#94a3b8;font-style:italic">No files attached</div>';

    return `
    <div>
      <div class="table-row" style="grid-template-columns:110px 1fr 1fr 110px 100px" onclick="toggleReportAccordion('${q.id}')">
        <div class="r-date">${new Date(q.completion_date).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}</div>
        <div class="r-title">${q.project||q.title||'—'}${emergencyBadge}</div>
        <div class="r-vendor">${q.vendor||q.contractor||'—'}</div>
        <div>${catBadge(q._cat)}</div>
        <div class="r-amount">${fmt(q.amount)}</div>
      </div>
      <div class="report-accordion" id="accordion-${q.id}">
        <div class="racc-grid">
          <div class="racc-item">
            <div class="detail-label">Project Description</div>
            <div class="detail-value">${q.project||'—'}</div>
          </div>
          <div class="racc-item">
            <div class="detail-label">Vendor / Contractor</div>
            <div class="detail-value">${q.vendor||'—'}</div>
          </div>
          <div class="racc-item">
            <div class="detail-label">Amount (AUD, ex GST)</div>
            <div class="detail-value">${fmt(q.amount)}</div>
          </div>
          <div class="racc-item">
            <div class="detail-label">Completion Date</div>
            <div class="detail-value">${new Date(q.completion_date).toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})}</div>
          </div>
        </div>
        ${q.notes?`<div style="margin-bottom:12px"><div class="detail-label" style="margin-bottom:5px">Notes</div><div class="detail-value" style="color:#475569;line-height:1.6;white-space:pre-wrap">${q.notes}</div></div>`:''}
        ${parsed.note?`<div style="margin-bottom:12px"><div class="detail-label" style="margin-bottom:5px">Internal Note</div><div class="detail-value" style="font-style:italic;color:#64748b;white-space:pre-wrap">${parsed.note}</div></div>`:''}
        <div>
          <div class="detail-label" style="margin-bottom:6px">Attached Files</div>
          ${filesHtml}
        </div>
        ${role==='admin'?`<div class="racc-footer"><button class="btn-delete" onclick="deleteReport('${q.id}');event.stopPropagation();">Delete</button></div>`:''}
      </div>
    </div>`;
  }).join('');

  ['date','project','vendor','category','amount'].forEach(k=>{
    const arr=document.getElementById('arr-'+k);
    if (!arr) return;
    if (k===currentSortKey) { arr.textContent=currentSortDir==='asc'?'↑':'↓'; arr.className='sort-arrow '+currentSortDir; }
    else { arr.textContent='↕'; arr.className='sort-arrow'; }
  });
}

window.deleteReport = async function(id) {
  if (!confirm('Permanently delete this record? This cannot be undone.')) return;
  try {
    const { error } = await supabase.from('quotes').update({ status: 'removed' }).eq('id', id);
    if (error) throw error;
    window.showToast('Record deleted');
    await loadReport();
  } catch(e) {
    console.error('deleteReport error:', e);
    window.showToast('Failed to delete', true);
  }
};

window.sortQuotes = (key) => {
  if (currentSortKey===key) { currentSortDir=currentSortDir==='asc'?'desc':'asc'; }
  else { currentSortKey=key; currentSortDir=(key==='category'||key==='vendor'||key==='project')?'asc':'desc'; }
  renderQuotesList();
};

window.filterByCat = (cat) => {
  document.getElementById('filterCategory').value=cat;
  loadReport();
  document.getElementById('quotesList').scrollIntoView({behavior:'smooth',block:'start'});
};

updateDateRange();
</script>
</body>
</html>
