<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parking Management – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v4.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">

<style>
.content{padding:24px;display:grid;grid-template-columns:0.75fr 1.25fr;gap:20px;align-items:start}
.report-form{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px}
.form-title{font-size:16px;font-weight:600;margin-bottom:4px}
.form-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.form-field{margin-bottom:14px}
.form-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;display:block}
.form-input{width:100%;height:44px;padding:0 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);outline:none;text-transform:uppercase;letter-spacing:0.1em;font-weight:600}
.form-input:focus{border-color:var(--red);background:#fff;box-shadow:0 0 0 3px rgba(239,68,68,0.1)}
.form-select{width:100%;height:44px;padding:0 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg)}
.form-select:focus{border-color:var(--red);outline:none}
.form-textarea{width:100%;min-height:80px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);resize:vertical;outline:none;line-height:1.6}
.form-textarea:focus{border-color:var(--red);background:#fff}
.violation-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.vio-btn{padding:10px 8px;border-radius:9px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;text-align:center;transition:all 0.15s;color:var(--text-2)}
.vio-btn:hover{border-color:var(--red);color:var(--red-text)}
.vio-btn.active{border-color:var(--red);background:var(--red-bg);color:var(--red-text)}
.vio-icon{font-size:20px;margin-bottom:4px;display:block}
.btn-report{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:9px;background:linear-gradient(135deg,#7f1d1d,#dc2626);color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;width:100%;justify-content:center}
.notice-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.parking-card{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:box-shadow 0.15s}
.parking-card[style*="border-left"]{border-top-left-radius:4px;border-bottom-left-radius:4px}
.parking-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.06)}
.parking-card.resolved{background:var(--bg)}
.pk-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background 0.12s;gap:12px;flex-wrap:wrap}
.pk-header:hover{background:var(--bg)}
.pk-header.resolved{background:var(--bg)}
.pk-header-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.pk-plate{font-size:20px;font-weight:700;color:var(--text);letter-spacing:0.1em;font-family:monospace;flex-shrink:0}
.pk-plate.resolved{color:#57534e}
.pk-info .resolved-text{color:#57534e}
.pk-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;color:var(--text)}
.pk-time{font-size:15px;font-weight:600;color:var(--text-2);text-align:right;flex-shrink:0}
.pk-time.resolved{color:#57534e}
.pk-body{display:none;padding:18px;background:var(--bg);border-top:0.5px solid var(--border-light)}
.pk-body.open{display:block}
.pk-location{font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px}
.pk-violation{display:inline-block;margin-bottom:10px}
.pk-reporter{font-size:14px;color:var(--text-2);margin-bottom:10px}
.pk-comment{font-size:15px;color:var(--text-2);background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;line-height:1.6;white-space:pre-wrap}
.pk-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pk-images{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0}
.pk-image{width:100%;border-radius:10px;cursor:pointer;transition:transform 0.15s;object-fit:cover;max-height:300px}
.pk-image:hover{transform:scale(1.02)}
.pk-chevron{font-size:14px;color:var(--muted);transition:transform 0.2s;flex-shrink:0}
.pk-chevron.open{transform:rotate(180deg)}
@media(max-width:900px){.content{grid-template-columns:1fr}}
@media(max-width:768px){
  .pk-header{flex-direction:column;align-items:flex-start;gap:8px}
  .pk-header-left{flex-direction:column;align-items:flex-start;gap:6px;width:100%}
  .pk-plate{font-size:20px}
  .pk-info{gap:6px}
  .pk-time{text-align:left}

  /* iOS Safari 줌인 방지 — 모든 input/select/textarea 16px */
  .form-input,.form-select,.form-textarea{font-size:16px}
  .form-input{height:48px}
  .form-select{height:48px}

  /* 컨텐츠 패딩 축소 */
  .content{padding:14px;gap:14px}
  .report-form{padding:18px}

  /* 통계 / 폼 타이틀 약간 축소 */
  .form-title{font-size:15px}
  .form-sub{font-size:12px;margin-bottom:14px}

  /* 위반 종류 버튼 컴팩트 */
  .vio-btn{padding:8px 6px;font-size:11px}
  .vio-icon{font-size:18px;margin-bottom:2px}
  .violation-grid{gap:6px}

  /* 필터바 가로 스크롤 */
  .filter-bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
  .filter-bar::-webkit-scrollbar{display:none}
  .filter-btn{flex-shrink:0}

  /* 사진 업로드 버튼 컴팩트 */
  #pkCameraBtn,#pkFileBtn{padding:10px 8px !important;font-size:12px !important}
  #pkCameraBtn span:first-child,#pkFileBtn span:first-child{font-size:18px !important}

  /* 카드 패딩 축소 */
  .pk-header{padding:12px 14px}
  .pk-body{padding:14px}

  /* 신고 사진 갤러리 모바일에선 작게 */
  .pk-images{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .pk-image{max-height:200px}

  /* Report Now 버튼 살짝 키움 */
  .btn-report{height:48px;font-size:14px}

  /* notice-header 정리 */
  .notice-header{flex-wrap:wrap;gap:6px}

  /* warning-banner 모바일 */
  .warning-banner{padding:14px 16px;line-height:1.5}
  .warning-banner .wb-title{font-size:14px;flex-wrap:wrap}
  .warning-banner .wb-title-mobile-break{flex-basis:100%;height:0;width:0;display:block !important}
  .warning-banner .wb-title-cjk{font-size:13px;font-weight:700;opacity:0.95}
  .warning-banner .wb-lang{font-size:13px}
}

/* Desktop: keep title in one line */
.warning-banner .wb-title-mobile-break{display:none}

/* === 익명 안내 박스 === */
.anon-notice{
  display:flex;
  align-items:flex-start;
  gap:10px;
  background:#ecfdf5;
  border:1px solid #a7f3d0;
  border-left:3px solid #10b981;
  border-radius:8px;
  padding:10px 12px;
  margin-bottom:14px;
}
.anon-notice .anon-icon{
  font-size:15px;
  line-height:1.5;
  flex-shrink:0;
}
.anon-notice .anon-text{
  font-size:12.5px;
  line-height:1.5;
  color:#065f46;
}
.anon-notice .anon-text strong{
  color:#047857;
  font-weight:700;
}

/* === 강렬한 경고 배너 === */
.warning-banner{
  background:linear-gradient(135deg,#b91c1c 0%,#7f1d1d 100%);
  color:#fff;
  border-radius:12px;
  padding:16px 20px;
  margin-bottom:14px;
  box-shadow:0 4px 14px rgba(185,28,28,0.35),inset 0 1px 0 rgba(255,255,255,0.1);
  border:2px solid #991b1b;
  position:relative;
  overflow:hidden;
}
.warning-banner::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:3px;
  background:repeating-linear-gradient(90deg,#fbbf24 0 14px,#1f2937 14px 28px);
  animation:wb-stripe 1s linear infinite;
}
@keyframes wb-stripe{from{background-position:0 0}to{background-position:28px 0}}
.warning-banner .wb-title{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-weight:800;font-size:15.5px;
  text-transform:uppercase;letter-spacing:0.6px;
  margin-bottom:12px;padding-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,0.18);
  text-shadow:0 1px 2px rgba(0,0,0,0.3);
  text-align:center;
}
.warning-banner .wb-icon{
  font-size:20px;
  animation:wb-pulse 1.5s ease-in-out infinite;
}
@keyframes wb-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:0.7}}
.warning-banner .wb-lang{
  font-size:14.5px;line-height:1.65;
  margin:8px 0;
  font-weight:500;
}
.warning-banner .wb-lang strong{
  color:#fde047;
  font-weight:700;
}
.warning-banner .wb-lang .wb-flag{
  display:inline-block;
  width:22px;
  font-size:13px;
  opacity:0.85;
  margin-right:4px;
  font-weight:700;
}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">

    <!-- Page Hero (full width across grid) -->
    <div style="grid-column:1/-1">
      <!-- Page Header -->
      <div class="page-header">
        <div class="page-header-icon">
          <svg viewBox="0 0 24 24"><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1l3-4h10l3 4h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/></svg>
        </div>
        <div class="page-header-body">
          <div class="page-header-title-row">
            <span class="page-header-title">Parking Management</span>
          </div>
          <div class="page-header-sub">Report and manage parking violations.</div>
        </div>
      </div>
      <div style="background:#FEE2E2;border:1px solid #FCA5A5;border-radius:10px;padding:11px 24px;display:flex;align-items:flex-start;gap:10px">
        <span style="font-size:16px;flex-shrink:0;line-height:1.4">🚨</span>
        <span style="font-size:13px;color:#991B1B;font-weight:600;line-height:1.4">Unauthorised vehicles will receive a warning sticker on the driver's windscreen.</span>
      </div>
    </div>

    <div class="report-form">
      <div class="form-field" style="margin-bottom:16px">
        <label class="form-label">🔍 Search Vehicle</label>
        <input class="form-input" id="plateSearchInput" placeholder="Enter plate to check owner & history..." maxlength="10" oninput="this.value = this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase(); onPlateSearch();">
        <div id="plateSearchResult" style="display:none;margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:13px"></div>
      </div>
      <div style="border-top:1px solid var(--border);margin-bottom:16px"></div>
      <div class="anon-notice">
        <span class="anon-icon">🔒</span>
        <div class="anon-text"><strong>Your report is anonymous.</strong> The reported driver will not see who submitted it.</div>
      </div>
      <div class="form-field">
        <label class="form-label">Number Plate</label>
        <input class="form-input" id="plateInput" placeholder="ABC 123" maxlength="10" oninput="this.value = this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase()">
      </div>
      <div class="form-field">
        <label class="form-label">Location</label>
        <select class="form-select" id="locationArea">
          <option value="">Select area…</option>
          <option value="entry">Entry</option>
          <option value="ground">Ground Floor</option>
          <option value="b1">B1</option>
          <option value="b2">B2</option>
        </select>
      </div>
      <div class="form-field" id="bayField" style="display:none">
        <label class="form-label">Bay</label>
        <select class="form-select" id="baySelect"></select>
      </div>
      <div class="form-field">
        <label class="form-label">Violation Type</label>
        <div class="violation-grid">
          <button class="vio-btn" data-vio="occupied"><span class="vio-icon">🚫</span>Someone else's bay</button>
          <button class="vio-btn" data-vio="disabled"><span class="vio-icon">♿</span>Disabled bay</button>
          <button class="vio-btn" data-vio="loading"><span class="vio-icon">🔴</span>Loading bay</button>
          <button class="vio-btn" data-vio="blocking"><span class="vio-icon">🚧</span>Blocking access</button>
          <button class="vio-btn" data-vio="contractor"><span class="vio-icon">🏗️</span>Contractor bay</button>
          <button class="vio-btn" data-vio="other"><span class="vio-icon">⚠️</span>Other</button>
        </div>
      </div>
      <div class="form-field">
        <label class="form-label">Additional Comments (optional)</label>
        <textarea class="form-textarea" id="pkComment" placeholder="Any additional details…"></textarea>
      </div>
      <div class="form-field">
        <label class="form-label">Photos (optional, max 3)</label>
        <div style="display:flex;gap:10px;margin-top:4px">
          <button type="button" id="pkCameraBtn" style="flex:1;padding:12px;border:2px dashed var(--border);border-radius:10px;background:var(--bg);cursor:pointer;font-size:13px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:6px;transition:all 0.15s" onmouseover="this.style.borderColor='var(--blue-600)'" onmouseout="this.style.borderColor='var(--border)'">
            <span style="font-size:22px">📷</span>
            <span>Camera</span>
          </button>
          <button type="button" id="pkFileBtn" style="flex:1;padding:12px;border:2px dashed var(--border);border-radius:10px;background:var(--bg);cursor:pointer;font-size:13px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:6px;transition:all 0.15s" onmouseover="this.style.borderColor='var(--blue-600)'" onmouseout="this.style.borderColor='var(--border)'">
            <span style="font-size:22px">📁</span>
            <span>Browse File</span>
          </button>
        </div>
        <input type="file" id="photoInputCamera" accept="image/*" capture="environment" style="display:none">
        <input type="file" id="photoInputFile" accept="image/*,application/pdf" multiple style="display:none">
        <div id="pkPhotoPreviewGrid" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
        <div id="pkPhotoCount" style="font-size:11px;color:var(--muted);margin-top:4px;display:none"></div>
      </div>
      <button class="btn-report" id="submitReportBtn">🚨 Report Now</button>
    </div>

    <div>
      <div class="notice-header">
        <div class="section-title">Active Incidents</div>
        <span id="activeCount" style="font-size:13px;font-weight:600;color:var(--red-text)"></span>
      </div>
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="all">All</button>
        <button class="filter-btn" data-filter="resolved">Resolved</button>
      </div>
      <div id="reportsList"><div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">Loading…</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div id="imageModal" tabindex="-1" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;flex-direction:column;padding:16px;outline:none" onclick="if(event.target===this)closeImageModal()">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-shrink:0" onclick="event.stopPropagation()">
    <span id="imageModalName" style="color:#e5e7eb;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:calc(100% - 120px)"></span>
    <div style="display:flex;gap:8px;flex-shrink:0">
      <button onclick="printImageModal()" style="background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;padding:6px 14px">🖨 Print</button>
      <button onclick="closeImageModal()" style="background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:22px;cursor:pointer;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center">&times;</button>
    </div>
  </div>
  <div id="imageModalContent" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:0;border-radius:10px;overflow:hidden" onclick="event.stopPropagation()"></div>
</div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role, name } = ctx;

async function logActivity(action, record_id = null) {
  try {
    if (role === 'admin') return;
    await supabase.from('audit_logs').insert({
      user_email: user.email,
      user_role: role,
      action,
      record_id,
      created_at: new Date().toISOString()
    });
  } catch (e) {}
}

const BAYS = {
  entry:  ['Loading Bay 1','Loading Bay 2'],
  ground: ['Disabled Bay 1','Disabled Bay 2','Contractor Bay','Management Bay','GF 1A','GF 1B','GF 1C','GF 1D','GF 1E','GF 1F','GF 1G','GF 1H','GF 2A','GF 2B','GF 2C','GF 2D','GF 2E','GF 2G','GF 2H'],
  b1: ['B1 1A','B1 1B','B1 1C','B1 1D','B1 1E','B1 1F','B1 1G','B1 1H','B1 2A','B1 2B','B1 2C','B1 2D','B1 2E','B1 2F','B1 2G','B1 2H','B1 3A','B1 3B','B1 3C','B1 3D','B1 3E','B1 3F','B1 3G','B1 3H','B1 4A','B1 4B','B1 4C','B1 4D','B1 4E','B1 4F','B1 4G','B1 4H','B1 5A','B1 5B','B1 5C','B1 5D','B1 5E','B1 5F','B1 5G','B1 5H','B1 6A','B1 6B','B1 6C','B1 6D','B1 6E','B1 6F','B1 6G','B1 6H'],
  b2: ['B2 1A','B2 1B','B2 1C','B2 1D','B2 1E','B2 1F','B2 1G','B2 1H','B2 2A','B2 2B','B2 2C','B2 2D','B2 2E','B2 2F','B2 2G','B2 2H','B2 3A','B2 3B','B2 3C','B2 3D','B2 3E','B2 3F','B2 3G','B2 3H','B2 4A','B2 4B','B2 4C','B2 4D','B2 4E','B2 4F','B2 4G','B2 4H','B2 5A','B2 5B','B2 5C','B2 5D','B2 5E','B2 5F','B2 5G','B2 5H','B2 6A','B2 6B','B2 6C','B2 6D','B2 6E','B2 6F','B2 6G','B2 6H'],
};
const VIO_LABELS = { occupied:"Someone else's bay",disabled:"Disabled bay violation",loading:"Loading bay violation",blocking:"Blocking access",contractor:"Contractor bay violation",other:"Other violation" };

let selectedVio = null;
let currentFilter = 'active';

document.getElementById('locationArea').addEventListener('change', () => {
  const area = document.getElementById('locationArea').value;
  const bayField = document.getElementById('bayField');
  const baySelect = document.getElementById('baySelect');
  if (!area) { bayField.style.display='none'; return; }
  bayField.style.display = 'block';
  baySelect.innerHTML = BAYS[area].map(b=>`<option value="${b}">${b}</option>`).join('');
});

document.querySelectorAll('.vio-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedVio = btn.dataset.vio;
    document.querySelectorAll('.vio-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});

const MAX_PHOTOS = 3;
const MAX_SIZE = 20 * 1024 * 1024; // 20MB
window._pkFiles = [];

function pkUpdatePreview() {
  const grid = document.getElementById('pkPhotoPreviewGrid');
  const countEl = document.getElementById('pkPhotoCount');
  grid.innerHTML = '';
  const f = window._pkFiles[0];
  if (f) alert('📷 Photo attached\n\n' + f.name + '\n' + (f.size > 1024*1024 ? (f.size/1024/1024).toFixed(1) + ' MB' : Math.round(f.size/1024) + ' KB'));
  window._pkFiles.forEach((file, idx) => {
    const isPdf = (file.type === 'application/pdf') || (file.name && file.name.toLowerCase().endsWith('.pdf'));
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;flex-shrink:0';
    if (isPdf) {
      wrap.innerHTML = `
        <div style="width:100%;height:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
          <span style="font-size:24px">📄</span>

async function compressImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => {
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let { width, height } = img;
        const maxWidth = 1600;
        if (width > maxWidth) { height = Math.round(height * (maxWidth / width)); width = maxWidth; }
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => {
          resolve(new File([blob], file.name, { type: 'image/jpeg' }));
        }, 'image/jpeg', 0.75);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function pkHandleFiles(files) {
  for (const file of files) {
    if (window._pkFiles.length >= MAX_PHOTOS) { showToast(`Max ${MAX_PHOTOS} photos allowed`, true); break; }
    if (file.size > MAX_SIZE) { showToast(`${file.name} exceeds 20MB`, true); continue; }
    window._pkFiles.push(file);
  }
  pkUpdatePreview();
  pkUpdateButtons();
}

document.getElementById('pkFileBtn').addEventListener('click', () => { if (window._pkFiles.length < MAX_PHOTOS) document.getElementById('photoInputFile').click(); });
const cameraInput = document.getElementById('photoInputCamera');
cameraInput.addEventListener('change', function(e) {
  const files = [...(e.target.files || [])];
  if (!files.length) return;
  files.forEach((file) => {
    if (window._pkFiles.length >= MAX_PHOTOS) { showToast(`Max ${MAX_PHOTOS} photos allowed`, true); return; }
    if (file.size > MAX_SIZE) { showToast(`${file.name} exceeds 20MB`, true); return; }
    window._pkFiles.push(file);
  });
  pkUpdatePreview();
  pkUpdateButtons();
  files.forEach((file) => {
    if (!window._pkFiles.includes(file)) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function() {
      const MAX = 1920;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        URL.revokeObjectURL(url);
        if (blob) {
          const currentIndex = window._pkFiles.indexOf(file);
          if (currentIndex !== -1) window._pkFiles[currentIndex] = new File([blob], file.name || 'photo.jpg', { type: 'image/jpeg' });
        }
      }, 'image/jpeg', 0.75);
    };
    img.onerror = function() { URL.revokeObjectURL(url); };
    img.src = url;
  });
  cameraInput.value = '';
});
document.getElementById('photoInputFile').addEventListener('change', e => { pkHandleFiles(e.target.files); e.target.value=''; });

document.getElementById('submitReportBtn').addEventListener('click', async () => {
  let plateInput = document.getElementById('plateInput').value.trim();
  const plate = plateInput.replace(/\s/g,'').toUpperCase();
  const area     = document.getElementById('locationArea').value;
  const bay      = document.getElementById('baySelect').value||'';
  const comment  = document.getElementById('pkComment').value.trim();

  if (!plate)      { showToast('Please enter a number plate', true); return; }
  if (!area)       { showToast('Please select a location', true); return; }
  if (!selectedVio){ showToast('Please select a violation type', true); return; }

  const btn = document.getElementById('submitReportBtn');
  btn.disabled = true; btn.textContent = 'Submitting…';

  if (role !== 'admin') {
    try {
      const todayStart = new Date(); todayStart.setHours(0,0,0,0);
      const { count } = await supabase.from('parking_reports').select('id', { count: 'exact', head: true }).eq('user_id', user.id).gte('created_at', todayStart.toISOString());
      if (count >= 5) { showToast('Daily report limit reached (max 5 per day)', true); btn.disabled=false; btn.textContent='🚨 Report Now'; return; }
    } catch(e) {}
  }

  let image_urls = [];
  let image_url = null;

  if (window._pkFiles.length > 0) {
    for (const file of window._pkFiles) {
      const fileExt = file.name.split('.').pop().toLowerCase();
      const safePlate = plate.replace(/[^A-Z0-9]/g, '') || 'unknown';
      const fileName = `parking_${Date.now()}_${safePlate}_${Math.random().toString(36).slice(2,6)}.${fileExt}`;
      const { error: uploadError } = await supabase.storage.from('parking-images').upload(fileName, file, { upsert: true });
      if (uploadError) { showToast('Image upload failed', true); btn.disabled=false; btn.textContent='🚨 Report Now'; return; }
      const { data: urlData } = supabase.storage.from('parking-images').getPublicUrl(fileName);
      image_urls.push(urlData.publicUrl);
    }
    image_url = image_urls[0];
  }

  try {
    const { data: prInserted } = await supabase.from('parking_reports').insert({ 
      plate, 
      location:bay||area, 
      violation:selectedVio, 
      comment, 
      image_url,
      image_urls,
      user_id: user.id,
      reported_by:user.id, 
      reporter_name:name, 
      status:'active' 
    }).select().single();
    
    document.getElementById('plateInput').value='';
    document.getElementById('locationArea').value='';
    document.getElementById('bayField').style.display='none';
    document.getElementById('pkComment').value='';
    document.getElementById('photoInputCamera').value = '';
    document.getElementById('photoInputFile').value = '';
    window._pkFiles = [];
    document.getElementById('pkPhotoPreviewGrid').innerHTML = '';
    document.getElementById('pkPhotoCount').style.display = 'none';
    document.querySelectorAll('.vio-btn').forEach(b=>b.classList.remove('active'));
    selectedVio=null;
    btn.disabled=false; btn.textContent='🚨 Report Now';
    pkUpdateButtons();
    
    await logActivity('PARKING_REPORTED', prInserted?.id || null);

    // 🔔 자동 이메일 발송: 내부 차량(vehicles 매칭됨)일 때 해당되는 모든 유닛에 경고 발송
    // 다중 유닛 소유자는 같은 이메일 1통만 받도록 units 배열로 한 번에 전달
    try {
      const { data: vehicles } = await supabase.rpc('lookup_vehicle_plates');
      const matchedUnits = (vehicles || [])
        .filter(v => v?.plate && v.plate.replace(/\s/g,'').toUpperCase() === plate)
        .map(v => v.unit)
        .filter((unit, idx, arr) => unit && arr.indexOf(unit) === idx);

      if (matchedUnits.length > 0) {
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-AU', { day:'numeric', month:'long', year:'numeric' });
        const timeStr = now.toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit' });

        // 모든 매칭 유닛 한 번에 전달 - Edge Function이 이메일 중복 제거 후 1통만 발송
        supabase.functions.invoke('email-parking-notice', {
          body: {
            units: matchedUnits,
            plate: plate,
            violation: selectedVio || 'Parking violation',
            location: bay || area || '',
            date: dateStr,
            time: timeStr
          }
        }).catch(err => console.warn('Auto email failed:', err));
      }
    } catch (emailErr) {
      console.warn('Email lookup failed:', emailErr);
    }

    try {
      const cooldownMins = 15;
      const cutoff = new Date(Date.now() - cooldownMins * 60 * 1000).toISOString();
      const { data: recentReports } = await supabase
        .from('parking_reports')
        .select('id')
        .eq('plate', plate)
        .gte('created_at', cutoff)
        .neq('id', prInserted.id);

      if (!recentReports || recentReports.length === 0) {
        const { data: { session: pushSession } } = await supabase.auth.getSession();
        await fetch('/api/send-push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${pushSession.access_token}` },
          body: JSON.stringify({
            title: '🚨 Unauthorised Parking Reported',
            message: `Plate: ${plate} — ${bay||area}`,
            url: '/pages/parking.html'
          })
        });
      }
    } catch(pushErr) {}

    showToast('Report submitted! All residents have been notified 🚨');
    if (confirm('Print warning notice for this vehicle?')) {
      let repeatN = 1;
      try {
        const { count: totalCount } = await supabase.from('parking_reports').select('id', { count: 'exact', head: true }).eq('plate', plate);
        repeatN = totalCount || 1;
      } catch(e) {}
      generateWarningPDF(plate, selectedVio, bay||area, null, null, repeatN);
    }
    await loadReports();
  } catch(e) { showToast(e.message||'Failed to submit', true); btn.disabled=false; btn.textContent='🚨 Report Now'; }
});

function ordinalOffence(n) {
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  const suf = (s[(v-20)%10] || s[v] || s[0]).toUpperCase();
  return n + suf + ' OFFENCE';
}

window.generateWarningPDF = function(plate, violation, location, createdAt, photoUrl, repeatCount) {
  const when = createdAt ? new Date(createdAt) : new Date();
  const dateStr = when.toLocaleDateString('en-AU', { day:'numeric', month:'long', year:'numeric' });
  const timeStr = when.toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit' });
  const vioLabel = VIO_LABELS[violation] || violation || 'Parking violation';
  const repeatN = parseInt(repeatCount) || 1;
  const timeSlot = repeatN >= 2
    ? `<text x="450" y="304" font-size="26" font-weight="900" fill="#e8000d">${ordinalOffence(repeatN)}</text>`
    : `<text x="450" y="304" font-size="28" font-weight="900" fill="#555">TIME</text><text x="546" y="304" font-size="32" font-weight="700" fill="#111">${timeStr}</text>`;

  let existing = document.getElementById('warningModal');
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'warningModal';
  modal.dataset.plate = plate;
  modal.dataset.vio = vioLabel;
  modal.dataset.loc = location || '—';
  modal.dataset.date = dateStr;
  modal.dataset.time = timeStr;

let plateSearchTerm = '';
window.onPlateSearch = function() {
  plateSearchTerm = document.getElementById('plateSearchInput').value.trim();
  loadReports();
};

async function loadReports() {
  let query = supabase.from('parking_reports').select('*').order('created_at',{ascending:false});
  if (currentFilter==='active')   query = query.eq('status','active');
  else if (currentFilter==='resolved') query = query.eq('status','resolved');
  
  const { data: reportsData } = await query;
  let reports = reportsData || [];
  if (plateSearchTerm) {
    reports = reports.filter(r => (r.plate||'').replace(/\s/g,'').toUpperCase().includes(plateSearchTerm));
  }

  const { data: activeData } = await supabase.from('parking_reports').select('id').eq('status','active');
  const activeCount = activeData?.length||0;
  document.getElementById('activeCount').textContent = activeCount > 0 ? `${activeCount} active` : '';

  let vehicleMap = {};
  try {
    const { data: vehicles } = await supabase
      .rpc('lookup_vehicle_plates');
    (vehicles || []).forEach(v => {
      if (!v?.plate) return;
      const normalized = v.plate.replace(/\s/g,'').toUpperCase();
      vehicleMap[normalized] = v;
    });
  } catch(e) {
    console.warn('Vehicle matching failed, continuing without owner info');
    vehicleMap = {};
  }

  const { data: allPlatesData } = await supabase.from('parking_reports').select('id,plate,created_at').order('created_at', {ascending: true});
  const offenderMap = {};      // plate -> total count
  const occurrenceMap = {};    // report id -> which occurrence number (1st, 2nd, 3rd...) this report was
  const runningCount = {};
  (allPlatesData || []).forEach(r => {
    if (!r.plate) return;
    const key = r.plate.replace(/\s/g,'').toUpperCase();
    runningCount[key] = (runningCount[key] || 0) + 1;
    occurrenceMap[r.id] = runningCount[key];
    offenderMap[key] = runningCount[key];
  });

  const searchResultBox = document.getElementById('plateSearchResult');
  if (plateSearchTerm) {
    const total = offenderMap[plateSearchTerm] || 0;
    const matchedVehicle = vehicleMap[plateSearchTerm];
    const ownershipHtml = matchedVehicle
      ? `<div style="margin-bottom:6px"><span style="font-size:12px;padding:2px 8px;border-radius:6px;background:#e0f2fe;color:#0369a1;font-weight:700">🏢 Building vehicle — Suite ${matchedVehicle.unit||'—'}</span></div>`
      : `<div style="margin-bottom:6px"><span style="font-size:12px;padding:2px 8px;border-radius:6px;background:#fef3c7;color:#92400e;font-weight:700">⚠️ Not a registered building vehicle</span></div>`;
    searchResultBox.style.display = 'block';
    searchResultBox.innerHTML = ownershipHtml + (total > 0
      ? `<strong>${plateSearchTerm}</strong> — ${total} violation${total>1?'s':''} on file${total>=2?` <span style="color:#e8000d;font-weight:700">(currently ${ordinalOffence(total)})</span>`:''}`
      : `<strong>${plateSearchTerm}</strong> — no violations on file`);
  } else {
    searchResultBox.style.display = 'none';
  }

  const list = document.getElementById('reportsList');
  if (!reports.length) {
    list.innerHTML = `<div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">No reports found</div>`;
    return;
  }

  list.innerHTML = reports.map(r => {
    const isResolved = r.status==='resolved';
    
    let timeAgo = '—';
    let absTime = '—';
    try {
      if (r.created_at) {
        const created = new Date(r.created_at);
        const diff = Date.now() - created.getTime();
        const mins = Math.floor(diff/60000);
        const hrs = Math.floor(mins/60);
        const days = Math.floor(hrs/24);
        timeAgo = mins<1 ? 'Just now' : mins<60 ? `${mins}m ago` : hrs<24 ? `${hrs}h ago` : `${days}d ago`;
        absTime = created.toLocaleString('en-AU', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
      }
    } catch(e) {}

    const normPlate = (r.plate || '').replace(/\s/g,'').toUpperCase();
    const vehicle = vehicleMap[normPlate];

    const isInternal = !!vehicle;
    const isExternal = !vehicle;
    const suite = vehicle?.unit || '';
    const occurrenceN = occurrenceMap[r.id] || 1;
    const isRepeat = occurrenceN >= 2;

    const tagInternal = isInternal ? `<span style="font-size:13px;padding:3px 9px;border-radius:6px;background:#e0f2fe;color:#0369a1;font-weight:600">🏢 Suite ${suite}</span>` : '';
    const tagExternal = isExternal ? `<span style="font-size:13px;padding:3px 9px;border-radius:6px;background:#fef3c7;color:#92400e;font-weight:600">⚠️ External</span>` : '';
    const repeatLabel = isRepeat ? `<span style="font-size:14px;font-weight:800;color:${isResolved?'#7f1d1d':'#e8000d'};letter-spacing:0.02em">${ordinalOffence(occurrenceN)}</span>` : '';

    const allImages = r.image_urls && r.image_urls.length ? r.image_urls : (r.image_url ? [r.image_url] : []);
    const imageFiles = allImages.filter(url => !url.toLowerCase().endsWith('.pdf'));
    const pdfFiles = allImages.filter(url => url.toLowerCase().endsWith('.pdf'));
    const imagesHtml = imageFiles.length ? `<div class="pk-images">${imageFiles.map(url => `<img src="${url}" class="pk-image" onclick="showImage('${url}')">`).join('')}</div>` : '';
    const pdfsHtml = pdfFiles.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0">${pdfFiles.map(url => { const fname = decodeURIComponent(url.split('/').pop()); return `<div onclick="showImage('${url}')" style="display:inline-flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.15s" onmouseover="this.style.borderColor='var(--blue-400)'" onmouseout="this.style.borderColor='var(--border)'"><span style="font-size:20px">📄</span><span style="font-size:12px;font-weight:600;color:var(--blue-600)">${fname.length>25?fname.slice(0,22)+'...':fname}</span></div>`; }).join('')}</div>` : '';

    return `
      <div class="parking-card ${isResolved?'resolved':''}" id="pk-${r.id}" style="${isRepeat?(isResolved?'border-left:4px solid #7f1d1d':'border-left:4px solid #e8000d'):''}">
        <div class="pk-header ${isResolved?'resolved':''}" onclick="togglePk('${r.id}')">
          <div class="pk-header-left">
            <span class="pk-plate ${isResolved?'resolved':''}">${r.plate || '—'}</span>
            ${repeatLabel}
            <div class="pk-info">
              <span style="${isResolved?'color:#57534e':''}">📍 ${r.location || '—'}</span>
              <span class="badge ${isResolved?'badge-green':'badge-red'}" style="font-size:13px;padding:3px 9px;${isResolved?'background:#dcfce7;color:#166534;opacity:1;font-weight:700':''}">${isResolved?'✓ Resolved':VIO_LABELS[r.violation]||r.violation||'—'}</span>
              ${tagInternal}${tagExternal}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="pk-time ${isResolved?'resolved':''}">${timeAgo} · ${absTime}</div>
            <span class="pk-chevron" id="chev-${r.id}">▼</span>
          </div>
        </div>
        <div class="pk-body" id="body-${r.id}">
          <div class="pk-location">📍 ${r.location || '—'}</div>
          <div class="pk-violation"><span class="badge ${isResolved?'badge-green':'badge-red'}" style="font-size:15px;padding:6px 16px;${isResolved?'background:#dcfce7;color:#166534;opacity:1;font-weight:700':''}">${isResolved?'✓ Resolved':VIO_LABELS[r.violation]||r.violation||'—'}</span></div>
          <div class="pk-reporter">${role==='admin' ? `Reported by ${r.reporter_name||'Unknown'} · ` : ''}${absTime}</div>
          ${imagesHtml}
          ${pdfsHtml}
          ${r.comment?`<div class="pk-comment">"${r.comment}"</div>`:''}
          <div class="pk-actions">
            ${!isResolved?`<button data-plate="${r.plate||''}" data-vio="${r.violation||''}" data-loc="${r.location||''}" data-date="${r.created_at||''}" data-photo="${(r.image_urls&&r.image_urls.filter(u=>!u.endsWith('.pdf'))[0])||r.image_url||''}" data-count="${occurrenceN}" onclick="generateWarningPDF(this.dataset.plate,this.dataset.vio,this.dataset.loc,this.dataset.date,this.dataset.photo,this.dataset.count)" style="padding:7px 14px;border:1px solid var(--blue-600);border-radius:8px;background:var(--blue-50);color:var(--blue-700);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif">🖨️ Warning Notice</button>`:''}
            ${role==='admin'?`<button onclick="openEditReport('${r.id}')" style="padding:7px 14px;border:1px solid var(--amber-600,#854f0b);border-radius:8px;background:var(--amber-50,#faeeda);color:var(--amber-800,#633806);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif">✏️ Edit</button>`:''}
            ${!isResolved&&role==='admin'?`<button class="btn-success" onclick="resolveReport('${r.id}')">✓ Mark Resolved</button>`:''}
            ${role==='admin'?`<button class="btn-danger" onclick="deleteReport('${r.id}')">Delete</button>`:''}
            ${isResolved?`<span style="font-size:12px;color:#57534e">Resolved ${timeAgo}</span>`:''}
          </div>
        </div>
      </div>`;
  }).join('');
}

await loadReports();
</script>
</body>
</html>
