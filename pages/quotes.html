<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Approvals – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="sidebarPlaceholder"></div>

<main class="main">
  <div id="topbarPlaceholder"></div>
  
  <div class="content">
    
    <!-- Section Header -->
    <div class="section-hdr">
      <div class="section-title">Quote Approvals</div>
      <button class="btn-primary" id="btnAddQuote" style="display:none" onclick="openAddQuote()">+ Add Quote</button>
    </div>

    <!-- Quotes List -->
    <div id="quotesList">
      <div style="padding:40px;text-align:center;color:var(--muted)">Loading quotes...</div>
    </div>

  </div>
</main>

<!-- Add Quote Modal -->
<div class="modal-backdrop" id="addQuoteModal">
  <div class="modal-box">
    <div class="modal-title">Add Quote</div>
    
    <div class="modal-field">
      <label class="modal-label">Project Name *</label>
      <input type="text" class="modal-input" id="quoteProject" placeholder="e.g., HVAC Maintenance">
    </div>

    <div class="modal-field">
      <label class="modal-label">Vendor *</label>
      <input type="text" class="modal-input" id="quoteVendor" placeholder="Company name">
    </div>

    <div class="modal-field">
      <label class="modal-label">Category *</label>
      <select class="modal-select" id="quoteCategory">
        <option value="">Select category</option>
        <option value="HVAC">HVAC</option>
        <option value="Fire">Fire</option>
        <option value="Electrical">Electrical</option>
        <option value="Security">Security</option>
        <option value="Plumbing">Plumbing</option>
        <option value="Lift">Lift</option>
        <option value="Legal">Legal</option>
        <option value="General">General</option>
      </select>
    </div>

    <div class="modal-field">
      <label class="modal-label">Amount (Ex GST) *</label>
      <input type="number" class="modal-input" id="quoteAmount" placeholder="0.00" step="0.01" min="0">
    </div>

    <div class="modal-field">
      <label class="modal-label">Description</label>
      <textarea class="modal-textarea" id="quoteNotes" placeholder="Quote details..."></textarea>
    </div>

    <div class="modal-field">
      <label class="modal-label">Internal Notes (Private)</label>
      <textarea class="modal-textarea" id="quoteInternalNote" placeholder="Private notes..."></textarea>
      <div class="private-hint">⚠️ This field is NOT visible to residents</div>
    </div>

    <div class="modal-field">
      <label class="modal-label">Attachments</label>
      <input type="file" id="quoteFiles" multiple>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('addQuoteModal')">Cancel</button>
      <button class="btn-primary" onclick="saveQuote()">Save Quote</button>
    </div>
  </div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:14px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,0.3)"></div>

<script type="module">
import { initLayout } from '/js/layout.js';

// 🔥 STEP 1 — layout.js 통합
const ctx = await initLayout();
if (!ctx) {
  window.location.href = '/index.html';
  throw new Error('Layout initialization failed');
}

const { supabase, user, role, permissions } = ctx;

// 🔥 STEP 2 — 전역 변수
let allQuotes = [];

// 🔥 STEP 3 — 권한 기반 버튼 제어
function initPermissions() {
  const canApprove = window.checkActionPermission('approve', permissions, role);
  
  // Add Quote 버튼 (admin만)
  if (role === 'admin') {
    document.getElementById('btnAddQuote').style.display = '';
  }
  
  window.canApprove = canApprove;
  window.canDecline = window.checkActionPermission('decline', permissions, role);
  window.canForceApprove = window.checkActionPermission('force_approve', permissions, role);
}

// 🔥 STEP 4 — parseComment (category 제거)
function parseComment(comment) {
  try {
    if (!comment) return { note: '', files: [], priority: 'Normal' };
    const obj = typeof comment === 'string' ? JSON.parse(comment) : comment;
    let files = [];
    if (Array.isArray(obj?.files)) files = obj.files.filter(f => f && f.path);
    
    // 🔥 챗이사 최종: category 제거
    return {
      note: obj?.note || '',
      files,
      priority: obj?.priority || 'Normal'
    };
  } catch {
    return { note: '', files: [], priority: 'Normal' };
  }
}

// 🔥 STEP 5 — Quotes 로드
async function loadQuotes() {
  try {
    const { data } = await supabase
      .from('quotes')
      .select('*')
      .order('created_at', { ascending: false });
    
    allQuotes = data || [];
    renderQuotes(allQuotes);
  } catch(e) {
    console.error('Failed to load quotes:', e);
    document.getElementById('quotesList').innerHTML = 
      '<div style="padding:40px;text-align:center;color:var(--red)">Failed to load quotes</div>';
  }
}

// 🔥 STEP 6 — Quotes 렌더링 (category 단일 소스)
function renderQuotes(quotes) {
  const list = document.getElementById('quotesList');
  
  if (quotes.length === 0) {
    list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">No quotes yet</div>';
    return;
  }
  
  // 승인되지 않은 것만 표시
  const activeQuotes = quotes.filter(q => q.status !== 'approved');
  
  list.innerHTML = activeQuotes.map(q => {
    // 🔥 챗이사 최종: category NULL = 에러 상태
    const hasCategory = !!q.category;
    const hasAmount = !!(q.amount && q.amount > 0);
    const canApproveQuote = hasCategory && hasAmount;
    
    const categoryDisplay = hasCategory 
      ? q.category 
      : '<span style="color:var(--red);font-weight:600">⚠️ Missing Category</span>';
    
    const statusBadge = {
      pending: 'badge-yellow',
      approved: 'badge-green',
      declined: 'badge-gray',
      onhold: 'badge-blue'
    }[q.status] || 'badge-gray';
    
    const statusLabel = {
      pending: 'Pending',
      approved: 'Approved',
      declined: 'Declined',
      onhold: 'On Hold'
    }[q.status] || 'Unknown';
    
    return `
      <div class="quote-card">
        <div class="quote-header" onclick="toggleQuote('${q.id}')">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div>
              <div style="font-size:16px;font-weight:600">${q.project_name}</div>
              <div style="font-size:13px;color:var(--muted);margin-top:4px">
                ${q.vendor} · ${categoryDisplay}
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-size:20px;font-weight:600;color:var(--blue-600)">
                $${(q.amount || 0).toFixed(2)}
              </div>
              <span class="badge ${statusBadge}" style="margin-top:6px">${statusLabel}</span>
            </div>
          </div>
        </div>
        
        <div class="quote-body" id="quote-${q.id}">
          <div style="padding:20px;background:var(--bg)">
            
            ${q.notes ? `
              <div style="margin-bottom:16px">
                <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">DESCRIPTION</div>
                <div style="font-size:13px;line-height:1.6">${q.notes}</div>
              </div>
            ` : ''}
            
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px">
              <div>
                <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">DETAILS</div>
                <div style="font-size:12px;line-height:1.8">
                  <div><strong>Vendor:</strong> ${q.vendor}</div>
                  <div><strong>Category:</strong> ${categoryDisplay}</div>
                  <div><strong>Amount:</strong> $${(q.amount || 0).toFixed(2)}</div>
                </div>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">STATUS</div>
                <div style="font-size:12px;line-height:1.8">
                  <div><strong>Status:</strong> ${statusLabel}</div>
                  <div><strong>Created:</strong> ${new Date(q.created_at).toLocaleDateString('en-AU')}</div>
                </div>
              </div>
            </div>
            
            ${!canApproveQuote && q.status === 'pending' ? `
              <div style="background:var(--red-bg);border:1px solid #fecaca;border-radius:10px;padding:12px;margin-bottom:16px">
                <div style="font-size:12px;color:var(--red-text);font-weight:600">
                  ⚠️ Cannot approve: ${!hasCategory ? 'Missing category' : 'Invalid amount'}
                </div>
              </div>
            ` : ''}
            
            <div style="display:flex;gap:8px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap">
              ${q.status === 'pending' && canApproveQuote && window.canApprove ? `
                <button class="btn-primary" onclick="approveQuote('${q.id}',event)">✓ Approve</button>
              ` : ''}
              ${q.status === 'pending' && window.canDecline ? `
                <button class="btn-secondary" onclick="declineQuote('${q.id}',event)">✕ Decline</button>
              ` : ''}
              ${q.status === 'pending' && canApproveQuote && window.canForceApprove ? `
                <button class="btn-secondary" onclick="forceApprove('${q.id}',event)">⚡ Force Approve</button>
              ` : ''}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// 🔥 STEP 7 — Quote 토글
window.toggleQuote = (id) => {
  const body = document.getElementById(`quote-${id}`);
  if (!body) return;
  
  const isOpen = body.classList.contains('open');
  
  // 다른 모든 quote 닫기
  document.querySelectorAll('.quote-body').forEach(b => b.classList.remove('open'));
  
  // 현재 quote 토글
  if (!isOpen) {
    body.classList.add('open');
  }
};

// 🔥 STEP 8 — Add Quote Modal
window.openAddQuote = () => {
  document.getElementById('quoteProject').value = '';
  document.getElementById('quoteVendor').value = '';
  document.getElementById('quoteCategory').value = '';
  document.getElementById('quoteAmount').value = '';
  document.getElementById('quoteNotes').value = '';
  document.getElementById('quoteInternalNote').value = '';
  document.getElementById('quoteFiles').value = '';
  window.openModal('addQuoteModal');
};

// 🔥 STEP 9 — Save Quote (validation 강화)
window.saveQuote = async () => {
  const projectName = document.getElementById('quoteProject').value.trim();
  const vendor = document.getElementById('quoteVendor').value.trim();
  const category = document.getElementById('quoteCategory').value;
  const amountInput = document.getElementById('quoteAmount').value;
  const notes = document.getElementById('quoteNotes').value.trim();
  const internalNote = document.getElementById('quoteInternalNote').value.trim();
  
  // 🔥 챗이사 최종: 필수 필드 검증
  if (!projectName) {
    window.showToast('Please enter project name', true);
    return;
  }
  
  if (!vendor) {
    window.showToast('Please enter vendor', true);
    return;
  }
  
  // 🔥 챗이사 최종: category 필수
  if (!category) {
    window.showToast('Please select category', true);
    return;
  }
  
  // 🔥 챗이사 최종: amount validation 강화
  const amount = parseFloat(amountInput);
  if (isNaN(amount) || amount <= 0) {
    window.showToast('Please enter valid amount (greater than 0)', true);
    return;
  }
  
  // 🔥 DEBUG: category 값 확인
  console.log('=== SAVE QUOTE DEBUG ===');
  console.log('category input value:', category);
  console.log('project_name:', projectName);
  console.log('vendor:', vendor);
  console.log('amount:', amount);
  
  // 🔥 챗이사 최종: comment는 note만 저장 (category 제거)
  const comment = {
    note: internalNote,
    files: [],
    priority: 'Normal'
  };
  
  const quoteData = {
    project_name: projectName,
    vendor: vendor,
    category: category,  // 🔥 반드시 포함
    amount: amount,
    notes: notes,
    comment: JSON.stringify(comment),
    status: 'pending'
    // 🔥 created_at 제거: DB default(now()) 사용
  };
  
  // 🔥 DEBUG: INSERT 데이터 확인
  console.log('INSERT data:', quoteData);
  
  try {
    // 🔥 챗이사 최종: 배열로 전달 (Supabase v2)
    const { data, error } = await supabase.from('quotes').insert([quoteData]);
    
    if (error) {
      console.error('❌ INSERT ERROR:');
      console.error('error.message:', error.message);
      console.error('error.details:', error.details);
      console.error('error.hint:', error.hint);
      console.error('error.code:', error.code);
      console.error('Full error:', JSON.stringify(error, null, 2));
      throw error;
    }
    
    console.log('✅ INSERT SUCCESS:', data);
    
    window.closeModal('addQuoteModal');
    window.showToast('Quote created');
    await loadQuotes();
  } catch(e) {
    console.error('Failed to save quote:', e);
    console.error('Exception message:', e.message);
    window.showToast('Failed to save: ' + e.message, true);
  }
};

// 🔥 STEP 10 — Approve Quote
window.approveQuote = async (id, e) => {
  if (e) e.stopPropagation();
  
  if (!confirm('Approve this quote and move to Ongoing Works?')) return;
  
  try {
    // STEP 1: Update status
    await supabase.from('quotes').update({ status: 'approved' }).eq('id', id);
    
    // STEP 2: Sync to Works
    await syncQuoteToWorks(id);
    
    window.showToast('Quote approved and moved to Ongoing Works');
    await loadQuotes();
  } catch(e) {
    console.error('Approve failed:', e);
    window.showToast('Approve failed: ' + e.message, true);
  }
};

// 🔥 STEP 11 — Decline Quote
window.declineQuote = async (id, e) => {
  if (e) e.stopPropagation();
  
  if (!confirm('Decline this quote?')) return;
  
  try {
    await supabase.from('quotes').update({ status: 'declined' }).eq('id', id);
    window.showToast('Quote declined');
    await loadQuotes();
  } catch(e) {
    console.error('Decline failed:', e);
    window.showToast('Decline failed: ' + e.message, true);
  }
};

// 🔥 STEP 12 — Force Approve
window.forceApprove = async (id, e) => {
  if (e) e.stopPropagation();
  
  if (!confirm('Force approve this quote?')) return;
  
  try {
    await supabase.from('quotes').update({ status: 'approved' }).eq('id', id);
    await syncQuoteToWorks(id);
    window.showToast('Quote force-approved and moved to Ongoing Works');
    await loadQuotes();
  } catch(e) {
    console.error('Force approve failed:', e);
    window.showToast('Force approve failed: ' + e.message, true);
  }
};

// 🔥 STEP 13 — syncQuoteToWorks (100% 데이터 일치 + contractor 구조 명확화)
async function syncQuoteToWorks(quoteId) {
  try {
    // STEP 1: 중복 체크
    const { data: existing } = await supabase
      .from('works')
      .select('id')
      .eq('quote_id', quoteId)
      .maybeSingle();
    
    if (existing) {
      console.log('Work already exists for quote', quoteId);
      return;
    }
    
    // STEP 2: Quote 데이터 가져오기
    const { data: q, error: fetchError } = await supabase
      .from('quotes')
      .select('*')
      .eq('id', quoteId)
      .maybeSingle();
    
    if (fetchError || !q) {
      console.error('Quote not found:', fetchError);
      throw new Error('Quote not found');
    }
    
    // 🔥 챗이사 최종: 필수 필드 검증 강화
    if (!q.category) {
      throw new Error('Quote missing category - cannot create work');
    }
    
    if (!q.amount || q.amount <= 0) {
      throw new Error('Quote missing valid amount - cannot create work');
    }
    
    if (!q.project_name) {
      throw new Error('Quote missing project name - cannot create work');
    }
    
    // 🔥 챗이사 최종: contractor 구조 명확화
    // Quote 단계: vendor (회사 이름)
    // Work 단계: contractor_id (contractors 테이블 FK)
    // 
    // vendor → contractor_id 매칭 (없으면 NULL)
    let contractorId = null;
    
    if (q.vendor) {
      const { data: contractor } = await supabase
        .from('contractors')
        .select('id')
        .ilike('name', q.vendor)
        .maybeSingle();
      
      contractorId = contractor?.id || null;
    }
    
    // STEP 3: Works 생성
    const workData = {
      quote_id: quoteId,
      project_name: q.project_name,
      contractor_id: contractorId,  // 🔥 vendor → contractor_id 매칭
      category: q.category,          // 단일 소스
      cost: q.amount,                // 단일 소스
      description: q.notes || '',
      status: 'scheduled',
      is_emergency: false
    };
    
    const { error: insertError } = await supabase.from('works').insert(workData);
    
    if (insertError) {
      console.error('Failed to insert work:', insertError);
      throw insertError;
    }
    
    console.log('Successfully moved to Ongoing Works (contractor_id:', contractorId, ')');
    
  } catch(e) {
    console.error('syncQuoteToWorks failed:', e);
    throw e;
  }
}

// 🔥 STEP 14 — Initialize
initPermissions();
await loadQuotes();

</script>
</body>
</html>
