<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotes – Phase 2</title>
<link rel="stylesheet" href="/css/style.css">

<style>
.project-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:18px}
.project-title{font-weight:600;font-size:16px;margin-bottom:12px}
.vendor-row{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.btn{padding:6px 12px;border-radius:8px;border:none;cursor:pointer}
.btn-green{background:#22c55e;color:#fff}
.btn-yellow{background:#f59e0b;color:#fff}
.btn-red{background:#ef4444;color:#fff}
.selected{color:#16a34a;font-weight:600}
.vote-box{margin-top:8px;font-size:13px;color:#475569}
</style>
</head>

<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
<div id="topbarPlaceholder"></div>

<div class="content">
<button id="createProjectBtn" class="btn btn-green" onclick="openCreate()">Create Project</button>
<div id="list"></div>
</div>
</div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
const { supabase, user } = ctx;

let allQuotes = [];
let allVotes = [];

async function loadData(){
  const [q,v] = await Promise.all([
    supabase.from('quotes').select('*').order('created_at',{ascending:false}),
    supabase.from('votes').select('*')
  ]);
  allQuotes = q.data || [];
  allVotes = v.data || [];
}

function group(){
  const map = {};
  allQuotes.forEach(q=>{
    const key = q.project_title || 'No Project';
    if(!map[key]) map[key]=[];
    map[key].push(q);
  });
  return map;
}

function getVotes(id){
  return allVotes.filter(v=>v.quote_id===id);
}

async function selectVendor(id){
  const q = allQuotes.find(x=>x.id===id);

  await supabase.from('quotes').update({is_selected:false}).eq('project_title', q.project_title);
  await supabase.from('quotes').update({is_selected:true}).eq('id', id);

  await loadData();
  render();
}

async function vote(id,type){
  const exists = allVotes.find(v=>v.quote_id===id && v.user_email===user.email);
  if(exists) return alert('already voted');

  await supabase.from('votes').insert({
    quote_id:id,
    user_email:user.email,
    vote:type
  });

  await loadData();
  render();
}

function render(){
  const container = document.getElementById('list');
  const groups = group();

  let html = '';

  Object.entries(groups).forEach(([project, list])=>{

    html += `<div class="project-card">`;
    html += `<div class="project-title">📁 ${project}</div>`;

    list.forEach(q=>{
      html += `
      <div class="vendor-row">
        <div>${q.vendor} | $${q.amount}</div>
        <div>
          ${q.is_selected
            ? '<span class="selected">✔ Selected</span>'
            : `<button class="btn btn-green" onclick="selectVendor('${q.id}')">Select</button>`
          }
        </div>
      </div>

      <div>
        <button class="btn btn-green" onclick="vote('${q.id}','approve')">Approve</button>
        <button class="btn btn-yellow" onclick="vote('${q.id}','hold')">Hold</button>
        <button class="btn btn-red" onclick="vote('${q.id}','decline')">Decline</button>
      </div>

      <div class="vote-box">
        ${getVotes(q.id).map(v=>`${v.user_email}: ${v.vote}`).join('<br>')}
      </div>
      `;
    });

    const selected = list.find(q=>q.is_selected);
    if(selected){
      html += `<div class="vote-box">✔ ${selected.vendor} selected</div>`;
    }

    html += `</div>`;
  });

  container.innerHTML = html;
}

function openCreate(){
  const name = prompt('Project Name');
  if(!name) return;

  const vendor = prompt('Vendor');
  const amount = prompt('Amount');

  supabase.from('quotes').insert({
    project_title:name,
    project:name,
    vendor:vendor,
    amount:amount,
    status:'pending'
  }).then(async ()=>{
    await loadData();
    render();
  });
}

window.selectVendor = selectVendor;
window.vote = vote;

await loadData();
render();
</script>

</body>
</html>
