<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotes UX Final</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.project{border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:20px}
.item{padding:10px;border:1px solid #ccc;margin:6px 0;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between}
.item.selected{border:2px solid #10b981;background:#ecfdf5}
.check{font-size:20px;color:#10b981;margin-left:10px}
.section{margin-top:12px}
button{padding:8px 14px;border-radius:8px;border:none;margin-right:6px;cursor:pointer}
.approve{background:#10b981;color:#fff}
.hold{background:#f59e0b;color:#fff}
.decline{background:#ef4444;color:#fff}
</style>
</head>
<body>

<div id="app"></div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error("Layout failed");

const { supabase, user } = ctx;

let quotes = [];
let votes = [];
let selectedQuoteId = null;

async function load(){
  const q = await supabase.from('quotes').select('*');
  const v = await supabase.from('votes').select('*');
  quotes = q.data || [];
  votes = v.data || [];
}

function group(){
  const map = {};
  quotes.forEach(q=>{
    if(q.status === 'approved' || q.status === 'declined') return;
    const k = q.project_id || q.id;
    if(!map[k]) map[k]=[];
    map[k].push(q);
  });
  return map;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML='';

  const projects = group();

  Object.values(projects).forEach(list=>{
    const p = list[0];
    const div = document.createElement('div');
    div.className='project';

    let html = `<h3>📁 ${p.project_title || p.project}</h3>`;

    list.forEach((q,i)=>{
      html += `
      <div class="item ${selectedQuoteId===q.id?'selected':''}" onclick="select('${q.id}')">
        <div>${i+1}. ${q.vendor}</div>
        <div>$${Number(q.amount||0).toLocaleString('en-AU')}
          ${selectedQuoteId===q.id?'<span class="check">✔</span>':''}
        </div>
      </div>`;
    });

    html += `
    <div class="section">
      <button class="approve" onclick="vote('approve')">Approve</button>
      <button class="hold" onclick="vote('hold')">Hold</button>
      <button class="decline" onclick="vote('decline')">Decline</button>
    </div>

    <div class="section">
      <input id="c-${p.project_id}" placeholder="comment">
      <button onclick="addComment('${p.project_id}')">Add</button>
      <div id="cl-${p.project_id}"></div>
    </div>

    <div class="section">
      <b>Voting Status</b><br>
      ${votes.map(v=>{
        const q = quotes.find(x=>x.id===v.quote_id);
        return q ? `${v.user_email}: ${q.vendor} → ${v.vote}<br>`:'';
      }).join('')}
    </div>
    `;

    div.innerHTML = html;
    app.appendChild(div);
  });
}

window.select = function(id){
  selectedQuoteId = id;
  render();
}

window.vote = async function(type){
  if(!selectedQuoteId){ alert('Select quote'); return; }
  await supabase.from('votes').insert({
    quote_id:selectedQuoteId,
    user_email:user.email,
    vote:type
  });
  await load();
  render();
}

window.addComment = async function(pid){
  const input = document.getElementById('c-'+pid);
  const txt = input.value.trim();
  if(!txt) return;

  await supabase.from('project_comments').insert({
    project_id:pid,
    user_email:user.email,
    user_name:user.email,
    comment:txt
  });

  input.value='';
}

await load();
render();
</script>

</body>
</html>
