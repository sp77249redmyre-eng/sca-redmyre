<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Approvals – Redmyre House</title>
<link rel="stylesheet" href="/css/style.css">

<style>
.project-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
}
.project-header{
  font-weight:600;
  font-size:16px;
  margin-bottom:14px;
}
.vendor-row{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:14px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.vendor-left{
  display:flex;
  gap:10px;
  align-items:center;
}
.btn{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  cursor:pointer;
}
.btn-green{background:#22c55e;color:#fff;}
.btn-red{background:#ef4444;color:#fff;}
.selected{
  color:#16a34a;
  font-weight:600;
}
.result-box{
  margin-top:15px;
  padding:10px;
  background:#f1f5f9;
  border-radius:8px;
}
</style>
</head>
<body>

<div id="sidebarPlaceholder"></div>
<div class="main">
<div id="topbarPlaceholder"></div>

<div class="content">
<div id="projectList"></div>
</div>
</div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
const { supabase } = ctx;

let allQuotes = [];

async function loadData(){
  const { data } = await supabase.from('quotes').select('*');
  allQuotes = data || [];
}

function groupProjects(){
  const map = {};
  allQuotes.forEach(q=>{
    if(!map[q.project_id]) map[q.project_id]=[];
    map[q.project_id].push(q);
  });
  return map;
}

async function selectVendor(id){
  const q = allQuotes.find(x=>x.id===id);

  await supabase.from('quotes')
    .update({is_selected:false})
    .eq('project_id', q.project_id);

  await supabase.from('quotes')
    .update({is_selected:true})
    .eq('id', id);

  await loadData();
  render();
}

function render(){
  const container = document.getElementById('projectList');
  const groups = groupProjects();

  let html = '';

  Object.values(groups).forEach(group=>{
    const first = group[0];

    html += `<div class="project-card">`;
    html += `<div class="project-header">📁 ${first.project}</div>`;

    group.forEach(q=>{
      html += `
      <div class="vendor-row">
        <div class="vendor-left">
          <div>${q.vendor} | $${q.amount}</div>
        </div>
        <div>
          ${q.is_selected
            ? '<span class="selected">✔ Selected</span>'
            : `<button class="btn btn-green" onclick="selectVendor('${q.id}')">Select</button>`
          }
        </div>
      </div>
      `;
    });

    const selected = group.find(q=>q.is_selected);

    if(selected){
      html += `<div class="result-box">✔ ${selected.vendor} selected</div>`;
    }

    html += `</div>`;
  });

  container.innerHTML = html;
}

window.selectVendor = selectVendor;

await loadData();
render();
</script>

</body>
</html>
