<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Approvals – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
/* ===== QUOTES-SPECIFIC STYLES ===== */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-num{font-size:26px;font-weight:600;letter-spacing:-1px}
.stat-label{font-size:12px;color:var(--muted);margin-top:3px}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;margin-top:20px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.quote-table{width:100%;border-collapse:collapse}
.quote-table th{background:var(--surface);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;padding:12px 16px;text-align:left}
.quote-table td{padding:16px;border-top:1px solid var(--border-light);cursor:pointer}
.quote-table tr:hover{background:rgba(37,99,235,0.02)}
.priority-normal{color:var(--muted)}
.priority-high{color:#f59e0b}
.priority-urgent{color:#ef4444}
.amount-confidential{color:var(--muted);font-style:italic}
.quote-body{border-top:1px solid var(--border-light);padding:20px;display:none;background:var(--bg)}
.quote-body.open{display:block}
.detail-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px}
.vote-status-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin:14px 0}
.vote-row{display:flex;gap:12px;margin-bottom:8px;font-size:13px}
.vote-item{display:flex;align-items:center;gap:6px;flex:1}
.vote-icon{font-size:16px}
.files-list{margin-top:8px}
.file-preview{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:12px;margin-top:6px;cursor:pointer}
.file-icon{font-size:16px}
.file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-size{font-size:11px;color:var(--muted)}
.file-visibility{font-size:10px;padding:1px 6px;border-radius:999px;background:#e0f2fe;color:#0369a1}
.internal-note-box{background:var(--purple-bg);border:1px solid #c4b5fd;border-radius:10px;padding:12px;font-size:12px;color:var(--purple-text);margin-top:10px;line-height:1.6;font-style:italic}
.quote-footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.empty-state{text-align:center;padding:60px 24px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-title{font-size:16px;font-weight:600;color:var(--text-2);margin-bottom:8px}

/* ===== PILL BUTTON SYSTEM ===== */
.btn-pill {
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  transition: all 0.15s ease;
  cursor: pointer;
}
.btn-pill:hover {
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.btn-pill-primary {
  background: var(--blue-600);
  color: #fff;
  border-color: var(--blue-600);
}
.btn-pill-success {
  background: #16a34a;
  color: #fff;
  border-color: #16a34a;
}
.btn-pill-danger {
  background: #dc2626;
  color: #fff;
  border-color: #dc2626;
}
.btn-pill-warning {
  background: linear-gradient(135deg, #f59e0b, #f97316);
  color: #fff;
  border-color: #f59e0b;
}
.btn-pill-active {
  background: var(--blue-600);
  color: #fff;
  border-color: var(--blue-600);
}

/* File Upload Style */
.file-upload {
  margin: 16px 0;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.file-upload select, .file-upload button {
  margin-right: 8px;
}

@media (max-width: 768px) {
  .stats-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>

  <div class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div style="font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:8px">
        <span style="width:3px;height:14px;border-radius:2px;background:var(--blue-600);display:inline-block"></span>
        Quote Approvals
      </div>
      <button class="btn-pill btn-pill-primary" id="addQuoteBtn" style="display:none" onclick="openAddQuote()">+ Add Quote</button>
    </div>

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="statTotal" style="color:var(--blue-600)">—</div><div class="stat-label">Total</div></div>
      <div class="stat-card"><div class="stat-num" id="statPending" style="color:var(--yellow)">—</div><div class="stat-label">Pending</div></div>
      <div class="stat-card"><div class="stat-num" id="statDeclined" style="color:var(--red)">—</div><div class="stat-label">Declined</div></div>
      <div class="stat-card"><div class="stat-num" id="statHold" style="color:var(--purple)">—</div><div class="stat-label">On Hold</div></div>
    </div>

    <!-- RULE INFO -->
    <div class="rule-info" id="ruleInfo">
      Committee of 8 members · Approval: ≥5 Approve → Approved · ≥4 Decline → Declined · ≥3 Hold (and <5 Approve) → On Hold · Votes are final once cast
    </div>

    <!-- QUOTE LIST -->
    <div id="quoteList">
      <div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">Loading…</div>
    </div>
  </div>
</div>

<!-- ADD/EDIT QUOTE MODAL -->
<div class="modal-backdrop" id="quoteModal">
  <div class="modal-box" style="max-width:680px">
    <div class="modal-title" id="quoteModalTitle">Add Quote</div>
    <input type="hidden" id="quoteEditId">
    <div class="modal-field">
      <label class="modal-label">Project / Works Description</label>
      <input type="text" class="modal-input" id="quoteProject" placeholder="e.g., Lift modernization">
    </div>
    <div class="modal-field">
      <label class="modal-label">Vendor / Contractor</label>
      <input type="text" class="modal-input" id="quoteVendor" placeholder="Company name">
    </div>
    <div class="modal-field">
      <label class="modal-label">Amount (AUD) (ex GST)</label>
      <input type="text" class="modal-input" id="quoteAmount" placeholder="0.00" oninput="formatAmount(this)">
    </div>
    <div class="modal-field">
      <label class="modal-label">Category</label>
      <select class="modal-select" id="quoteCategory">
        <option value="General">General</option>
        <option value="HVAC">HVAC</option>
        <option value="Fire">Fire</option>
        <option value="Electrical">Electrical</option>
        <option value="Security">Security</option>
        <option value="Plumbing">Plumbing</option>
        <option value="Lift">Lift</option>
        <option value="Legal">Legal</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">Priority</label>
      <select class="modal-select" id="quotePriority">
        <option value="Normal">Normal</option>
        <option value="High">High</option>
        <option value="Urgent">Urgent</option>
      </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">Scope / Notes (Public)</label>
      <textarea class="modal-textarea" id="quoteNotes" placeholder="Brief description visible to voters…"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">🔒 Internal Notes (Admin / Committee / Observer)</label>
      <textarea class="modal-textarea" id="quoteInternalNote" placeholder="Private notes..." style="background:var(--purple-bg);border-color:#c4b5fd"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">📎 Attach Files</label>
      <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" style="display:none">
      <button class="btn-pill" onclick="document.getElementById('fileInput').click()">+ Choose Files</button>
      <div id="filePreview" style="margin-top:10px"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-pill" onclick="closeModal('quoteModal')">Cancel</button>
      <button class="btn-pill btn-pill-danger" id="deleteQuoteBtn" onclick="deleteQuote()" style="display:none">Delete</button>
      <button class="btn-pill btn-pill-primary" id="saveQuoteBtn" onclick="saveQuote()">Save →</button>
    </div>
  </div>
</div>

<!-- HOLD MODAL -->
<div class="modal-backdrop" id="holdModal">
  <div class="modal-box" style="max-width:480px">
    <div class="modal-title">Put Quote On Hold</div>
    <div class="modal-field">
      <label class="modal-label">Reason for Hold</label>
      <textarea class="modal-textarea" id="holdReason" placeholder="Why is this being put on hold?"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-pill" onclick="closeModal('holdModal')">Cancel</button>
      <button class="btn-pill btn-pill-warning" onclick="confirmHold()">Confirm Hold</button>
    </div>
  </div>
</div>

<!-- SCOPE EDIT MODAL -->
<div class="modal-backdrop" id="scopeModal">
  <div class="modal-box" style="max-width:540px">
    <div class="modal-title">Edit Scope / Notes</div>
    <input type="hidden" id="scopeEditId">
    <div class="modal-field">
      <label class="modal-label">Internal Note</label>
      <textarea class="modal-textarea" id="scopeText" placeholder="Add or update notes…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-pill" onclick="closeModal('scopeModal')">Cancel</button>
      <button class="btn-pill btn-pill-primary" onclick="saveScope()">Save</button>
    </div>
  </div>
</div>

<!-- PDF VIEWER MODAL -->
<div class="modal-backdrop" id="pdfModal">
  <div class="modal-box" style="max-width:1200px;width:95%;padding:20px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div style="font-size:14px;font-weight:600;color:var(--text)" id="pdfModalTitle">Document</div>
      <button class="btn-pill" onclick="closeModal('pdfModal')" style="font-size:12px;padding:6px 12px">✕ Close</button>
    </div>
    <div id="pdfViewerWrap" style="width:100%;height:70vh;border-radius:10px;overflow:hidden;background:var(--bg)">
      <iframe id="pdfIframe" src="" style="width:100%;height:100%;border:none;border-radius:10px"></iframe>
    </div>
  </div>
</div>

<!-- IMAGE VIEWER MODAL -->
<div class="modal-backdrop" id="viewerModal">
  <div class="modal-box" style="max-width:860px;width:100%;padding:20px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div style="font-size:14px;font-weight:600;color:var(--text)" id="viewerModalTitle">Document</div>
      <button class="btn-pill" onclick="closeModal('viewerModal')" style="font-size:12px;padding:6px 12px">✕ Close</button>
    </div>
    <div id="viewerContent" style="width:100%;height:72vh;border-radius:10px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
// ✅ REDMYRE BMS 표준 구조: layout.js 사용
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase, user, role } = ctx;

// ── 데이터 변수 ──
let allQuotes = [];
let allVotes = [];
let committeeEmails = [
  "jimmyg@ignitelearning.com.au", "michael@efstratiou.com.au", "jskmhc@gmail.com",
  "sudesh@taxwealth.com.au", "niranjan@calculus.net.au", "redmyremedical@gmail.com",
  "laurachoo2@gmail.com", "eva.j3nova@hotmail.com"
];
const RULES = { approvalsRequired: 5, declinesToAutoDecline: 4, holdsToAutoHold: 3, expiryDays: 15 };
let currentFilter = 'all';
let holdingQuoteId = null;
const uploadedFiles = [];

const canSeeSensitive = ['admin', 'committee', 'observer'].includes(role);

// ── Admin UI 제어 ──
if (role === 'admin') {
  document.getElementById('addQuoteBtn').style.display = 'inline-flex';
}

// ── 헬퍼 함수들 ──
function parseComment(comment) {
  try {
    if (!comment) return { note:'', files:[], category:'General', priority:'Normal' };
    const obj = typeof comment === 'string' ? JSON.parse(comment) : comment;
    let files = Array.isArray(obj?.files) ? obj.files : [];
    return {
      note: obj?.note || '',
      files: files.filter(f => f && f.path),
      category: obj?.category || 'General',
      priority: obj?.priority || 'Normal'
    };
  } catch { return { note:'', files:[], category:'General', priority:'Normal' }; }
}

async function getSignedUrl(path) {
  if (!path) return '';
  const { data, error } = await supabase.storage.from('quotes').createSignedUrl(path, 3600);
  if (error) throw error;
  return data.signedUrl;
}

// 수정: uploadFile 함수에 quoteId 파라미터 추가
async function uploadFile(file, quoteId) {
  const safeName = file.name.replace(/[^\w.\- ]+/g,'_');
  const path = `${quoteId}/${Date.now()}-${safeName}`;
  const { error } = await supabase.storage.from('quotes').upload(path, file, { contentType: file.type });
  if (error) throw error;
  return { path, name: safeName, type: file.type || '', size: file.size };
}

function formatAmount(input) {
  let val = input.value.replace(/[^0-9.]/g, '');
  if (val) input.value = parseFloat(val).toLocaleString('en-AU');
}

async function clearVotesForQuote(quoteId) {
  try {
    await supabase.from('votes').delete().eq('quote_id', quoteId);
  } catch(e) { console.error('Failed to clear votes:', e); }
}

async function safeSyncQuoteToWorks(quoteId) {
  try {
    const { data: existing } = await supabase.from('works').select('id').eq('quote_id', quoteId).maybeSingle();
    if (existing) return true;

    const { data: q } = await supabase.from('quotes').select('*').eq('id', quoteId).maybeSingle();
    if (!q) throw new Error('Quote not found');

    const workData = { title: q.project || 'No title', status: 'scheduled', quote_id: quoteId };
    const { error } = await supabase.from('works').insert(workData);
    if (error) throw error;
    return true;
  } catch(e) {
    console.error('syncQuoteToWorks failed:', e);
    await supabase.from('quotes').update({ status: 'pending' }).eq('id', quoteId);
    showToast('CRITICAL: Failed to create Ongoing Works. Status reverted to PENDING. Error: ' + e.message, true);
    return false;
  }
}

window.forceApprove = async function (quoteId) {
  if (!confirm('Force approve this quote and move it to Ongoing Works?')) return;
  try {
    const syncSuccess = await safeSyncQuoteToWorks(quoteId);
    if (!syncSuccess) return;
    await supabase.from('quotes').update({ status: 'approved' }).eq('id', quoteId);
    await clearVotesForQuote(quoteId);
    showToast('Quote force-approved and moved to Ongoing Works');
    await loadData();
    renderQuotes();
  } catch(e) {
    showToast('Force approve failed: ' + e.message, true);
  }
};

window.openAttachment = async (path, name, type) => {
  if (!path) return showToast('Invalid file', true);
  try {
    const url = await getSignedUrl(path);
    if (type === 'application/pdf' || name.toLowerCase().endsWith('.pdf')) {
      document.getElementById('pdfModalTitle').textContent = name;
      document.getElementById('pdfIframe').src = url;
      document.getElementById('pdfModal').classList.add('open');
    } else {
      document.getElementById('viewerModalTitle').textContent = name;
      document.getElementById('viewerContent').innerHTML = `<img src="${url}" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:8px" alt="${name}">`;
      document.getElementById('viewerModal').classList.add('open');
    }
  } catch(e) {
    showToast('Failed to open file: ' + e.message, true);
  }
};

// 파일 업로드 함수 (quoteId 기반 경로 사용)
window.handleFileUpload = async function(quoteId) {
  const fileInput = document.getElementById(`fileInput-${quoteId}`);
  if (!fileInput || !fileInput.files.length) {
    showToast('Please select files to upload', true);
    return;
  }

  const visibility = document.getElementById(`fileVisibility-${quoteId}`).value || 'internal';
  const files = Array.from(fileInput.files);
  const newFiles = [];

  try {
    for (const file of files) {
      const uploaded = await uploadFile(file, quoteId);   // quoteId 전달
      newFiles.push({
        path: uploaded.path,
        name: uploaded.name,
        type: uploaded.type,
        size: uploaded.size,
        visibility: visibility
      });
    }

    // 기존 comment 가져와서 files append
    const { data: quote } = await supabase.from('quotes').select('comment').eq('id', quoteId).single();
    const parsed = parseComment(quote.comment);
    parsed.files = [...(parsed.files || []), ...newFiles];

    const commentPayload = JSON.stringify({
      note: parsed.note || '',
      files: parsed.files,
      category: parsed.category || 'General',
      priority: parsed.priority || 'Normal'
    });

    await supabase.from('quotes').update({ comment: commentPayload }).eq('id', quoteId);

    showToast('Files uploaded successfully');
    fileInput.value = '';
    await loadData();
    renderQuotes();
  } catch(e) {
    showToast('File upload failed: ' + e.message, true);
  }
};

async function loadData() {
  const [qRes, vRes] = await Promise.all([
    supabase.from('quotes').select('*').order('created_at', { ascending: false }),
    supabase.from('votes').select('*')
  ]);
  allQuotes = qRes.data || [];
  allVotes = vRes.data || [];

  const counts = { total:0, pending:0, declined:0, hold:0 };
  for (const q of allQuotes) {
    const st = getQuoteStatus(q);
    counts.total++;
    if (st === 'pending') counts.pending++;
    else if (st === 'declined') counts.declined++;
    else if (st === 'onhold') counts.hold++;
  }
  document.getElementById('statTotal').textContent = counts.total;
  document.getElementById('statPending').textContent = counts.pending;
  document.getElementById('statDeclined').textContent = counts.declined;
  document.getElementById('statHold').textContent = counts.hold;
}

function getQuoteVotes(quoteId) {
  return allVotes.filter(v => v.quote_id === quoteId);
}

function getQuoteStatus(q) {
  const st = (q.status || 'pending').toLowerCase();
  if (st === 'onhold') return 'onhold';
  if (st === 'approved') return 'approved';
  if (st === 'declined') return 'declined';
  if (st === 'expired') return 'expired';
  if (st === 'pending' && q.expiry_date && new Date() > new Date(q.expiry_date)) return 'expired';

  const votes = getQuoteVotes(q.id);
  const approvals = votes.filter(v=>v.vote==='approve').length;
  const declines = votes.filter(v=>v.vote==='decline').length;
  const holds = votes.filter(v=>v.vote==='hold').length;

  if (approvals >= RULES.approvalsRequired) return 'approved';
  if (declines >= RULES.declinesToAutoDecline) return 'declined';
  if (holds >= RULES.holdsToAutoHold && approvals < RULES.approvalsRequired) return 'onhold';
  return 'pending';
}

function renderVotesStatus(quoteId) {
  const votes = getQuoteVotes(quoteId);
  const voteMap = {};
  votes.forEach(v => { voteMap[v.user_email] = v.vote; });

  let topRow = '', bottomRow = '';
  committeeEmails.forEach((email, idx) => {
    const v = voteMap[email] || null;
    let icon = '⏳', color = 'var(--muted)';
    if (v === 'approve') { icon = '✅'; color = 'var(--green)'; }
    else if (v === 'decline') { icon = '❌'; color = 'var(--red)'; }
    else if (v === 'hold') { icon = '⏸'; color = '#8b5cf6'; }

    const html = `<div class="vote-item"><span class="vote-icon" style="color:${color}">${icon}</span><span>${email.split('@')[0]}</span></div>`;
    if (idx % 2 === 0) topRow += html;
    else bottomRow += html;
  });

  return `
    <div class="vote-status-box">
      <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px">Votes Status</div>
      <div class="vote-row">${topRow}</div>
      <div class="vote-row">${bottomRow}</div>
    </div>
  `;
}

function renderQuotes() {
  const list = document.getElementById('quoteList');
  const visibleQuotes = allQuotes;

  const filtered = currentFilter === 'all' 
    ? visibleQuotes 
    : visibleQuotes.filter(q => getQuoteStatus(q) === currentFilter);

  const filterBar = `<div class="filter-bar">
    <button class="btn-pill ${currentFilter==='all'?'btn-pill-active':''}" onclick="filterQuotes('all')">All</button>
    <button class="btn-pill ${currentFilter==='pending'?'btn-pill-active':''}" onclick="filterQuotes('pending')">⏳ Pending</button>
    <button class="btn-pill ${currentFilter==='declined'?'btn-pill-active':''}" onclick="filterQuotes('declined')">❌ Declined</button>
    <button class="btn-pill ${currentFilter==='onhold'?'btn-pill-active':''}" onclick="filterQuotes('onhold')">⏸ On Hold</button>
    <button class="btn-pill ${currentFilter==='expired'?'btn-pill-active':''}" onclick="filterQuotes('expired')">🕒 Expired</button>
  </div>`;

  if (!filtered.length) {
    list.innerHTML = filterBar + `<div class="empty-state"><div class="empty-icon">💰</div><div class="empty-title">No quotes found</div></div>`;
    return;
  }

  let html = filterBar + `<table class="quote-table"><thead><tr>
    <th>Date</th><th>Priority</th><th>Project Name</th><th>Contractor</th><th>Amount (AUD ex GST)</th>
  </tr></thead><tbody>`;

  filtered.forEach(q => {
    const st = getQuoteStatus(q);
    const created = new Date(q.created_at);
    const dateStr = created.toLocaleDateString('en-AU', {day:'2-digit', month:'short', year:'numeric'});
    const parsed = parseComment(q.comment);
    const prioClass = `priority-${(parsed.priority || 'normal').toLowerCase()}`;
    let amountHtml = (role === 'owner' || role === 'tenant') 
      ? `<span class="amount-confidential">Confidential</span>` 
      : `$${Number(q.amount || 0).toLocaleString('en-AU', {minimumFractionDigits: 2})}`;

    const canResubmit = (st === 'declined' || st === 'onhold' || st === 'expired') && role === 'admin';
    const showCommitteeButtons = role === 'committee' && st === 'pending';

    let filesHtml = '';
    const visibleFiles = canSeeSensitive 
      ? (parsed.files || []) 
      : (parsed.files || []).filter(f => !f.visibility || f.visibility === 'public');

    if (visibleFiles.length) {
      filesHtml = `<div style="margin:16px 0"><div class="detail-label">📎 Files</div><div class="files-list">`;
      filesHtml += visibleFiles.map(f => `
        <div class="file-preview" onclick="openAttachment('${f.path}','${f.name}','${f.type}')">
          <span class="file-icon">📄</span>
          <span class="file-name">${f.name}</span>
          <span class="file-size">${(f.size/1024).toFixed(1)} KB</span>
          ${f.visibility === 'public' ? `<span class="file-visibility">Public</span>` : `<span class="file-visibility" style="background:#f3e8ff;color:#6b21a8">Internal</span>`}
        </div>
      `).join('');
      filesHtml += `</div></div>`;
    }

    const uploadUI = `
      <div class="file-upload">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Upload New Files</div>
        <input type="file" id="fileInput-${q.id}" multiple style="margin-bottom:6px">
        <select id="fileVisibility-${q.id}" style="margin-right:8px;font-size:12px;padding:4px 8px;border-radius:4px">
          <option value="internal">🔒 Internal</option>
          <option value="public">🌐 Public</option>
        </select>
        <button class="btn-pill btn-pill-primary" onclick="handleFileUpload('${q.id}');event.stopImmediatePropagation()">📎 Upload Files</button>
      </div>`;

    html += `
      <tr onclick="toggleQuote('${q.id}')">
        <td>${dateStr}</td>
        <td><span class="${prioClass}">${parsed.priority}</span></td>
        <td>${q.project || 'Untitled Quote'}</td>
        <td>${q.vendor || 'Unknown'}</td>
        <td>${amountHtml}</td>
      </tr>
      <tr style="display:none" id="row-body-${q.id}">
        <td colspan="5">
          <div class="quote-body open" id="body-${q.id}">
            ${q.notes ? `<div><div class="detail-label">Scope</div><div style="font-size:13px;line-height:1.6;color:var(--text-2)">${q.notes}</div></div>` : ''}
            
            ${canSeeSensitive && parsed.note ? `<div class="internal-note-box">🔒 <strong>Internal Note:</strong> ${parsed.note}</div>` : ''}
            
            ${filesHtml}
            
            ${uploadUI}
            
            ${renderVotesStatus(q.id)}
            
            <div class="quote-footer">
              ${showCommitteeButtons ? `
                <button class="btn-pill btn-pill-success" onclick="castVote('${q.id}','approve');event.stopImmediatePropagation()">✅ Approve</button>
                <button class="btn-pill btn-pill-danger" onclick="castVote('${q.id}','decline');event.stopImmediatePropagation()">❌ Decline</button>
                <button class="btn-pill btn-pill-warning" onclick="castVote('${q.id}','hold');event.stopImmediatePropagation()">⏸ Hold</button>
              ` : ''}
              
              ${role === 'admin' ? `
                ${st === 'pending' ? `<button class="btn-pill btn-pill-warning" onclick="openHold('${q.id}');event.stopImmediatePropagation()">⏸ Put On Hold</button>` : ''}
                ${st === 'onhold' ? `<button class="btn-pill btn-pill-primary" onclick="resumeQuote('${q.id}');event.stopImmediatePropagation()">▶ Resume</button>` : ''}
                ${st === 'pending' ? `<button class="btn-pill btn-pill-success" onclick="forceApprove('${q.id}');event.stopImmediatePropagation()">Force Approve</button>` : ''}
                <button class="btn-pill" onclick="openEditQuote('${q.id}');event.stopImmediatePropagation()">✏️ Edit</button>
                <button class="btn-pill" onclick="openEditScope('${q.id}');event.stopImmediatePropagation()">📝 Edit Scope</button>
                ${canResubmit ? `<button class="btn-pill btn-pill-primary" onclick="resubmitQuote('${q.id}');event.stopImmediatePropagation()">🔄 Re-submit</button>` : ''}
              ` : ''}
            </div>
          </div>
        </td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  list.innerHTML = html;
}

window.toggleQuote = id => {
  const row = document.getElementById('row-body-' + id);
  if (row) row.style.display = row.style.display === 'table-row' ? 'none' : 'table-row';
};

window.filterQuotes = (filter) => {
  currentFilter = filter;
  renderQuotes();
};

window.openAddQuote = () => {
  document.getElementById('quoteEditId').value = '';
  document.getElementById('quoteModalTitle').textContent = 'Add Quote';
  document.getElementById('deleteQuoteBtn').style.display = 'none';
  document.getElementById('quoteProject').value = '';
  document.getElementById('quoteVendor').value = '';
  document.getElementById('quoteAmount').value = '';
  document.getElementById('quoteCategory').value = 'General';
  document.getElementById('quotePriority').value = 'Normal';
  document.getElementById('quoteNotes').value = '';
  document.getElementById('quoteInternalNote').value = '';
  uploadedFiles.length = 0;
  document.getElementById('filePreview').innerHTML = '';
  document.getElementById('quoteModal').classList.add('open');
};

window.openEditQuote = id => {
  const q = allQuotes.find(q=>q.id===id);
  if (!q) return;
  const parsed = parseComment(q.comment);
  document.getElementById('quoteEditId').value = id;
  document.getElementById('quoteModalTitle').textContent = 'Edit Quote';
  document.getElementById('deleteQuoteBtn').style.display = 'inline-flex';
  document.getElementById('quoteProject').value = q.project || '';
  document.getElementById('quoteVendor').value = q.vendor || '';
  document.getElementById('quoteAmount').value = q.amount ? Number(q.amount).toLocaleString('en-AU') : '';
  document.getElementById('quoteCategory').value = parsed.category;
  document.getElementById('quotePriority').value = parsed.priority;
  document.getElementById('quoteNotes').value = q.notes || '';
  document.getElementById('quoteInternalNote').value = parsed.note || '';
  displayExistingFiles(parsed.files);
  document.getElementById('quoteModal').classList.add('open');
};

function displayExistingFiles(files) {
  uploadedFiles.length = 0;
  if (files) files.forEach(f => uploadedFiles.push(f));
  updateFilePreview();
}

document.getElementById('fileInput').addEventListener('change', e => {
  Array.from(e.target.files).forEach(f => {
    uploadedFiles.push({ 
      file: f, 
      name: f.name, 
      size: (f.size/1024).toFixed(1)+' KB', 
      type: f.type,
      visibility: 'internal'
    });
  });
  updateFilePreview();
});

function updateFilePreview() {
  const preview = document.getElementById('filePreview');
  preview.innerHTML = uploadedFiles.map((f,i) => `
    <div class="file-preview">
      <span class="file-icon">📄</span>
      <span class="file-name">${f.name}</span>
      <span class="file-size">${f.size}</span>
      <select onchange="setFileVisibility(${i}, this.value)" style="font-size:11px;padding:2px 6px;border-radius:4px">
        <option value="internal" ${f.visibility==='internal'?'selected':''}>Internal</option>
        <option value="public" ${f.visibility==='public'?'selected':''}>Public</option>
      </select>
      <span class="file-del" onclick="removeFile(${i});event.stopImmediatePropagation()">✕</span>
    </div>
  `).join('');
}

window.setFileVisibility = (idx, vis) => {
  if (uploadedFiles[idx]) uploadedFiles[idx].visibility = vis;
};

window.removeFile = idx => {
  uploadedFiles.splice(idx, 1);
  updateFilePreview();
};

// saveQuote 내부 업로드도 quoteId 기반으로 수정
window.saveQuote = async () => {
  const id = document.getElementById('quoteEditId').value;
  const project = document.getElementById('quoteProject').value.trim();
  const vendor = document.getElementById('quoteVendor').value.trim();
  let amountStr = document.getElementById('quoteAmount').value.replace(/[^0-9.]/g, '');
  const amount = parseFloat(amountStr) || 0;
  const category = document.getElementById('quoteCategory').value;
  const priority = document.getElementById('quotePriority').value;
  const notes = document.getElementById('quoteNotes').value.trim();
  const internalNote = document.getElementById('quoteInternalNote').value.trim();

  if (!project || !vendor || amount <= 0) return showToast('Please fill all required fields', true);

  const saveBtn = document.getElementById('saveQuoteBtn');
  saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

  try {
    const fileData = [];
    for (const f of uploadedFiles) {
      if (f.file) {
        // 신규 quote 생성 시 임시 quoteId 사용 (실제 저장 후 재조회됨)
        const tempQuoteId = id || 'temp_' + Date.now();
        const uploaded = await uploadFile(f.file, tempQuoteId);
        fileData.push({
          path: uploaded.path,
          name: uploaded.name,
          type: uploaded.type,
          size: uploaded.size,
          visibility: f.visibility || 'internal'
        });
      } else {
        fileData.push(f);
      }
    }

    const commentPayload = JSON.stringify({
      note: internalNote,
      files: fileData,
      category: category,
      priority: priority
    });

    const payload = { project, vendor, amount, notes, comment: commentPayload, priority, category };

    if (id) {
      await supabase.from('quotes').update(payload).eq('id', id);
    } else {
      const expiry = new Date(); expiry.setDate(expiry.getDate() + RULES.expiryDays);
      await supabase.from('quotes').insert({ ...payload, status: 'pending', expiry_date: expiry.toISOString(), created_by: user.id });
    }

    closeModal('quoteModal');
    await loadData(); 
    renderQuotes();
    showToast('Quote saved successfully');
  } catch(e) {
    showToast('Save failed: ' + e.message, true);
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = 'Save →';
  }
};

window.openHold = id => { holdingQuoteId = id; document.getElementById('holdReason').value = ''; document.getElementById('holdModal').classList.add('open'); };

window.confirmHold = async () => {
  const reason = document.getElementById('holdReason').value.trim();
  if (!reason) return showToast('Please enter a reason', true);
  await supabase.from('quotes')
    .update({status:'onhold', hold_reason: reason})
    .eq('id', holdingQuoteId);
  await clearVotesForQuote(holdingQuoteId);
  closeModal('holdModal'); await loadData(); renderQuotes(); showToast('Quote put on hold');
};

window.resumeQuote = async id => {
  await supabase.from('quotes').update({status:'pending', hold_reason: null}).eq('id', id);
  await loadData(); renderQuotes(); showToast('Voting resumed');
};

window.resubmitQuote = async id => {
  if (!confirm('Re-submit this quote? All previous votes will be cleared.')) return;
  await supabase.from('votes').delete().eq('quote_id', id);
  await supabase.from('quotes').update({status: 'pending', hold_reason: null}).eq('id', id);
  await loadData(); renderQuotes(); showToast('Quote re-submitted for voting');
};

window.openEditScope = id => {
  const q = allQuotes.find(q=>q.id===id);
  if (!q) return;
  const parsed = parseComment(q.comment);
  document.getElementById('scopeEditId').value = id;
  document.getElementById('scopeText').value = parsed.note || '';
  document.getElementById('scopeModal').classList.add('open');
};
window.saveScope = async () => {
  const id = document.getElementById('scopeEditId').value;
  const note = document.getElementById('scopeText').value.trim();
  const q = allQuotes.find(q=>q.id===id);
  if (!q) return;
  const parsed = parseComment(q.comment);
  parsed.note = note;
  await supabase.from('quotes').update({ comment: JSON.stringify(parsed) }).eq('id', id);
  closeModal('scopeModal'); await loadData(); renderQuotes(); showToast('Scope updated');
};

window.deleteQuote = async () => {
  const id = document.getElementById('quoteEditId').value;
  if (!id || !confirm('Delete this quote?')) return;
  try {
    await supabase.from('votes').delete().eq('quote_id', id);
    const q = allQuotes.find(q => q.id === id);
    if (q) {
      const parsed = parseComment(q.comment);
      const paths = (parsed.files||[]).map(f=>f.path).filter(Boolean);
      if (paths.length) await supabase.storage.from('quotes').remove(paths);
    }
    await supabase.from('quotes').delete().eq('id', id);
    closeModal('quoteModal');
    await loadData(); renderQuotes();
    showToast('Quote deleted');
  } catch(e) { showToast('Delete failed: ' + e.message, true); }
};

window.castVote = async (quoteId, vote) => {
  const existing = allVotes.find(v => v.quote_id === quoteId && v.user_email === user.email);
  if (existing) return showToast('You have already voted', true);

  await supabase.from('votes').insert({ quote_id: quoteId, user_email: user.email, vote });

  let toastMsg = vote === 'approve' ? '✅ Approved' : vote === 'decline' ? '❌ Declined' : '⏸ Hold';
  showToast(toastMsg);

  const { data: latestVotes } = await supabase.from('votes').select('*').eq('quote_id', quoteId);

  const approvals = latestVotes.filter(v=>v.vote==='approve').length;
  const declines = latestVotes.filter(v=>v.vote==='decline').length;
  const holds = latestVotes.filter(v=>v.vote==='hold').length;

  if (approvals >= RULES.approvalsRequired) {
    const syncSuccess = await safeSyncQuoteToWorks(quoteId);
    if (syncSuccess) {
      await supabase.from('quotes').update({status:'approved'}).eq('id', quoteId);
      await clearVotesForQuote(quoteId);
    }
  } else if (declines >= RULES.declinesToAutoDecline) {
    await supabase.from('quotes').update({status:'declined'}).eq('id', quoteId);
    await clearVotesForQuote(quoteId);
  } else if (holds >= RULES.holdsToAutoHold && approvals < RULES.approvalsRequired) {
    await supabase.from('quotes').update({status:'onhold', hold_reason: 'Automatic hold by committee votes'}).eq('id', quoteId);
    await clearVotesForQuote(quoteId);
  }

  await loadData(); 
  renderQuotes();
};

try {
  await loadData();
  renderQuotes();
} catch(e) {
  console.error(e);
  showToast('Failed to load quotes', true);
}

window.closeModal = (id) => document.getElementById(id).classList.remove('open');
</script>
