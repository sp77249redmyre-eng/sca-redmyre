<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Temperature Request – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-field{margin-bottom:14px}
.form-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:7px;display:block}
.form-input,.form-select,.form-textarea{width:100%;padding:0 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);outline:none}
.form-input,.form-select{height:44px}
.form-textarea{min-height:100px;padding:10px 12px;resize:vertical;line-height:1.6}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue-600);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
</style>
</head>
<body class="role-admin">
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">
    <div class="section-hdr">
      <div class="section-title">New Temperature Request</div>
    </div>
    <div class="card" style="max-width:680px">
      <div class="card-header" style="border-bottom:1px solid var(--border-light)">
        <div class="card-title">Report Temperature Issue</div>
      </div>
      <div style="padding:24px">
        <form id="requestForm">
          <div class="form-row">
            <div class="form-field">
              <label class="form-label">User Name</label>
              <input type="text" class="form-input" id="userName" placeholder="Your name" required>
            </div>
            <div class="form-field">
              <label class="form-label">Email (optional)</label>
              <input type="email" class="form-input" id="userEmail" placeholder="your@email.com">
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label class="form-label">Floor Level</label>
              <select class="form-select" id="level" required>
                <option value="">Select floor</option>
                <option>Level 1</option>
                <option>Level 2</option>
                <option>Level 3</option>
                <option>Level 4</option>
                <option>Level 5</option>
                <option>Level 6</option>
              </select>
            </div>
            <div class="form-field">
              <label class="form-label">Tenancy</label>
              <input type="text" class="form-input" id="tenancy" placeholder="e.g. Suite 201" required>
            </div>
          </div>
          <div class="form-field">
            <label class="form-label">Issue Type</label>
            <select class="form-select" id="type" required>
              <option value="">Select issue</option>
              <option value="hot">🥵 Too Hot</option>
              <option value="cold">🥶 Too Cold</option>
            </select>
          </div>
          <div class="form-field">
            <label class="form-label">Comment (optional)</label>
            <textarea class="form-textarea" id="comment" placeholder="Describe the issue..."></textarea>
          </div>
          <div class="btn-row">
            <button type="button" class="btn-secondary" onclick="window.location.href='/'">Cancel</button>
            <button type="submit" class="btn-primary">📤 Submit Request</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initLayout } from '../js/layout.js';
const ctx = await initLayout();
if (!ctx) throw new Error('Layout init failed');
const { supabase } = ctx;

document.getElementById('requestForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const userName  = document.getElementById('userName').value.trim();
  const userEmail = document.getElementById('userEmail').value.trim();
  const level     = document.getElementById('level').value;
  const tenancy   = document.getElementById('tenancy').value.trim();
  const type      = document.getElementById('type').value;
  const comment   = document.getElementById('comment').value.trim();
  if (!userName || !level || !tenancy || !type) {
    showToast('❌ Please fill all required fields');
    return;
  }
  const { error } = await supabase.from('hvac_requests').insert([{
    user_name: userName,
    user_email: userEmail || null,
    level,
    tenancy,
    type,
    comment: comment || null,
    status: 'pending'
  }]);
  if (error) {
    showToast('❌ Failed to submit');
    console.error(error);
  } else {
    showToast('✅ Request submitted');
    document.getElementById('requestForm').reset();
    setTimeout(() => window.location.href='/', 1500);
  }
});
</script>
</body>
</html>
