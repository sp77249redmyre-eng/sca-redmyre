<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Approvals – Redmyre House</title>
<link rel="manifest" href="/manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32-v4.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon-v4.png?v=5">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redmyre BMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/pages/quotes.css">



</head>
<body>
<div id="sidebarPlaceholder"></div>
<div class="main">
  <div id="topbarPlaceholder"></div>
  <div class="content">

    <!-- Page Hero -->
    <!-- Page Header -->
    <div class="page-header">
      <div class="page-header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg>
      </div>
      <div class="page-header-body">
        <div class="page-header-title-row">
          <span class="page-header-title">Quote Approvals</span>
        </div>
        <div class="page-header-sub">Review and vote on contractor quotes for building projects.</div>
      </div>
    </div>
    <div class="vote-rule-banner" style="background:#DBEAFE;border:1px solid #93C5FD;border-radius:10px;padding:11px 24px;display:flex;align-items:flex-start;gap:10px;margin-bottom:20px">
      <span style="font-size:16px;flex-shrink:0;line-height:1.4"></span>
      <span style="font-size:13px;color:#1E40AF;font-weight:600;line-height:1.5;flex:1;min-width:0;word-break:break-word">8 committee members vote · 5+ approve → Approved · 5+ decline → Declined · 4+ hold → On Hold</span>
    </div>

    <div class="quote-section-stack">
      <section class="quote-section" id="draftSection">
        <div class="quote-section-heading">
          <button type="button" class="quote-section-toggle" aria-expanded="true" aria-controls="draftSectionBody" onclick="toggleQuoteSection('draftSectionBody',this)">
            <span class="quote-section-accent quote-section-accent-draft"></span>
            <span class="quote-section-title">DRAFT</span>
            <span class="quote-section-count" id="draftCount">0</span>
            <span class="quote-section-chevron">⌃</span>
          </button>
          <button class="btn-create-project" id="createProjectBtn" style="display:none" onclick="openCreateProject()">
            <span class="btn-create-project-icon"></span>
            <span class="btn-create-project-label">
              <span class="btn-create-project-main">Create Project</span>
              <span class="btn-create-project-sub">New quote group</span>
            </span>
          </button>
        </div>
        <div class="quote-section-body" id="draftSectionBody">
          <div id="pendingList"></div>
        </div>
      </section>

      <section class="quote-section" id="currentVotingSection">
        <div class="quote-section-heading quote-section-heading-static">
          <span class="quote-section-accent quote-section-accent-voting"></span>
          <span class="quote-section-title">CURRENT VOTING</span>
          <span class="quote-section-count" id="currentVotingCount">0</span>
        </div>
        <div class="quote-section-body" id="currentVotingSectionBody">
          <div id="currentVotingList"></div>
        </div>
      </section>

      <section class="quote-section" id="onHoldSection">
        <div class="quote-section-heading quote-section-heading-static">
          <span class="quote-section-accent quote-section-accent-hold"></span>
          <span class="quote-section-title">ON HOLD</span>
          <span class="quote-section-count quote-section-count-hold" id="onHoldCount">0</span>
        </div>
        <div class="quote-section-body" id="onHoldSectionBody">
          <div id="onHoldList"></div>
        </div>
      </section>
    </div>
  </div>
</div>

<div id="fileViewerModal" tabindex="-1" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;flex-direction:column;padding:16px;outline:none" onclick="if(event.target===this)closeViewer()">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-shrink:0" onclick="event.stopPropagation()">
    <span id="viewerFileName" style="color:#e5e7eb;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:calc(100% - 120px)"></span>
    <div style="display:flex;gap:8px;flex-shrink:0">
      <button onclick="printViewer()" style="background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;padding:6px 14px;display:flex;align-items:center;gap:6px">Print</button>
      <button onclick="closeViewer()" style="background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:22px;cursor:pointer;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center">&times;</button>
    </div>
  </div>
  <div id="viewerContent" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:10px" onclick="event.stopPropagation()"></div>
</div>

<div class="modal-backdrop" id="filePreviewModal" onclick="if(event.target===this)closeModal('filePreviewModal')">
  <div class="modal-box" style="max-width:860px;width:96%;padding:0;overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e5e7eb;background:#f8fafc">
      <span id="filePreviewTitle" style="font-weight:600;color:#1f2937;font-size:15px"></span>
      <button onclick="closeModal('filePreviewModal')" style="background:none;border:none;font-size:22px;cursor:pointer;color:#6b7280;line-height:1">&times;</button>
    </div>
    <div id="filePreviewBody" style="min-height:420px;display:flex;align-items:center;justify-content:center;padding:20px;background:#fff"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<div class="modal-backdrop" id="quoteModal">
  <div class="modal-box">
    <div class="modal-title" id="quoteModalTitle">Add New Quote</div>
    <input type="hidden" id="quoteEditId">
    <div class="modal-field">
      <label class="modal-label">Project / Works Description</label>
      <select class="modal-select" id="projectSelect" onchange="handleProjectSelect()">
        <option value="">+ New Project</option>
      </select>
      <input type="text" class="modal-input" id="quoteProject" placeholder="Enter new project name" style="display:none;margin-top:8px">
    </div>
    <div class="modal-field">
      <label class="modal-label">Vendor / Contractor</label>
      <input type="text" class="modal-input" id="quoteVendor" placeholder="Company name">
    </div>
    <div class="modal-field">
      <label class="modal-label">Amount (AUD, ex GST)</label>
      <input type="text" class="modal-input" id="quoteAmount" placeholder="0.00" oninput="formatAmount(this)">
    </div>
    <div class="modal-field">
      <label class="modal-label">Category</label>
      <select class="modal-select" id="quoteCategory">
        <option value="General">General</option>
        <option value="HVAC">HVAC</option>
        <option value="Fire">Fire</option>
        <option value="Electrical">Electrical</option>
        <option value="Security">Security</option>
        <option value="Plumbing">Plumbing</option>
        <option value="Lift">Lift</option>
        <option value="Legal">Legal</option>
              </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">Priority</label>
      <select class="modal-select" id="quotePriority">
        <option value="Normal">Normal</option>
        <option value="High">High</option>
        <option value="Urgent">Urgent</option>
      </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">Scope / Notes (Public)</label>
      <textarea class="modal-textarea" id="quoteNotes" placeholder="Brief description visible to voters…" style="min-height:200px"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">Internal Notes</label>
      <textarea class="modal-textarea" id="quoteInternalNote" placeholder="Private notes for committee..." style="min-height:200px"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">Attachments</label>
      <div id="existingFilesList" style="margin-bottom:8px"></div>
      <div class="file-upload-area" onclick="document.getElementById('quoteFiles').click()">
        <input type="file" id="quoteFiles" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg" onchange="handleFileSelect(event)">
        <div style="color:#6b7280;font-size:13.5px">Click to upload files (PDF, Word, Excel, Images)</div>
      </div>
      <div class="file-list" id="fileList"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-pill" onclick="closeModal('quoteModal')">Cancel</button>
      <button class="btn-pill btn-pill-danger" id="deleteQuoteBtn" onclick="deleteQuote()" style="display:none">Delete Quote</button>
      <button class="btn-pill btn-pill-primary" id="saveQuoteBtn" onclick="saveQuote()">Save Quote</button>
    </div>
  </div>
</div>

<script type="module" src="/js/quotes.js"></script>
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">


<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script src="/js/quotes-quill.js"></script>
</body>
</html>
