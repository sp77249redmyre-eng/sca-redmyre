<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes - Redmyre BMS</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32-v4.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16-v4.png">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/quotes.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
        <div id="topbar-container"></div>
        <div class="content-area">
            <div class="page-header">
                <h1>Quotes</h1>
                <button id="newQuoteBtn" class="btn-primary">New Quote</button>
            </div>
            <div class="tabs">
                <button class="tab-btn active" data-tab="pending">Pending</button>
                <button class="tab-btn" data-tab="archive">Archive</button>
            </div>
            <div class="tab-content active" id="pending-tab">
                <table id="pendingTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Project</th>
                            <th>Vendor</th>
                            <th>Amount</th>
                            <th>Votes</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="pendingTableBody"></tbody>
                </table>
            </div>
            <div class="tab-content" id="archive-tab">
                <table id="archiveTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Category</th>
                            <th>Project</th>
                            <th>Vendor</th>
                            <th>Amount</th>
                            <th>Notes</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="archiveTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="quoteModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">New Quote</h2>
            <form id="quoteForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Project *</label>
                    <input type="text" id="project" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Building Maintenance">Building Maintenance</option>
                        <option value="Cleaning">Cleaning</option>
                        <option value="Security">Security</option>
                        <option value="Landscaping">Landscaping</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Insurance">Insurance</option>
                        <option value="Legal">Legal</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Vendor *</label>
                    <input type="text" id="vendor" required>
                </div>
                <div class="form-group">
                    <label>Amount *</label>
                    <input type="number" id="amount" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Priority *</label>
                    <select id="priority" required>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Urgent">Urgent</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Internal Note</label>
                    <textarea id="internalNote" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Files</label>
                    <input type="file" id="files" multiple>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
    <div id="detailModal" class="modal">
        <div class="modal-content detail-modal">
            <span class="close detail-close">&times;</span>
            <h2 id="detailTitle">Quote Details</h2>
            <div id="detailContent"></div>
            <div id="voteSection"></div>
            <div id="commentSection"></div>
            <div class="form-actions">
                <button type="button" class="btn-secondary detail-close">Close</button>
                <button type="button" id="forceApproveBtn" class="btn-danger" style="display:none;">Force Approve</button>
            </div>
        </div>
    </div>
    <script type="module">
        import { supabase, checkAuth } from '../js/auth.js';
        import { loadLayout } from '../js/layout.js';

        let currentUser = null;
        let editingQuoteId = null;

        async function init() {
            currentUser = await checkAuth();
            await loadLayout();
            setupEventListeners();
            await loadQuotes();
        }

        function setupEventListeners() {
            document.getElementById('newQuoteBtn').addEventListener('click', openNewQuoteModal);
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', switchTab);
            });
            document.querySelector('.close').addEventListener('click', closeModal);
            document.querySelectorAll('.detail-close').forEach(el => {
                el.addEventListener('click', closeDetailModal);
            });
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('quoteForm').addEventListener('submit', saveQuote);
            window.addEventListener('click', (e) => {
                if (e.target.id === 'quoteModal') closeModal();
                if (e.target.id === 'detailModal') closeDetailModal();
            });
            window.viewQuote = viewQuote;
            window.editQuote = editQuote;
            window.deleteQuote = deleteQuote;
            window.voteQuote = voteQuote;
        }

        function switchTab(e) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            e.target.classList.add('active');
            const tabName = e.target.dataset.tab;
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }

        function openNewQuoteModal() {
            editingQuoteId = null;
            document.getElementById('modalTitle').textContent = 'New Quote';
            document.getElementById('quoteForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('quoteModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('quoteModal').style.display = 'none';
        }

        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        async function saveQuote(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const project = document.getElementById('project').value.trim();
            const category = document.getElementById('category').value;
            const vendor = document.getElementById('vendor').value.trim();
            const amount = document.getElementById('amount').value;
            const priority = document.getElementById('priority').value;
            const notes = document.getElementById('notes').value.trim();
            const internalNote = document.getElementById('internalNote').value.trim();
            const filesInput = document.getElementById('files');

            if (!project || !category || !vendor || !amount) {
                alert('Please fill in all required fields');
                return;
            }

            const fileData = [];
            if (filesInput.files.length > 0) {
                for (let file of filesInput.files) {
                    fileData.push({
                        name: file.name,
                        size: file.size,
                        type: file.type
                    });
                }
            }

            const quoteId = editId || crypto.randomUUID();
            const commentPayload = {
                note: internalNote,
                files: fileData,
                category: category,
                priority: priority
            };

            try {
                if (editId) {
                    const { error } = await supabase
                        .from('quotes')
                        .update({
                            project: project,
                            vendor: vendor,
                            amount: Number(amount),
                            notes: notes,
                            comment: commentPayload,
                            category: category
                        })
                        .eq('id', editId);
                    if (error) throw error;
                } else {
                    const { error } = await supabase
                        .from('quotes')
                        .insert({
                            id: quoteId,
                            project: project,
                            vendor: vendor,
                            amount: Number(amount),
                            notes: notes,
                            comment: commentPayload,
                            category: category,
                            status: 'pending'
                        });
                    if (error) throw error;
                }
                closeModal();
                await loadQuotes();
            } catch (error) {
                console.error('Error saving quote:', error);
                alert('Error saving quote');
            }
        }

        async function loadQuotes() {
            try {
                const { data, error } = await supabase
                    .from('quotes')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const pending = data.filter(q => q.status === 'pending');
                const archived = data.filter(q => q.status !== 'pending');

                renderPendingTable(pending);
                renderArchiveTable(archived);
            } catch (error) {
                console.error('Error loading quotes:', error);
            }
        }

        function parseComment(comment) {
            if (!comment) return { priority: 'Medium', category: '' };
            if (typeof comment === 'object') return comment;
            try {
                return JSON.parse(comment);
            } catch {
                return { priority: 'Medium', category: '' };
            }
        }

        function renderPendingTable(quotes) {
            const tbody = document.getElementById('pendingTableBody');
            if (quotes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No pending quotes</td></tr>';
                return;
            }
            tbody.innerHTML = quotes.map(q => {
                const parsed = parseComment(q.comment);
                const dateStr = new Date(q.created_at).toLocaleDateString();
                const voteStatus = getVoteStatus(q);
                return `
                    <tr>
                        <td>${dateStr}</td>
                        <td>${q.category}</td>
                        <td>${parsed.priority}</td>
                        <td>${q.project}</td>
                        <td>${q.vendor}</td>
                        <td>$${Number(q.amount).toFixed(2)}</td>
                        <td>${voteStatus}</td>
                        <td>
                            <button class="btn-small" onclick="window.viewQuote('${q.id}')">View</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderArchiveTable(quotes) {
            const tbody = document.getElementById('archiveTableBody');
            if (quotes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No archived quotes</td></tr>';
                return;
            }
            tbody.innerHTML = quotes.map(q => {
                const dateStr = new Date(q.created_at).toLocaleDateString();
                const statusText = q.status === 'approved' ? 'Approved' : 'Rejected';
                return `
                    <tr>
                        <td>${dateStr}</td>
                        <td>${statusText}</td>
                        <td>${q.category}</td>
                        <td>${q.project}</td>
                        <td>${q.vendor}</td>
                        <td>$${Number(q.amount).toFixed(2)}</td>
                        <td>${q.notes || '-'}</td>
                        <td>
                            <button class="btn-small" onclick="window.viewQuote('${q.id}')">View</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getVoteStatus(quote) {
            if (!quote.votes || Object.keys(quote.votes).length === 0) {
                return '0/0';
            }
            const votes = Object.values(quote.votes);
            const approvals = votes.filter(v => v === 'approve').length;
            const total = votes.length;
            return `${approvals}/${total}`;
        }

        async function viewQuote(id) {
            try {
                const { data: quote, error } = await supabase
                    .from('quotes')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error) throw error;

                const parsed = parseComment(quote.comment);
                const dateStr = new Date(quote.created_at).toLocaleString();

                let detailHTML = `
                    <div class="detail-grid">
                        <div class="detail-item"><strong>Project:</strong> ${quote.project}</div>
                        <div class="detail-item"><strong>Category:</strong> ${quote.category}</div>
                        <div class="detail-item"><strong>Vendor:</strong> ${quote.vendor}</div>
                        <div class="detail-item"><strong>Amount:</strong> $${Number(quote.amount).toFixed(2)}</div>
                        <div class="detail-item"><strong>Priority:</strong> ${parsed.priority}</div>
                        <div class="detail-item"><strong>Status:</strong> ${quote.status}</div>
                        <div class="detail-item"><strong>Created:</strong> ${dateStr}</div>
                        <div class="detail-item"><strong>Notes:</strong> ${quote.notes || '-'}</div>
                    </div>
                `;

                if (parsed.note) {
                    detailHTML += `<div class="detail-section"><strong>Internal Note:</strong><p>${parsed.note}</p></div>`;
                }

                if (parsed.files && parsed.files.length > 0) {
                    detailHTML += `<div class="detail-section"><strong>Files:</strong><ul>`;
                    parsed.files.forEach(f => {
                        detailHTML += `<li>${f.name} (${(f.size / 1024).toFixed(2)} KB)</li>`;
                    });
                    detailHTML += `</ul></div>`;
                }

                document.getElementById('detailContent').innerHTML = detailHTML;

                if (quote.status === 'pending') {
                    renderVoteSection(quote);
                    renderCommentSection(quote);
                    const forceBtn = document.getElementById('forceApproveBtn');
                    if (currentUser.role === 'admin') {
                        forceBtn.style.display = 'inline-block';
                        forceBtn.onclick = () => forceApprove(id);
                    } else {
                        forceBtn.style.display = 'none';
                    }
                } else {
                    document.getElementById('voteSection').innerHTML = '';
                    document.getElementById('commentSection').innerHTML = '';
                    document.getElementById('forceApproveBtn').style.display = 'none';
                }

                document.getElementById('detailModal').style.display = 'block';
            } catch (error) {
                console.error('Error viewing quote:', error);
                alert('Error loading quote details');
            }
        }

        function renderVoteSection(quote) {
            const voteSection = document.getElementById('voteSection');
            const votes = quote.votes || {};
            const userVote = votes[currentUser.id];

            let voteHTML = '<div class="vote-section"><h3>Votes</h3>';
            
            if (Object.keys(votes).length > 0) {
                voteHTML += '<ul class="vote-list">';
                for (const [userId, vote] of Object.entries(votes)) {
                    const voteIcon = vote === 'approve' ? '✓' : '✗';
                    const voteClass = vote === 'approve' ? 'vote-approve' : 'vote-reject';
                    voteHTML += `<li class="${voteClass}">${userId}: ${voteIcon}</li>`;
                }
                voteHTML += '</ul>';
            } else {
                voteHTML += '<p>No votes yet</p>';
            }

            if (!userVote) {
                voteHTML += `
                    <div class="vote-buttons">
                        <button class="btn-success" onclick="window.voteQuote('${quote.id}', 'approve')">Approve</button>
                        <button class="btn-danger" onclick="window.voteQuote('${quote.id}', 'reject')">Reject</button>
                    </div>
                `;
            } else {
                voteHTML += `<p>You voted: ${userVote}</p>`;
            }

            voteHTML += '</div>';
            voteSection.innerHTML = voteHTML;
        }

        function renderCommentSection(quote) {
            const commentSection = document.getElementById('commentSection');
            commentSection.innerHTML = '<div class="comment-section"><h3>Discussion</h3><p>Comment feature coming soon</p></div>';
        }

        async function voteQuote(id, vote) {
            try {
                const { data: quote, error: fetchError } = await supabase
                    .from('quotes')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (fetchError) throw fetchError;

                const votes = quote.votes || {};
                if (votes[currentUser.id]) {
                    alert('You have already voted on this quote');
                    return;
                }

                votes[currentUser.id] = vote;

                const { data: allUsers, error: userError } = await supabase
                    .from('users')
                    .select('id')
                    .eq('role', 'admin');

                if (userError) throw userError;

                const totalAdmins = allUsers.length;
                const approvals = Object.values(votes).filter(v => v === 'approve').length;
                const rejections = Object.values(votes).filter(v => v === 'reject').length;

                let newStatus = 'pending';
                if (approvals > totalAdmins / 2) {
                    newStatus = 'approved';
                    await createWork(quote);
                } else if (rejections > totalAdmins / 2) {
                    newStatus = 'rejected';
                }

                const { error: updateError } = await supabase
                    .from('quotes')
                    .update({ 
                        votes: votes,
                        status: newStatus
                    })
                    .eq('id', id);

                if (updateError) throw updateError;

                closeDetailModal();
                await loadQuotes();
            } catch (error) {
                console.error('Error voting:', error);
                alert('Error recording vote');
            }
        }

        async function forceApprove(id) {
            if (!confirm('Force approve this quote? This will bypass voting.')) return;

            try {
                const { data: quote, error: fetchError } = await supabase
                    .from('quotes')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (fetchError) throw fetchError;

                const { error: updateError } = await supabase
                    .from('quotes')
                    .update({ 
                        status: 'approved',
                        is_forced: true
                    })
                    .eq('id', id);

                if (updateError) throw updateError;

                await createWork(quote);
                closeDetailModal();
                await loadQuotes();
            } catch (error) {
                console.error('Error force approving:', error);
                alert('Error force approving quote');
            }
        }

        async function createWork(quote) {
            try {
                const { error } = await supabase
                    .from('works')
                    .insert({
                        title: quote.project,
                        description: quote.notes,
                        category: quote.category,
                        cost: Number(quote.amount),
                        vendor: quote.vendor,
                        quote_id: quote.id,
                        status: 'not_started'
                    });

                if (error && error.code !== '23505') {
                    throw error;
                }
            } catch (error) {
                console.error('Error creating work:', error);
            }
        }

        async function editQuote(id) {
            try {
                const { data: quote, error } = await supabase
                    .from('quotes')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error) throw error;

                const parsed = parseComment(quote.comment);

                document.getElementById('editId').value = quote.id;
                document.getElementById('project').value = quote.project;
                document.getElementById('category').value = quote.category || parsed.category || '';
                document.getElementById('vendor').value = quote.vendor;
                document.getElementById('amount').value = quote.amount;
                document.getElementById('priority').value = parsed.priority || 'Medium';
                document.getElementById('notes').value = quote.notes || '';
                document.getElementById('internalNote').value = parsed.note || '';

                document.getElementById('modalTitle').textContent = 'Edit Quote';
                document.getElementById('quoteModal').style.display = 'block';
            } catch (error) {
                console.error('Error loading quote for edit:', error);
                alert('Error loading quote');
            }
        }

        async function deleteQuote(id) {
            if (!confirm('Are you sure you want to delete this quote?')) return;

            try {
                const { error } = await supabase
                    .from('quotes')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                await loadQuotes();
            } catch (error) {
                console.error('Error deleting quote:', error);
                alert('Error deleting quote');
            }
        }

        init();
    </script>
</body>
</html>
