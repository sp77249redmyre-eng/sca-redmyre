<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotes</title>
<link rel="stylesheet" href="/css/style.css">

<style>
.project-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
}
.project-header{
  font-size:18px;
  font-weight:600;
  margin-bottom:16px;
}
.vendor-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}
.vendor-selected{
  border-color:#16a34a;
  background:#f0fdf4;
}
.btn{
  padding:8px 16px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
}
.btn-green{background:#16a34a;color:#fff;}
.btn-yellow{background:#f59e0b;color:#fff;}
.btn-red{background:#dc2626;color:#fff;}

.action-bar{
  display:flex;
  gap:10px;
  margin:15px 0;
}

.result-box{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#ecfdf5;
  font-weight:600;
}
</style>
</head>

<body>

<div id="sidebarPlaceholder"></div>

<div class="main">
  <div id="topbarPlaceholder"></div>

  <div class="content">
    <div id="pendingList"></div>
  </div>
</div>

<script type="module">
import { initLayout } from '/js/layout.js';
const ctx = await initLayout();
const { supabase, role } = ctx;

let allQuotes = [];
let allVotes = [];
window.selectedQuoteId = null;

async function loadData(){
  const [q,v] = await Promise.all([
    supabase.from('quotes').select('*'),
    supabase.from('votes').select('*')
  ]);
  allQuotes = q.data || [];
  allVotes = v.data || [];
}

function getVotes(id){
  return allVotes.filter(v=>v.quote_id===id);
}

function castVoteWrapper(type){
  if(type === 'approve'){
    if(!window.selectedQuoteId){
      alert("Select a quote first");
      return;
    }
    castVote(window.selectedQuoteId,'approve');
  }
  if(type === 'hold'){
    castVote(null,'hold');
  }
  if(type === 'decline'){
    castVote(null,'decline');
  }
}

function renderPendingQuotes(){

  const container = document.getElementById('pendingList');

  const projects = {};
  allQuotes.forEach(q=>{
    const key = q.project_id || q.id;
    if(!projects[key]) projects[key] = [];
    projects[key].push(q);
  });

  let html = '';

  Object.values(projects).forEach(group=>{
    const first = group[0];

    html += `<div class="project-card">`;

    html += `<div class="project-header">📁 ${first.project}</div>`;

    group.forEach(q=>{

      let selected = window.selectedQuoteId === q.id;

      html += `
      <div class="vendor-row ${selected?'vendor-selected':''}">

        <div onclick="toggleQuote('${q.id}')">
          ${q.vendor} | $${q.amount} + GST
        </div>

        <div>
          ${
            selected
            ? '✔ Selected'
            : (window.selectedQuoteId ? '❌' : `<button class="btn btn-green" onclick="selectQuote('${q.id}')">Select</button>`)
          }
        </div>

      </div>
      `;
    });

    html += `
    <div class="action-bar">
      <button class="btn btn-green" onclick="castVoteWrapper('approve')">Approve</button>
      <button class="btn btn-yellow" onclick="castVoteWrapper('hold')">Hold</button>
      <button class="btn btn-red" onclick="castVoteWrapper('decline')">Decline</button>
    </div>
    `;

    html += `<div><b>Committee Comments</b><br></div>`;

    html += `
    <div>
      <b>Voting Status</b><br>
    `;

    group.forEach(q=>{
      const votes = getVotes(q.id);
      votes.forEach(v=>{
        html += `${v.user_email}: ${v.vote}<br>`;
      });
    });

    html += `</div>`;

    html += `<div class="result-box">Result: Pending</div>`;

    html += `</div>`;
  });

  container.innerHTML = html;
}

window.selectQuote = function(id){
  window.selectedQuoteId = id;
  renderPendingQuotes();
}

await loadData();
renderPendingQuotes();

</script>

</body>
</html>
