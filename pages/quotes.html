<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quotes Final Clean</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.project{border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:20px}
.item{padding:10px;border:1px solid #ccc;margin:6px 0;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between}
.item.selected{border:2px solid #10b981;background:#ecfdf5}
.check{color:#10b981;font-size:20px;margin-left:8px}
</style>
</head>
<body>

<div id="app"></div>

<script>
let selectedQuoteId = null;

const sample = [
 {project:"Project A",quotes:[
   {id:"1",vendor:"Vendor A",amount:1200},
   {id:"2",vendor:"Vendor B",amount:1350},
   {id:"3",vendor:"Vendor C",amount:1400}
 ]}
];

function render(){
 const app = document.getElementById("app");
 app.innerHTML = "";

 sample.forEach(p=>{
   const card = document.createElement("div");
   card.className = "project";

   const title = document.createElement("div");
   title.textContent = "📁 " + p.project;
   card.appendChild(title);

   p.quotes.forEach((q,i)=>{
     const row = document.createElement("div");
     row.className = "item";
     if(selectedQuoteId===q.id) row.classList.add("selected");

     row.onclick = ()=>{ selectedQuoteId=q.id; render(); };

     const left = document.createElement("div");
     left.textContent = (i+1)+". "+q.vendor;

     const right = document.createElement("div");
     right.textContent = "$"+q.amount.toLocaleString();

     if(selectedQuoteId===q.id){
       const check = document.createElement("span");
       check.className="check";
       check.textContent="✔";
       right.appendChild(check);
     }

     row.appendChild(left);
     row.appendChild(right);
     card.appendChild(row);
   });

   const actions = document.createElement("div");

   ["Approve","Hold","Decline"].forEach(type=>{
     const btn = document.createElement("button");
     btn.textContent = type;
     btn.onclick = ()=>{
       if(!selectedQuoteId){ alert("Select first"); return; }
       alert(type+" → "+selectedQuoteId);
     };
     actions.appendChild(btn);
   });

   card.appendChild(actions);
   app.appendChild(card);
 });
}

render();
</script>

</body>
</html>
