<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quotes Phase 2</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="pendingList"></div>

<script>
let selectedQuoteId = null;

function renderPendingQuotes(quotes){

  const container = document.getElementById('pendingList');
  container.innerHTML = '';

  if(!quotes.length){
    container.innerHTML = '<div style="padding:40px;text-align:center">No pending quotes</div>';
    return;
  }

  const grouped = {};
  quotes.forEach(q=>{
    const key = q.project_id || q.id;
    if(!grouped[key]) grouped[key]=[];
    grouped[key].push(q);
  });

  Object.values(grouped).forEach(group=>{

    const wrapper = document.createElement('div');
    wrapper.style.marginBottom = '30px';

    const title = document.createElement('div');
    title.style.fontWeight = '700';
    title.style.marginBottom = '10px';
    title.textContent = '📁 ' + (group[0].project || 'Project');
    wrapper.appendChild(title);

    group.forEach(q=>{

      const row = document.createElement('div');
      row.style.display = 'flex';
      row.style.justifyContent = 'space-between';
      row.style.alignItems = 'center';
      row.style.padding = '12px';
      row.style.border = '1px solid #ddd';
      row.style.borderRadius = '8px';
      row.style.marginBottom = '6px';
      row.style.cursor = 'pointer';

      if(selectedQuoteId === q.id){
        row.style.border = '2px solid #10b981';
        row.style.background = '#ecfdf5';
      }

      row.onclick = ()=>{
        selectedQuoteId = q.id;
        renderPendingQuotes(quotes);
      };

      const left = document.createElement('div');
      left.textContent = q.vendor;

      const right = document.createElement('div');
      right.style.display = 'flex';
      right.style.alignItems = 'center';
      right.style.gap = '10px';

      const amount = document.createElement('div');
      amount.textContent = '$' + Number(q.amount||0).toLocaleString('en-AU');

      right.appendChild(amount);

      if(selectedQuoteId === q.id){
        const check = document.createElement('div');
        check.textContent = '✔';
        check.style.color = '#10b981';
        check.style.fontSize = '26px';
        right.appendChild(check);
      }

      row.appendChild(left);
      row.appendChild(right);
      wrapper.appendChild(row);

    });

    const action = document.createElement('div');
    action.style.display = 'flex';
    action.style.gap = '10px';
    action.style.marginTop = '10px';

    const approve = document.createElement('button');
    approve.className = 'btn-pill btn-pill-success';
    approve.textContent = 'Approve';
    approve.onclick = ()=>{
      if(!selectedQuoteId) return alert('Select a quote first');
      castVote(selectedQuoteId,'approve');
    };

    const hold = document.createElement('button');
    hold.className = 'btn-pill btn-pill-warning';
    hold.textContent = 'Hold';
    hold.onclick = ()=>{
      if(!selectedQuoteId) return alert('Select a quote first');
      castVote(selectedQuoteId,'hold');
    };

    const decline = document.createElement('button');
    decline.className = 'btn-pill btn-pill-danger';
    decline.textContent = 'Decline';
    decline.onclick = ()=>{
      if(!selectedQuoteId) return alert('Select a quote first');
      castVote(selectedQuoteId,'decline');
    };

    action.appendChild(approve);
    action.appendChild(hold);
    action.appendChild(decline);

    wrapper.appendChild(action);

    container.appendChild(wrapper);

  });

}
</script>

</body>
</html>
